    category: silicon-photonics
  - query: "photonic+neural+network+stars:>50"
    category: photonic-neural-networks
  - query: "silicon+photonics+simulator+stars:>50"
    category: silicon-photonics
    subcategory_hint: development
  - query: "optical+computing+stars:>30"
    category: optical-computing
  - query: "photonic+quantum+stars:>50"
    category: quantum-photonics
  - query: "integrated+photonics+stars:>30"
    category: integrated-photonics
  - query: "awesome+photonics+stars:>20"
