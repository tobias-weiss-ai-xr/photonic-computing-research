- title: Photonic Computing and Optical Communication Framework for SLM-Driven UAV
  date: 2026-06
  url: https://doi.org/10.2514/6.2026-4439
  category: optical-computing
  subcategory: theory
  authors:
  - Lathish Balaji Baskaran
  - Bharathwaj Vijayakumar
  abstract: Recent advances in photonic computing and optical communication have created
    new possibilities for developing fully autonomous Unmanned Aerial Vehicles (UAVs),
    particularly in environments with limited or disrupted GPS signals and restricted
    communication access. This paper proposes a Photonic Computing and Optical Communication
    Framework(PCOC-F) that integrates Small Language Models (SLMs) for onboard intelligence.
    The framework replaces conventional radio frequency (RF) communication and silicon-based
    processors with light-based computing and optical transmission architectures,
    enabling UAVs to process information and communicate using photons instead of
    electrons. Through photonic circuits capable of performing analog optical matrix
    operations, UAVs can achieve real-time reasoning, low-latency sensor fusion, and
    autonomous decision-making without relying on external RF links. The proposed
    system enhances energy efficiency, interference resistance, and operational independence.
    The framework is grounded in programmable Mach-Zehnder Interferometer (MZI) meshes
    for neural inference, an Optical Neural Ordinary Differential Equation (ON-ODE)
    framework for continuous-time SLM execution, and Free Space Optical (FSO) communication
    for jam-resistant inter platform links. Although still theoretical, this study
    presents a detailed architectural design, core mathematical models, feasibility
    analysis, and projected performance bounds, providing a foundation for future
    experimental research and the next generation of light-based autonomous UAVs.
  venue: ''
- title: Distributed Coherent Optical Computing via Injection-Locked Photonic Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.13450
  category: optical-computing
  subcategory: theory
  authors:
  - Shenghan Gao
  - Kathy Lüdge
  - Francesco Da Ros
  abstract: Coherent photonic computing uses both the phase and amplitude of light
    to implement linear operations such as dot products and matrix multiplication
    but requires phase stability between the interfering paths. This poses a challenge
    for such strategies when optical data is generated at a remote source due to environmental
    phase variations in fiber. Conventional approaches to distributed computing rely
    on optical-to-electrical conversion and buffering, limiting truly real-time and
    distributed computation. Here, we propose a new strategy via optical injection
    locking to enable distributed, real-time coherent optical processing without unnecessary
    conversions in the optical-to-electrical or analog-to-digital domains. Using a
    semiconductor laser rate-equation model, we explore the conditions required for
    stable operation by sweeping the power injection ratio, frequency detuning, and
    modulation conditions of the remote and injected lasers. Our results indicate
    that higher injection powers broaden the locking margin but more readily exhibit
    frequency-selective features associated with relaxation oscillations and increased
    amplitude-phase mixing, whereas lower injection powers yield a narrower, but more
    predictable operating window which remains stable under large modulation depth.
    End-to-end symbol-sequence simulations with balanced detection and temporal integration
    further confirm that reducing the injection ratio suppresses residual remote-modulation
    components in the injected laser output and improves computational accuracy. Overall,
    our study provides guidance and design trade-offs for remote coherent detection
    and distributed coherent photonic computing enabled by injection locking.
  venue: arXiv (Cornell University)
- title: Non-deterministic photonic computing
  date: 2026-05
  url: https://doi.org/10.1117/12.3108745
  category: optical-computing
  subcategory: theory
  authors:
  - Wolfram H. P. Pernice
  abstract: Immense progress in artificial intelligence is rapidly transforming everyday
    life from autonomous vehicles and personalized medicine to language models that
    emulate human reasoning. Yet this transformation comes at a high energy cost.
    The exponential growth of AI workloads, driven by ever-higher data rates and ever-lower
    latency demands, is exposing the physical and economic limits of today’s digital
    electronics. Sustaining this momentum requires not only new algorithms, but entirely
    new physical platforms for information processing. Photonic computing using light
    rather than electrons to perform computations offers a compelling alternative.
    In integrated photonic circuits, optical signals play the role of currents and
    voltages in electronic chips, but they propagate at the speed of light, experience
    negligible loss, and generate minimal heat. This unique combination of speed,
    bandwidth, and energy efficiency opens up radically new opportunities for accelerating
    AI workloads. In this talk, I will explore how photonic systems can implement
    machine learning directly in hardware. By leveraging interference and modulation
    within integrated photonic networks, we can realize optical equivalents of neural
    architectures that perform matrix–vector multiplications and other core AI operations
    at terahertz speeds. Beyond deterministic computation, probabilistic photonic
    processors embrace physical noise and randomness as intrinsic resources for reasoning
    under uncertainty, a hallmark of biological intelligence. Recent advances in materials
    science, including nanoscale phase-change materials, and in photonic device engineering,
    such as microcombs and chaotic light sources, now enable massively parallel, in-memory
    photonic computation. These breakthroughs herald a new generation of brain-inspired
    processors capable of solving complex inference and optimization problems with
    high energy efficiency. By merging the physics of light with the principles of
    learning, photonic computing promises to reshape the landscape of artificial intelligence,
    holding promise for making it faster, more efficient, and ultimately more human-like
    in the way it computes.
  venue: ''
- title: 'Diffractive Optical Neural Networks: Pathways Toward Intelligent and Scalable
    Photonic Computing'
  date: 2026-04
  url: https://doi.org/10.1002/nap2.70098
  category: optical-computing
  subcategory: theory
  authors:
  - Yufei Wang
  - Mingheng Zhong
  - Kun Liao
  abstract: ABSTRACT Optical neural networks have witnessed remarkable progress in
    recent years, driven by the demand for parallel, high efficiency, and ultrafast
    information processing. Among various optical neural network architectures, diffractive
    optical neural networks (DONNs) have emerged as a particularly promising approach
    due to their scalability in the neuron number, ultrahigh throughput, and passive
    low‐power operation. Although free‐space implementations laid the foundation for
    DONNs, on‐chip implementations were later developed to overcome integration challenges
    and to enhance compatibility with photonic circuits, forming together the two
    primary platforms of DONNs. Across both free‐space and on‐chip implementations,
    increasing efforts have been devoted to reconfigurability and multidimensional
    multiplexing, enabling more flexible and sophisticated optical computing functions.
    Beyond their intrinsic advantages for imaging and sensing, DONNs have been increasingly
    adopted for broader neural computing tasks, extending toward large model‐level
    functionalities. This review provides a comprehensive overview of DONNs, covering
    their theoretical foundations and structural evolution from free‐space systems
    to integrated on‐chip and hybrid photonic configurations. It further summarizes
    recent progress in enhancing computational flexibility through multidimensional
    modulation and reconfigurable control strategies. Additionally, representative
    applications and emerging directions are discussed. Finally, the review identifies
    key challenges and outlines prospective pathways toward intelligent and scalable
    photonic computing systems.
  venue: Nanophotonics
- title: 'Integrated photonic computing: towards high-dimensional information processing'
  date: 2026-05
  url: https://arxiv.org/abs/2605.14690
  category: optical-computing
  subcategory: method
  authors:
  - Ji Qin
  - Zhi-Kai Pong
  - Xuke Qiu
  abstract: 'The rapid growth of artificial intelligence, coupled with the slowing
    of Moore''s law, is straining computing infrastructure, as CMOS electronics face
    inherent limits in bandwidth, energy efficiency, and parallelism. Integrated photonic
    computing encodes and processes information using the phase, amplitude, spatial
    modes, wavelength channels, and polarisation of guided optical fields, offering
    a scalable and energy-efficient route beyond charge-based signalling. Here, we
    review on-chip photonic computing, emphasising the progression from low-dimensional
    to high-dimensional architectures. At the foundational level, low-dimensional
    approaches manipulate the phase and amplitude of guided light through Mach-Zehnder
    interferometers, diffractive structures, microring resonators, and absorptive
    elements, forming a programmable basis for optical matrix-vector multiplication.
    Crucially, high-dimensional architectures exploit spatial modes and wavelength
    channels to carry multiple independent data streams through a single waveguide,
    achieving higher throughput with moderate hardware overhead. Practical deployment,
    however, demands more than device innovation. We examine how system-level techniques,
    from time-wavelength interleaving to hardware-aware training, address energy efficiency,
    precision, and algorithm-hardware co-design. Five challenges nevertheless remain:
    electro-optic conversion efficiency, computing parallelism, spatial integration,
    reconfigurability, and robustness. We highlight emerging topological structures,
    such as optical skyrmions, as a promising route to fault-tolerant, topologically
    protected encoding that exploits the largely untapped polarisation degree of freedom.
    We argue that, by embracing the higher dimensionality of light, photonic computing
    can offer not merely an incremental improvement but a new paradigm for high-performance,
    energy-efficient information processing.'
  venue: arXiv (Cornell University)
- title: Temporally plastic photonic processor for real-time adaptive computing
  date: 2026-07
  url: https://doi.org/10.1186/s43593-026-00139-8
  category: optical-computing
  subcategory: theory
  authors:
  - Lingzhi Luo
  - Yue Wang
  - Zhiwei Xue
  abstract: 'Real-time intelligent systems increasingly require hardware that can
    adapt continuously to evolving inputs, yet most existing processors rely on static-weight
    inference, making them vulnerable to distribution shifts and error accumulation
    in dynamic environments. Although adaptive weight updates can, in principle, address
    this limitation, their implementation on electronic hardware is hindered by the
    stability-plasticity trade-off, as well as by the memory wall and clocking bottlenecks
    that become particularly severe in sequential processing. Here, we present a Temporally
    Plastic Photonic Processor (TPPP) that enables ultra-fast in situ adaptation by
    combining multi-timescale photonic kernels with a recursive optical delay memory.
    The architecture integrates a slow, reconfigurable kernel for stable long-term
    processing and a fast, dynamic kernel for transient adaptation, enabling time-varying
    weights to be embedded directly in the photonic domain without repeated electronic
    memory access. We experimentally validate the TPPP on linear and nonlinear sequential
    tasks. In both regimes, data-driven temporal plasticity enables the TPPP to outperform
    conventional static photonic baselines in robustness and accuracy. Under an operation-matched
    INT8 comparison, scaling analysis projects up to 16 × higher per-operation energy
    efficiency and up to 100 × lower intrinsic single-pass compute delay than advanced
    electronic processors, establishing the TPPP as a promising hardware framework
    for real-time adaptive photonic computing. Supplementary Information: The online
    version contains supplementary material available at 10.1186/s43593-026-00139-8.'
  venue: eLight
- title: Hybrid programmable diffractive photonic computing
  date: 2026-06
  url: https://doi.org/10.1117/12.3100883
  category: optical-computing
  subcategory: theory
  authors:
  - Anwar Gatto
  - Harish Kumar Dharavath
  - Abrar F. Liaf
  abstract: Photonic matrix-vector multiplication (MVM) accelerators offer ultra-low
    latency and low computational overhead, enabling high-throughput and low-power
    AI/ML inference. However, reconfigurable photonic MVM platforms remain challenging
    to scale due to footprint, stability, and calibration constraints. Diffractive
    MVM architectures, by contrast, naturally scale to more than 106 optical modes,
    but programmable implementations based on spatial light modulators are limited
    by kHz refresh rates and substantial electronic power consumption. We propose
    a hybrid photonic–electronic architecture that preserves the scalability of diffractive
    computing while enabling practical reconfigurability. A single random diffractive
    surface mixes the optical modes encoding the input vector, and a camera array
    records the resulting high-dimensional correlations. By calibrating the mapping
    between the input modes and the detected responses, the desired linear transformation
    is implemented through simple electronic post-processing, where weighted groups
    of pixels are combined to synthesize the output. We model the diffraction from
    a random diffuser and realize different matrices up to 80 × 80 in size, maintaining
    98% numerical accuracy. Using a single experimental run, we experimentally implement
    several 90 × 4 matrices with 98% numerical accuracy. We also experimentally demonstrate
    several Iris dataset classifiers with 97.6% classification parity with electronic
    systems. This hybrid diffractive MVM approach combines the parallelism of photonic
    mixing with the programmability of electronic post-processing, enabling a scalable,
    stable, and CMOS-compatible reconfigurable photonic processing platform. It preserves
    the intrinsic speed and low computational overhead of photonic computing while
    avoiding the need for active optical reconfiguration.
  venue: ''
- title: Experimental Demonstration of All-Optical Input Masking in Photonic Time-Stretch
    Reservoir Computing
  date: 2026-04
  url: https://doi.org/10.1109/jlt.2026.3679997
  category: optical-computing
  subcategory: theory
  authors:
  - Yuanli Yue
  - Heng Zhang
  - C. Wang
  abstract: 'We propose and experimentally demonstrate a photonic reservoir computing
    (RC) system with integrated all optical input masks to enhance processing performance.
    Leveraging photonic time-stretch (PTS) and spectral mixing, the system employs
    optical wavelengths as virtual reservoir nodes, thereby improving spectral interaction
    and memory capacity during feedback. To overcome electronic bottlenecks and reduce
    bandwidth requirements, we design two optical input mask schemes: (i) a programmable
    optical filter based on parallel diffraction gratings, and (ii) an analog mask
    generated by a Mach Zehnder Interferometer (MZI). Both approaches introduce randomness
    directly in the optical domain prior to modulation, enriching reservoir dynamics
    without relying on high-speed electronics. Proof-of-concept experiments on waveform
    and spoken-digit classification validate the effectiveness of our method. The
    proposed system achieves accuracies of 97.19% with the MZI based mask and 98.16%
    with the diffraction gratings mask, compared with 80.65% in the no-mask case.
    These results demonstrate that all-optical masking not only significantly improves
    classification performance but also alleviates electronic constraints, making
    it highly suitable for real-time recognition in high-speed photonic imaging systems.'
  venue: Journal of Lightwave Technology
- title: 'APMR-accelerated photonic CNN: Compact nonlinear optical computing with
    dual-ring resonators'
  date: 2026-02
  url: https://doi.org/10.1016/j.photonics.2026.101524
  category: optical-computing
  subcategory: theory
  authors:
  - Thanh Pham Tien
  - Trung Thanh Le
  abstract: ''
  venue: Photonics and Nanostructures - Fundamentals and Applications
- title: Deep Binarized Photonic Reservoir Computing for Ultrafast Multimedia Signal
    Processing
  date: 2026-05
  url: https://arxiv.org/abs/2605.30149
  category: optical-computing
  subcategory: method
  authors:
  - Muhammad Waqar Iqbal
  - Mohamad Alassir
  - Nicolas Marsal
  abstract: We present a deep photonic neural network architecture based on ultrafast
    binary optical modulation from a digital micro-mirror device (DMD), optical scattering
    in random medium, high-speed photodetection with a CMOS sensor, and time-multiplexed
    deep layer structure. Operating at Gigabit-per-second (Gb/s) processing rates,
    our system based on the reservoir computing (RC) framework achieves state-of-the-art
    performance across various multimedia tasks, including video, image and speech
    recognition. We show that the careful optimization of key physical intra- and
    inter-layer hyper-parameters can significantly enhance the deep photonic RC system
    ability to extract relevant temporal and spatial features via balancing memory
    retention and dynamical response of individual layers. This approach paves the
    way for highly scalable hierarchical photonic reservoir computing systems for
    high-throughput real-time multimedia signal processing.
  venue: arXiv (Cornell University)
- title: Fully multiplexed photonic tensor computing
  date: 2026-04
  url: https://arxiv.org/abs/2604.22660
  category: optical-computing
  subcategory: application
  authors:
  - Aolong Sun
  - Junhao Zhao
  - Fangchen Hu
  abstract: Tensor operations dominate modern computational workloads, yet their further
    acceleration demands hardware platforms with greater parallelism. Although photonic
    computing provides a compelling route for parallel processing, fully exploiting
    all native multiplexing dimensions of optical fields is impeded by the challenges
    in routing and programming light in all dimensions simultaneously. Here we introduce
    FieldCore, a fully multiplexed photonic tensor core that jointly harnesses wavelength,
    radio-frequency, guided-mode, time and space dimensions, thereby enabling parallelism
    to scale multiplicatively within a single optical field. Enabled by inverse-designed
    silicon photonics, FieldCore preserves a uniform programmed computation across
    all multiplexed channels in parallel. Experimentally, we validate and benchmark
    its performance from ultra-high-baudrate arithmetic operations to high-fidelity
    image convolution and parallel handwritten-digit recognition. We further use FieldCore
    to unlock applications that naturally require high-dimensional data processing,
    such as high-dimensional hyperspectral classification and massively parallel mechanical
    fault diagnosis. Our FieldCore supports an estimated aggregate compute throughput
    of 69.12 tera operations per second (TOPS) and accommodates up to 1,800 parallel
    input streams within a single core, establishing a scalable paradigm for fully
    multiplexed photonic tensor computing and AI inference.
  venue: arXiv (Cornell University)
- title: 'Photonics-Enabled Edge Processing: A Vision for Near-Sensor Optical Intelligence'
  date: 2026-06
  url: https://doi.org/10.1145/3787109.3816405
  category: optical-computing
  subcategory: theory
  authors:
  - Deniz Najafi
  - Shaahin Angizi
  - Mahdi Nikdast
  abstract: Edge intelligence is rapidly shifting computation from centralized cloud
    infrastructure toward the point of data generation. This shift is especially important
    for visual sensing systems, where continuous streams of high-dimensional pixel
    data must be converted, stored, transmitted, and processed under strict energy
    and latency constraints. While processing-in-sensor and processing-near-sensor
    architectures have reduced data movement, they remain limited by analog-to-digital
    conversion, memory access, electronic bandwidth, and the difficulty of supporting
    increasingly complex models near the sensor. This invited paper argues that integrated
    photonics can provide a new substrate for edge processing by enabling high-bandwidth,
    low-latency, and naturally parallel analog computation close to the sensing interface.
    We review the basic principles of photonic computing and discuss how it can be
    used to realize near-sensor multiply-and-accumulate operations. We then use recent
    work from our group as representative case studies, including optical in-sensor
    acceleration, optical near-sensor acceleration with compressive acquisition, near-sensor
    neuro-symbolic photonic computing, and in-sensor compressed weight retrieval for
    vision transformers. These examples motivate a broader research agenda in which
    photonics is not only a fast accelerator for neural operations, but also a system-level
    enabler for data-centric, energy-aware, and real-time edge intelligence.
  venue: ''
- title: 192-dimensional wavelength-/mode-/polarization-multiplexed photonic architecture
    for highly parallel optical computing
  date: 2026-06
  url: https://doi.org/10.1093/nsr/nwag350
  category: optical-computing
  subcategory: method
  authors:
  - 姚庆瑞
  - Yuxin Sun
  - Weike Zhao
  abstract: ABSTRACT Photonic matrix–vector multiplication (MVM) constitutes a core
    computational primitive in on-chip photonic neural networks, enabling ultrahigh-speed
    multiply–accumulate operations. Most existing photonic MVM implementations do
    not fully exploit the intrinsic multidimensional degrees of freedom of light,
    thereby constraining parallelism, scalability, and functional flexibility. Here,
    we present a 192-dimensional multiplexed photonic computing architecture that
    simultaneously harnesses 32 wavelengths, three spatial modes, and dual polarizations,
    enabling highly parallel and fully reconfigurable optical computation within a
    single integrated platform. By dynamically selecting and combining multiplexed
    channels, we demonstrate flexible convolution-kernel reconfiguration, supporting
    large and variable kernel sizes up to 13 × 13, as well as multichannel parallel
    signal processing. Enabled by large-scale and adaptable convolution operations,
    we experimentally demonstrate effective suppression of structured noise, enhanced
    extraction of diverse spatial features, and preservation of holistic contour information—capabilities
    that are difficult to achieve using conventional small-kernel architectures alone.
    The optical chip can achieve a throughput of 15.36 tera-operations per second,
    which can be further improved by adopting higher-speed modulation and expanding
    the optical dimension channels. Overall, the proposed architecture establishes
    a powerful and scalable photonic computing paradigm, with strong potential for
    computer vision, biomedical imaging, and next-generation artificial intelligence
    systems, especially those demanding high-precision visual processing.
  venue: National Science Review
- title: Probabilistic photonic computing
  date: 2026-05
  url: https://doi.org/10.1117/12.3098684
  category: optical-computing
  subcategory: method
  authors:
  - Frank Brückerhoff-Plückelmann
  - Hendrik Borras
  - Holger Fröning
  abstract: We present a novel photonic architecture that leverages broadband chaotic-light
    as an entropy source together with an incoherent photonic crossbar array to enable
    high-speed probabilistic computation. By encoding input means and variances in
    the optical domain and performing parallel wavelength-division-multiplexed sampling,
    we execute probabilistic convolutions and embed a Bayesian neural network capable
    of both classification and uncertainty estimation. Our prototype processes at
    an effective sampling rate of tens of gigasamples per second and demonstrates
    high accuracy on the MNIST task while reliably detecting out-of-distribution inputs.
    This work paves the way for ultrafast hardware-native probabilistic inferencing.
  venue: ''
- title: SYSTEMS AND METHODS FOR PHOTONIC COMPUTING 2025-11-25
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.17708817
  category: optical-computing
  subcategory: method
  authors:
  - Quni-Gudzinas, Rowan Brad
  abstract: The present invention pertains generally to quantum information processing,
    photonic integrated circuits, and cryogenic engineering. More specifically, the
    invention concerns systems and methods for achieving fault-tolerant quantum computing
    through physical instantiation of synthetic topological lattices in cryogenically
    stabilized environments, utilizing continuous-variable cluster states. This disclosure
    also relates to integrated photonics and optical signal processing. Specifically,
    it concerns monolithic silicon nitride circuits that combine nonlinear optical
    soliton generation with robust topological routing and spectral filtering for
    high-bandwidth communications and radio-frequency (RF) photonics. The present
    disclosure also relates generally to the field of integrated photonics and optical
    signal processing. More particularly, the invention pertains to passive photonic
    integrated circuits (PICs) that leverage topological geometry and quasi-periodic
    lattices for advanced functionalities such as spectral filtering, physical layer
    encryption, and athermal operation.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: A case study on the performance metrics of integrated photonic computing
  date: 2026-06
  url: https://arxiv.org/abs/2511.00186
  category: optical-computing
  subcategory: method
  authors:
  - Frank Brückerhoff‐Plückelmann
  - Jelle Dijkstra
  - Julian Büchel
  abstract: Photonic processors use optical signals for computation, leveraging the
    high bandwidth and low loss of optical links. While many approaches have been
    proposed, including in-memory photonic circuits, most efforts have focused on
    the physical design of photonic components rather than full architectural integration
    with electronic peripheral circuitry. In this study, we present a microarchitecture-level
    study that estimates the compute efficiency and density of three prominent photonic
    computing architectures. Our evaluation accounts for both the photonic circuits
    and the essential peripheral electronics required for opto-electronic and analog–digital
    conversions. We further demonstrate a heterogeneous photonic–electronic in-memory
    processing approach for low-latency neural network inference. These results provide
    a better understanding of the design aspects of photonic computing.
  venue: APL Machine Learning
- title: Integrated photonic systems and materials for high-speed communication, quantum
    networks, and intelligent optical computing
  date: 2026-06
  url: https://doi.org/10.1117/12.3115774
  category: optical-computing
  subcategory: theory
  authors:
  - Sherzod Korabayev
  - Nursultan Khalmurzaev
  - Zebo Alimova
  abstract: 'In order to meet the concurrent needs of quantum information processing,
    high-speed data transmission, and developing neuromorphic computing architectures,
    integrated photonic technologies are coming together. In order to improve the
    scalability and functionality of photonic integrated circuits, this article provides
    a thorough analysis of recent developments in material platforms, heterogeneous
    integration techniques, and packaging innovations. We study three complementary
    material systems: silicon-organic hybrid platforms that provide 200 Gb/s per lane
    bandwidth with a 40% smaller form factor than traditional silicon photonics; site-controlled
    gallium arsenide quantum dot arrays edge-coupled to silicon nitride waveguides
    with 5% absolute coupling efficiency and 0.17 relative collection efficiency;
    and lithium tantalate-on-silicon nitride modulators that achieve 100 GHz bandwidth
    with a 6 V half-wave voltage and net data rates of 581 Gbit/s for 16-QAM signals.
    Wafer-scale protocols that achieve >50% probability for telecom-wavelength color
    centers in silicon with sub-100 nm positioning accuracy are demonstrated by parallel
    developments in deterministic single-photon emitter creation. Additionally, we
    investigate a novel plug-and-play fiber coupling concept using threedimensionally
    printed total reflection couplers that achieve sub-dB loss in the 1500-1600 nm
    telecommunications band, allowing neuromorphic processors with 17-port connectivity
    to be packaged in a scalable manner. According to our findings, integrated photonics
    is on the verge of being widely used in data centers, quantum communication networks,
    and intelligent optical computing systems due to the convergence of heterogeneous
    material integration, deterministic quantum emitter fabrication, and standardized
    packaging techniques. While acknowledging the ongoing challenges in absolute efficiency,
    manufacturing yield, and long-term stability, we present comparative performance
    metrics across modulator platforms, quantum source integration strategies, and
    packaging approaches, identifying optimal configurations for particular application
    contexts.'
  venue: ''
- title: Cascade operation of programmable photonic logic gates using semiconductor
    optical amplifiers for optical computing
  date: 2026-04
  url: https://doi.org/10.1364/optcon.592759
  category: optical-computing
  subcategory: method
  authors:
  - Yusuke HATANO
  - Motoharu Matsuura
  abstract: Optical signal processing technologies, which process optical signals
    directly without electrical conversion, have long been researched as a means of
    overcoming the bottleneck of conventional optical-electrical-optical signal processing.
    Optical logic gates are fundamental functions that enable advanced computational
    processing. Semiconductor optical amplifiers (SOAs) have been incorporated into
    various optical logic gates because they generate diverse nonlinear effects with
    low-power optical switching operations. This study focuses on optical logic gates
    based on various nonlinear effects in SOAs that assist optical filters. In this
    configuration, by controlling the input signal power and the properties of the
    optical filters, programmable photonic logic gates (PPLGs) that are capable of
    performing various logic operations with the same configuration can be constructed.
    This study proposes a photonics-electronics hybrid logic circuit that serializes
    and parallels these PPLGs based on a matrix-switch configuration. Whereas slow
    and complex computational logic operation requests and path control are executed
    using electronics technologies, the high-speed optical logic operation of digital
    data signals can be processed using PPLGs through photonics technologies. This
    study experimentally verified the use of PPLGs composed of two types of two-stage
    cascade configurations (OR-NOT and AND-OR) to demonstrate the basic feasibility.
    The findings indicate that cascaded PPLGs with the same configuration enable the
    high-quality execution of various logic operations.
  venue: Optics Continuum
- title: Photonic Neuromorphic Computing enabled by a BIC Metasurface
  date: 2026-02
  url: https://arxiv.org/abs/2602.22528
  category: optical-computing
  subcategory: theory
  authors:
  - Jingsong Fu
  - Ruiheng Jin
  - Zhaohui Xie
  abstract: 'Photonic neuromorphic computing promises revolutionary advances in parallel
    and high-speed processing, yet a key challenge persists: co-integrating nonlinearity,
    dense connectivity, and intrinsic memory monolithically to enable brain-inspired,
    spatiotemporal information processing. Here, we overcome this challenge by introducing
    a monolithic photonic recurrent network based on an active metasurface operating
    at bound state in the continuum (BIC). The BIC mode mediates strong,long-range
    coupling across the lattice, creating a reconfigurable recurrent network topology
    in hardware. Concurrently, the gain medium provides both optical nonlinearity
    for neuronal activation and a finite carrier lifetime that serves as a built in,
    analog temporal memory. This synergy enables computation to emerge directly from
    the collective spatiotemporal dynamics of the driven-dissipative photonic system,
    effectively realizing a physical reservoir computer on a chip. We experimentally
    validate a minimal yet physically complete system on benchmark tasks: brain MRI
    image classification and human action recognition, achieving 92.16% and 85.36%
    accuracies, respectively. This work establishes a scalable pathway toward ultrafast,
    energy-efficient neuromorphic intelligence where processing is an inherent property
    of tailored light matter interaction.'
  venue: Figshare
- title: 'Continuous-Variable Quantum Fourier Layer: Applications to Filtering and
    PDE Solving'
  date: 2026-05
  url: https://doi.org/10.3390/a19050370
  category: optical-computing
  subcategory: method
  authors:
  - Paolo Marcandelli
  - Stefano Mariani
  - Martina Siena
  abstract: 'Fourier representations play a central role in operator learning for
    partial differential equations and are increasingly being explored in quantum
    machine learning architectures. The classical fast Fourier transform (FFT), particularly
    in its Cooley–Tukey decomposition, exhibits a structure that naturally matches
    continuous-variable quantum circuits. This correspondence establishes a direct
    structural isomorphism between the Cooley–Tukey butterfly network and Gaussian
    photonic gates, enabling the FFT to be realized as a native optical computation
    in continuous-variable quantum computing. Building on this observation, we introduce
    a continuous-variable Quantum Fourier Layer (CV–QFL) based on a bipartite Gaussian
    encoding and a Cooley–Tukey quantum Fourier transform, enabling exact two-dimensional
    spectral processing within a Gaussian photonic circuit. We test the CV–QFL on
    two representative tasks: spectral low-pass filtering and Fourier-domain integration
    of the heat equation. In both cases, the results match the classical reference
    to machine precision. More broadly, this work lays the foundation for continuous-variable
    approaches to quantum scientific computing and for the development of native spectral
    architectures in quantum machine learning.'
  venue: Algorithms
- title: An Analog Photonic Computing Device Based on a Diffractive Neural Network
    for Video Stream Processing
  date: 2026-06
  url: https://doi.org/10.14529/jsfi260208
  category: optical-computing
  subcategory: theory
  authors:
  - Roman V. Skidanov
  - Leonid L. Doskolovich
  - Nikolay L. Kazanskiy
  abstract: This paper investigates the design principles of analog photonic computing
    devices for pattern recognition tasks. As a result of the conducted research,
    an analog photonic computing device (APCD) based on a diffractive neural network
    (DNN) is developed and implemented in two configurations. The DNN is realized
    using a phase spatial light modulator (SLM) placed in the Fourier plane of a two-lens
    optical system (4F system). Benefits of combining an optical DNN with a compact
    computer neural network for post-processing the optical recognition results are
    demonstrated. The presented results show the effectiveness of using the APCD for
    processing and recognition of high-dimensional imagery in real-time video streams.
    A comparative performance analysis of the APCD and a family of GPU-based YOLO
    neural networks is conducted for object image recognition in video streams. The
    results demonstrate that when processing high-dimensional frames, the power consumption
    of the APCD is an order of magnitude lower than that of modern GPU-class graphics
    platforms such as the RTX 4090.
  venue: Supercomputing Frontiers and Innovations
- title: Cavity solitons as a nonlinear substrate for photonic neuromorphic computing
  date: 2026-06
  url: https://doi.org/10.6084/m9.figshare.c.8509515
  category: optical-computing
  subcategory: method
  authors:
  - Amir Arabieh
  - Alessandro Lupo
  - Simon-Pierre Gorza
  abstract: Reservoir computing leverages nonlinear dynamics of physical systems to
    process temporal information with minimal training cost. Here, we demonstrate
    that cavity solitons sustained in a fiber optical cavity provide an optical platform
    for photonic reservoir computing. Our methodology exploits the use of a phase-modulated
    drive laser to encode the input, while the reservoir states are accessed through
    frequency-resolved readout. Numerical simulations indicate that the emission of
    Kelly waves enriches the dynamics and enhances performance for machine learning
    tasks. We evaluate the performance of the cavity-soliton reservoir computer on
    several standard benchmark tasks.
  venue: Figshare
- title: Manifold partitioning induced sequential optical reasoning and decision framework
    for photonic computing
  date: 2026-06
  url: https://arxiv.org/abs/2606.01616
  category: optical-computing
  subcategory: method
  authors:
  - Zhihao Li
  - Jing Pan
  - Wei Yan
  abstract: Real-world data are intrinsically embedded in highly entangled manifolds,
    making the extraction of separable representations a central challenge for artificial
    intelligent (AI) systems. While optical neural networks (ONNs) offer ultrafast
    and energy-efficient data processing, their capacity is constrained by limited
    physical depth. Here, we introduce a sequential optical reasoning and decision
    (SORD) framework, an architecture that performs time-sequenced hierarchical inference
    by decomposing global tasks into coarse-to-fine steps via geometry-guided data
    partitioning. At each step, SORD executes small reasoning via dynamic operator
    selection, effectively reducing the overall task complexity without scaling up
    physical architecture. Experimentally, SORD enables a single-layer diffractive
    ONN to achieve otherwise intractable 100-class optical fiber speckle classification
    with 94% accuracy and a system energy efficiency of 23.3 TOPS/W. This high-fidelity
    recognition is further examined in a human-machine interface, featuring real-time
    interactive all-optical sensing. Overall, our work establishes a scalable and
    hardware-efficient approach to expanding the effective expressivity of compact
    photonic AI systems, and may advance their deployment in applications requiring
    real-time sensing, inference, and control.
  venue: Figshare
- title: 'Photon Avalanching Nanoparticles: The Next Generation of Upconverting Nanomaterials?'
  date: 2026-03
  url: https://doi.org/10.1002/adfm.202531980
  category: optical-computing
  subcategory: theory
  authors:
  - Kimoon Lee
  - Y. J. Kim
  - Hyeong‐ku Jo
  abstract: ABSTRACT Photon Avalanche (PA) is a unique, feedback‐driven upconversion
    process where the absorption of a single photon initiates cascaded excited‐state
    absorption and cross‐relaxation, leading to an exceptionally steep, threshold‐dependent
    emission rise. The realization of PA at the nanoscale has recently opened transformative
    opportunities in photonics, sensing, and optical computing. However, systematic
    exploitations of avalanching nanoparticles (ANPs) across diverse applications
    and rational design principles for next‐generation devices remain at an early
    stage. This Perspective examines the current status and future directions of research
    on ANPs, with emphasis on lanthanide‐doped fluoride systems. Initially, we analyze
    the PA mechanism and rate‐equation frameworks governing PA properties, including
    threshold intensity and cross‐relaxation efficiency. Next, we survey frontier
    applications, including super‐resolution imaging, nanothermometry, force sensing,
    optical logic gating, and neuromorphic computing. Ultimately, promising avenues
    for advancing ANP‐based technologies are outlined, spanning improved optical efficiency,
    chemical stability, homogeneity, and tunable threshold engineering. We hope this
    Perspective clarifies the foundations of PA at the nanoscale and provides a roadmap
    for exploiting avalanche mechanisms to unlock next‐generation functional platforms
    with enhanced performance and versatility.
  venue: Advanced Functional Materials
- title: Integration and control of an LNOI interferometer for photonic quantum computing
  date: 2026-03
  url: https://doi.org/10.1117/12.3079342
  category: optical-computing
  subcategory: method
  authors:
  - E. Beckert
  - M. Reibe
  - M. Monika
  abstract: Photonic quantum computing is a promising platform for achieving high-performance
    quantum information processing. For system integration and scalability, we propose
    a solution based on an integrated lithium niobate on insulator (LNOI) platform
    for optical modulation, presenting an 8-mode LNOI interferometer chip with electro-optic
    modulators, featuring both electrical and optical coupling. With measured propagation
    losses of approximately 2 dB/m for straight waveguides, the LNOI platform demonstrates
    strong potential for scalable and efficient on-chip modulation, connected with
    ultra-high numerical aperture (UHNA) fibers and wire bonds, and controlled via
    an FPGA platform. The challenge of low-loss coupling between optical fibers and
    the photonic chip we have conducted several design studies and experimental investigations,
    with further work planned to minimize coupling losses &lt;&lt;1dB. The approach
    includes integrated mode field adapters based on three-dimensional tapers on the
    chip side, and external geometries for mode matching between fiber and waveguide.
    These include the use of lensed fibers, UHNA fibers, spot-size converters, and
    two-photon polymerized microlenses.
  venue: ''
- title: Photonic-Interconnected Quantum Chiplets for Modular and Networked Quantum
    Computing
  date: 2026-05
  url: https://doi.org/10.62311/nesx/rp9-30052026
  category: optical-computing
  subcategory: theory
  authors:
  - Murali Krishna Pasupuleti
  abstract: 'Abstract: This study investigates photonic-interconnected quantum chiplets
    as a modular hardware pathway for scalable and networked quantum computing. The
    central problem is that monolithic quantum processors face compounding constraints
    in yield, wiring density, cryogenic routing, interconnect loss, calibration complexity
    and non-local connectivity. Photonic interconnection offers a technically plausible
    route to divide a large quantum computer into smaller processors while preserving
    quantum communication across modules through fibre links, photonic switches, optical
    transduction or integrated photonic interposers. The paper develops an academically
    rigorous framework that connects quantum-chiplet architecture, photonic integration,
    quantum error correction, control latency and manufacturability. It uses secondary
    real-data anchors from recent public demonstrations and a transparent engineering
    analysis to evaluate whether modular photonic networking can satisfy requirements
    for distributed logical qubits, entanglement generation and fault-tolerant operation.
    Results indicate that photonic chiplets can reduce scaling penalties relative
    to a monolithic wiring strategy when interconnect loss, feed-forward latency and
    module yield are jointly optimized. The study concludes that photonic-interconnected
    chiplets are not a minor packaging improvement but a possible architectural transition
    comparable to the movement from single-die classical processors to heterogeneous
    chiplet systems. The strongest contribution is a system-level evaluation model
    that links physical photonic performance with computer-architecture metrics and
    identifies the practical thresholds that must be met for Nature-level experimental
    validation. Keywords quantum computing chips, photonic chiplets, modular quantum
    computing, quantum interconnects, distributed quantum processors, silicon photonics,
    quantum networking, fault-tolerant quantum computing, optical interposers, quantum
    error correction, entanglement routing, wafer-scale quantum manufacturing, cryogenic
    control, quantum architecture, quantum hardware scalability'
  venue: International Journal of Academic and Industrial Research Innovations(IJAIRI)
- title: 'Photonic Computing for AI Acceleration: Architectures, Opportunities, Challenges,
    and Future Perspectives'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21191734
  category: optical-computing
  subcategory: theory
  authors:
  - Hira Fatima
  abstract: Photonic computing has emerged as a promising paradigm for accelerating
    artificial intelligence workloads by leveraging light-based information processing
    to overcome the bandwidth, latency, and energy limitations of conventional electronic
    architectures. This theoretical review synthesizes recent advances in photonic
    computing for AI acceleration, covering optical computing fundamentals, silicon
    photonics, photonic integrated circuits, optical neural networks, hybrid electronic–photonic
    systems, opportunities, applications, challenges, and future research directions.
    The review highlights current technological limitations while discussing the role
    of photonic computing in the post-Moore computing era.
