- title: Influence of nonlinear node operating states on the performance of photonic
    reservoir computing
  date: 2026-05
  url: https://doi.org/10.1364/oe.591550
  category: optical-computing
  subcategory: development
  authors:
  - Tong Zhao
  - Baofeng Feng
  - 崔天培
  abstract: Photonic reservoir computing (PRC) has attracted significant attention
    in artificial intelligence and information processing owing to its advantages
    of high speed, low power consumption, and inherent parallelism. The operating
    state of the nonlinear node strongly influences the computational performance
    of the PRC, yet most existing studies rely almost exclusively on the traditional
    operating point located in the steady-state region before the Hopf bifurcation.
    In this work, we adopt a dual-delay optical feedback structure to create another
    bifurcation pathway in which the system can transition directly from the steady
    state toward a quasi-periodic regime, bypassing the periodic state. We compare
    the steady state located before this quasi-periodic bifurcation with the conventional
    pre-Hopf steady state, and analyze their respective impacts on reservoir performance.
    The results highlight the importance of selecting an appropriate operating state
    for specific tasks and provide new insights for nonlinear optimization in PRC
    systems.
  venue: Optics Express
- title: Bidirectional All‐Optical Synapses for Neuromorphic Computing and Vision
  date: 2026-04
  url: https://doi.org/10.1002/smll.202514627
  category: optical-computing
  subcategory: method
  authors:
  - Zifan Li
  - Zicheng Zhang
  - Zhenhui Tao
  abstract: All-optical synapses (AOS) that integrate sensing and processing of photonic
    signals represent a transformative frontier for optical computing and neuromorphic
    imaging. Most existing AOSs are limited to unidirectional weight modulation, achieving
    both excitation and inhibition output through all-optical pathway remains a challenge.
    Here we report a dual-photon-mediated strategy that achieving bidirectional neuroplasticity
    within a phosphorescent and photothermal carbon dot hybrid (CDH) neurotransmitter.
    This regulatory process employs ultraviolet and infrared light manipulation to
    achieve controllable exciton release and superposition of phosphorescent emission,
    thereby enabling neurophotonic potentiation and depression output. These features
    enable the CDH to realize optical logic operation and neurovision with real-time
    tracking and recognition of light objects, including motion trajectory, velocity,
    and direction, with a high accuracy of 97%. This work offers an all-optical regulation
    method to innovate phosphorescent paradigm for all-optical computing and imaging.
