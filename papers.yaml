- title: Silicon integrated balanced-photonic general matrix-computing system
  date: 2026-04
  url: https://doi.org/10.1109/icsp69961.2026.11540581
  category: optical-computing
  subcategory: theory
  authors:
  - Lijun Yang
  - Xiaoyan Hu
  - Zhiqiang Wang
  abstract: Over the past decade, the leap in deep learning has relied on an increasingly
    unsustainable demand for computing power, with its growth far exceeding the pace
    of energy efficiency improvements in electronic hardware. Photonic computing is
    expected to address many challenges in the field of computing; however, integrated
    photonic processors are often limited by the physical size of processing units
    and the energy consumption caused by high-speed analog-to-digital conversion.
    We propose a hybrid optoelectronic computing architecture that utilizes a modular
    dot product unit (DPU) composed of photonic crossbars and balanced detection to
    achieve on-chip general matrix-matrix multiplication. We modeled a 4×4 matrix
    computing system using INTERCONNECT, and simulated and analyzed the 4×4 matrix-matrix
    multiplication process. The maximum error between the simulated values and the
    theoretical calculation values is 0.5%, thus verifying the effectiveness and accuracy
    of the computing system. This computing system bypasses the bottlenecks of high-speed
    electronic readout and frequent reprogramming of photonic weights, which can significantly
    reduce energy consumption and latency when dealing with large-scale matrices.
    Therefore, our research lays the foundation for realizing efficient and scalable
    on-chip optical computing for various AI applications.
