- title: Integrated van der Waals waveguides for all-optical nonlinear photonic circuits
  date: 2026-05
  url: https://doi.org/10.1038/s41467-026-73107-y
  category: optical-computing
  subcategory: method
  authors:
  - Xiaowen Zhang
  - Xiaowen Zhang
  - Zhican Zhou
  abstract: All-optical deep neural networks offer significant improvements in processing
    speed and energy efficiency compared with traditional electronic systems. However,
    achieving broadband all-optical signal transmission with ultrafast processing
    speed in conventional photonic waveguides remains challenging. In this work, we
    present an integrated photonic circuit incorporating vertically grown molybdenum
    disulfide (MoS2), which is also compatible with wafer-scale manufacturing. By
    leveraging the saturable absorption properties of MoS2, this platform enables
    all-optical nonlinear activation over both the telecommunication O-band and C-band,
    with response speeds as fast as ~ 10 ps. This broadband operability enables flexible
    deployment as an optical activation function for neural network inference. Using
    a standardized evaluation framework, we benchmarked task-level performance against
    mainstream digital activation functions across diverse network architectures and
    quantization settings. These findings highlight the potential of van der Waals
    materials like MoS₂ for enabling in-situ nonlinearity in all-optical neural network
    hardware, advancing the development of scalable photonic computing systems. This
    study reports transfer-free, in-situ-grown MoS2 waveguides that enable broadband
    telecom band saturable absorption for all-optical nonlinear activation.
  venue: Nature Communications
- title: Quantum Neuromorphic and Photonic AI Architectures for Energy-Efficient Cognitive
    Computing
  date: 2026-05
  url: https://doi.org/10.62311/nesx/rb4m-978-81-687299-6-4
  category: optical-computing
  subcategory: theory
  authors:
  - Murali Krishna Pasupuleti
  abstract: Abstract This academic manuscript develops a doctoral-level framework
    for quantum neuromorphic and photonic AI architectures as a pathway toward energy-efficient
    cognitive computing. It examines how quantum-inspired representation and optimisation,
    neuromorphic event-based processing, photonic interconnection and trustworthy
    machine learning can be integrated into reproducible research systems and governable
    deployment infrastructures. The book advances a coherent sequence from conceptual
    foundations and uncertainty-aware research design to statistical modelling, causal
    inference, trustworthy prediction, scalable MLOps and sectoral governance. It
    avoids unsupported empirical claims and instead provides research-oriented models,
    evaluation metrics, workflow protocols, risk frameworks and policy artifacts that
    can guide future scholarly and industrial programmes. The manuscript emphasises
    global relevance across South Asia, Europe, Africa and the Americas, where energy
    constraints, digital inclusion, public accountability, industrial competitiveness
    and sustainable AI infrastructure differ significantly. By linking device-level
    reasoning with social and institutional evaluation, the book positions energy-efficient
    cognitive computing as both a technical challenge and a governance problem. Its
    intended contribution is a structured reference architecture for researchers,
    engineers, policymakers and interdisciplinary research teams developing next-generation
    cognitive systems. Keywords Quantum AI, neuromorphic computing, photonic AI, cognitive
    computing, energy-efficient intelligence, spiking neural networks, optical interconnects,
    edge intelligence, quantum-inspired optimization, trustworthy machine learning,
    causal inference, uncertainty quantification, MLOps, digital twins, low-power
    hardware, algorithmic governance, reproducibility, smart cities, healthcare AI,
    industrial automation, data sovereignty, cyber resilience, public policy, sustainable
    computing
  venue: ''
- title: 'Review of Optical Fiber and Integrated Photonic Sensors for Industry and
    Smart Manufacturing: Technologies, Applications, Structural Health Monitoring
    and AI-Enabled Sensing'
  date: 2026-06
  url: https://doi.org/10.3390/s26113581
  category: photonic-sensing
  subcategory: method
  authors:
  - Giannis Poulopoulos
  - H. Avramopoulos
  abstract: 'Smart manufacturing, Industry 4.0, and cyber-physical systems (CPSs)
    require sensing architectures capable of resolving both spatially distributed
    asset behavior and highly localized process states. This review examines optical
    fiber sensors (OFSs) and integrated photonic sensors for industrial monitoring
    through a deployment-oriented, multi-scale perspective. The discussion covers
    five major application regimes: continuous infrastructure surveillance, structural
    health monitoring (SHM) of load-bearing composites, dynamic condition monitoring
    of machinery, in situ observability in advanced manufacturing, and localized chemical
    or gas sensing. Extended fiber-optic networks, including distributed fiber-optic
    sensing (DFOS) based on Rayleigh, Raman, and Brillouin scattering, together with
    multiplexed fiber Bragg grating (FBG) sensors, provide passive, embeddable, and
    remotely interrogated monitoring for large-scale assets and harsh environments.
    Photonic integrated circuits (PICs) shift transduction to compact node-level devices
    for localized thermal, mechanical, refractive-index, absorption, vibration, and
    inertial measurements, while plasmonic and dielectric nanophotonic sensors extend
    optical monitoring toward surface-selective and chemically specific detection.
    Across these platforms, digital signal processing (DSP), machine learning (ML),
    sensor fusion, and digital-twin (DT) coupling are treated as artificial-intelligence-enabled
    (AI-enabled) layers for signal recovery, inverse mapping, uncertainty reduction,
    and predictive maintenance. The review argues that scalable industrial adoption
    is less limited by sensing physics than by the complete deployment chain: packaging,
    fiber-chip interfacing, calibration stability, interrogation robustness, and AI-enabled
    data interpretation. This manuscript is structured as a deployment-oriented narrative
    review of optical fiber and integrated photonic sensors for industrial monitoring
    and smart manufacturing.'
  venue: Sensors
- title: IoT-Enabled PCF-SPR Glucose Sensor With MLP-Based Performance Prediction
  date: 2026-04
  url: https://doi.org/10.1109/jsen.2026.3684789
  category: photonic-sensing
  subcategory: theory
  authors:
  - Dhouha Grina
  - Randa Khemiri
  - Sameh Kaziz
  abstract: This work presents a novel intelligent and connected biomedical sensing
    platform that integrates a high-sensitivity photonic crystal fiber-surface plasmon
    resonance (PCF-SPR) sensor with artificial intelligence and Internet of Things
    (IoT) technologies for real-time glucose monitoring. Finite Element Method (FEM)
    simulations were performed to investigate the optical response in terms of confinement
    loss (CL), resonance wavelength shift, and amplitude sensitivity over clinically
    relevant glucose concentrations. The proposed sensor achieves a high wavelength
    sensitivity of 2173.91 nm/RIU, amplitude sensitivity of 732.24 RIU-1, and a detection
    resolution of 4.6 × 10-5RIU. To overcome the computational burden of FEM simulations,
    a Multilayer Perceptron (MLP) model was developed to accurately predict the full
    confinement loss, demonstrating excellent agreement with numerical results (R2=
    0.9963) and effectively capturing nonlinear parameter interactions. The PCF-SPR
    sensor is directly interfaced with an ESP32 microcontroller for real-time signal
    digitization and cloud-based IoT monitoring. This integrated framework enables
    fast data processing, remote visualization, and intelligent glucose estimation,
    establishing a seamless transition from optical simulation to smart, connected
    plasmonic biosensing systems.
