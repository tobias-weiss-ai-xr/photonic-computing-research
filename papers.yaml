- title: Physics-Informed Deep Neural Networks and Density Functional Theory for Quantum
    Defect Modeling in Hexagonal Boron Nitride (hBN)
  date: 2026-07
  url: https://doi.org/10.1093/mam/ozag053.567
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Rafael Noriega Mendoza
  - Arnulfo Castellanos Moreno
  abstract: Hexagonal boron nitride (hBN) has emerged as a key two-dimensional material
    for quantum technologies due to its wide band gap, chemical stability, and the
    presence of optically active point defects that can act as quantum emitters. Understanding
    the electronic structure and localization mechanisms associated with atomic vacancies
    and defect complexes in hBN is essential for the rational design of quantum devices.
    However, accurately modeling these systems remains challenging because of the
    coexistence of long-range interactions, localized defect states, and strong coupling
    between electronic structure and local fields. In this work, we present an integrated
    computational framework combining Density Functional Theory (DFT) and Physics-Informed
    Deep Neural Networks (PINNs) to model quantum defects in monolayer and bilayer
    hexagonal boron nitride. The study focuses on pristine and defective hBN lattices,
    with particular emphasis on atomic vacancies that break translational symmetry
    and generate localized electronic states within the wide band gap of the material.
    These defect-induced states play a central role in charge localization and in
    the interaction of hBN with highly polarizable adsorbates, such as fullerene molecules.
    The physical system under consideration consists of a periodic hBN lattice composed
    of alternating boron and nitrogen atoms, which intrinsically generates local dipoles
    due to differences in electronegativity. In the pristine configuration, the electronic
    states are delocalized across the lattice and can be described as extended states
    characteristic of a two-dimensional insulator. When an atomic vacancy is introduced,
    the periodic potential is locally perturbed, leading to the emergence of mid-gap
    states that are spatially localized around the defect site. These localized states
    significantly modify the electronic density and create attractive potential wells
    that can trap charge carriers or interact strongly with nearby molecules. First-principles
    DFT calculations are employed to generate reference electronic energies, charge
    densities, and effective potentials for both pristine and defective hBN systems.
    These results serve as a quantitative baseline for benchmarking the performance
    of physics-informed neural networks. The DFT-derived potentials encode the underlying
    quantum mechanical interactions and provide physically consistent training data
    that reflect the influence of lattice symmetry, defect-induced perturbations,
    and electronic localization. Physics-Informed Deep Neural Networks are then constructed
    to approximate the quantum wavefunctions and energy eigenvalues associated with
    the defective hBN systems. Unlike purely data-driven models, PINNs explicitly
    incorporate the governing physical laws into the learning process by enforcing
    the residual of the Schrödinger equation, together with normalization and boundary
    constraints. By embedding these physical principles directly into the loss function,
    the neural network is guided toward solutions that are consistent with quantum
    mechanics, even in regions where data may be sparse. The PINN framework is trained
    using potentials derived from DFT calculations, allowing the network to learn
    corrections and refinements to the quantum solutions while preserving physical
    interpretability. The resulting neural network solutions reproduce the key features
    of defect-induced localization observed in DFT, including the formation of mid-gap
    states and the spatial concentration of electronic density around vacancy sites.
    This agreement demonstrates that PINNs can effectively bridge variational quantum
    methods and first-principles electronic structure calculations. Beyond static
    modeling, the proposed framework establishes the foundation for future extensions
    involving coupled systems, such as highly polarizable molecules adsorbed on defective
    hBN surfaces. In particular, fullerene C60 is considered as a candidate system
    due to its large polarizability and strong sensitivity to local electric fields.
    The interaction between C60 and hBN defects is expected to be governed by a combination
    of van der Waals forces and dipole–dipole coupling, leading to modified electronic
    states that are relevant for sensing and quantum photonic applications. Overall,
    this work demonstrates that physics-informed deep learning provides a powerful
    and physically consistent approach for modeling quantum defects in two-dimensional
    materials. By integrating DFT and PINNs into a unified computational pipeline,
    the proposed methodology enables accurate, scalable, and interpretable modeling
    of defect-driven electronic phenomena in hBN. This approach offers a promising
    route toward the design and optimization of defect-based quantum materials and
    hybrid nanostructures.
