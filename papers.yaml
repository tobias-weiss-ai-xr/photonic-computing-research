- title: Angular spectrum-encoded single-shot ultrafast photography
  date: 2026-06
  url: https://doi.org/10.1038/s41377-026-02289-3
  category: photonic-neural-networks
  subcategory: method
  authors:
  - C J Huang
  - Chunqi Jin
  - Yi Chen
  abstract: Capturing transient events on ultrafast time scales demands imaging at
    up to trillions of frames per second (Tfps). Yet leading methods, including compressed
    sensing-based photography, time-resolved shadowgraphy, and other active approaches,
    are limited by bulky optics, high cost, and repeated measurements. Here, we propose
    angular spectrum-encoded single-shot ultrafast photography (ASUP). ASUP combines
    the time-wavelength mapping of a chirped-pulse probe with dispersion-encoded angular
    spectrum information. The latter is realized by a multilayer dielectric thin-film
    photonic chip, inversely designed using a deep Q-network (DQN) reinforcement-learning
    framework. This chip performs pixel-level encoding without the need for bulky
    dispersive optics. An enhanced residual convolutional neural network with Transformer
    blocks then decodes the measurements to reconstruct high-fidelity ultrafast dynamics.
    In experiments, ASUP achieves 0.83 Tfps with six frames in a single exposure and
    captures picosecond laser-induced damage and plasma dynamics in metal films. ASUP
    delivers performance comparable to state-of-the-art ultrafast photography while
    remaining compact, highly integrated, and cost-effective. It overcomes key limitations
    of existing ultrafast imaging and offers a scalable solution for high-speed optical
    diagnostics, laser-matter interactions, and transient phenomena studies.
  venue: Light Science & Applications
- title: AI-AcceleratedTwo-Photon FLIM Phasor Imaging forLabel-Free Mapping of Macrophages
    in Influenza A Virus-Infected HumanLung Tissue
  date: 2026-05
  url: https://doi.org/10.1021/acsphotonics.5c02951
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Stella Greiner
  - Jhonatan Contreras
  - Franziska Hornung
  abstract: Abstract Influenza A virus (IAV) remains a major cause of respiratory
    infections, resulting in significant global morbidity and mortality. Understanding
    the host immune response is key to elucidating disease mechanisms, requiring human-relevant
    model systems that preserve the complex lung microenvironment. Precision-cut lung
    slices (PCLS) represent such a model, maintaining native architecture and cell–cell
    interactions, thereby enabling ex vivo infection studies under near-physiological
    conditions. However, current optical imaging approaches for PCLS─such as conventional
    two-photon excited fluorescence (TPEF) microscopy─primarily reveal structural
    information but lack the metabolic and functional contrast needed to differentiate
    immune cells, such as macrophages, from surrounding lung tissue. To overcome this
    limitation, we applied two-photon fluorescence lifetime imaging microscopy (2P-FLIM)
    to IAV-infected human PCLS, capturing intrinsic autofluorescence signals (mainly
    NAD(P)H) that report on cellular metabolism. This label-free approach enables
    discrimination of macrophages within tissue, but time-intensive acquisition and
    analysis limit throughput for systematic studies. To accelerate image collection
    and interpretation, we trained a neural network on annotated 2P-FLIM data sets,
    where fluorescence intensity images were labeled via phasor-based lifetime segmentation.
    The model learned morphological and intensity cues to predict the macrophage distribution
    directly from intensity-only z-stacks, enabling rapid segmentation. This AI-enhanced
    FLIM framework bridges physiological relevance and analytical efficiency─combining
    human PCLS, phasor-based 2P-FLIM, and deep learning to achieve fast, label-free
    visualization and quantification of pulmonary macrophages in a human model in
    one-fifth of the time compared to only 2P-FLIM. The approach highlights the potential
    of integrating advanced photonics and AI for high-throughput immunometabolic studies
    and antiviral research.
  venue: ACS Photonics
- title: 'Scientific Report: Explaining the Computational Innovation in the Fraserphere
    Concept'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21144498
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Kyle Fraser
  abstract: 'Worked for 14s Scientific Report: Explaining the Computational Innovation
    in the Fraserphere Concept Author: Kyle Ross Fraser Affiliation: Independent Researcher,
    @kylefraser1 on X (formerly Twitter) Email: k.fraser95@hotmail.com Date: July
    3rd 2026 This report explains the computational innovation in the Fraserphere
    concept, integrating photonic neuromorphic processing with swarm-based emergent
    cognition for energy-efficient, stellar-scale AI. The hypothesis is that this
    synergy bridges optical engineering and AI, enabling distributed computation powered
    by solar harvesting. Methods include logical synthesis from photonic principles
    and swarm algorithms, with quantitative scaling via symbolic calculations. Two
    representative scaling regimes are examined: a fixed deployment of 109 10^9 109
    nodes and a partial Dyson swarm capturing a collection fraction f=10−6 f = 10^{-6}
    f=10−6 of solar luminosity. Results quantify node-level performance at (1.64±0.39)×1017
    (1.64 \pm 0.39) \times 10^{17} (1.64±0.39)×1017 ops/s (at Eop=10−15 E_{\rm op}
    = 10^{-15} Eop=10−15 J/op). Swarm-level performance reaches (1.64±0.39)×1026 (1.64
    \pm 0.39) \times 10^{26} (1.64±0.39)×1026 ops/s for a 109 10^9 109-node deployment
    or (1.15±0.28)×1034 (1.15 \pm 0.28) \times 10^{34} (1.15±0.28)×1034 ops/s when
    capturing f=10−6 f = 10^{-6} f=10−6 of solar luminosity. Sensitivity analysis
    shows robust performance across plausible efficiency ranges. The discussion highlights
    the innovation’s potential to inspire advancements in AI and space systems, including
    recommendations for xAI collaboration and targeted simulations using deep learning
    tools for temporal modeling. This report stands alone as a self-contained summary
    of the rationale, mechanisms, and implications. Introduction The Fraserphere is
    a proposed network of space-based nodes for photonic communication, energy transfer,
    and computation, inspired by Dyson swarm concepts for stellar energy harvesting.
    This report focuses on its computational innovation, addressing limitations in
    traditional AI such as high energy consumption (Eop≈10−12 E_{\rm op} \approx 10^{-12}
    Eop≈10−12 J/op in silicon) and scalability bottlenecks. The research objective
    is to explain this innovation clearly, defining the “photonic brain” as the onboard
    neuromorphic component and “NeuroSwarms” as the emergent swarm-level cognition.
    The hypothesis states that light-based (photonic) processing in nodes, combined
    with swarm metaheuristics, enables efficient, distributed AI. This work is original
