  abstract: 'In appreciation of the strong support all Microscopy Society of America
    Sustaining Members provide for the Society, Microscopy Today offered these members
    the opportunity to highlight their company mission and goals and to provide a
    product description in the form of an entry of up to 500 words. Below we include
    contributions from those companies that provided this information. The Microscopy
    Society of America and its publications greatly appreciate the outstanding support
    received from all of our Sustaining Members. At DECTRIS, we develop and manufacture
    the most accurate high-performance, hybrid-pixel X-ray and electron detectors.
    Our goal is to advance scientific research all over the world. Here, academic
    research meets agile industry practices and an entrepreneurial spirit. Deeply
    rooted in the scientific community, we share our users’ values, as well as their
    desire to learn. Simultaneously, we serve businesses whose mission is to provide
    the best possible scientific equipment. Our engineers, technicians, administrators,
    and commercial experts work hard to make sure that our users get a detector they
    can truly count on. Direct Electron designs and manufactures next-generation direct
    detection cameras for electron microscopy, enabling researchers to push the frontiers
    of science. Our innovation is driven by continuous R&D, advanced data collection
    and ­processing tools, and close collaboration with the scientific community.
    Direct Electron’s newest cameras set the standard in their fields: Apollo, the
    fastest cryoEM camera, and Celeritas XS, the fastest 4D STEM camera. Apollo –
    Revolutionary event-based direct detection technology delivering ultra-fast 8k×8k
    super-resolution cryoEM imaging with exceptional image quality, ease-of-use, and
    throughput. Centuri – 100kV optimized cryoEM detector for single-particle analysis
    of small biological molecules with outstanding speed and sensitivity. Celeritas
    XS – The largest and fastest pixelated 4D STEM camera, enabling 4D STEM acquisition
    at speeds comparable to conventional HAADF detectors. Features include on-chip
    CDS and global shutter for outstanding data quality. Artemis – High-speed direct
    detection camera optimized for advanced materials science TEM applications including
    high-throughput in situ workflows. Meridian – Direct detection camera optimized
    for HR-EBSD and related low-voltage diffraction applications, delivering high
    sensitivity and high-speed acquisition for materials characterization. Zenith
    – Direct detection camera designed for low-kV biological SEM imaging, combining
    high sensitivity and low-dose performance for challenging life science applications.
    DE-Series – Versatile direct detection cameras supporting a broad range of TEM
    applications, from high-resolution cryo-EM with the DE-64 to high-speed in situ
    TEM with the DE-16 and cost-effective imaging with DirectView2. LV-Series – Proprietary
    direct detection technology optimized for low-voltage applications including LEEM
    and PEEM in the 5–30kV range. Mission Control – Advanced software suite for efficient
    data collection, automation, and image processing, designed to maximize productivity
    and scientific impact. DE-FreeScan – High-performance SEM and STEM scan generator
    supporting arbitrary scan patterns, compressive sensing, subsampling, and synchronized
    high-speed 4D-STEM acquisition. Founded in 2007, Direct Electron is led by a team
    of Ph.D. scientists dedicated to advancing electron microscopy through innovation,
    collaboration, and responsive customer support. Since 1976, Duniway Stockroom
    has provided new and high-quality used vacuum equipment to universities, government
    laboratories, OEMs, Fortune 500 corporations, and smaller end-users around the
    world. We are a manufacturer of new ion pumps and ion pump controllers (Terranova®)
    as well as new vacuum gauge controllers (Terranova®). Duniway keeps and distributes
    a large stock of hardware and supplies ready for same-day shipment as well as
    a large selection of new and rebuilt ion pumps, mechanical pumps, and diffusion
    pumps. Our pump rebuilding services handle all makes of ion pumps, mechanical
    pumps, and diffusion pumps. For more information, please go to www.duniway.com.
    Euclid Techlabs is a US-based firm specializing in electron beam devices and advanced
    materials. After 20+ years serving the particle accelerator R&D market, we now
    ship a much wider-range product portfolio with customers around the globe, from
    semiconductor photocathodes and superconducting photoinjectors, to ultrafast electron
    microscopy, to domestically grown technical diamonds, to arc-free high-power microwave
    windows using our proprietary conducting ceramics. As pioneers in advanced electron
    device engineering, we excel in tackling complex design challenges. Building on
    this expertise, Euclid Techlabs is executing a focused strategy to expand from
    our laser-free UltraFast Pulser™ (UFP™) platform on TEMs into broader ultrafast
    solutions for the EM ecosystem, including ultrafast probe modulation, ultrafast
    pump solutions, advanced sample holders, and other electron beam technologies.
    Through tight collaborations and deep understanding of the underlying physics,
    we drive co-engineering and accelerated commercialization, delivering upgrades
    that transform standard electron microscopes into powerful stroboscopic ultrafast
    instruments with superior spatiotemporal resolution, acquisition time, pulse tunability,
    and stability. Our agile, milestone-driven project management approach ensures
    optimal resource allocation and timely delivery. We collaborate with major microscope
    manufacturers, national laboratories across the United States, academic institutions,
    CERN, and numerous global institutions. Gatan, Inc. is the world''s leading manufacturer
    of instrumentation and software used to enhance and extend the operation and performance
    of electron microscopes. Gatan products, which are fully compatible with nearly
    all electron microscope models and include the EDAX portfolio, cover the entire
    range of the research process— from specimen preparation and manipulation to imaging,
    spectroscopy, and analysis. The Gatan brand name is recognized and respected throughout
    the worldwide scientific community and has been synonymous with high-quality products
    and leading technology for more than 60 years. Gatan is headquartered in Pleasanton,
    CA. For more information, visit www.gatan.com. The International Centre for Diffraction
    Data (ICDD®), started in 1941, is focused on meeting the needs of the scientific
    community through the publication of the Powder Diffraction File™ (PDF®) and JADE®
    software. The ICDD is a non-profit scientific organization. The membership of
    the ICDD consists of worldwide representation from academe, government, and industry.
    We strive to provide quality educational opportunities to exchange new ideas and
    information for materials characterization. ICDD’s carefully curated and edited
    material identification databases interface with diffractometers and analysis
    systems of the world’s leading X-ray equipment manufacturers and software developers.
    The PDF databases and JADE software are available in a variety of licensing options.
    The ICDD PDF database is a collection of single-phase X-ray powder diffraction
    patterns in the form of tables of characteristic interplanar spacings and corresponding
    relative intensities, along with other pertinent physical and crystallographic
    properties. The creation, maintenance, and dissemination of such a file was the
    primary purpose for the establishment of the ICDD and its predecessor organizations.
    In order to meet the individual need of diffractionists worldwide, our PDF databases
    are available in various formats. The PDF has various subfiles of data including,
    but not limited to, minerals, metals and alloys, and forensic materials. There
    is also an educational package for classroom use. Various methods, including the
    use of printed indexes and computer software, enable users to match data in the
    file with their laboratory data. Data for the publication in the PDF are acquired
    through contributions from individual scientists, corporate laboratories, literature
    surveys, and a Grant-in-Aid program (https://www.icdd.com/grant-in-aid). Approximately
    200 leading scientific journals are searched manually for powder diffraction data.
    Additional literature surveys covering patents, dissertations, and the remaining
    open literature are performed using various online databases and search techniques.
    All data are critically reviewed and evaluated by the editorial staff. Each pattern
    must pass through a four-tiered editorial review process before it can be included
    in the PDF. As technology evolves, the quality requirements for reference pattern
    data also evolve. As a result, information in the PDF is continuously reviewed
    and upgraded for accuracy and quality. The ICDD’s JADE software provides novel
    ways of looking at data and new methods of XRD analysis. Because we build our
    analytical applications independent of any hardware manufacturer, our tools must
    work across a very wide range of diffractometers, so our results must be unbiased
    toward any brand of diffractometer. Our pursuit is the most accurate XRD analysis
    and results, independent of the equipment manufacturer. JEOL USA is dedicated
    to delivering world-class technology with superior service, ensuring that its
    customers achieve the highest levels of performance and reliability. The JEOL
    Technology Center, New England, located at the Peabody, MA headquarters, serves
    as a hub for demonstrations, training, and applications development. The site
    also houses the primary parts depot and service center for the Western Hemisphere,
    ensuring fast, efficient support for customers worldwide. As a wholly owned subsidiary
    of JEOL Ltd., JEOL USA, Inc. was established in 1962 to provide service and sales
    support across the Americas. Headquartered in Peabody, MA, JEOL USA operates with
    a team of more than 300 professionals, offering industry-leading instrumentation,
    training, and technical expertise to researchers and businesses. Product Portfolio:
    JEOL offers a comprehensive range of scientific and industrial solutions, including:
    Electron Optics Instruments Transmission electron microscopes (TEM) Scanning electron
    microscopes (SEM) Focused ion beam systems (FIB-SEM) Electron probe microanalyzers
    (EPMA) Soft X-ray emission spectrometers Auger microanalyzer Analytical Instruments
    Nuclear magnetic resonance (NMR) spectrometers Mass spectrometers (MALDI-TOF,
