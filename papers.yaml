- title: Streamlined optical training of large-scale modern deep learning architectures
    with direct feedback alignment
  date: 2026-05
  url: https://doi.org/10.1073/pnas.2532022123
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Ziao Wang
