  - Daniel Pérez
  abstract: Programmable integrated photonics aims to replicate the versatility of
    field-programmable gate arrays in the optical domain. However, scaling these systems
    has been prevented by the high power consumption and thermal crosstalk of conventional
    volatile phase shifters. Here we introduce a non-volatile field-programmable photonic
    gate array, implemented on a hybrid silicon–barium titanate platform, which overcomes
    the power scaling limitations of previous technologies. Unlike traditional thermo-optic
    devices that require constant power to maintain a state, our device utilizes ferroelectric
    domain switching to provide non-volatile memory, allowing optical circuits to
    be programmed and retained without any holding power or electrical bias. The hexagonal
    waveguide mesh integrates 58 programmable unit cells and 116 actuators, achieving
    nanosecond-scale switching speeds of 80 ns while reducing static power consumption
    to negligible levels (560 nW per π phase shift). To validate this platform, we
    configured the mesh to perform diverse signal processing functions, including
    tunable filtering, 4 × 4 linear unitary transformations and optical routing. This
    work establishes non-volatile ferroelectric silicon photonics as a scalable, heat-free
    platform essential for the next generation of energy-efficient photonic computing.
    Barium titanate ferroelectric is used in photonic phase shifters arranged in a
    hexagonal waveguide mesh, forming a programmable photonic array. The device achieves
    sub-100-ns switching speeds, while each individual gate retains its state without
    continuous powering, enhancing overall energy efficiency.
  venue: Nature Photonics
- title: Programmable Three-dimensional Photonic Neural Network Chip
  date: 2026-04
  url: https://doi.org/10.1038/s41467-026-72316-9
  category: optical-computing
  subcategory: method
  authors:
  - Ziyu Cao
  - Hong-Jing Du
  - Xi-Jun Yuan
  abstract: Photonic neural network chips promise compact footprint, low latency,
    and high energy efficiency. Yet, their scale and computing throughput are fundamentally
    constrained by one-dimensional input interfaces, unavoidable waveguide crossings,
    and the resulting crosstalk and excess loss. As a result, two-dimensional (2D)
    image data must be serialized through limited input ports, sacrificing spatial
    parallelism and creating input/output (I/O) bottlenecks. Here we demonstrate a
    programmable three-dimensional (3D) photonic neural network chip, fabricated by
    femtosecond laser direct writing (FLDW) in glass, that directly processes 2D images.
    The cascaded architecture alternates photonic-lantern waveguide arrays and phase-shifter
    arrays to implement matrix operations. An 8-layer 8 × 8 device achieves a computing
    throughput of 6554 TOPS, surpasses leading planar photonic platforms, and delivers
    93% accuracy on MNIST classification and 94% fidelity in optical pattern generation.
    By combining 3D spatial parallelism with programmability, this work establishes
    a scalable paradigm for reconfigurable photonic computing in complex inference
    tasks. Photonic AI chips can process information at high speed, but current designs
    are constrained by planar layouts. Here, authors demonstrate a programmable 3D
    photonic neural network chip that directly processes 2D images and achieves 93%
    accuracy on MNIST classification.
  venue: Nature Communications
- title: Ultrafast Laser-Fabricated Three-Dimensional Photonic Chips Empowering Diverse
    Applications
  date: 2026-03
  url: https://doi.org/10.1109/jstqe.2026.3669125
  category: optical-computing
  subcategory: method
  authors:
  - Jian Wang
  - Jue Wang
  - Chengkun Cai
  abstract: Three-dimensional (3D) photonic integration is becoming a key enabler
    for future optical technologies, driven by the need for greater functionality,
    higher compactness, and superior interconnect density. In response to these demands,
    ultrafast laser processing has emerged as a powerful technique for realizing 3D
    photonic chips with enhanced design and fabrication flexibility—while avoiding
    the complexity of mask-based or cleanroom-dependent fabrication. This review begins
    by outlining the fundamental mechanisms of femtosecond laser–matter interactions,
    which enable precise energy deposition and spatially confined material modification.
    It then delineates three primary processing routes—direct modification, additive
    processing, and subtractive processing—alongside essential beam-shaping strategies.
    The compatibility of various material systems and structural platforms, including
    glasses, polymers, crystals, bulk substrates, thin-film layers, and optical fibers,
    is further discussed. Subsequently, the review details how these 3D laser-fabricated
    photonic structures underpin a wide range of applications, such as optical field
    manipulation, optical communications, optical interconnects, optical computing
    and processing, optical data storage, quantum information, nonlinear optics, optical
    trapping, and imaging. Finally, it concludes with a perspective on the prevailing
    challenges and future trends toward scalable, multifunctional, and hybrid-integrated
    photonic systems enabled by ultrafast laser microfabrication.
