- title: Localized Temperature Monitoring in Mouse Brain during Light Delivery via
    a Non‐Planar Tapered Fiber‐Integrated µRTD Sensor
  date: 2026-04
  url: https://doi.org/10.1002/adma.202519655
  category: photonic-sensing
  subcategory: method
  authors:
  - Antonio Balena
  - Marco Bianco
  - Barbara Spagnolo
  abstract: Monitoring local brain temperature with high spatial precision is essential
    to understanding neurophysiological processes and managing the side effects of
    optical neuromodulation techniques. We present a novel multifunctional neural
    interface integrating a microscale resistance temperature detector (µRTD) onto
    the curved surface of a tapered optical fiber (TF), enabling co-localized light
    delivery and thermal sensing with minimal footprint. The µRTD, patterned via an
    unconventional two-photon polymerization (TPP)-based process on the fiber surface,
    exhibits thermal sensitivity <0.1°C and low self-heating under physiologically-safe
    bias conditions. We demonstrate the system's capacity to resolve subtle temperature
    changes induced by optogenetic stimulation/inhibition protocols (the latter requiring
    illumination periods of hundreds of milliseconds up to several seconds), revealing
    significant thermal accumulation only under long, high-intensity illumination.
    This integration resolves the spatial mismatch of multimodal probes and reduces
    implant cross-section compared to coaxial or side-by-side configurations. Furthermore,
    the TPP approach is modular, allowing integration with additional functionalities
    (i.e., electrophysiological recording or thermoplasmonics). By uniting photonic
    and thermal readout into a minimally invasive probe, our technology offers a powerful
    tool for studying thermally mediated neural processes, enhancing the safety and
    interpretability of optical neurotechnologies. Its integration potential positions
    this platform as a complementary technology for next-generation multifunctional
    neural interfaces.
  venue: Advanced Materials
- title: Microwave Photonic Unmanned Aerial Vehicles Structural Health Monitoring
    System Based on Address Fiber Bragg Structures
  date: 2026-03
  url: https://doi.org/10.1109/ieeeconf68869.2026.11461125
  category: photonic-sensing
  subcategory: method
  authors:
  - Ilnur I. Nureev
  - Oleg G. Morozov
  - Igor Muravev
  abstract: The integration of Structural Health Monitoring (SHM) systems into Unmanned
    Aerial Vehicles (UAVs) is essential to ensure operational safety and longevity,
    particularly for composite airframes susceptible to barely visible damage. While
    fiber Bragg gratings (FBGs) offer notable advantages for strain sensing, conventional
    FBG-based interrogation systems face significant challenges in UAV applications
    due to their weight, power consumption, complexity, and sensitivity to temperature
    variations. This paper proposes a novel, lightweight SHM architecture based on
    Addressed Fiber Bragg Structures (AFBS). AFBS are specialized fiber gratings that
    generate a dual-peak optical response with a stable, temperature and strain invariant
    radio-frequency (RF) spacing – the address frequency. This property enables straightforward
    sensor identification and multiplexing while simplifying thermal compensation.
    The proposed interrogation scheme utilizes a simple narrowband laser source, a
    linear slope filter, and a single photodetector, shifting the signal processing
    to the RF domain with compact electronics. A detailed mathematical framework is
    presented for demodulating the central wavelength shifts of multiple AFBS in an
    array, addressing cross-beat ambiguities through numerical optimization. The feasibility
    of the approach is validated via OptiSystem simulations of both transmission-type
    ($2 \pi$-AFBS) and reflection-type ($2 \lambda$-AFBS) sensor arrays, demonstrating
    successful multiplexed operation and accurate wavelength shift detection. The
    results confirm that the AFBS-based system offers a robust, low-mass, and power-efficient
    technology toward fully integrated on-board SHM system for UAVs.
  venue: ''
- title: Postprocessing free 3D printing of glasses for seamless integration in optical
    microsystems
  date: 2026-03
  url: https://doi.org/10.1117/12.3084227
  category: photonic-sensing
  subcategory: application
  authors:
  - Po‐Han Huang
  - Lee-Lun Lai
  - Pierre Edinger
  abstract: Integrated optical microsystems are key to next-generation communication,
    sensing, and quantum technologies, with the potential to exceed the capabilities
    of conventional microelectronics. Such systems rely on precise control of light,
    but creating optimal 3D micro-optics is challenging for conventional microfabrication
    technologies. Multiphoton lithography (MPL) offers nanoscale 3D printing capabilities,
    while efforts to extend MPL to high-performance glasses typically involve harsh
    high-temperature or chemical postprocessing that is incompatible with integrated
    optical microsystems. To address this, we explore the use of hydrogen silsesquioxane
    (HSQ), an inorganic precursor, for MPL. We demonstrate postprocessing-free 3D
    printing of solid silica glass and self-forming glass nanogratings with nanoscale
    resolution. These advances enable the direct integration of glass micro-optics
    on photonic chips and optical fibers. We present functional 3D-printed glass optical
    devices, including on-chip ring resonators and photoluminescent sources, and fiber-tip
    refractive index sensors and polarization beam splitters, opening new avenues
    for high-performance optical microsystem integration.
  venue: ''
- title: Dual-core PCF-SPR sensor for early-stage cancer cell detection
  date: 2026-06
  url: https://doi.org/10.1364/josab.596081
  category: photonic-sensing
  subcategory: method
  authors:
  - Parisa Taghizadeh
  - Masoud Jabbari
  - Ghahraman Solookinejad
  abstract: This study proposes a novel, to our knowledge, photonic crystal fiber
    (PCF)-based surface plasmon resonance (SPR) biosensor for rapid, early-stage detection
    of cancer cells. The proposed sensor incorporates a dual-core, dual-side-polished
    PCF architecture integrated with an external sensing channel, enabling efficient
    analyte circulation and enhanced light–matter interaction. The unique configuration
    enables strong coupling between guided optical modes and surface plasmon polaritons,
    enabling highly sensitive detection of refractive index variations associated
    with different stages of cancer cell progression. Numerical investigations reveal
    outstanding sensing performance, achieving a maximum wavelength sensitivity of
    5714 nm/RIU and amplitude sensitivities ranging from −631 to −951RIU −1 across
    various cancer cell conditions. The proposed design requires only 13 air holes,
    significantly simplifying the fabrication process compared with conventional SPR-PCF
    sensors while maintaining excellent optical performance. Furthermore, the external
    sensing scheme enhances operational flexibility and supports continuous sample
    circulation, making the platform attractive for real-time biomedical diagnostics.
    Owing to its compact structure, high sensitivity, ease of fabrication, and cost-effectiveness,
    the proposed sensor is a promising candidate for next-generation label-free cancer
    detection systems. The presented approach provides a viable pathway toward non-invasive,
    rapid, and accurate clinical diagnostics, with significant potential for improving
    early cancer screening and patient prognosis.
  venue: Journal of the Optical Society of America B
- title: High-sensitivity mid-infrared temperature sensors based on femtosecond laser-inscribed
    indium fluoride FBGs at 4.6 μm
  date: 2026-03
  url: https://doi.org/10.1364/ol.591531
  category: photonic-sensing
  subcategory: application
  authors:
  - Andreas Ioannou
  - Antreas Theodosiou
  - Kyriacos Kalli
  abstract: We demonstrate high-sensitivity mid-infrared (MIR) temperature sensing
    using femtosecond-laser-inscribed fiber Bragg gratings (FBGs) in single-mode indium
    fluoride (InF 3 ) optical fibers. Linear and repeatable thermal responses are
    obtained at long MIR wavelengths, with a sensitivity of 51.96 pm/°C at 4.61 µm,
    enabled by operation near the long-wavelength transmission edge of the material.
    High-reflectivity Bragg resonances exceeding 97% at 3.45 µm and 98% at 4.61 µm
    are achieved using plane-by-plane inscription through the polymer coating, preserving
    fiber integrity. First-order FBG operation beyond 4.5 µm is demonstrated for the
    first time, to our knowledge, in InF 3 fiber, while higher-order harmonics in
    the near-infrared enable indirect interrogation using standard telecom-band instrumentation.
    These results establish InF 3 FBGs as an effective platform for integrated MIR
    temperature sensing and fiber-based photonic systems.
  venue: Optics Letters
- title: Inverse design epsilon-near-zero-based broadband nonreciprocal thermal emitter
    using hybrid deep learning framework
  date: 2026-03
  url: https://doi.org/10.1063/5.0323320
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Jun-Yang Sui
  - Haifeng Zhang
  abstract: Nonreciprocal thermal radiation, which breaks Kirchhoff's law by decoupling
    absorptivity and emissivity, is essential for advanced radiative heat transfer
    control. However, achieving broadband and tunable nonreciprocal thermal radiation
    with high design efficiency remains a challenge. This study proposes a novel hybrid
    deep learning framework, integrating the Artificial Rabbit Optimization and tandem
    neural network, to inversely design multilayer films (MLFs) based on magnetized
    gradient epsilon-near-zero (ENZ) InAs layers. By using the Artificial Rabbit Optimization
    algorithm, we collect a high-quality dataset with a noise ratio of only 3.2%,
    significantly reducing computational overhead compared to random sampling. The
    multitasking tandem neural network converges to a low cost function of 0.086,
    improving the accuracy and avoiding the scattering problem faced by traditional
    neural networks. Results show that significant nonreciprocal thermal radiation
    (nonreciprocity > 0.637 and peak 0.723) is achieved in the 14–19 μm range by exploiting
    the magneto-optical effects of InAs and ENZ-induced Brewster modes. Furthermore,
    the MLFs exhibit reversed absorptivity and emissivity spectra under reversed magnetic
    fields. These findings provide a data-efficient and scalable solution for dynamic
    thermal management and infrared camouflage, demonstrating the powerful synergy
    between deep learning and nonreciprocal photonics.
  venue: Applied Physics Letters
- title: Hardware-software collaborative computing of photonic spiking reinforcement
    learning for robotic continuous control
  date: 2026-05
  url: https://arxiv.org/abs/2512.00427
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Mengting Yu
  - Shuiying Xiang
  - Changjian Xie
  abstract: Robotic continuous control tasks impose stringent demands on the energy
    efficiency and latency of computing architectures due to their high-dimensional
    state spaces and real-time interaction requirements. Conventional electronic computing
    platforms face computational bottlenecks, whereas the fusion of photonic computing
    and spiking reinforcement learning (RL) offers a promising alternative. We propose
    a computing architecture based on photonic spiking RL, which integrates the twin
    delayed deep deterministic policy gradient algorithm with a spiking neural network.
    The proposed architecture employs an optical-electronic hybrid computing paradigm
    wherein a silicon photonic Mach-Zehnder interferometer (MZI) chip executes linear
    matrix computations, while nonlinear spiking activations are performed in the
    electronic domain. Experimental validation on the Pendulum-v1 and HalfCheetah-v2
    benchmarks demonstrates the capability of the system for software-hardware coinference,
    achieving a control policy reward of 5497±251 on HalfCheetah-v2, a 15% reduction
    in convergence steps, and an action deviation below 2.2%. Notably, we present
    the first application of a programmable MZI photonic computing chip to robotic
    continuous control tasks, attaining an energy efficiency of 1.39 TOPS/W and an
    ultralow computational latency of 120 ps. Such performance underscores the promise
    of photonic spiking RL for real-time decision-making in autonomous and industrial
    robotic systems.
  venue: Advanced Photonics Nexus
- title: Leveling Up Upconverting Nanoparticles with Machine Learning
  date: 2026-05
  url: https://doi.org/10.1021/acs.accounts.6c00187
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Ripeng Luo
  - Jungmin Hamm
  - Emory M. Chan
  abstract: ConspectusUpconverting nanoparticles (UCNPs) transform low-energy light
    into higher-energy photons, enabling applications in subwavelength and subsurface
    imaging, nanoscale sensing, therapeutics, optogenetics, printing, and optical
    computing. However, the widespread adoption of UCNPs is hindered by their low
    brightness and limited spectral tunability. Predicting the ideal nanoparticle
    architectures to overcome these limitations is challenging because UCNP photophysics
    are governed by highly nonlinear, complex energy transfer networks that span the
    excited states of lanthanide dopants. Due to the large number of possible combinations
    of dopants, concentrations, host matrices, heterostructures, and reaction conditions,
    optimizing the compositional and synthetic parameters of UCNPs using conventional
    trial-and-error approaches is intractable.This Account explores how researchers
    can overcome these challenges and enhance the properties of UCNPs using artificial
    intelligence (AI) and machine learning (ML). We first review how the early foundations
    of AI-guided discovery were established with automated experimental workflows
    and physical modeling. Using robotic synthesis platforms and differential rate
    equation models, researchers have successfully navigated high-dimensional compositional
    spaces to reveal optical phenomena, such as energy looping and photon avalanching,
    in nanoparticles.Building on these data-driven approaches, ML has been integrated
    into UCNP research initially for processing raw characterization data, such as
    automating the analysis of TEM images and time-resolved luminescence curves. AI
    approaches have been extended to interpret signals in applications that utilize
    UCNPs, such as classifying the cytotoxicity of drugs based on upconversion luminescence
    microscopy data. Most significantly, ML is driving the design of new UCNP compositions
    and structures, including our recent development of closed-loop active learning
    of UCNP core-shell heterostructures. By coupling Bayesian optimization with kinetic
    Monte Carlo (kMC) simulations, we achieved 110-fold enhancement in UCNP emission
    over just 40 iterations. To bypass the steep computational cost of simulating
    UCNP heterostructures with up to 9 shells, we leveraged differentiable deep learning
    surrogate models based on heterogeneous graph neural networks to perform inverse
    design. Notably, these hetero-GNNs were able to extrapolate far outside of the
    model's training data and predict UCNP heterostructure compositions with 6.5-fold
    more intense emission than the brightest UCNP in the training set.In the future,
    we predict that AI/ML approaches will become integral to the UCNP research. UCNP
    experiments may soon be accelerated by autonomous self-driving laboratories in
    which robotic synthesis, in-line characterization, and ML agents operate in a
    closed feedback loop to intelligently investigate underexplored chemical spaces.
    Large language models (LLMs) could parse literature to develop overarching hypotheses
    and detailed recipes for these autonomous workflows, with generative models suggesting
    novel structures to test. Together with human creativity and critical analysis,
    these AI tools will accelerate the discovery of advanced upconverting nanomaterials,
    aiding fundamental understanding of their mechanisms and inspiring a broader array
    of photonic applications.
  venue: Accounts of Chemical Research
- title: End-to-end training and inference in integrated photonic deep neural networks
  date: 2026-03
  url: https://doi.org/10.1117/12.3077930
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Farshid Ashtiani
  - Mohamad Hossein Idjadi
  - Alexander J. Geers
  abstract: Photonic neural networks can significantly boost the performance of their
    digital electronic counterparts by benefiting from large optical bandwidth, low-loss
    signal transmission, and various multiplexing schemes. Hence, high accuracy and
    robust training and inference in such networks are critical for their large-scale
    deployment. Here, we demonstrate integrated end-to-end photonic deep neural networks
    that offer scalability, low-latency signal processing, and robust and repeatable
    end-to-end backpropagation training. Moreover, we use standard silicon photonic
    platforms which enable high-yield and low-cost fabrication of large-scale photonic
    neural networks for the next generation of deep learning systems.
  venue: ''
- title: Scalable optical neural network with nonlocally coupled coherent photonic
    processor
  date: 2026-03
  url: https://arxiv.org/abs/2603.07174
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Chun Ren
  - Ryota Tanomura
  - Kazuki Ichinose
  abstract: Optical neural networks (ONNs) based on programmable photonic integrated
    circuits (PICs) offer a promising route toward low-latency and energy-efficient
    deep learning. However, conventional photonic implementations of matrix-vector
    multiplication (MVM) rely on locally connected architectures, such as Mach-Zehnder
    interferometer (MZI) meshes, whose number of active components scales quadratically
    with matrix size, severely limiting scalability. Here, we present a scalable ONN
    that overcomes this limitation by exploiting the intrinsically diffractive and
    nonlocal nature of coherent light inside a silicon photonic chip. Our approach
    employs cascaded stages of multiport directional couplers (MDCs) interleaved with
    compact phase-shifter arrays, enabling strong nonlocal coupling among multiple
    optical modes. We show that an MDC-based optical unitary converter (OUC) requires
    only $3N$ phase shifters to achieve uniform coverage over the $N$-dimensional
    complex unitary group, in stark contrast to the $O(N^2)$ scaling of conventional
    MZI meshes. Based on the singular value decomposition, we demonstrate that an
    $N\times N$ MVM can be realized using only $7N$ phase shifters, breaking the traditional
    $O(N^2)$ scaling barrier. We experimentally implement a 32-input silicon photonic
    MVM chip with a tenfold reduction in active components and validate its performance
    on various classification tasks. Our results establish a practical pathway toward
    large-scale, energy-efficient, and reconfigurable photonic neural networks.
  venue: arXiv (Cornell University)
- title: Unsupervised online learning in photonic neural networks
  date: 2026-03
  url: https://doi.org/10.1117/12.3078293
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Xi Li
  - Disha Biswas
  - Anna Capuano
  abstract: We present a fully optical deep photonic neuromorphic network (DPNN) that
    supports unsupervised online learning using a local Hebbian learning rule. Unlike
    conventional photonic systems that rely on offline training and energy-intensive
    optical-electrical-optical (O-E-O) conversions, our architecture operates entirely
    in the optical domain. In a tabletop proof-of-concept using fiber-optic components,
    the network achieves 100% accuracy on a letter recognition task under both supervised
    and unsupervised learning. We also explore the use of phase-change materials (PCMs)
    as promising candidates for enabling non-volatile optical synapses and neurons.
    While not yet implemented on-chip, integrating PCM-based devices is a key future
    goal to enhance scalability and efficiency. This work establishes a pathway toward
    next-generation energy-efficient, scalable photonic AI hardware.
  venue: ''
- title: Distillation-guided Optical Neural Networks with Reinforcement Learning-assisted
    Calibration
  date: 2026-07
  url: https://doi.org/10.6084/m9.figshare.c.8572904.v1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Kangjian Di
  - Fuhao Yu
  - Silin Chen
  abstract: Optical neural networks (ONNs) promise ultra-fast and energy-efficient
    computing but are hampered by the critical challenge of on-chip training. Here,
    we propose an on-chip training distillation-guided optical neural network (DGONN)
    and introduce a forward distilled algorithm to address these challenges. The forward
    distillation algorithm mitigates the instability of blind gradient propagation
    in photonic chips. Our on-chip distillation scheme reduces the number of parameters
    compared to electronic deep neural networks, thus enhancing training efficiency
    and accuracy relative to traditional optical training methods. Numerical and experimental
    results demonstrate the high classification accuracy of our DGONN system across
    various datasets (CIFAR-10, Fashion-MNIST, Handwriting-MNIST, free spoken digit
    dataset (FSDD), and distributed acousto-optic sensing (DAS)). Additionally, deep
    reinforcement learning further enables the controllability and stability of the
    on-chip optical system. Our work could pave the way for efficient ONNs, offering
    a promising approach to overcoming the training challenges of photonic neural
    networks and enabling the potential development of energy-efficient, low-power
    AI systems using photonic technology.
  venue: Figshare
- title: A Geometrothermodynamic Learning Bound for Analog Photonic Neural NNetwork
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20416616
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Dimitrios Ropokis
  abstract: Analog computing substrates, such as silicon-based photonic Mach-Zehnder
    Interferometer (MZI) meshes, present a highly energetic alternative to digital
    accelerators for deep learning workloads. However, establishing fundamental limits
    on their thermodynamic training cost remains a major open challenge. In this paper,
    we formulate a rigorous Geometrothermodynamic Learning Bound (GTLB) that bridges
    stochastic thermodynamics and information geometry for analog physical neural
    networks trained via Equilibrium Propagation (EqProp). Under covariant Itô stochastic
    dynamics on the Fisher-Rao information manifold of MZI phase parameters, we prove
    that the average entropy production } \langle \Delta S_{\text{prod}} \rangle \text{
    per epoch is bounded from below by the coupling between the Fisher-Rao Ricci curvature
    tensor and the Hessian of the loss landscape. We further generalize this limit
    to Finslerian information manifolds to capture optical amplifier saturation and
    two-photon absorption (TPA) non-linearities, resolving the implicit gradient lift
    using Banach's contraction mapping principle. Finally, we implement a corrected
    high-order automatic differentiation compiler in JAX, resolving critical index
    bugs, and connect the theoretical entropic bound to the real thermodynamic work
    of Ti/Au metallic micro-heaters, providing a concrete framework for the physical
    co-design of future energy-efficient photonic AI systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Diffractive deep neural networks with multimode fibers
  date: 2026-03
  url: https://doi.org/10.1117/12.3079670
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Bahadır Utku Kesgin
  - Firdevs Yüce
  - Uğur Teğin
  abstract: Optical computing is gaining traction as a viable alternative to digital
    neural networks, especially in machine learning applications, due to its potential
    for significantly reduced power consumption. Our work presents a multimode-fiber-based
    diffractive deep neural network operating in a linear regime without employing
    high peak power lasers. By mechanically perturbing the multimode fiber, we optimize
    the linear mode coupling for enhanced feature extraction within the optical processor.
    This method demonstrates substantial accuracies on real-world datasets, including
    breast cancer classification and satellite-based scene classification, reaching
    performance levels comparable to modern neural networks while training far fewer
    parameters. We demonstrate the efficiency of linear programmable photonic neural
    networks for low-power optical computing applications.
  venue: ''
- title: Deep learning assisted inverse design of nonreciprocal multilayer photonic
    structures
  date: 2026-03
  url: https://arxiv.org/abs/2603.10672
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Weiran Zhang
  - Hao Pan
  - Shubo Wang
  abstract: Nonreciprocal structures play an important role in optical physics and
    applications. Conventional approaches for designing nonreciprocal optical structures
    rely heavily on extensive numerical simulation and parameter tuning, leading to
    high computational cost and low efficiency. Here, we apply deep learning to the
    design of nonreciprocal multilayer photonic structures. Three neural-network models-a
    forward neural network (FNN), an inverse design network (IDN), and a variational
    autoencoder (VAE)-are employed to learn the complex mapping between structural/material
    parameters and nonreciprocal spectral characteristics. We show that the FNN can
    rapidly and accurately predict the nonreciprocal electromagnetic response of a
    given structure, while the IDN can directly generate suitable structural parameters
    for target spectral responses. Both approaches substantially reduce computational
    cost and design time while improving nonreciprocal performance. Furthermore, the
    VAE can generate band-limited inverse design under practical performance constraints,
    facilitating efficient exploration of multiple feasible structures that meet different
    threshold requirements within specified frequency bands. Our work highlights the
    potential of deep learning for the advanced design of nonreciprocal optical structures
    and devices.
