- title: Ultralow Energy Optoelectronic Synapse Using Halide Perovskite/Organic Semiconductor
    Heterostructure for Neuromorphic Computing, Optical Logic and Wireless Communication
  date: 2026-04
  url: https://doi.org/10.1021/acsami.6c03922
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Debabrata Sahu
  - Sanju Nandi
  - Garima Choudhary
  abstract: With the advancement of artificial intelligence, the emulation of biological
    neural processes through neuromorphic computing has gained significant attention.
    Artificial optoelectronic synapses have emerged as promising components for neuromorphic
    computing due to their simple structure, low energy consumption, and ability to
    overcome the von Neumann bottleneck. Here, we design a multifunctional, energy-efficient
    optoelectronic synapse based on a formamidinium cesium lead iodide (FA x Cs 1–
    x PbI 3 )/Poly(3-hexylthiophene) (P3HT) heterojunction in a two-terminal vertical
    structure. The synaptic device exhibits key synaptic characteristics, such as
    excitatory postsynaptic current (EPSC), paired-pulse facilitation (PPF), and achieves
    a transition from short-term to long-term memory with an exceptionally low energy
    consumption of 0.59 fJ per synaptic event, and successfully emulates biological
    learning behavior, such as learning-forgetting-relearning. Long-term potentiation
    (LTP) enables efficient visual object recognition with 90.31% accuracy on the
    Modified National Institute of Standards and Technology (MNIST) data set using
    an artificial neural network (ANN). In addition, light logic functions (“AND”,
    “OR”) and associative learning (Pavlov’s dog experiment) are demonstrated using
    405 and 532 nm pulses. More significantly, optical wireless communication is experimentally
    performed using Morse code for words such as IITG, 2025, HELP, and SOS. Moreover,
    the device achieves 86.76% pixel-wise accuracy in the semantic segmentation of
    urban street scenes using a U-Net model. Finally, the working mechanism of the
    device, attributed to the efficient photogeneration of carriers and accumulation
    of electrons at the perovskite side, offers deep insights into the optoelectronic
    plasticity. These findings show the path toward the development of a highly integrated,
    photonic neuromorphic device for future intelligent systems.
  venue: ACS Applied Materials & Interfaces
- title: DNN-assisted waveguide width extraction via optical measurement of a single
    low-order Mach-Zehnder interferometer
  date: 2026-03
  url: https://doi.org/10.1038/s41598-026-41085-2
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Fuling Wang
  - Hao You
  - Xiao Xu (112147)
  abstract: An accurate waveguide width extraction methodology is demonstrated by
    developing a deep-learning neural network (DNN) framework synergized with a single
    low-order Mach-Zehnder interferometer (MZI). Utilizing its intrinsic capacity
    for complex nonlinear capture, the proposed DNN achieves a simulation-to-prediction
    accuracy of 0.15 nm on a test dataset, establishing a robust geometry mapping.
    By leveraging fabrication tolerance analysis and group-index estimation from C-band
    MZI interference spectra, our method directly extracts the as-fabricated waveguide
    width via a pre-trained DNN. Experimental validation on 30 devices demonstrates
    an experimental estimation accuracy of 3.28 nm when compared to SEM measurements.
    Additionally, the system operates with a single low-order MZI featuring a reduced
    arm-length difference of 26.672 μm, while the conventional ones exceeding 100
    μm. The superior precision and miniaturization capability make our approach an
    effective strategy for fabrication monitoring and high-density photonic circuit
    characterization.
