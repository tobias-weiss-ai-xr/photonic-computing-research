  abstract: The synergy between astronomy and photonics is offering new perspectives
    in the field of wavefront sensing for ground-based telescopes. In this context,
    the integration of photonic devices and machine learning is particularly promising.
    Within this framework, this research investigates the use of multimode fibers
    (MMFs) as wavefront sensors, combined with a properly trained Convolutional Neural
    Network (CNN). Aberrated wavefronts were propagated through a simulated multimode
    fiber with known properties, and the resulting intensity patterns were used for
    network training. Following this simulation phase, an optical bench has been developed
    to experimentally verify the concept and evaluate its performance under controlled
    laboratory conditions. This step marks a crucial transition from numerical modeling
    to physical implementation, enabling future developments and experimental validation.
