- title: Robustness-oriented training for automated design of photonic tensor cores
  date: 2026-03
  url: https://doi.org/10.1364/oe.588175
  category: photonic-hardware
  subcategory: method
  authors:
  - Gianluca Kosmella
  - Matej Hejda
  - Thomas Van Vaerenbergh
  abstract: 'Optical computing aims to leverage the large bandwidth of light and exploits
    its potential for low-latency signal processing to efficiently handle large-scale
    Machine Learning (ML) workloads. A critical component of this approach is a Photonic
    Tensor Core (PTC), which facilitates general matrix-vector products. However,
    computational accuracy can be degraded by noise and fabrication imperfections,
    posing challenges for practical deployment. In this work, we address the problem
    of designing noise-robust PTCs within footprint-constrained architectures composed
    of Phase Shifters (PSs), Directional Couplers (DCs), and Waveguide Crossings (CRSs).
    Using a recently developed automated design framework, we propose and demonstrate
    in simulations the efficacy of two complementary techniques: noise injection during
    chip topology training and penalty terms that promote noise robust and imperfection-insensitive
    local optima in the loss landscape of the ML task. We find that, compared to the
    original design, the ML task accuracy degrades significantly slower under increasing
    noise levels when the proposed robustness techniques are used. We increase the
    average accuracy in the presence of DC biases from 87.2% to 97.8% using noise
    injection on the MNIST classification task. Furthermore, using the gradient-based
    techniques, we increase the accuracy when the DCs experience high variations from
    ∼81% to ∼84% on the F-MNIST classification task. These advances contribute to
    the practical viability of photonic accelerators for ML and potentially beyond,
    by addressing noise and imperfections through hardware–algorithm co-design.'
  venue: Optics Express
- title: Matrix–vector multiplication for photonic tensor core in optical neural network
  date: 2026-06
  url: https://doi.org/10.1088/1402-4896/ae8345
  category: photonic-hardware
  subcategory: method
  authors:
  - Aijun Zhu
  - Tailin Xu
  - Wenrui Wei
  abstract: Abstract Matrix-vector multiplication (MVM) is the basic operation for
    photonic tensor core, which lies at the core of neural network inference and training,
    forming the dominant computational primitive underlying every layer of modern
    deep architectures. Although optical neural networks promise massive acceleration
    of these operations through parallel electromagnetic propagation, most existing
    implementations suffer from limited reconfigurability, off-chip footprint, or
    complex integration requirements. In this work, we introduce an on-chip computing
    element specifically tailored for neural-network MVM, constructed from a cascaded
    arrangement of metasurfaces. The metasurfaces incorporate vanadium dioxide and
    photoactivated GaAs, whose distinct switching mechanisms enable each layer to
    encode matrix weights and input vector elements through external electrical, thermal,
    and optical stimuli. As terahertz waves sequentially traverse the cascade, the
    system physically accumulates weighted contributions, yielding the equivalent
    multiplication between a 2 × 2 matrix and a 2 × 1 input vector—executed at wave
    speed. Finite integration time-domain simulations validate all logical combinations
    of matrix elements and inputs and confirm the correct arithmetic mapping for two
    independent computing channels. Moreover, it supports general weight programmability
    and maintains stable responses with respect to incident and polarization angles.
    By embedding the most fundamental neural-network operation directly into a planar
    metasurface stack, this work provides a compact pathway toward integrated, low-power
    optical accelerators and lays the groundwork for future metasurface-based deep
    learning hardware.
  venue: Physica Scripta
- title: 'MDTransformer: A Hardware-Software Co-Design of Mode-Division Photonic Transformer
    Accelerator with Inverse-Designed Coherent Crossbar'
  date: 2026-07
  url: https://arxiv.org/abs/2607.26016
  category: photonic-hardware
  subcategory: method
  authors:
  - Solomon Serunjogi
  - Rachmad Vidya Wicaksana Putra
  - Ayat Taha
  abstract: Recently, photonic transformer accelerators (PTAs) have successfully achieved
    significant speedup and energy efficiency improvements over electronic accelerators
    for expediting Transformer inference. However, state-of-the-art rely on expensive
    multi-wavelength light generation and large dot-product units due to active phase-shifter
    components, thus making their approach inefficient and impractical. To address
    this, we propose MDTransformer, a novel hardware-software co-design of PTA based
    on mode-division optical dataflow and operations. Specifically, MDTransformer
    performs complex matrix operations using spatial-mode interference, that leverages
    the inverse-designed multi-mode couplers, crossings, and Mach-Zehnder IQ modulators
    into a compact mode-division photonic tensor core (MPTC), capable of executing
    matrix multiplications in the optical domain. Its each guided mode (i.e., TE0-TE3)
    acts as an independent computational lane, enabling four-fold parallelism-per-waveguide
    without spectral filtering or free-spectral-range limitations. Moreover, its coherent
    detection and IQ modulation jointly encode amplitude and phase, realizing complex-valued
    arithmetic for full-range operations in transformers. MDTransformer offers analog
    multiplication with sub-4-bit effective precision and inter-modal crosstalk below
    -30 dB. Its inverse-designed approach also offers scalable and full compatibility
    with single-laser continuous-wave operation at 1550 nm. Experimental results show
    that MDTransformer achieves 40.4% area reduction, 63.6% power saving, 40.6% energy
    saving, and comparable latency over the state-of-the-art PTA across different
    workloads (i.e., DeiT-Tiny/Small/Base and BERT-Base/Large). These results show
    that MDTransformer offers a practical solution for high-performance and energy-efficient
    transformer-based systems.
  venue: arXiv (Cornell University)
- title: Towards Topology-Aware Very Large-Scale Photonic AI Accelerators
  date: 2026-04
  url: https://arxiv.org/abs/2604.26966
  category: photonic-hardware
  subcategory: theory
  authors:
  - Belal Jahannia
  - Abdolah Amirany
  - Hamed Dalir
  abstract: The rapid growth of deep neural networks (DNNs) has exposed fundamental
    limitations in electronic accelerators, where data movement dominates energy consumption,
    commonly referred to as the memory wall. Photonic accelerators offer a compelling
    alternative due to their inherent parallelism and high-speed matrix operations.
    However, existing research largely focuses on device-level innovations, leaving
    system-level scalability insufficiently explored. In this paper, we present a
    scalable photonic accelerator architecture based on a modular scale-out paradigm
    using 4 X 4 photonic tensor core units. We perform a systematic architectural
    analysis that incorporates the practical scaling limits of photonic hardware,
    including insertion loss, fanout penalties, and laser power limits, which restrict
    monolithic photonic scaling. Through evaluation on representative DNN workloads
    (GoogleNet, ResNet-18, MobileNet, and AlphaGo Zero) with up to 1024 processing
    elements, we identify a topology-dominated scaling bottleneck in the photonic
    domain, termed the Utilization Wall, where performance is governed by grid topology
    rather than hardware size. We further establish the Symmetric Grid Rule, demonstrating
    that symmetric topologies improve utilization by up to 6X while reducing memory
    access by over 40% compared to linear configurations, which reveal that topology-aware
    scaling is essential for achieving energy-efficient and high-performance photonic
    AI accelerators.
  venue: arXiv (Cornell University)
- title: 'SKYLIGHT: A Scalable Hundred-Channel 3D Photonic In-Memory Tensor Core Architecture
    for Real-time AI Inference'
  date: 2026-08
  url: https://doi.org/10.1145/3831711
  category: photonic-hardware
  subcategory: theory
  authors:
  - Meng Zhang
  - Ziang Yin
  - Nicholas Gangi
  abstract: The growing computational demands of artificial intelligence (AI) are
    challenging conventional electronics, making photonic computing a promising alternative.
    However, existing photonic architectures face fundamental scalability and reliability
    barriers. This paper introduces SKYLIGHT , a scalable 3D photonic in-memory tensor
    core architecture designed for real-time AI inference. By co-designing its topology,
    wavelength routing, accumulation, and programming in a 3D stack, SKYLIGHT overcomes
    key limitations. Its innovations include a low-loss 3D Si/SiN crossbar topology,
    a thermally robust non-micro-ring resonator (MRR)-based wavelength-division multiplexing
    (WDM) component, a hierarchical signal accumulation using a multi-port photodetector
    (PD), and optically programmed non-volatile phase-change material (PCM) weights.
    Importantly, SKYLIGHT enables in-situ weight updates that support label-free,
    layer-local learning (e.g., forward-forward local updates) in addition to inference.
    With comprehensive system-level modeling, we show that a single 144 × 256 SKYLIGHT
    core achieves a peak compute capability of 342.1 TOPS at 23.7 TOPS/W under a high-reuse
    tensor-core operating point. For end-to-end ResNet-50 inference, where the same
    physical core is reprogrammed across layers and tiles, SKYLIGHT reaches 1212 FPS
    with 60.9 mJ/image after explicitly accounting for PCM programming energy. System-level
    evaluations on four representative machine learning tasks, including unsupervised
    local self-learning, demonstrate SKYLIGHT ’s robustness to realistic hardware
    non-idealities (low-bit quantization and signal-proportional analog noise capturing
    modulation, PCM programming, and readout variations). With noise-aware training,
    SKYLIGHT maintains high task accuracy, validating its potential as a comprehensive
    solution for energy-efficient, large-scale photonic AI accelerators.
  venue: ACM Transactions on Design Automation of Electronic Systems
- title: Scalable High-Order Integrated Photonic Tensor Processor via Frequency-Domain
    Modulation
  date: 2026-05
  url: https://doi.org/10.6084/m9.figshare.c.8456955
  category: photonic-hardware
  subcategory: theory
  authors:
  - Yue Wu
  - Liangjun Lu
  - Yu Li
  abstract: The rising computational demands of deep learning—particularly for high-order
    tensor operations—have driven the need for novel hardware accelerators. While
    integrated photonics presents a promising platform, the matrix scale of existing
    schemes is often constrained by the physical number of on-chip components. Here,
    we propose and experimentally demonstrate a scalable high-order integrated photonic
    tensor processor (HIPTP) that decouples the computational dimensionality from
    physical device count by leveraging a two-dimensional array combined with electrical
    frequency-domain modulation. The design employs a scalable array of cascaded Mach-Zehnder
    interferometers (MZIs) and photodetectors (PDs), enabling third- and fourth-order
    tensor multiplication by encoding data onto distinct microwave frequencies. A
    4×4 HIPTP chip was fabricated and characterized, exhibiting high consistency across
    core components, which facilitates the extension toward larger-scale on-chip systems.
    To validate its computational capabilities, three computational modes were verified
    under varying frequency counts, and an inference accuracy of 97.5% was achieved
    on the German Traffic Sign Recognition Benchmark (GTSRB). Our work presents a
    promising pathway toward ultra-large-scale photonic computing for advanced AI
    models and frequency-aware signal processing scenarios.
  venue: Figshare
- title: 'Metasurface Geometric Polarization Matrix-Tensor Computing Accelerator:
    O(1) Unitary Matrix Inversion for AGI-Scale Linear Algebra Offloading v3.5503'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19441746
  category: photonic-hardware
  subcategory: theory
  authors:
  - Xiangning Chen Xiangning Chen
  abstract: 'In the B³D-HPV paradigm, matrix inversion is no longer a high-complexity
    silicon computation, but a physical collapse of the Hermitian Adjoint operator.
    By leveraging the geometric nature of polarization, we achieve near-zero latency
    inversion through optical conjugation. In the B³D-HPV (Physics-based Volumetric
    Logic) paradigm, we move away from the high-complexity iterative processes of
    silicon-based logic. Instead, we treat mathematical operations as geometric projections
    and physical state collapses. 1. Matrix Inversion: The "Physical Collapse" In
    traditional computing, inverting a matrix M requires O(n³) complexity (e.g., Gaussian
    elimination). In our photonic architecture, we leverage the Unitary nature of
    polarized optical flow. The Logic: If a transformation matrix M is represented
    by a series of lossless polarization rotations (Unitary transformations), then
    its inverse M⁻¹ is simply its Hermitian Adjoint M† (the conjugate transpose).
    The Implementation: In B³D-HPV, "calculating" the inverse is not an arithmetic
    operation, but a Symmetry Transformation. By reversing the polarization state
    or utilizing the geometric reciprocity of the quartz lattice, the inversion occurs
    as a near-zero latency physical collapse.6 The Advantage: We achieve O(1) complexity.
    The answer is not "computed"; it is "revealed" by the physical symmetry of the
    optical field. 2. The Polarization Adder (POL_ADD) Photonic addition is naturally
    handled by the Principle of Superposition. Principle: When two incoherent light
    fields I₁ and I₂ are combined into the same spatial mode (e.g., through a Beam
    Combiner), the resulting intensity is a direct summation. Vector Mapping: By mapping
    data values to the intensity or the amplitude of polarized wave-fronts, the hardware
    performs massive parallel addition simply by letting the light paths merge within
    the 3D quartz structure. 3. The Polarization Subtractor (POL_SUB) Subtraction
    is the historical "Achilles'' heel" of incoherent optical computing, as light
    intensity cannot be negative. B³D-HPV solves this via Geometric Projection Mapping.
    The Mechanism: Instead of trying to "cancel" photons (which requires unstable
    phase interference), we use Polarization Orthogonality. Process: Encoding: Map
    the minuend (A) to the Horizontal axis (0°) and the subtrahend (B) to the Vertical
    axis (90°). Rotation: The SLM executes a POL_TRANS instruction, rotating the composite
    polarization vector by a specific angle θ. Projection: We use a Polarization Sensitive
    Detector (or a PBS) to extract the projected components. By measuring the difference
    in intensity between the two orthogonal projections, we physically extract the
    value A − B. Result: This is a Robust Subtraction. Unlike phase-based destructive
    interference, it is immune to thermal phase drift because it relies on the rigid
    geometric orientation of the polarization states. Summary: Geometry vs. Arithmetic
    Addition — Silicon (Digital): Gates & Latency; B³D-HPV (Geometric): Superposition
    (O(1)) Subtraction — Silicon (Digital): Two''s Complement; B³D-HPV (Geometric):
    Orthogonal Projection Inversion — Silicon (Digital): Iterative Loops (O(n³));
    B³D-HPV (Geometric): Hermitian Collapse (O(1)) By defining these as Physical Mapping
    Instructions (PDMM), we turn the quartz lattice into a high-dimensional geometric
    computer where the "logic" is simply the evolution of the light field''s geometry.
    Key Updates & Version Notes This version incorporates the finalized system-level
    schematic, completing the closed-loop design from conceptual logic to engineering
    implementation, and adds the software-programmable reference voltage (Vref) of
    PD front-end comparators to realize dynamic adjustment of AGI computing sensitivity,
    further improving the software-defined capability of the architecture. 1. Core
    System: Single-Plane UV/IR Spatial Cross-Modulation SLM + 5-Sided PD Array The
    design diagram confirms the single-plane, side-pumping-free architecture, using
    only a front-facing UV/IR mixed parallel SLM array to achieve: - 3D voxel addressing:
    Non-parallel UV/IR beams intersect at a focal point to form an energy threshold,
    activating Tm³⁺ metastable traps precisely at the (x,y,z) voxel without path damage.
    - Polarization operator writing: The IR beam induces local birefringence at the
    activated voxel, directly implementing polarization-based logic gates. - 5-sided
    PD tomography: Top/bottom/left/right/rear photodiode arrays capture scattered
    and transmitted light for full-volume topology reconstruction and runtime calibration,
    with the 5-channel differential PD core eliminating common-mode noise from intensity
    superposition; the front-end high-speed comparators are equipped with software-programmable
    Vref to support dynamic AGI sensitivity adjustment. 2. Polarization Incoherent
    Computing Paradigm Abandons phase interference for high robustness, with the core
    advantage of spatial topology replacing temporal phase: - Logic states are mapped
    to Poincaré sphere coordinates, and polarization evolution follows unitary matrix
    rules with inverse computation via physical conjugate transposition. - Computation
    is realized via UV/IR-induced local anisotropy instead of phase superposition,
    doubling the initial parallelism compared with single-phase schemes. - Maintains
    high SNR even with thermal drift through 5-channel differential PD noise suppression
    and programmable Vref threshold calibration, eliminating the need for precision
    environmental control and expensive anti-vibration platforms. 3. Multi-Method
    Virtual Waveguide Writing Multiple refractive index gradient induction strategies
    are supported, selectable or combinable, all compatible with unitary polarization
    manifold computing: 4. UV/IR cross-modulation (native core method) 5. Photothermal-assisted
    writing 6. Photo-induced refractive index (PRI) enhancement 7. Multi-wavelength
    IR cooperative confinement 8. Voxel-level array superposition 9. Software-Defined
    Layer: Topology Equivalence & Self-Healing Control The core paradigm of "flexible
    logical topology" is formalized with three key algorithms, supporting real-time
    calibration for polarization evolution stability and software-controlled AGI sensitivity
    adjustment: - Optical Homing: SLM-to-voxel dynamic mapping via blind scanning
    and trilateration. - Self-Organizing Routing: Reinforcement learning-based path
    formation via PD feedback with programmable Vref threshold. - Vector Lock-loop:
    Real-time polarization correction via Stokes parameter monitoring, synchronously
    calibrating the comparator Vref to match AGI task requirements. 5. Photonics HLS:
    From High-Level Language to Physical Collapse Defines the complete compilation
    flow, directly mapping PDMM unitary polarization operators to Optical ISA, and
    integrating AGI sensitivity adjustment into the optical instruction set: 6. Human
    layer: Logical abstraction and Optical ISA definition (compatible with POL/TM
    series operators, adding sensitivity adjustment instructions). 7. Silicon layer:
    Topological sketching and linear mapping, converting sensitivity requirements
    into comparator Vref calibration parameters. 8. SLM layer: Parallel execution
    and runtime verification, synchronizing Vref adjustment with polarization operator
    implantation. - Supports both static curing (photonics FPGA) and streaming trigger
    (dynamic processor) modes, with a recommended "static skeleton + dynamic fine-tuning"
    hybrid, and dynamic Vref adjustment is compatible with both operating modes. 6.
    Core Value & Future Directions - Simplified, robust, software-defined, and mass-production-ready,
    with O(1) time complexity for unitary matrix inverse computation and software-programmable
    AGI computing sensitivity via comparator Vref adjustment. - Future work includes
    ISA development with complete sensitivity adjustment instruction sets, millisecond
    rerouting, prototype integration, waveguide writing method optimization for polarization
    computing, and dynamic sensitivity matching algorithm optimization for complex
    AGI tasks.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Photonic Computing Architectures for Accelerated Artificial Intelligence:
    A Post-Silicon Paradigm for Energy-Efficient Neural Network Processing'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20195080
  category: photonic-hardware
  subcategory: theory
  authors:
  - Laszlo Pokorny
  abstract: 'The exponential growth of artificial intelligence workloads has created
    an unsustainable trajectory in computational energy consumption, while the deceleration
    of Moore’s Law and breakdown of Dennard scaling constrain electronic hardware
    from meeting this demand. This dissertation investigates photonic computing as
    a post-silicon paradigm for energy-efficient neural network processing, evaluating
    three architectures—Mach-Zehnder interferometer (MZI) mesh processors, micro-ring
    resonator (MRR) weight banks, and phase-change material (PCM) tensor cores—through
    a three-phase mixed-methods design. Phase 1 benchmarked four photonic against
    four electronic AI accelerators, revealing a median energy efficiency advantage
    of 2.36× (5.19 vs. 2.20 TOPS/W) with a large effect size (Cohen’s d = 0.76) and
    directional support from 89.8% of 10,000 bootstrap resamples. Statistical significance
    was not achieved (p = .354) owing to 14.9% power in the near-census sample (n
    = 4 per group), consistent with a Type II error. Phase 2 modeled architectural
    barriers: silicon MRRs exhibited thermal drift of ~100 pm/°C, MZI processors lost
    >60% accuracy at ±3°C deviation, 64×64 meshes required phase error tolerances
    of σ ≤ 0.02 rad for 90% accuracy, and optical loss at 2.13 dB/stage constrained
    practical depth to ~100–150 stages. Phase 3 conducted multi-criteria decision
    analysis integrating technology readiness, investment, and patent data. PCM tensor
    cores ranked highest (6.72/10), exceeding MZI (5.65) and MRR (4.95) in a ranking
    robust under ±5% weight perturbation, supported by $2.164 billion in private investment
    and patent growth exceeding 30% CAGR. A five-layer sanity-check audit (8 PASS,
    9 CAUTION, 3 FAIL) confirmed physical plausibility and internal consistency while
    flagging statistical power and outlier sensitivity as limitations. The evidence
    suggests photonic architectures offer substantial energy efficiency potential,
    with PCM designs providing the most promising long-term pathway contingent on
    thermal management and fabrication advances, while MZI processors represent the
    most viable near-term bridging technology.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Scalable Back-Propagation-Free Training of Optical Physics-Informed Neural
    Networks
  date: 2026-08
  url: https://arxiv.org/abs/2502.12384
  category: photonic-hardware
  subcategory: theory
  authors:
  - Yequan Zhao
  - Xinling Yu
  - Xian Xiao
  abstract: 'Physics intelligence and digital twins often require rapid and repeated
    performance evaluation of various engineering systems (e.g. robots, autonomous
    vehicles, semiconductor chips) to enable (almost) real-time actions or decision
    making. This has motivated the development of accelerated partial differential
    equation (PDE) solvers, in resource-constrained scenarios if the PDE solvers are
    to be deployed on the edge. Physics-informed neural networks (PINNs) have shown
    promise in solving high-dimensional PDEs, but the training time on state-of-the-art
    digital hardware (e.g., GPUs) is still orders-of-magnitude longer than the latency
    required for enabling real-time decision making. Photonic computing offers a potential
    solution to address this huge latency gap because of its ultra-high operation
    speed. However, the lack of photonic memory and the large device sizes prevent
    training real-size PINNs on photonic chips. This paper proposes a completely back-propagation-free
    (BP-free) and highly scalable framework for training real-size PINNs on silicon
    photonic platforms. Our approach involves three key innovations: (1) a sparse-grid
    Stein derivative estimator to avoid the BP in the loss evaluation of a PINN, (2)
    a dimension-reduced zeroth-order optimization via tensor-train decomposition to
    achieve better scalability and convergence in BP-free training, and (3) a scalable
    on-chip photonic PINN training accelerator design using photonic tensor cores.
    We validate our numerical methods on both low- and high-dimensional PDE benchmarks.
    Through pre-silicon simulation based on real device parameters, we further demonstrate
    the significant performance benefit (e.g., real-time training, huge chip area
    reduction) of our photonic accelerator. Our code is available at https://github.com/olokevin/scalable_bpfree_onn_training.'
  venue: ACM Transactions on Design Automation of Electronic Systems
- title: 'PICoSNN: Partially Incoherent Configurable Optical Computing Architecture
    for SNN Acceleration'
  date: 2026-04
  url: https://doi.org/10.23919/date69613.2026.11539300
  category: photonic-hardware
  subcategory: method
  authors:
  - Bowen Duan
  - Zhenhua Zhu
  - Zhengyang Duan
  abstract: 'Optical computing is becoming a promising solution to meet the growing
    computational demands of increasingly large-scale deep neural networks (DNNs).
    However, high power consumption from analog-to-digital (ADC) and digital-to-analog
    (DAC) conversions poses significant challenges for optical computing. Spiking
    Neural Networks (SNNs), with their binary spike-based input and output, show the
    potential to address this issue by reducing the need for high-precision DAC/ADC.In
    order to exploit the complementary nature of optical computing and spike-based
    processing, this paper proposes the Partially Incoherent Configurable Optical
    Computing Architecture for SNN Acceleration (PICoSNN). We address three critical
    challenges: phase errors in coherent optical computing, limited configurability
    in weight-stationary architectures, and inefficient mapping of general SNNs to
    optical computing hardware. We integrate partially incoherent tensor cores with
    optical leaky integrate-and-fire neurons, minimizing ADC/DAC overhead while supporting
    dynamic weight mapping. Further, we propose KV Spiking Self-Attention to enable
    efficient attention with 1-bit multiplications. Experimental results show that
    PICoSNN achieves up to 70.54× higher throughput and 8.13× lower energy consumption
    compared to ASIC implementations, while delivering 15.46× better throughput per
    area and 17.67× better energy efficiency per area than state-of-the-art photonic
    accelerators.'
