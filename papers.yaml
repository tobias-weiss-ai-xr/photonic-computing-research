- title: Photonic integrated circuits for scalable and high-fidelity quantum computing
    and networking
  date: 2026-03
  url: https://doi.org/10.1117/12.3087471
  category: optical-computing
  subcategory: theory
  authors:
  - Kang Tan
  - Anshuman Singh
  - Henry Thoreen
  abstract: Quantum computing shows great potential in solving highly complex computational
    challenges in multiple applications, including artificial intelligence, chemical
    modelling, biology simulation, portfolio optimization, drug delivery, logistical
    planning, etc. Quantum networking can enable secure communication as well as scalable
    interconnects of multiple quantum processing units. We need to scale up the number
    of high-quality qubits and make quantum systems more compact, robust, and lower
    cost to further improve the performance of quantum computing and networking. Photonic
    integrated circuits (PICs) can play a significant role in reducing the size, improving
    the stability, and reducing the system bring-up time of optical subsystems. QuEra’s
    recent progress shows the potential of leveraging PICs as a viable solution to
    facilitate the builds of highly scalable and high-performance quantum computers
    [1]. These results position integrated photonics as a critical enabling technology
    for next-generation large-scale quantum systems and invite broader participation
    from the photonics community in advancing quantum technologies with significant
    industrial impact.
