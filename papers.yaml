    beam deposition systems Additive manufacturing (electron beam metal 3D printing)
    Global Presence: With a 71.2% overseas sales ratio and operations in 27 international
    offices, JEOL serves customers in over 130 countries, maintaining a strong presence
    in North America, Europe, Asia, and Latin America. The company''s global footprint
    ensures localized support and service, enabling seamless collaboration with research
    institutions, universities, and industry leaders worldwide. Commitment to Quality
    and Sustainability: JEOL upholds high standards of quality, environmental responsibility,
    and customer service. As a total solution provider, JEOL continuously improves
    its products and services, integrating eco-friendly manufacturing practices and
    adhering to international quality management standards. Looking Ahead: As a 2025
    Nature index top-ranked Japan company in the Company category, JEOL remains at
    the forefront of scientific and industrial progress. With an unwavering commitment
    to innovation, JEOL continues to shape the future of research and technology,
    empowering scientists and engineers with precision instruments that drive discovery
    and industry advancements. For more information about JEOL''s products, services,
    and career opportunities, visit www.jeolusa.com. The Lehigh Microscopy School
    (LMS) provides well-known courses from fundamental to advanced microscopy techniques
    for professionals who conduct various materials characterization. The first LMS
    was organized by renowned Lehigh University Professor Joe Goldstein in the summer
    of 1970 with three lecturers, a dozen students, and a single scanning electron
    microscope (SEM). Since then, the annual Lehigh-hosted event has grown to become
    the largest, best-attended, and longest-running school of its kind. Now in its
    53rd year, the week-long school offers basic and advanced courses that combine
    theory with lab practice. Manufacturers’ microscopes supplement the eleven scanning
    and transmission electron microscopes, including two focused ion beam instruments,
    in Lehigh’s Materials Characterization Facility, one of the best-equipped laboratories
    of its kind in the United States. LMS provides a unique platform for participants
    to learn from leading experts in the field. The school is renowned for its comprehensive
    curriculum and high level of interaction between students and instructors. Participants
    have the opportunity to engage with advanced microscopy equipment from industry-leading
    manufacturers. The school offers the flagship main SEM course associated with
    a one-day introductory SEM course, quantitative X-ray microanalysis focusing on
    electron probe microanalysis using energy dispersive spectrometry (EDS) and wavelength
    dispersive spectrometry (WDS) techniques, focused ion beam (FIB) instrumentation
    and applications, and transmission electron microscopy (TEM) courses. The courses
    are instructed by over 40 experts in the electron microscopy fields. Many electron
    microscopy vendors and related manufacturers for detectors, spectrometers, and
    hardware devices for electron microscopy participate in the school, introducing
    the latest advances in electron microscopy and materials characterization techniques.
    Every year, ∼100 attendees participate in the LMS, with ∼35% of all LMS attendees
    being female from the United States and overseas countries including over 30 countries
    from Africa, Asia, Europe, and South America. In the beginning, biological specimen
    prep— so vital to good imaging results— was time-consuming, tedious, and subject
