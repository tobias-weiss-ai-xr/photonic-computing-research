- title: Machine learning–driven computational design of high-performance optical
    materials
  date: 2026-06
  url: https://doi.org/10.1117/12.3115862
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Nargiza Kamolova
  - Nodira Rustamova
  - Husnidakhon Mukhtorova
  abstract: Optical materials play a crucial role in a myriad of sectors, ranging
    from modern-day optics to advanced photonic devices. Approaches that rely on sophisticated
    computational modelling and mathematical descriptions of optical behavior are
    becoming increasingly important for designing advanced optical materials and for
    leveraging existing materials to realize new functionalities. With sophisticated
    optical simulation software, it is now possible to construct inverse design workflows
    that take desired optical characteristics as input and yield a set of candidate
    geometries as output. The design of optical materials, particularly difficult
    materials such as photonic bandgap materials, can greatly benefit from machinelearning-based
    modelling techniques. A range of sophisticated methodologies, including Generative
    Adversarial Networks, Convolutional Neural Networks and Deep Neural Networks,
    can be employed to establish the complex mapping between structure and function.
    Various candidate geometrical representations of optical structures have been
    investigated, including physics-informed material structures, discretized shapes,
    and image-based representations. Physical materials and related geometry parameters
    form a fundamental backbone for causality in the inverse design of photonic bandgap
    materials. In these systems, the bandgap response depends delicately on the materials
    geometrical and physical properties; thus, it becomes paramount to evaluate the
    materials' composition alongside the geometry parameters.
