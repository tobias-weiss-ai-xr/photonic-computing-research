- title: An end-to-end hybrid deep-learning approach for single-shot wavefront sensing
    and correction
  date: 2026-05
  url: https://doi.org/10.1038/s41467-026-72364-1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Sina Moayed Baharlou
  - Muhammad Khalid
  - Guli Gulinihali
  abstract: Optical aberrations fundamentally limit the performance of optical systems
    across scales, from microscopy and astronomy to quantum imaging and ubiquitous
    technologies such as smartphone cameras, autonomous vehicles, and optical communication
    networks. Despite sustained progress in wavefront sensing and correction, existing
    approaches typically require multiple intensity measurements and iterative phase
    retrieval algorithms and are often restricted to narrowband operation and simple
    beam profiles. Their performance further degrades when aberrations are weak or
    obscured by noise. Here we report a single-shot wavefront sensing and correction
    paradigm that overcomes the limitations of existing approaches. Central to the
    approach is the integration of a learned optical phase mask that acts as a physical
    encoder and is jointly optimized with a neural-network decoder. This encoding
    removes intrinsic phase ambiguities and significantly enhances sensitivity to
    weak aberrations. By leveraging this hybrid deep-learning architecture, our method
    directly and unambiguously retrieves Zernike-based phase distortions from a single
    focal-plane intensity image, eliminating the need for defocus measurements, or
    iterative phase reconstruction. The framework is intrinsically broadband, exhibits
    strong robustness to noise, and generalizes across a diverse class of structured
    light fields. Together, these capabilities establish a scalable and practical
    foundation for real-time aberration correction in next-generation optical and
    photonic systems.
  venue: Nature Communications
- title: On-demand customization of visible-infrared compatible anti-counterfeiting
    materials empowered by deep learning
  date: 2026-05
  url: https://doi.org/10.1088/1742-6596/3243/1/012018
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Wenzhuang Ma
  - L Y Zhang
  abstract: Abstract With the increasing demand for high-end anti-counterfeiting and
    security authentication, traditional single-band anti-counterfeiting technologies
    (such as visible patterns or infrared markers) have become inadequate in addressing
    increasingly sophisticated forgery methods. Achieving high-precision synergistic
    anti-counterfeiting in both visible and infrared bands has emerged as a key challenge
    for next-generation optical anti-counterfeiting materials. However, due to the
    inherent physical conflict between structural color modulation in the visible
    band (380–780 nm) and low-emissivity requirements in the infrared band (8–14 μm),
    conventional design approaches struggle to achieve co-optimization. In this study,
    we innovatively propose a metal/insulator/metal (MIM) asymmetric Fabry-Pérot (FP)
    resonator structure and integrate it with a tandem deep learning network, enabling
    intelligent on-demand design for dual-band visible-infrared anti-counterfeiting.
    By precisely tuning the geometric parameters of the MIM metasurface, we simultaneously
    achieved accurate color matching in the visible spectrum (ΔE &lt; 2) and low emissivity
    (&lt;0.2) in the infrared regime. Notably, the developed tandem neural network
    architecture—comprising a high-precision forward prediction model, an inverse
    design generator, and an infrared performance discriminator—reduces the conventional
    design cycle from hours to milliseconds. This research provides an innovative
    design paradigm for optical anti-counterfeiting technology, with significant application
    value in enhancing the controllability of anti-counterfeiting features. The proposed
    methodology can also serve as a technical reference for other photonic devices
    requiring multi-band cooperative modulation.
  venue: Journal of Physics Conference Series
- title: <strong>Inverse Design Epsilon-Near-Zero-based Broadband Nonreciprocal Thermal
    Emitter using Hybrid Deep Learning Framework</strong>
  date: 2026-03
  url: https://doi.org/10.60893/figshare.apl.c.8351626.v1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Jun-Yang Sui
  - Hai-Feng Zhang
  abstract: Nonreciprocal thermal radiation, which breaks Kirchhoff's law by decoupling
    absorptivity and emissivity, is essential for advanced radiative heat transfer
    control. However, achieving broadband and tunable nonreciprocal thermal radiation
    with high design efficiency remains a challenge. This study proposes a novel hybrid
    deep learning framework, integrating the Artificial Rabbit Optimization and tandem
    neural network, to inversely design multilayer films (MLFs) based on magnetized
    gradient epsilon-near-zero (ENZ) InAs layers. By using the Artificial Rabbit Optimization
    algorithm, we collect a high-quality dataset with a noise ratio of only 2.17%,
    significantly reducing computational overhead compared to random sampling. The
    multitasking tandem neural network converges to a low cost function of 0.091,
    improving the accuracy and avoiding the scattering problem faced by traditional
    neural networks. Results show that significant nonreciprocal thermal radiation
    (nonreciprocity&gt;0.72, peak 0.815) is achieved in the 14~19 μm range by exploiting
    the magneto-optical effects of InAs and ENZ-induced Brewster modes. Furthermore,
    the MLFs exhibit reversed absorptivity and emissivity spectra under reversed magnetic
    fields. These findings provide a data-efficient and scalable solution for dynamic
    thermal management and infrared camouflage, demonstrating the powerful synergy
    between deep learning and nonreciprocal photonics.
