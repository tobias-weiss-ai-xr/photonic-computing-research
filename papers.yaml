- title: 'QUANTUM COMPUTING AND QUANTUM INFORMATION- QUANTUM INFORMATION PROCESSING
    WITH PHOTONIC QUBITS: EXPLORING THE USE OF PHOTONIC QUBITS FOR QUANTUM INFORMATION
    PROCESSING'
  date: 2026-06
  url: https://doi.org/10.70917/ijcisim-2026-2184
  category: optical-computing
  subcategory: method
  authors:
  - Mohd. Shakil Qureshi
  - P. Hari Krishna
  - Bhavana Kshirsagar
  abstract: Compared with other physical platforms for Quantum Information Processing
    (QIP), photons have the unique advantages of travelling over free-space links
    or optical fiber with relatively low decoherence and of propagating with minimal
    coupling to the environment, while also being easily coupled to existing telecommunications
    technology. The R&amp;D of various single photon and entangled photon generation
    technologies and the linear-optical implementations of quantum computation and
    communication are now surveyed and analyzed in a structured manner. We discuss
    photonic qubit degrees of freedom (polarization, time-bin, path, frequency and
    Orbital angular momentum), determine sources such as deterministic quantum-dot
    based sources and probabilistic sources based on spontaneous parametric down conversion
    (SPDC), and review architectures for Linear Optical Quantum Computation (LOQC),
    such as the Knill–Laflamme–Milburn (KLM) protocol and measurement-based quantum
    computation. Building on the density-matrix treatment of biexciton–exciton coherent
    dynamics in semiconductor quantum dots, we recapitulate the development of two-pulse
    coherent control schemes for generation and readout of photonic qubits in these
    systems and how they have been stretched towards optical control of logic gates.
    A comparative performance framework is established along the lines of source brightness,
    entanglement fidelity, photon indistinguishability, channel loss and scalability,
    which is illustrated by simulated performance plots and tabulated against literature
    numbers. Remaining hurdles in the field regarding issues of photon loss, scalable
    multiplexing, deterministic two-qubit interaction, and its integration with a
    quantum memory are highlighted and a perspective is provided on hybrid photonic–matter
    architectures for fault-tolerant quantum networks.
  venue: International Journal of Computer Information Systems and Industrial Management
