- title: Photonic integrated circuits on fiber tips for lab-on-fiber sensing
  date: 2026-03
  url: https://doi.org/10.1117/12.3078928
  category: photonic-sensing
  subcategory: method
  authors:
  - Arthur D. Bouamra
  - Pieter C. Vijn
  - René P. J. Veldhoven
  abstract: Photonic sensors integrated on the tip of optical fibers offer a compelling
    platform for compact and remote detection. However, most existing fiber-tip sensors
    rely on simplified microstructures that provide limited performance as compared
    to photonic integrated circuits (PICs). Bridging PIC-level functionality and performance
    with the form factor and deployment flexibility of optical fibers remains a key
    challenge, primarily due to constraints in fabrication complexity, footprint,
    and fiber-to-chip optical coupling. We present a fabrication strategy for enabling
    PICs on the tip of standard multicore fibers, using a transfer-based approach
    based on wafer-level fabrication. The platform integrates vertically-coupled backside
    grating couplers (VBGCs) specifically optimized for normal-incidence. These VBGCs
    maintain robust alignment tolerance, minimal feature sizes consistent with standard
    fabrication flows, and a compact layout suitable for the 120μm-diameter fiber-tip
    footprint. Demonstrated devices fabricated on an InP membrane exhibit coupling
    efficiencies (CE) up to −6.9 dB (20.1%) in the Sband, confirming the efficiency
    of the normal-incidence backside coupling scheme. PICs integrating ring resonators
    achieved experimental Q-factors up to 13,000, confirming the low-loss performance
    achievable within the fiber-tip geometry. This work establishes a practical and
    scalable route for transferring multifunctional PICs onto fiber facets, providing
    a versatile platform for future fiber-tip sensors.
  venue: ''
- title: Intelligent fiber sensors based on upconversion nanoparticles for integrated
    optical information processing and temperature monitoring
  date: 2026-05
  url: https://doi.org/10.1016/j.matlit.2026.100009
  category: photonic-sensing
  subcategory: method
  authors:
  - Yuzhen Wang
  - Zhiguo Xia
  abstract: Thermal management of logical operations is of crucial importance for
    optical logic gate (OLG) devices in optical information processing and beyond.
    Generally, the OLG unit is separated with the sensors, making it difficult to
    monitor their status accurately in a real-time mode. Here, we report the design
    and fabrication of an optical fiber composed of core-shelled nanoparticles with
    rationally designed orthogonal upconversion photoluminescence (UCPL); accordingly,
    a versatile and multidimensional sensor platform for synchronized OLGs and temperature
    sensing has been demonstrated. Specifically, the high-contrast logic functions
    (16.2 dB for logical OR gate) have been realized by setting specific thresholds,
    and the Boltzmann-type luminescence thermometry function (maximum relative sensitivity
    of 3.1% K −1 ) is integrated based on the UCPL spectra in fluorescence optical
    fibers. This work paves the way for fluorescence fiber sensors as compact and
    flexible sensing platforms for intelligent photonic integration. • Core-shelled
    nanoparticles were rationally designed with orthogonal UCPL • Flexible fluorescent
    optical fibers based on UCNPs conduct temperature sensing • An optical fiber realizes
    synchronous Boolean computation and temperature monitoring Currently, the monitoring
    of optical path status is of vital importance in fields such as optical communication
    and information processing. Traditional monitoring attempts involving external
    photodetectors and bypass monitoring methods suffer drawbacks such as non- in
    situ monitoring and increased system complexity and cost, highlighting the urgent
    need for intrinsic and logic-function-integrated sensing mechanisms. The optical-controlled
    logic gate demonstrates significant advantages in parallel processing due to its
    multi-dimensional controllability of light, the multi-functional responsiveness
    of the system, and its non-invasive reading characteristics. It can support parallel
    information processing with multiple wavelengths and is applicable to cutting-edge
    fields such as real-time environmental monitoring, photonic computing, and information
    security. Wang et al. develop a versatile and multidimensional sensor platform
    for synchronized optical logical gates and temperature sensing in an optical fiber,
    which is composed of core-shelled nanoparticles with rationally designed orthogonal
    upconversion photoluminescence.
  venue: Matter & Light
- title: 'Integrated micro-optics: an enabler for integrated photonics'
  date: 2026-05
  url: https://doi.org/10.1117/12.3110481
  category: photonic-sensing
  subcategory: method
  authors:
  - Guillaume Basset
  - Frédéric Zanella
  - Christian Schneider
  abstract: 'Advanced integrated photonics components deliver and promises unprecedented
    functions with very compact format, mass manufacturability and lower power consumption
    than legacy systems. The components being developed for photon generation, manipulation,
    emission, reception and detection have complex geometries and very small dimensions,
    making their optical interfacing and overall assembly and packaging very demanding.
    Micro-optics improves dramatically these optical interfaces by improving the photon
    emission efficiency, detection efficiency and coupling efficiencies between integrated
    photonic devices as will be discussed in various cases. Stand-alone micro-optics
    components allowed dramatic cost reduction in various industries such as for light
    to fiber coupling, consumer electronics devices or automotive. A few examples
    of such stand alone micro-optics are presented, such as to miniaturize compact
    optical atomic clocks. However, integrating micro-optics together with integrated
    photonic devices offers further miniaturization, ease of assembly and unmatched
    performance and allow to address emerging needs in a variety of cases. Single‑photon
    detectors and imagers such as single‑photon avalanche diode (SPAD) arrays, silicon
    photomultipliers (SiPMs), and advanced CMOS image sensors are intrinsically limited
    by pixel fill factor, dead areas, and optical losses at the detector surface.
    However, they allow unmatched low light detection sensitivity, up to single photon
    detection capability, at room temperature. These limitations are particularly
    critical under photon‑starved conditions relevant to scientific instrumentation,
    quantum sensing, time‑resolved imaging, and super-resolution microscopy. Monolithically
    integrated microlens arrays provide an effective means to increase the effective
    photon collection area by concentrating incident light onto the active regions
    of the detector, boosting the quantum efficiency of these photon detectors. CSEM
    has developed a UV‑replication‑based microlens technology enabling the fabrication
    of a wide variety of microlens arrays with diameters ranging from a few micrometers
    to the millimeter scale. Microlenses can be fabricated from a variety of materials,
    including inorganic sol‑gels and organic polymers such as PMMA and polyurethane,
    allowing optimization with respect to optical transmission, mechanical stability,
    environmental robustness, and application‑specific constraints. The technology
    is compatible with wafers up to 8″ but as well down to individual chips down to
    2 × 2 mm². The technology is compatible with aggressive environment such as space
    and cryostats. The impact of UV‑replicated microlenses has been evaluated on several
    classes of quantum photonic devices. For front‑illuminated SPAD imagers, cylindrical
    and square microlenses significantly increase the photon concentration factor,
    with measured values of approximately 2 to 9 in agreement with optical simulations.
    In low‑photon‑flux regimes, these microlenses enhance signal‑to‑noise ratio by
    increasing the number of detected photons without introducing additional electronic
    noise. Various optimization techniques are presented to further improve the imagers
    and detectors. In the context of high‑energy physics, round microlenses integrated
    on silicon photomultipliers developed for the upgrade of the Large Hadron Collider
    b detector at CERN achieve pixel fill factors exceeding 80% and enable approximately
    15% more detected photons at room temperature as well as in cryostats. In a different
    direction, the rapid growth of data communications, cloud computing, and AI infrastructure
    is driving an increasing demand for high‑density optical interconnects capable
    of supporting large fiber counts while maintaining reliability in demanding environments.
    Conventional physical‑contact fiber connectors face significant challenges in
    such applications, including stringent sub‑micron alignment tolerances, high sensitivity
    to contamination, and reduced mechanical robustness as the number of fibers per
    connector increases. These limitations become particularly critical in telecom,
    datacom, defense, and industrial networks, where connectors must operate reliably
    over wide temperature ranges and under harsh environmental conditions. Expanded
    beam (EB) fiber connector technology offers an attractive alternative by eliminating
    direct fiber‑to‑fiber contact. By expanding, collimating, and refocusing the optical
    beam between mating fibers, EB connectors significantly relax alignment and cleanliness
    requirements. However, traditional EB implementations often rely on glass or polymer
    lenses that suffer from either high cost or strong thermal and environmental sensitivity,
    limiting scalability and stability. We have been developing a next‑generation
    multi‑fiber optical connector based on expanded beam technology using thermally
    compensated polymer microlens arrays fabricated and assembled at wafer level.
    The connector is developed by Zoharay in collaboration with CSEM, VTT, and TH‑Wildau,
    combining optical system design, advanced micro‑optical fabrication, material
    characterization, and precision bonding technologies. The core innovation lies
    in the use of polymer microlens doublets with matched thermo‑optic and thermo‑mechanical
    properties, enabling stable optical performance across a wide temperature range
    while retaining the cost and scalability advantages of polymer optics. The connector
    architecture consists of three main elements: a commercially available MT/MPO
    multi‑fiber ferrule, an optical insert incorporating the microlens arrays, and
    a mating interface ensuring repeatable alignment. The ferrule provides accurate
    fiber positioning through standard guiding holes and alignment pins, enabling
    compatibility with existing datacom ecosystems. Within the optical insert, paired
    polymer microlenses expand and collimate the beam, significantly reducing sensitivity
    to dust particles and lateral misalignment. Optical simulations and ray‑tracing
    optimization demonstrate a numerical aperture of approximately 0.22 and a coupling
    loss sensitivity below 0.3 dB for lateral misalignments of ±5 µm, while showing
    strongly reduced temperature dependence compared to conventional single‑lens EB
    designs. The resulting connector system targets multimode fiber arrays operating
    at 850 nm and supports high fiber densities while maintaining low insertion loss,
    high return loss, and robust environmental performance. Its compatibility with
    existing MPO‑based infrastructure makes it particularly attractive for large‑scale
    deployment in data centers, telecom networks, and harsh‑environment applications
    where conventional physical‑contact connectors reach their limits. In a third
    direction, micro-optics assembly on photonic integrated circuits (PIC) for waveguide
    array to fiber array unit (FAU) coupling is today a key enabler for advanced electronic
    and photonic packages, so called co-package optics. Co-package optics is widely
    evaluated as being key to reduce the energy consumption of datacenters while providing
    higher bandwidth inside each rack unit. Examples of implementation in the industry
    of micro.optics for PIC to FAU coupling are presented to review the current state
    of the art. Current limitations and expected future development in this strategic
    field are presented as well as the challenges to enable mass manufacturing of
    this micro-optics-enabled co-package optics systems.'
  venue: ''
- title: Magnetoplasmonic core–shell nanowire integrated in D-shaped fibers for enhanced
    optical sensing
  date: 2026-06
  url: https://doi.org/10.1007/s11082-026-08947-5
  category: photonic-sensing
  subcategory: theory
  authors:
  - William O. F. Carvalho
  abstract: Abstract Optical fiber sensors have become essential tools in modern photonics
    due to their compactness, flexibility, and capability for real-time and remote
    detection. Among the various sensing approaches, surface plasmon resonance (SPR)
    techniques stand out for their high refractive index (RI) sensitivity and compatibility
    with nanostructured materials. In this context, conventional in-fiber SPR sensors
    operate purely on passive plasmonic effects, whereas the integration of magneto-optical
    (MO) materials introduces an additional degree of control, enabling active tunability
    and sharper optical responses. However, the realization of in-fiber MO-SPR configurations
    that simultaneously provide magnetic tunability, strong field confinement, and
    a broad RI operating range remains largely underexplored. Herein, a MO-SPR sensor
    based on a D-shaped optical fiber side-coupled to a core–shell nanowire (NW) structure
    is presented. The proposed approach uniquely combines core–shell nanowire-based
    SPR, MO tunability, and an extended RI operating range within a single in-fiber
    platform. The NW comprises a metallic core coated with a ferrimagnetic shell and
    is positioned on the polished surface of a single-mode fiber (SMF), where the
    guided mode HE $$_{11}^y$$ couples to the magnetoplasmonic mode in the NW. This
    interaction yields strong electromagnetic field confinement and tunable dispersion
    at the NW–fiber interface. Numerical analysis demonstrates a pronounced confinement
    loss peak of 3345 dB/m and a high RI sensitivity of S = 3240 nm/RIU over a wide
    analyte RI range, spanning the optical S-, C-, L-, and U-bands. When an external
    magnetic field is applied, the MO effect induces distinct resonance shifts depending
    on the magnetization direction, resulting in a MO-SPR sensor with an enhanced
    figure of merit (FoM) of 1912 RIU −1 , approximately four times greater than that
    achieved with conventional SPR configurations. These results demonstrate that
    the proposed D-shaped MO-SPR fiber architecture provides a robust and highly sensitive
    platform for next-generation in-fiber sensing, combining the advantages of plasmonic
    field confinement and magnetically tunable optical response.
  venue: Optical and Quantum Electronics
- title: A Highly Sensitive Electro Optic-SPR Optical Fiber Sensor for Micro-Voltage
    Monitoring
  date: 2026-02
  url: https://doi.org/10.1109/jlt.2026.3666160
  category: photonic-sensing
  subcategory: method
  authors:
  - Hanrui Yang
  - Wentao Du
  - Jiaxing Tian
  abstract: This paper presents a novel optical fiber voltage sensing technology based
    on the electro-optic effect and surface plasmon resonance (SPR) effect. By monitoring
    the refractive index changes of the electro-optic material (DMF) under an electric
    field and leveraging the high-sensitivity response of SPR, high-precision optical
    detection of minute voltages is achieved. Experimental results demonstrate that
    the sensor achieves sensitivities of-1.3518 nm/mV and-0.8018 nm/mV in the ranges
    of-80 mV to-70 mV and 30 mV to 40 mV, respectively. Based on this sensing mechanism,
    a grooved photonic crystal fiber structure with integrated trench confinement
    and optimized air-hole layout is further proposed, which strengthens the interaction
    between the optical field and DMF and enhances the surface plasmon excitation
    via a TiO2 overlayer. Through this structural optimization, the sensitivity is
    improved to −1.65nm/mV, accompanied by excellent linear response characteristics.
    This study validates the feasibility and advantages of the electro optic–SPR coupling
    mechanism for micro-voltage detection. The proposed technology offers benefits
    such as non-invasiveness, immunity to electromagnetic interference, high integration,
    and good stability, providing a new approach for monitoring neural electrophysiological
    activity.
  venue: Journal of Lightwave Technology
- title: Self-Pulsing Microring Resonator Networks for Bandwidth-Efficient Event Detection
    in an Optical Fiber Sensor
  date: 2026-06
  url: https://arxiv.org/abs/2606.11940
  category: photonic-sensing
  subcategory: application
  authors:
  - Alessio Lugnan
  - Yonas Muanenda
  - Ilya Auslender
  abstract: The native processing of time-dependent signals from optical sensors by
    integrated photonic circuits can potentially bring significant advantages in terms
    of energy consumption, latency and processing power, as it allows skipping or
    reducing the use of fast digital electronics and directly exploiting optical degrees
    of freedom and parallelism. However, due to a short memory, optical operations
    usually struggle to directly process optical signals with relatively slow (<MHz)
    dynamics from optical sensors. In this work, we experimentally show that these
    limitations can be overcome by exploiting the self-pulsing dynamics in a microring
    resonator (MRR) network. In particular, we demonstrate that such dynamics can
    expand and retain information about perturbations sensed by a fiber sensor. This
    reduces the minimum sampling rate for the digitization of the sensor signal by
    at least one order of magnitude. The reduction is achieved by combining fiber
    sensing measurements at two different perturbation locations and frequencies with
    MRR network measurements at multiple output ports, input power levels and laser
    wavelengths. This work represents a first step in bridging time-dependent optical
    processing and optical sensing at sub-μs time scales.
  venue: arXiv (Cornell University)
- title: Rapid Multipoint Gas Sensing Using a Silicon-Photonic-Integrated Widely-Tunable
    Narrow-Linewidth Laser by FMCW Interferometry
  date: 2026-04
  url: https://doi.org/10.1109/jlt.2026.3680921
  category: photonic-sensing
  subcategory: theory
  authors:
  - Xiutao Lou
  - Yunfei Meng
  - Ning Xu
  abstract: We present a spectroscopic method using a silicon-photonic-integrated
    laser by frequency-modulated continuous-wave (FMCW) interferometry to realize
    rapid multipoint gas sensing. The employed hybrid integrated external cavity laser
    has a wide tuning range of 147 GHz, a narrow linewidth of 180 kHz and a high sweeping
    speed of 294 THz/s (∼2700 nm/s), enabling sub-millisecond multipoint spectroscopic
    gas sensing. In the proof-of-concept experimental demonstration, three methane
    sensing nodes are deployed along a 30-m optical fiber, achieving a measurement
    sensitivity of 6 ppm with a time resolution of 0.5 ms and a positioning spatial
    resolution of 0.7 mm. Having the advantage of high spatiotemporal resolution,
    our proposed method promotes a novel way of developing spectroscopic gas sensors
    for challenging safety monitoring applications where spatially resolved chemical
    analysis with fast response is required.
  venue: Journal of Lightwave Technology
- title: 'SENS-COMM Technical Framework: Hybrid Photonic-Electronic Sensing System'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21432808
  category: photonic-sensing
  subcategory: method
  authors:
  - Abbas khaleghi moghaddam
  abstract: '"SENS-COMM is a high-resolution, non-invasive hybrid photonic-electronic
    framework designed for real-time optical phase sensing and wireless data transmission.
    The system utilizes a 30-sensor array integrated into a wearable cap, employing
    single-mode fibers and GaAs photodiodes for high-speed signal conversion. Data
    processing is managed by an FPGA-based neural core using differential phase subtraction
    (\Phi_1 - \Phi_2) to eliminate common-mode noise. The entire architecture is implemented
    on a flexible PCB with advanced diamond-based thermal management. This document
    provides the full engineering specifications, connectivity maps, and noise mitigation
    strategies for the first prototype'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'The Sensor Dome: An Interferometric–Acoustic–Optical Architecture for Passive
    Airspace Detection Using Distributed Acoustic Sensing and Multi-Sensor Fusion'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18960227
  category: photonic-sensing
  subcategory: theory
  authors:
  - Marcel Krüger
  - Don Feeney
  - Jacobo Tlacaelel Mina Rodríguez
  abstract: This paper presents the concept and operating principle of the Sensor
    Dome, a distributed multi-modal sensing architecture designed for passive monitoring
    of lowaltitude airspace and environmental vibrations in complex urban environments.
    The system integrates heterodyne interferometry, distributed acoustic sensing
    (DAS), acoustic–infrasound arrays, electro-optical/infrared (EO/IR) verification,
    and passive radio-frequency (RF) detection within a synchronized multi-node sensor
    network. Heterodyne interferometry enables high-sensitivity phase measurements
    of small refractive-index variations and Doppler shifts, while DAS converts existing
    telecommunications fibers into large-scale acoustic sensor arrays capable of detecting
    lowfrequency vibration signatures. By combining these modalities within a unified
    fusion framework, the system improves robustness against environmental noise and
    sensor-specific limitations. Preliminary analytical estimates and feasibility
    simulations indicate that multimodal fusion can enhance weak signal detectability
    and increase the effective signal-to-noise ratio through adaptive weighting of
    individual sensing channels. In the proposed architecture, a Bayesian fusion layer
    combined with adaptive neural weighting dynamically adjusts sensor contributions
    to suppress background noise and improve detection reliability. The Sensor Dome
    concept demonstrates how photonic sensing technologies and distributed acoustic
    monitoring can be integrated into a scalable, passive sensing infrastructure.
    The architecture is designed to be modular and adaptable to different operational
    environments, enabling applications ranging from counter-UAS monitoring to environmental
    and infrastructure sensing. Early modeling results suggest that adaptive multi-sensor
    fusion can improve detection stability and extend the practical sensing range
    in urban monitoring scenarios.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Photonic Crystal Fiber-Based Optofluidic Platforms for Biomedical Diagnostics:
    A Comprehensive Review'
  date: 2026-04
  url: https://doi.org/10.1109/jphot.2026.3686400
  category: photonic-sensing
  subcategory: theory
  authors:
  - Yugesh Kumar P
  - Sangeetha N
  - Subramaniyan Parimalam S
  abstract: Photonic crystal fiber (PCF)-based optofluidic (OF) technologies have
    been developed as miniature and highly sensitive systems. PCFs are superior to
    conventional optical sensors as a result of light-fluid interaction. PCF allows
    regulated fluid penetration inside the microstructured cladding zones. This study
    covers various PCF-based OF sensing approaches, including hollow-core, solid-core,
    side-polished, D-shaped, and selectively infiltrated designs. It focuses on the
    design principles of refractive index modulation, modal confinement, and birefringence
    management. We analyzed fundamental detection methods, such as refractive index
    sensing and plasmonic sensing. This study also examines critical performance parameters,
    such as wavelength sensitivity, confinement loss, resolution, and limit of detection.
    Existing solutions for single-cell analysis, protein detection, and disease diagnostics
    were used to identify design trade-offs and optimization strategies. The integration
    of MEMS integrated microfluidics, sophisticated plasmonic materials, and machine
    learning-based signal processing is expanded to highlight the growing system-level
    capabilities. Major issues related to fabrication repeatability, fluid stability,
    and flexibility were examined. Finally, future research options for stable, multichannel,
    and therapeutically translatable lab-on-a-fiber platforms are discussed.
  venue: IEEE photonics journal
- title: Monolithic 3D micro-encapsulation on optical fiber tips via femtosecond laser
    direct writing
  date: 2026-03
  url: https://doi.org/10.1088/2631-7990/ae4e6f
  category: photonic-sensing
  subcategory: theory
  authors:
  - Xuhao Fan
  - Liangye Li
  - Zongjing Li
  abstract: Abstract Multifunctional integration of optical fiber tips has attracted
    tremendous attention because of the high sensitivity, compact size, and immunity
    to electromagnetic interference of fiber-optic devices. However, achieving stable
    three-dimensional (3D) micro-structuring while maintaining both miniaturization
    and sensing performance remains a persistent challenge. Here, we present a monolithic
    3D micro-encapsulation strategy based on femtosecond laser direct writing (FsLDW)
    and chemical vapor polymerization (CVP), enabling the multifunctional integration
    of Fabry–Pérot interferometers (FPIs) on fiber tips with submicron precision and
    enhanced structural robustness. This approach combines an FsLDW-nanoprinted air
    cavity with the CVP of the Parylene C coating, reducing the overall sensor footprint
    from the centimeter scale to approximately 100 μm without compromising sensing
    performance. As a proof of concept, we demonstrate the stable operation of encapsulated
    optical fiber sensors under continuous fluidic and mechanical disturbances, supporting
    both intensity and wavelength demodulation. The encapsulated FPI cavities achieve
    over an order of magnitude improvement in spectral stability and a 26.4 dB increase
    in long-term signal contrast, with performance sustained over 10 000 repeated
    test cycles. This work offers a scalable route toward high-density, multifunctional
    fiber–optic sensors with enhanced durability and long-term reliability for next-generation
    photonic integrated applications.
  venue: International Journal of Extreme Manufacturing
- title: Innovating microstructured optical fiber platforms for biophysical flow control
    and birefringence-based cellular diagnostics
  date: 2026-04
  url: https://doi.org/10.1117/12.3093797
  category: photonic-sensing
  subcategory: theory
  authors:
  - Rosalind Wynne
  abstract: Drawing from key studies, we explore how photonic crystal fiber (PCF)
    platforms can serve as both microfluidic conduits and optical sensors for biophysical
    transport. An interdisciplinary approach is taken that bridges photonics, fluid
    mechanics, and bioengineering, advancing the design of integrated sensing systems.
    Examples include investigations of mammalian cell transport through PCFs and simulations
    reveal how cell membrane deformation affects the refractive index and birefringence.
    Experimental configurations demonstrate cell aggregation or occlusion under low
    Reynolds and Capillary numbers, while simulations using the lattice Boltzmann
    method (LBM) model lateral migration and membrane rupture thresholds. These simulations
    quantify lateral migration velocities and deformation thresholds, offering predictive
    insight into cell behavior under varying shear conditions. An integrated approach
    offers insights into cellular mechanics, fluid dynamics, and optical diagnostics,
    advancing PCF-based technologies for non-destructive evaluation in bioengineering
    applications. Together, these studies establish a cohesive optofluidic diagnostic
    framework that supports real-time assessment of cellular health, pathology, and
    therapeutic response.
