- title: A Heterogeneous 200 mm Silicon Nitride Photonics Platform for Visible-to-Near-Infrared
    Applications via Micro-Transfer Printing
  date: 2026-08
  url: https://arxiv.org/abs/2608.02037
  category: integrated-photonics
  subcategory: application
  authors:
  - Konstantinos Akritidis
  - Gaudhaman Jeevanandam
  - Manuel Reza
  abstract: The commercialization of next-generation technologies, including optical
    interconnects, quantum computing, AR/VR, and medical diagnostics, requires a low-loss
    photonic platform offering compact, multifunctional systems in the visible and
    near-infrared range. Although silicon nitride (SiN) is an excellent material due
    to its ultra-low loss and broad transparency window, integrating active components
    such as light sources, modulators and photodetectors from diverse material platforms
    in a scalable, reliable way remains challenging. Micro-transfer printing is an
    emerging wafer-scale heterogeneous integration technology that can be implemented
    as a back-end post-processing step without disrupting the primary in-line fabrication
    process. In this work, we present a dual LPCVD SiN layer platform fabricated in
    a 200 mm CMOS pilot line, that incorporates micro-transfer printing modules, allowing
    the integration of active components on well defined recesses. A hydrogenated
    amorphous silicon layer is also available to increase the versatility of the platform
    allowing for evanescently-coupled III-V lasers as well as other passive functionality
    in the near-infrared region. We report full wafer-scale measurements showing low
    optical SiN losses of 4 dB/cm and 0.23 dB/cm at a wavelength of 488 nm and 940
    nm respectively. In addition, a transition loss of only 0.35 dB is obtained from
    the SiN to the a-Si:H layer, in good agreement with simulated values. Finally,
    to showcase more advanced functionality, GaAs-based gain sections are micro-transfer
    printed on several dies, achieving consistent die-to-die lasing at 970 nm with
    on-chip optical powers of approximately 1 mW. These results showcase the potential
    of the integrated photonics platform towards unlocking a wide range of new applications
    in the sub-1-$μ$m spectral region.
