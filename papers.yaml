  abstract: 'Inverse design is a target-oriented design methodology that determines
    device geometries by first specifying the desired optical performances, such as
    polarization conversion efficiency, insertion loss, and operational bandwidth,
    and subsequently retrieving the corresponding structural parameters using optimization
    algorithms or neural networks. With the rapid evolution of polarization control
    devices towards higher integration density and superior performance, conventional
    forward design approaches largely dependent on empirical knowledge and physical
    intuition have become increasingly inadequate in terms of efficiency and scalability.
    As a result, inverse design has emerged as a powerful and indispensable paradigm
    in the development of advanced polarization photonic devices. This chapter introduces
    two major categories of inverse design strategies for polarization devices: optimization-based
    inverse design methods and deep-learning-based inverse design methods. Representative
    polarization control devices realized through these strategies are also discussed.'
