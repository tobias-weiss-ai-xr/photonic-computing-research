  - Matthew Filipovich
  abstract: Modern deep learning relies nearly exclusively on dedicated electronic
    hardware accelerators. Photonic approaches, with low consumption and high operation
    speed, are increasingly considered for inference but, to date, remain mostly limited
    to relatively basic tasks. Simultaneously, the problem of training deep and complex
    neural networks, overwhelmingly performed through backpropagation, remains a significant
    limitation to the size and, consequently, the performance of current architectures
    and a major compute and energy bottleneck. Here, we experimentally implement a
    versatile and scalable training algorithm, called direct feedback alignment, on
    a hybrid electronic-photonic platform. An optical processing unit performs large-scale
    random matrix multiplications, which is the central operation of this algorithm.
    We perform optical training of modern deep learning architectures, including Transformers,
    with more than 1B parameters, and obtain good performances on language, vision,
    and diffusion-based generative tasks. We study the scaling of the training time
    and demonstrate a potential advantage of our hybrid opto-electronic approach for
    ultra-deep and wide neural networks, thus opening a promising route to sustain
    the exponential growth of modern artificial intelligence beyond traditional von
    Neumann approaches.
