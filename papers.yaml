- title: Hybridized-band parametric oscillations in coupled Kerr microresonators
  date: 2026-06
  url: https://doi.org/10.1063/5.0328178
  category: optical-computing
  subcategory: theory
  authors:
  - Luca O. Trinchão
  - Luiz Peres
  - Eduardo Gonçalves
  abstract: Coupled resonators form band-like optical states that support rich nonlinearities
    beyond what is possible in single resonators. In these systems, four-wave mixing
    mediates interband coupling, displaying multimode dynamics that span both spatial
    and spectral degrees of freedom. In this study, we propose a framework describing
    the onset and control of hybridized optical parametric oscillation in three coupled
    silicon nitride microring resonators. In a symmetric configuration, we observe
    the emergence of diverse phase-matching pathways defined by the dispersive band
    structure. We develop an analytical model that captures the parametric gain of
    these interband processes and derive closed-form expressions for the dominant
    gain maxima; the analytical framework itself readily extends to more complex coupled
    networks. We further report an asymmetric design that co-engineers mode overlap
    and dispersion to operate on compact 7-GHz spacing, free from mode competition.
    Our findings establish design principles for engineering nonlinear dynamics in
    coupled-resonator platforms, with implications for coherent photonic computing
    and quantum information processing.
