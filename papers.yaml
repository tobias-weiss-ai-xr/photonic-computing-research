- title: Topological all-optical logic gates via edge-corner state coupling in 2D
    valley photonics
  date: 2026-03
  url: https://doi.org/10.1364/josab.591161
  category: optical-computing
  subcategory: theory
  authors:
  - Yong‐Feng Gao
  - Enming Zhang
  - Run-Yu Yang
  abstract: The pursuit of all-optical computing demands logic gates that are fast,
    miniaturized, and robust. Topological photonics, with its inherent resistance
    to backscattering, offers a compelling pathway to such devices. Here, we propose
    and demonstrate a comprehensive suite of high-performance all-optical logic gates—NOR,
    NOT, OR, AND, and NAND—by harnessing the distinct coupling mechanisms between
    topological edge states (TESs) and topological corner states (TCSs) in a designer
    valley photonic crystal (VPC) heterostructure. We engineer a topological interface
    supporting robust TESs and integrate a triangular resonator to host highly localized
    TCSs. The operational principle hinges on the controllable coupling between adjacent
    TESs via distance modulation, and between TESs and TCSs via spectral overlap.
    By strategically cascading these coupling elements, we realize all fundamental
    and universal logic gates. Our devices exhibit high extinction ratios, reaching
    up to 27.58 dB. Crucially, benefiting from topological protection, the gates maintain
    correct functionality even in the presence of intentionally introduced defects.
    This work establishes a novel, to our knowledge, paradigm for constructing high-reliability,
    integrated, and topologically protected photonic circuits for next-generation
    optical information processing.
  venue: Journal of the Optical Society of America B
- title: Maximum Shannon capacity of photonic structures
  date: 2026-03
  url: https://doi.org/10.1038/s44310-025-00104-2
  category: optical-computing
  subcategory: theory
  authors:
  - Alessio Amaolo
  - Pengning Chao
  - Benjamin Strekha
  abstract: Abstract Information transfer through electromagnetic waves is vital to
    computing, imaging, telecommunications, and power management. A central figure
    of merit is the Shannon capacity, the maximum error-free bit-rate over a noisy
    channel achievable via encoding. Prior works on optical information transfer have
    treated waves propagating through fixed photonic structures such as vacuum, where
    the communication channels are predetermined and the Shannon capacity can be evaluated
    via a convex “water-filling” procedure, or relied on simplifications of relevant
    physics via circuit theory and far-field assumptions. In this article, we present
    limits on the significantly more difficult problem of maximizing Shannon capacity
    given the freedom to structure the photonic environment, allowing for the optimization
    of optical communication channels subject to wave propagation constraints. By
    combining information theory, wave scattering, and convex relaxations, we formalize
    the relationship between electromagnetic and information-theoretic quantities,
    showing how device considerations such as material choice, system size, and geometry
    impact optimal channel power allocations and maximum bit-rates. Our results generalize
    prior attempts to interpret optical communication using the spectral decomposition
    of the electromagnetic Green’s function, and provide a foundation for furthering
    understanding of how to optimally engineer information-processing photonic devices
    such as antennas, MIMO space-division multiplexers, and metasurface imaging kernels.
  venue: npj Nanophotonics
- title: A Phase‐Transition‐Driven All‐Optical Neuron with Sub‐Nanosecond Nonlinear
    Activation
  date: 2026-03
  url: https://doi.org/10.1002/adma.202522820
  category: optical-computing
  subcategory: method
  authors:
  - Jiabin Shen
  - Chen Gao
  - A. F. Liu
  abstract: Photonic neuromorphic computing has emerged as a potent solution for artificial
    intelligence (AI) to transcend the computational constraints of traditional integrated
    circuits. Nonlinear activation functions of neurons are central to deep neural
    networks, one of the most powerful tools in AI programs, as they enable the learning
    of highly intricate mappings. Currently, the absence of high-speed, low-threshold
    all-optical neurons presents a tremendous challenge in the field, leading to an
    overreliance on optoelectronic hybrids. This reliance necessitates frequent optoelectronic
    conversions for data transfer between photonic and electronic systems, leading
    to considerable latency and increased energy consumption. To address these challenges,
    we leveraged the light-induced phase transition in elemental tellurium (Te) to
    develop an all-optical neuron, which has achieved, for the first time, an ultrafast
    response at the picosecond level (∼260 ps), representing a nearly two orders of
    magnitude enhancement in speed compared to conventional all-optical technologies.
    Furthermore, through an integrated hardware-software approach, we have effectively
    demonstrated the superiority of our Te neurons within a three-layer deep neural
    network. The processing of nonlinear activation operations is accelerated by a
    factor of 100 compared to electronic neurons, with the added benefit of further
    enhancement by parallel processing. Additionally, the phase-transition-driven
    mechanism has granted Te neurons exceptional advantages in terms of feature size,
    threshold energy, and enhanced performance metrics. Indeed, the proposed all-optical
    neuron holds immense promise for enhancing the integration density and energy
    efficiency of photonic neural networks. It demonstrates great potential to surmount
    the performance limitations imposed by electronic systems, heralding a new era
    in photonic computing.
