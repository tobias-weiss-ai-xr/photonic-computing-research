  subcategory: method
  authors:
  - Jia Qi Wu
  - Sajay B. N. Gourikutty
  - Bin He
  abstract: Heterogeneous integration (HI) is a highly promising approach to integrate
    photonic and electronic chips to form optical engines (OE) which address the crucial
    I/O bottleneck in hyperscale Data Centre (DC) switches and AI/ML clusters in high
    performance computing (HPC). Cost, performance, and manufacturability are key
    challenges for HI. In this paper we present the design, process-integration, test-results
    for a novel Fan-out Wafer Level Package (FOWLP) approach to realize cost-effective,
    volume-manufacturable, high-performance OEs for 1.6T/6.4T and beyond.
  venue: ''
- title: Disordered mosaic metasurfaces with scalable functional density
  date: 2026-04
  url: https://doi.org/10.1038/s41467-026-71774-5
  category: optical-computing
  subcategory: theory
  authors:
  - Chi Li
  - Changxu Liu
  - Cade Peters
  abstract: Optical metasurfaces have catalysed transformative advances across imaging,
    optoelectronics, quantum information processing, sensing, energy conversion, and
    optical computing. Yet, most current research remains constrained by the challenge
    of integrating multiple functions within a single device. Inspired by the aesthetic
    of disordered mosaics in art, we demonstrate that by engineering structural disorder
    of meta-pixels to implement a photonic function, the active area required can
    be considerably reduced, without compromising optical performance. Without increasing
    the design complexity, the remaining unallocated space can be repurposed to encode
    functionally distinct meta-pixels, each independently addressable via various
    optical degrees of freedom. To demonstrate the universal adaptability of our approach,
    we present two proof-of-concept examples including an achromatic metalens — that
    operates across the 1200–1400 nm spectral window and with a scalable aperture
    size up to 8.1 mm — and single-shot, high-spatial-resolution polarimetric imaging
    of arbitrarily structured light fields. This disordered mosaic metasurface platform
    establishes a versatile foundation for integrating diverse photonic functionalities
    within a single diffractive optical element, representing a substantial step toward
    compact, high-density, multifunctional optical devices. Despite the technological
    advancements in optical metasurfaces, the integration of multiple functions with
    a single device is challenging. Here, authors propose a multifunctional metasurface
    based on engineered structural disorder, demonstrating a broadband metalens with
    scalable aperture and metasurface-based detection of optical topological textures.
  venue: Nature Communications
- title: Implementation of high-data rate all-optical NAND, XNOR, NOR logic gates
    with high speed and low insertion losses
  date: 2026-06
  url: https://doi.org/10.1515/joc-2026-0201
  category: optical-computing
  subcategory: method
  authors:
  - Dalai Gowri Sankar Rao
  - Haraprasad Mondal
  - Mohammad Soroosh
  abstract: Abstract The function of optical devices has improved very quickly in
    comparison to electronic circuits, due to the quick process of optical devices
    with the fastest speed of operation. Optical structures may be combined with optical
    logic gates. NAND, XNOR and NOR (NXN) logic gate are employed through a single
    shared structural design rather than having separate structures for each of the
    NAND, XNOR and NOR logic gates. However, these designs occupy a very small area
    of approximately 81 μm 2 , utilizing a 2-dimensional (2D) square lattice photonic
    crystal waveguide (PhCWs) as air background. Therefore, the proposed design has
    been implemented on a single NXN structural design rather than multiple separate
    structural designs as has been reported to date. The advantages of the proposed
    NXN structure include low insertion loss (IL) of 0.008 dB, ∼99 % transmittance,
    and a high extinction ratio (ER) of 22.9 dB. Including with mentioned advantages
    proposed design achieves ultrafast response and high data rates are 0.088 ps and
    11.36 Tbps respectively. Because of these value-added figures, the proposed NXN
    structure can be used for high-performance optical computing devices.
  venue: Journal of Optical Communications
- title: Infrared Optoelectronic Logic Gates and Encrypted Optical Communication Enabled
    by a b‐AsP/MoTe <sub>2</sub> Heterostructure With Bipolar Photoresponse
  date: 2026-05
  url: https://doi.org/10.1002/adfm.202532184
  category: optical-computing
  subcategory: theory
  authors:
  - Yue Zhang
  - Fakun Wang
  - Qi Jie Wang
  abstract: ABSTRACT Optoelectronic logic gates (OELGs) that directly convert optical
    inputs into Boolean electrical outputs offer a promising route toward low‐latency,
    in‐sensor computing. However, most existing OELGs operate in the ultraviolet‐visible‐near‐infrared
    (UV‐VIS‐NIR) range and require complex circuits to implement versatile logic operations.
    Here, we demonstrate a broadband optoelectronic logic device based on a 2D b‐AsP/MoTe
    2 heterostructure, which exhibits intrinsically bipolar photoresponses across
    both near‐ and mid‐infrared (NIR‐MIR) bands under zero bias. The device outputs
    a positive photocurrent under NIR illumination via photovoltaic effect, and a
    negative photocurrent under MIR excitation dominated by the photothermoelectric
    effect. By assigning logic states according to current polarity and magnitude,
    multiple logic functions including AND, OR, NOR, NAND, NOT, and XOR, are implemented
    within a single pixel through wavelength‐intensity reconfiguration. Furthermore,
    the XOR behavior enables a proof‐of‐concept demonstration of encrypted optical
    communication, including secure transmission of binary text and images using dual‐band
    optical inputs. These results establish a scalable, compact platform for multifunctional
    logic‐in‐sensor architectures, with potential applications in intelligent infrared
    imaging, secure optical networks, and on‐chip processing in multiband photonic
    systems.
  venue: Advanced Functional Materials
- title: Switchable image processing based on metasurfaces supporting qBIC resonances
  date: 2026-03
  url: https://doi.org/10.1088/2040-8986/ae598d
  category: optical-computing
  subcategory: theory
  authors:
  - Shuo Wang
  - Deyu Zhu
  - Ángela Barreda
  abstract: Abstract Analog optical image processing provides a fast and energy-efficient
    computing paradigm capable of overcoming the high power consumption and latency
    limitations of conventional electronic chips in real-time, high-throughput image
    analysis. Recently, metasurfaces have emerged as a powerful platform for implementing
    diverse computing functions, including edge detection, convolution, and classification.
    To advance toward integrated optoelectronic image-processing units, it is crucial
    to achieve rapid switching between processing functions and enhance the flexibility
    of metasurface functional designs. However, existing image-processing metasurfaces
    typically suffer from slow tuning speeds and limited control over angular response
    tailoring. To address these challenges, we propose and theoretically investigate
    fast tunable metasurfaces for switchable image processing based on quasi-bound-state-in-continuum
    (qBIC). Numerical simulations demonstrate that femtosecond-laser pumping of silicon
    metasurfaces supporting qBIC modes in terahertz range enables microsecond-level
    fast switching between edge-detection and bright-field imaging functionalities.
    Furthermore, by combining the photonic tight-binding method with temporal coupled-mode
    theory, we establish the relationships between qBIC angular dispersion and the
    corresponding image processing performance. Finally, we explore qBIC metasurfaces
    with varying quality factors to analyze their switching and processing performances,
    providing quantitative insights into the design flexibility of image-processing
    functionalities. This work demonstrates a fast switching mechanism suitable for
    integrated optoelectronic processing units and offers a systematic theoretical
    framework for understanding and tailoring qBIC resonances in analog image processing.
  venue: Journal of Optics
- title: Photonic integrated computing engine for concurrent optical computing
  date: 2026-08
  url: https://doi.org/10.1038/s41467-026-76872-y
  category: optical-computing
  subcategory: application
  authors:
  - Ruiqi Zheng
  - Sheng Dong
  - Huan Rao
  abstract: Optical networks with parallel processing capabilities advance high-speed
    computing and large-scale data processing by providing ultrawide computational
    bandwidth. In this paper, we present a photonic integrated processor that can
    be segmented into multiple functional blocks, enabling compact and reconfigurable
    matrix operations for parallel computational tasks. Fabricated on a silicon-on-insulator
    platform, the processor supports reconfigurable optical matrix operations of various
    sizes, offering flexibility and scalability. Specifically, it performs optical
    convolution operations with three-channel 1×1 and 2×2 real-valued convolution
    kernels implemented in distinct blocks. The multichannel 1×1 convolution is experimentally
    validated using a deep residual U-Net for precise segmentation of pneumonia lesions
    in lung computed tomography images. The 2×2 convolution is validated through an
    optical convolution layer integrated with an electrical fully connected layer
    for ten-class classification of handwritten digits. The processor features high
    scalability and robust parallel computing capability, positioning it as a promising
    candidate for optical neural networks. Photonic processors can accelerate large-scale
    data processing but often target a single fixed task. Here, the authors demonstrate
    a reconfigurable photonic processor that can be partitioned into functional blocks
    to perform three optical convolution tasks concurrently.
