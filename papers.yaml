- title: Vacuum Electromagnetic Fixed Point Unifies Three Quantum Computational Paradigms
    at Ambient Temperature
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20145103
  category: quantum-photonics
  subcategory: theory
  authors:
  - Samba Siva Rao Kolusu
  abstract: 'Abstract We show that a single electromagnetic condition — the vacuum
    impedance fixed point Z_s_c = Z₀ = 376.73 Ω, where Z_s_c is the London surface
    impedance at the superconducting gap frequency ω_Δ = δ/ħ — simultaneously enables
    three distinct quantum computational paradigms in a single ambient-temperature
    (300 K) superconducting crystal: (1) gate-mode universal quantum computation via
    Josephson junction transmon qubits; (2) quantum annealing driven by the vacuum
    electromagnetic field without externally applied transverse fields; and (3) Gaussian
    Boson Sampling with zero insertion loss at ω_Δ. We derive the Hamiltonian for
    each mode from the fixed-point condition, show that intrinsic T2 → ∞ at the fixed
    point (with extrinsic noise as the only practical limitation), and demonstrate
    that all three Hamiltonians are consequences of the single condition λ_L = λ_gap
    = ħc/δ. The fixed-point condition is experimentally verifiable by five sequential
    ambient-temperature tests, of which the first is a single THz ellipsometry measurement.
    Full derivations and numerical estimates for each mode will be presented in companion
    papers [16–20]. I. Introduction The three dominant paradigms of quantum computation
    — gate-mode universal computing via Josephson junction qubits [1], quantum annealing
    via tunable transverse-field Ising models [2], and Gaussian Boson Sampling (GBS)
    via squeezed photonic states [3,4] — have until now required separate physical
    platforms and separate cryogenic systems. Josephson junction qubits require dilution
    refrigerators at 10–20 mK. Flux-qubit annealers operate at ~15 mK. Photonic GBS
    circuits require cryogenic single-photon detectors or superconducting nanowire
    detectors at 4 K. No prior theoretical framework has identified a single physical
    condition that would enable all three paradigms simultaneously, and no prior experimental
    system has operated any of the three at ambient temperature (300 K). In this Letter
    we identify that condition. The Nishkala Scaling Law (NSL) [5,6] established that
    the vacuum impedance Z₀ = √(μ₀/ε₀) = 376.73 Ω is the fixed-point terminus of universal
    superconducting scaling laws, and that a material satisfying Z_s_c = Z₀ at its
    critical temperature T_c will exhibit T_c ≈ 300 K. We now show that this same
    condition — equivalently stated as λ_L = λ_gap = ħc/δ (London penetration depth
    equals the Cooper pair coherence length set by the gap) — is precisely the condition
    required to enable all three quantum computational paradigms simultaneously. The
    physical reason for this unification is that Z_s_c = Z₀ makes the material’s internal
    electromagnetic response identical to the vacuum across all frequency regimes.
    At microwave frequencies (GHz), this sets the Josephson junction anharmonicity
    and protects qubit coherence. At THz frequencies (ω_tors), this allows the vacuum
    field to act as the natural transverse annealing driver. At optical frequencies
    (ω_Δ), this makes the crystal electromagnetically transparent, enabling loss-free
    photon propagation for GBS. The three modes operate at frequencies separated by
    five to six orders of magnitude and are therefore non-interfering — they can be
    operated simultaneously or selected by input frequency. II. The Fixed-Point Condition
    and Its Physical Content The Nishkala Scaling Law [5] for a superconductor’s critical
    temperature is: T_c = (δ/1.764 k_B) · χ · f(Θ) · g(Φ) · h(Z_s_c/Z₀) (1) where
    δ is the pairing gap, χ the three-dimensional connectivity factor, f(Θ) the phase
    stiffness function, g(Φ) the charge-reservoir saturation function, and h(Z_s_c/Z₀)
    = h_ph + (1−h_ph)×Z_s_c/Z₀ the vacuum impedance proximity function. The fixed
    point T_c ≈ 300 K is achieved when all five factors simultaneously equal unity,
    requiring: Z_s_c = Z₀ ⇔ λ_L = λ_gap = ħc/δ (2) Equation (2) has a precise electromagnetic
    meaning: the London penetration depth (the length scale over which magnetic fields
    are screened from the bulk) exactly equals the coherence length of the Cooper
    pair set by the energy gap. This double equality is the condition under which
    the material’s electromagnetic mode structure is indistinguishable from vacuum
    at all frequencies — the same vacuum field that mediates Cooper pairing in all
    superconductors is now the dominant field in the material itself, rather than
    a perturbative correction to phonon-mediated pairing. We now show that Eq. (2)
    independently implies each of the three Hamiltonians. III. Mode 1: Gate-Mode Quantum
    Computation The standard transmon Hamiltonian for a Josephson junction qubit is
    [1]: H_gate = 4E_C(̂n − n_g)² − E_J cos(φ̂) (3) where E_C = e²/(2C_Σ) is the charging
    energy, E_J = Φ₀I_c/(2π) is the Josephson energy, n_g is the gate charge offset,
    and φ̂ is the superconducting phase. Universal quantum gates require anharmonicity
    E_C/E_J > 0 so that the |0⟩ → |1⟩ transition is distinguishable from |1⟩ → |2⟩.
    At the Nishkala fixed point, two new results follow from Eq. (2): Result 1 — Fixed
    anharmonicity: The junction critical current I_c = πδ/(2eR_N) (Ambegaokar–Baratoff
    relation) and the junction capacitance C_Σ = ε₀A/d are both set by the gap δ through
    the condition λ_L = δ/ξ (where ξ = ħv_F/(πδ) is the BCS coherence length). At
    Z_s_c = Z₀, the ratio E_J/E_C = Φ₀I_c C_Σ/(2πe²) is determined by the fixed-point
    geometry without external flux tuning. The anharmonicity is intrinsic. Result
    2 — Intrinsic T₂ → ∞: The Purcell decay rate γ_1 ∝ (g/δ_r)² × (Q_c/Q_0) → 0 as
    Z_s_c → Z₀, because impedance matching eliminates the electromagnetic coupling
    between the qubit and environmental modes. The intrinsic phase decoherence rate
    γ_2^{intrinsic} ∝ exp(−Θ_s/k_BT) → 0 as the phase stiffness Θ_s = ħ²n_s/(4m*)
    diverges at the fixed point. The practical T₁ is limited by phonon-mediated quasiparticle
    generation, derived from the Debye phonon model at 300 K to be hours to days —
    five to eight orders of magnitude longer than cryogenic transmon qubits at 15
    mK. Since T₂ ≤ 2T₁ by the fundamental decoherence bound, coherence times at the
    fixed point are limited only by extrinsic noise. Full T₁ and T₂ derivations are
    given in companion paper [20]. A V12/V2/V12 trilayer junction (V12 electrodes,
    V2 weak link) implements H_gate with the impedance difference ΔZ = |Z_V12 − Z_V2|
    setting E_C through the relation E_C ∝ ΔZ/Z₀, as described in the Applicant’s
    prior patent [7]. Full derivation and gate fidelity estimates are given in companion
    paper [16]. A candidate material satisfying Z_s_c ≈ Z₀ has been identified through
    computational screening. Two compositions — designated V2 and V12 in order of
    simulation sequence — were found to produce room-temperature optical impedances
    closest to the vacuum fixed point Z₀ = 376.73 Ω, with V12 (Z = 376.21 Ω) on the
    metallic branch and V2 (Z = 377.23 Ω) on the ceramic branch of the bilateral convergence
    map. The exact elemental ratios are protected under Indian Patent Applications
    (202641052969 and 202641055923) and are not disclosed here. The V12/V2/V12 trilayer
    junction uses V12 as the superconducting electrodes and V2 as the weak-link interlayer,
    straddling the fixed point from the metallic and ceramic branches respectively.
    IV. Mode 2: Vacuum-Field Quantum Annealing Quantum annealing requires a time-dependent
    Hamiltonian H(t) = A(t)H_driver + B(t)H_problem [2] where H_driver provides a
    transverse field that drives quantum tunnelling between classical Ising configurations,
    and H_problem encodes the combinatorial optimisation instance. In all prior implementations,
    H_driver is an externally applied magnetic or microwave transverse field, requiring
    cryogenic shielding and field calibration. At the Nishkala fixed point, H_driver
    is provided by the vacuum electromagnetic field itself. The derivation proceeds
    in two steps: Step 1 — Identification of H_vacuum: At Z_s_c = Z₀, the crystal’s
    internal electromagnetic mode at the structural torsional frequency ω_tors (Pillar
    III of the NSL, experimentally confirmed in K₃C₆₀ at 10 THz [8]) is the vacuum
    mode — the crystal is electromagnetically transparent at ω_tors. The vacuum field
    at ω_tors exerts a transverse quantum pressure on each Josephson junction site,
    acting as a natural transverse field: H_vacuum = ħω_tors Σ_i σ_i^x (4) Step 2
    — Problem encoding: The coupling matrix J_ij in H_problem = −Σ_{ij} J_{ij}σ_i^zσ_j^z
    − Σ_i h_iσ_i^z is encoded by locally modifying the Josephson energies E_J{ij}
    at each junction through the laser-written chi circuit method [7]. Each junction’s
    E_J ∝ δ_{ij} is set by the local gap, implementing J_{ij} = α δ_{ij}^2 where α
    is a material constant. The complete annealing Hamiltonian is therefore: H(t)
    = A(t)·ħω_tors Σ_i σ_i^x + B(t)·(−Σ_{ij} J_{ij}σ_i^zσ_j^z − Σ_i h_iσ_i^z) (5)
    with A(t): 1 → 0 and B(t): 0 → 1 over the annealing time T_anneal. This is the
    first quantum annealing Hamiltonian in which H_driver = H_vacuum is not externally
    generated but is a consequence of the fixed-point condition. No dilution refrigerator,
    no external magnet, no microwave transverse field source is required. Full derivation
    of the tunnelling rate and annealing performance guarantees is given in companion
    paper [17]. V. Mode 3: Gaussian Boson Sampling Gaussian Boson Sampling (GBS) [3,4]
    requires: (a) squeezed photon sources; (b) a linear optical network U_ij; (c)
    photon-number-resolving detection; and (d) low insertion loss throughout. Prior
    implementations require cryogenic photon sources and detectors. At the Nishkala
    fixed point, all four requirements are satisfied by the crystal at ambient temperature.
    The key physical fact is the transparency condition from Eq. (2). At λ_L = λ_gap
    = ħc/δ, the crystal is electromagnetically transparent to photons at the gap frequency
    ω_Δ = δ/ħ: the impedance mismatch at the crystal surface is Z_s_c − Z₀ = 0, giving
    zero reflection loss. Photons at ω_Δ propagate through the crystal without absorption
    or scattering — the laser-in step. The'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Experimental memory control in continuous-variable optical quantum reservoir
    computing
  date: 2026-03
  url: https://doi.org/10.1038/s41566-026-01880-9
  category: optical-computing
  subcategory: method
  authors:
  - Iris Paparelle
  - Johan Henaff
  - Jorge García-Beni
  abstract: Forecasting complex processes requires efficient learning from temporal
    data. Reservoir computing platforms enable such learning with minimal training
    cost. Quantum reservoir computing (QRC) extends this framework into the quantum
    domain, offering promising capabilities for online, quantum-enhanced machine learning
    tailored to temporal tasks. As in the classical case, photonics provides a natural
    platform for QRC. However, implementing native memory capabilities in practical
    photonic quantum systems remains a major challenge. Here we demonstrate a photonic
    QRC platform based on deterministically generated multimode squeezed states, exploiting
    spectral and temporal multiplexing in a continuous-variable setting with controllable
    fading memory. Data is encoded via programmable pump phase shaping in an optical
    parametric process and retrieved through mode-selective homodyne detection. Real-time
    memory is implemented through feedback via electro-optic modulation, and expressivity
    is boosted via spatial multiplexing. This architecture enables nonlinear temporal
    tasks, including parity check at different delays and chaotic signal forecasting.
    All results are supported by a high-fidelity Digital Twin. Leveraging the entangled
    multimode structure enhances expressivity and memory capacity, establishing a
    scalable continuous-variable photonic platform for quantum-enhanced information
    processing. Researchers demonstrate a photonic quantum reservoir computing platform
    that uses spectral and temporal multiplexing in a continuous-variable setting.
    Real-time memory is implemented, and nonlinear temporal tasks are enabled.
  venue: Nature Photonics
- title: Inverse-designed nanophotonic neural network accelerators for ultra-compact
    optical computing
  date: 2026-03
  url: https://doi.org/10.1038/s41467-026-68648-1
  category: optical-computing
  subcategory: method
  authors:
  - Joel Sved
  - Shijie Song
  - Liwei Li
  abstract: Inverse-designed nanophotonic devices offer promising solutions for analog
    optical computation, where high-density photonic integration is critical for scaling
    computational complexity. Here, we present an inverse-designed photonic neural
    network (PNN) accelerator, enabling ultra-compact and energy-efficient optical
    computing. Using a wave-based inverse-design method based on three-dimensional
    finite-difference time-domain simulations, we exploit the linearity of Maxwell’s
    equations to reconstruct arbitrary spatial fields through optical coherence. Each
    subwavelength voxel serves as a trainable degree of freedom, yielding a computational
    density of approximately 400 million parameters per mm². By decoupling the forward-pass
    process into linearly separable simulations, our approach is highly amenable to
    computational parallelism. We experimentally demonstrate two inverse-designed
    PNN accelerators, achieving on-chip MNIST and MedNIST classification accuracies
    of 89% and 90% respectively, within footprints of 20 × 20 µm² and 30 × 20 µm².
    Our results establish a scalable, energy-efficient platform for photonic computing,
    bridging inverse nanophotonic design with high-performance optical information
    processing. Scaling of optical computing requires computationally dense and efficient
    hardware. Here, the authors inverse-design and experimentally demonstrate ultracompact
    nanophotonic neural network accelerators with high computational density, enabling
    scalable and energy-efficient analog photonic computing.
  venue: Nature Communications
- title: Mobile-compatible neuromorphic optical computing enabled by dual-emission
    photonic materials
  date: 2026-05
  url: https://doi.org/10.1088/2634-4386/ae6a19
  category: optical-computing
  subcategory: theory
  authors:
  - Lilia Dias
  - Ana Rita Bastos
  - Lianshe Fu
  abstract: Abstract Artificial intelligence (AI) and neuromorphic computing demand
    hardware platforms that combine energy efficiency with physically informed data
    processing. Photonics offers unique advantages in this context, but optical neuromorphic
    systems in which memory and information processing arise from intrinsic material
    dynamics remain scarce. We demonstrate a photonic layer in which history-dependent
    material photophysics implements physically embedded information processing before
    digital learning, using luminescent phosphors. The photonic layer exhibits dual
    fluorescence and phosphorescence together with excitation-history-dependent photoactivation
    dynamics that emulate synaptic functionalities, including short-term memory, long-term
    memory, and synaptic potentiation. Quantitative analysis and modelling reveal
    efficient nanoscale interlamellar energy transfer consistent with the lamellar
    material morphology, establishing a link between structure and function. When
    integrated as an active optical front-end within a hybrid photonic–digital AI
    architecture, the photonic layer performs a material-based transformation of input
    data before digital learning. Using a laboratory-based optical readout, classification
    accuracy comparable to state-of-the-art hybrid neuromorphic computing (approximately
    94%) is achieved while requiring fewer training epochs. A mobile-compatible implementation
    based on smartphone optical readout yields similar accuracy, demonstrating robustness
    to non-specialized optical hardware. These results outline a general strategy
    for neuromorphic photonic systems in which functional materials act as adaptive
    computational primitives, enabling energy-efficient computing architectures.
  venue: Neuromorphic Computing and Engineering
- title: Heterogeneous Back‐End‐of‐Line Integration of Thin‐Film Lithium Niobate on
    Active Silicon Photonics for Single‐Chip Optical Transceivers
  date: 2026-05
  url: https://doi.org/10.1002/lpor.71344
  category: optical-computing
  subcategory: development
  authors:
  - Lingfeng Wu
  - Zhonghao Zhou
  - Weixing Ma
  abstract: ABSTRACT The explosive growth of artificial intelligence, cloud computing,
    and large‐scale machine learning is driving an urgent demand for short‐reach optical
    interconnects featuring large bandwidth, low power consumption, high integration
    density, and low cost adopting complementary metal‐oxide‐semiconductor (CMOS)
    processes. Heterogeneous integration of silicon photonics and thin‐film lithium
    niobate (TFLN) combines the advantages of both platforms, and enables co‐integration
    of high‐performance modulators, photodetectors, and passive photonic components,
    thereby offering an ideal route to meet these requirements. However, process incompatibilities
    have constrained the integration of TFLN to passive silicon photonics only. Here,
    we demonstrate the first heterogeneous back‐end‐of‐line integration of TFLN with
    a full‐functional active silicon photonics platform via trench‐based die‐to‐wafer
    bonding. This technology introduces TFLN after completing the full CMOS‐compatible
    silicon photonics process. The close vertical proximity of the Si and TFLN waveguides
    enables efficient inter‐layer optical coupling without fine patterning on the
    TFLN layer. Si/SiN passive components including low‐loss fiber interfaces, 56‐GHz
    Ge photodetectors, 100‐GHz TFLN modulators, and multilayer metallization are integrated
    on a single silicon chip. The integrated on‐chip optical links exhibit &gt;60
    GHz electrical‐to‐electrical bandwidth and support 128‐GBaud OOK and 100‐GBaud
    PAM4 transmission below forward error correction thresholds, establishing a scalable
    platform for energy‐efficient, high‐capacity photonic systems.
  venue: Laser & Photonics Review
- title: Integrated photonic 3D tensor processing engine
  date: 2026-03
  url: https://doi.org/10.1038/s41377-026-02183-y
  category: optical-computing
  subcategory: theory
  authors:
  - Yue Wu
  - Ziheng Ni
  - Xin Li
  abstract: Optical computing leverages high bandwidth, low latency, and power efficiency,
    which is considered as one of the most effective solutions for accelerating deep
    learning tasks. However, mainstream photonic hardware accelerators are primarily
    optimized for two-dimensional (2D) matrix-vector multiplications (MVMs). To implement
    three-dimensional (3D) convolutional neural networks (CNNs), high-order tensors
    must be reshaped in the electrical domain according to the size of the accelerators
    before computation, leading to extra memory usage and time overheads. Additionally,
    synchronization across multiple channels depends on external electronic clocks,
    which increases the complexity of the system. In this work, we propose an integrated
    photonic 3D tensor processing engine (3D-TPE) based on the interleaving modulation
    of time, wavelength, and space. Data caching, channel synchronization and computation
    are realized entirely within the optical domain, reducing memory and time usage,
    and simplifying the system. Optical caching and synchronization are achieved with
    an optical tunable delay line (OTDL) chip supporting versatile clock frequencies
    up to 200 GHz, and optical computing is accomplished with a dual-coupled micro-ring
    resonators (MRRs) based crossbar chip with a 3-dB passband width of 50 GHz. We
    verify the processing capabilities of the 3D-TPE at clock frequencies ranging
    from 10 GHz to 30 GHz and perform a proof-of-concept experiment for a LiDAR 3D
    point cloud image recognition task operating at 20 GHz, achieving a recognition
    accuracy of 97.06%. The proposed 3D-TPE is anticipated to facilitate high-order
    tensor convolutions, playing an important role in autonomous driving, healthcare,
    video analytics, virtual reality, etc.
  venue: Light Science & Applications
- title: 'Spatial photonic Ising machine: an emerging free-space optical computing
    architecture [Invited]'
  date: 2026-03
  url: https://doi.org/10.1364/ao.589243
  category: optical-computing
  subcategory: theory
  authors:
  - Yusuke Ogura
  abstract: Free-space optical computing is a domain-specific architecture that performs
    information processing based on optical modulation, control, and free-space light
    propagation. It inherently offers useful features such as spatial parallelism,
    high-throughput processing using passive devices, and lossless information transmission.
    Fueled by the explosive growth and rapid advancement of artificial intelligence
    in recent years, attention to free-space optical computing has been revived over
    the past decade. In such circumstances, the spatial photonic Ising machine (SPIM)
    has emerged as a novel free-space optical computing architecture. SPIM is expected
    to serve as a dedicated solver for combinatorial optimization problems with high
    speed and efficiency, motivating efforts to understand its characteristics and
    drive innovations in performance and functionality. This review provides a detailed
    overview of the principles and current statuses of free-space optical computing
    to highlight its potential. We then summarize recent advances in SPIM models,
    implementation techniques, and the exploration of new functionalities, and offer
    insights into future directions for this rapidly evolving field.
  venue: Applied Optics
- title: Microcomb-enabled parallel self- calibration optical convolution streaming
    processor
  date: 2026-03
  url: https://doi.org/10.1038/s41377-025-02093-5
  category: optical-computing
  subcategory: method
  authors:
  - Yi-Xiang Wang
  - Xingyuan Xu
  - Xiaotian Zhu
  abstract: The exponential growth of cloud computing and artificial intelligence
    (AI) applications has driven an urgent need for high-bandwidth, energy-efficient
    hardware architectures in data centers. With Moore's Law nearing its limits, optical
    neuromorphic computing hardware offers a promising alternative, providing ultra-high
    speeds and minimal energy consumption due to its analog architecture. Here, we
    propose the microcomb-enabled parallel optical convolution streaming processor
    (OCSP) with time, space, and wavelength three-dimensional multiplexing, operating
    at data rates of 50 GBaud or higher, achieving a convolution computing speed of
    up to 4 trillion operations per second (TOPS). Moreover, the OCSP uses a robust
    self-calibration mechanism to achieve accurate optical phase calibration and set-up
    of its convolution function. This innovative approach leverages time-space interleaving
    passive periodic interference architecture, incorporating wavelength-division-multiplexing
    technology, and is verified experimentally for parallel image feature extraction
    and recognition tasks. Our OCSP offers a practical pathway for seamlessly integrating
    photonic computing units into data center interconnects, unlocking photonic computing's
    potential for scalable, low-latency AI workloads.
