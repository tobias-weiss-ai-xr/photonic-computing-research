  abstract: The achievement of sensing both pressure and temperature for the same
    body part is often required in real clinical application. Therefore, the capability
    of multi-parameter measurement with single sensing unit poses significant challenges
    for optical fiber sensor. Combining the techniques of both optics and microwave,
    a high-precision microwave photonic (MWP) sensor for multiple parameters sensing
    assisted by deep learning (DL) processing is proposed. The proposed sensor operates
    by virtue of MWP interrogation and advanced DL processing based on convolutional
    neural network (CNN) and, hence, achieves high resolution pressure and temperature
    measurement with one packaged FBG head simultaneously. The theoretical analysis
    and experimental results of the proposed MWP sensor are presented and discussed.
    When the pressure and temperature vary within a certain range, the maximum mean
    absolute errors (MAEs) of the pressure and temperature measurement are 0.59 kPa
    and 0.17 °C, respectively. The estimation results can satisfy the body pressure
    and temperature monitoring in real clinical application.
  venue: IEEE Sensors Journal
- title: 'Fusion-oil: a multimodal deep learning and photonic-inspired framework for
    high-frequency crude oil price prediction'
  date: 2026-02
  url: https://doi.org/10.1117/12.3101638
  category: photonic-neural-networks
  subcategory: theory
  authors:
  - Jiaqi Sun
  - Kexin Xie
  - Zhirong Li
  abstract: 'High-frequency crude oil price prediction presents major computational
    and modeling challenges due to the volatile and heterogeneous nature of financial
    markets. Traditional uni-modal approaches fall short in capturing the dynamic
    interplay among real-time trading activity, unstructured financial sentiment,
    and macroeconomic structural signals. In this study, we propose Fusion-Oil, a
    novel multimodal deep learning framework enhanced by photonic computing concepts
    for robust and real-time oil price forecasting. The model integrates three distinct
    modalities: numerical trade sequences processed via long short-term memory (LSTM)
    networks, sentiment-enriched textual data encoded using Financial Bidirectional
    Encoder Representations from Transformers (FinBERT), and macroeconomic relational
    structures represented through graph attention networks (GATs). These modality-specific
    features are fused adaptively using a trainable attention mechanism, and the full
    architecture is optimized using a composite loss function incorporating both prediction
    accuracy and Value-at-Risk (VaR) regularization. Furthermore, we discuss how optical
    neural networks (ONNs) and photonic attention mechanisms can accelerate inference
    for latency-sensitive trading environments. Experimental results on multisource,
    high-frequency datasets demonstrate that Fusion-Oil significantly outperforms
    baseline models in terms of mean absolute error (MAE), root mean square error
    (RMSE), and directional accuracy. The findings underscore the complementary strength
    of multimodal signals and point to the promising role of emerging photonic computing
    paradigms in next-generation financial intelligence systems.'
