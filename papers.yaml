  abstract: 'Traditional ultrafast pulse characterization methods face limitations
    in accuracy and real-time applicability. This work presents the first experimental
    realization of a novel methodology, previously explored numerically, that uses
    deep learning to characterize femtosecond pulses from supercontinuum (SC) spectral
    data. Using a fully automated system to generate a comprehensive dataset from
    a nonlinear photonic crystal fiber (NL-PCF), we trained and compared two distinct
    architectures: a Deep Neural Network (DNN) using 1D final SC spectra and a Convolutional
    Neural Network (CNN) using 2D spectral evolution maps. Both models demonstrated
    high predictive accuracy, achieving a coefficient of determination ($R^2$) greater
    than 0.98. By successfully translating this technique from simulation to a validated
    experimental framework, our study establishes a powerful and practical data-driven
    metrology for in-situ monitoring of ultrafast laser systems.'
