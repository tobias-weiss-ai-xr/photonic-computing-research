- title: Design and Development of an All-Fiber Optical Processor Based on Boron Carbide
    Nanostructure Ink for Advanced Photonic Logic
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21592896
  category: optical-computing
  subcategory: theory
  authors:
  - Milad Keshavarz Azhdari
  abstract: Conventional CMOS silicon-based computational architectures face severe
    physical limitations, including interconnect RC delay, thermal dissipation bottlenecks,
    and limited electronic bandwidth. Photonic computing offers a transformative alternative
    by enabling near-light-speed processing, ultra-wide bandwidth, and sub-picosecond
    response times. This paper presents the design, modeling, and performance evaluation
    of an all-fiber optical processor utilizing a novel Boron Carbide (B4C) nanostructure
    ink functionalized on micro-tapered and D-shaped optical fiber waveguides. Leveraging
    the high third-order optical susceptibility (χ⁽³⁾), ultrafast Kerr nonlinearity,
    and extraordinary thermal/mechanical resilience of B4C nanostructures, the proposed
    architecture enables all-optical logic operations (AND, OR, NOT, XOR) via nonlinear
    phase modulation and cross-phase modulation (XPM) phenomena. Numerical simulations
    and theoretical modeling demonstrate high optical extinction ratios, low insertion
    losses, and high thermal damage thresholds under intense optical pump power regimes.
    The integration of B4C nanostructure ink directly onto optical fibers provides
    a robust, low-cost, and scalable pathway toward all-fiber photonic logic gates,
    removing the need for complex bulk-optic alignments and paving the way for scalable,
    ultra-fast, and energy-efficient optical processing networks.
