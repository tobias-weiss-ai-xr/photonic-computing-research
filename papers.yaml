- title: Ultra-Broadband Polarization Splitter-Rotator Based on a Three-Layer Taper
    in a Si-SiN Heterogeneous Waveguide
  date: 2026-04
  url: https://doi.org/10.1109/jlt.2026.3686619
  category: silicon-photonics
  subcategory: theory
  authors:
  - Hang Liang
  - Haibo Kuang
  - Shiao Zhao
  abstract: The significant birefringence in 220 nm silicon-on-insulator (SOI) silicon
    waveguides makes polarization diversity essential in silicon photonic integrated
    circuits. To address this, we propose a broadband polarization splitter-rotator
    (PSR) based on a silicon-nitride-on-silicon (SiN-on-SOI) hybrid integration platform.
    The device consists of a polarization rotator (PR) unit and an asymmetrical directional
    coupler (ADC). The PR unit is formed by a double-layer silicon taper coupled with
    a single-layer silicon nitride taper, while the ADC is implemented using a shallow-etched
    ridge waveguide. During operation, the TM0 mode is adiabatically converted to
    the TE1 mode, which is then coupled via the ADC into the narrow waveguide, propagating
    as the TE0 mode. Meanwhile, the input TE0 mode passes through the original waveguide
    without conversion. Through systematic optimization of the width parameters in
    the three-layer taper structure, efficient mode mixing is achieved across the
    entire 1260–1675 nm band, resulting in excellent broadband performance. Theoretical
    analysis indicates that the PSR operates effectively over the full optical communication
    band, with an insertion loss (IL) below 0.34 dB and an extinction ratio (ER) exceeding
    17 dB. Experimental results demonstrate a 1dB bandwidth of 190 nm and an ER greater
    than 14.5 dB, representing the widest operational bandwidth reported for a silicon
    PSR to date. Furthermore, a comprehensive fabrication tolerance analysis reveals
    the device's high robustness to silicon nitride dimensional variations, while
    identifying the silicon slab thickness as the critical parameter for maintaining
    high extinction ratios. The device is fully compatible with standard silicon photonic
    foundry processes and holds strong potential for large-scale production.
  venue: Journal of Lightwave Technology
- title: 'Toward Large Nonradiating Qubits: When Quantum Engineering Meets Photonics'
  date: 2026-03
  url: https://doi.org/10.1002/qute.202500587
  category: survey
  subcategory: theory
  authors:
  - Alexey A. Basharin
  abstract: 'ABSTRACT Over the past few decades, significant progress has been made
    toward quantum computers ‐ machines designed to exploit the full complexity of
    many‐particle quantum systems for tasks such as drug discovery, molecular simulation,
    cryptography, and including applications in quantum simulation of astrophysical
    and cosmological systems. Among the most promising platforms are superconducting
    qubits. However, a central challenge remains: qubits readily lose coherence by
    radiating energy into their environment. Recent advances in superconducting circuits
    demonstrate that nonradiating qubit architectures, inspired by photonics and metamaterials,
    can suppress such losses and dramatically extend qubit lifetimes. This review
    highlights two key concepts enabling radiation suppression in large (wavelength‐scale)
    qubits: the anapole state and bound states in the continuum (BICs). By engineering
    currents and fields for destructive interference, these states confine electromagnetic
    energy to the qubit''s near field and prevent radiation into the far field. We
    survey the theoretical foundations of anapole and BIC qubits, recent experimental
    implementations in superconducting platforms, and their implications for scalable
    quantum computing. We discuss how harnessing these nonradiating modes, as demonstrated
    in large qubits, yields unprecedented coherence times while addressing the practical
    challenges of control, readout, and fabrication. We conclude by outlining opportunities
    for future research at the intersection of quantum engineering and photonics,
    where tailored interference and symmetry principles may pave the way toward high‐coherence,
    large‐scale quantum processors. This work addresses a key open question in qubit
    design: How can a superconducting qubit be scaled to the wavelength regime without
    suffering from parasitic radiation losses?'
  venue: Advanced Quantum Technologies
- title: Comprehensive Review of Quantum Computing Technologies and Processor Architectures
  date: 2026-03
  url: https://doi.org/10.56975/ijedr.v14i1.304192
  category: survey
  subcategory: theory
  authors:
  - Babu shanmugham
  abstract: This paper presents a comprehensive review of quantum computing and the
    technological foundations of quantum processors. Quantum computing represents
    a transformative computational paradigm that leverages the fundamental principles
    of quantum mechanics—such as superposition, entanglement, and quantum interference—to
    solve complex problems that are intractable for classical computers. At the core
    of this paradigm lies the quantum processor, a specialized hardware system designed
    to initialize, control, and measure quantum bits (qubits) through precise gate
    operations and coherent interactions. The survey examines the essential theoretical
    concepts underlying quantum computation and provides a structured comparison of
    leading quantum processor platforms. Prominent architectures, including superconducting
    circuits, trapped-ion systems, and photonic implementations, are analyzed in terms
    of their physical mechanisms, scalability, coherence properties, and engineering
    challenges. Each platform offers distinct advantages and faces specific technical
    limitations related to noise, error correction, and fabrication complexity. In
    addition to reviewing hardware developments, this study highlights key obstacles
    in advancing quantum processors toward large-scale, fault-tolerant systems. Issues
    such as qubit stability, error mitigation, thermal management, and system integration
    are discussed to present a realistic perspective on current progress. Performance
    indicators including gate fidelity, coherence time, connectivity, and scalability
    are used to compare architectural approaches. The objective of this paper is to
    provide a clear and organized synthesis of recent advancements in quantum computing
    hardware, thereby offering researchers and practitioners a foundational reference
    to support continued innovation and development in this rapidly evolving field.
  venue: International Journal of Engineering Development and Research
- title: Noise Models Impacts and Mitigation Strategies in Photonic Quantum Machine
    Learning
  date: 2026-03
  url: https://arxiv.org/abs/2603.09645
  category: survey
  subcategory: theory
  authors:
  - A. M. A. S. D. Alagiyawanna
  - Asoka Karunananda
  abstract: 'Photonic Quantum Machine Learning (PQML) is an emerging method to implement
    scalable, energy-efficient quantum information processing by combining photonic
    quantum computing technologies with machine learning techniques. The features
    of photonic technologies offer several benefits: room-temperature operation; fast
    (low delay) processing of signals; and the possibility of representing computations
    in high-dimensional (Hilbert) spaces. This makes photonic technologies a good
    candidate for the near-term development of quantum devices. However, noise is
    still a major limiting factor for the performance, reliability, and scalability
    of PQML implementations. This review provides a detailed and systematic analysis
    of the sources of noise that will affect PQML implementations. We will present
    an overview of the principal photonic quantum computer designs and summarize the
    many different types of quantum machine learning algorithms that have been successfully
    implemented using photonic quantum computer architectures such as variational
    quantum circuits, quantum neural networks, and quantum support vector machines.
    We identify and categorize the primary sources of noise within photonic quantum
    systems and how these sources of noise behave algorithm-specifically with respect
    to degrading the accuracy of learning, unstable training, and slower convergence
    than expected. Additionally, we review traditional and advanced techniques for
    characterizing noise and provide an extensive survey of strategies for mitigating
    the effects of noise on learning performance. Finally, we discuss recent advances
    that demonstrate PQML''s capability to operate in real-world settings with realistic
    noise conditions and future obstacles that will challenge the use of PQML as an
    effective quantum processing platform.'
  venue: arXiv (Cornell University)
- title: 'Quantum Computing: Today, Tomorrow, and the Future: A Comprehensive Survey
    of Foundations, Hardware, Algorithms, Markets, Education, and Careers'
  date: 2026-08
  url: https://doi.org/10.20944/preprints202608.0864.v1
  category: survey
  subcategory: theory
  authors:
  - Muhammad Saddam Khokhar
  - Misbah Ayoub
  - Zakria Jamali
  abstract: Quantum computing has moved from a theoretical curiosity to a strategic
    technological priority for governments, hyperscale technology companies, and a
    fast-growing ecosystem of specialized start-ups. This survey provides a comprehensive,
    self-contained overview of the field as it stands in 2026. We first lay out the
    physical and mathematical foundations of quantum computation, superposition, entanglement,
    interference, and measurement, and contrast them systematically with classical
    computing. We then survey the competing hardware modalities (superconducting,
    trapped-ion, photonic, neutral-atom, topological, and spin qubits) and the logic
    gates and circuit model that operate on them, before reviewing the canonical quantum
    algorithms that motivate the field. We classify the major computing paradigms
    (gate-based, annealing, adiabatic, measurement-based, and topological), and examine
    the current state of the market, the national strategies of leading countries,
    and the roles played by IBM, Google, Microsoft, Amazon, NVIDIA, and a cohort of
    pure-play companies. Dedicated sections map undergraduate and graduate education
    pathways, including specific universities offering quantum-focused degrees, the
    domains in which quantum computers are expected to create value, and the career
    paths now opening in the field. We close with an explicit three-phase roadmap
    \qtoday{}, \qtomorrow{}, and the \qfuture{} and a candid discussion of the open
    scientific and engineering problems that stand between the present noisy intermediate-scale
    quantum (NISQ) era and a fault-tolerant, utility-scale quantum computing industry.
  venue: Preprints.org
- title: Local and Nonlocal Pathways to Quantum Light with Quantum Photonic Materials
  date: 2026-02
  url: https://doi.org/10.1002/adfm.202524326
  category: survey
  subcategory: theory
  authors:
  - Wu Wen
  - Jing Li
  - Yunquan Liu
  abstract: ABSTRACT Advances in materials science continue to shape photonic quantum
    technologies. The generation and control of quantum light across diverse material
    platforms provide quantum resources, including single‐photon emission, complex
    entangled states, and hybrid interfaces between photons and other quantum systems.
    These resources underlie quantum communication, quantum computing, and precision
    metrology. Understanding material properties drives progress in quantum materials
    engineering. This review surveys physical origins and control strategies of quantum‐optical
    phenomena in materials. The mechanisms that govern the quantum properties of photons
    are categorized into two types. The first comprises localized effects from intrinsic
    quantum confinement, exemplified by quantum dots, localized excitons in transition‐metal
    dichalcogenides (TMDs), and deep‐level defects in hexagonal boron nitride (hBN).
    The second involves nonlocal collective coherent processes, particularly nonlinear
    responses in low‐dimensional materials. Building on these mechanisms, approaches
    to manipulate local states include electrostatic gating, magnetic‐field tuning,
    and strain engineering. Nonlocal properties are controlled by symmetry engineering
    and phase matching. A unifying perspective is material–mode co‐design. Nanophotonics
    provides optical modes from tightly confined plasmonic fields to the nonlocal
    character of quasi‐bound states in the continuum (q‐BICs), matching specific material
    platforms. This material–mode “selection rule” provides a guideline for material
    choice and device design, enabling versatile quantum light sources for diverse
    applications.
  venue: Advanced Functional Materials
- title: Machines and Exascale computing
  date: 2026-06
  url: https://doi.org/10.22323/1.518.0017
  category: survey
  subcategory: method
  authors:
  - Stefan Krieg
  - Eric B. Gregory
  - Giovanni Pederiva
  abstract: 'We review the current landscape of high-performance computing hardware
    relevant to lattice QCD simulations, placing it in the context of more than four
    decades of co-development between the LQCD community and the HPC industry. After
    a brief historical survey from the quenched era through the algorithmic revolution
    that enabled dynamical simulations, we describe the pre-exascale and exascale
    systems now available to the community, with particular attention to LQCD performance
    results on representative machines. We then discuss JUPITER, the first exascale
    system in Europe, currently being deployed at the Jülich Supercomputing Centre.
    Looking to the future, we analyse the key hardware trends shaping the next generation
    of HPC: the dominance of AI workloads and its impact on vendor roadmaps, the push
    towards mixed- and low-precision arithmetic, the rapidly increasing energy cost
    of advanced semiconductor fabrication nodes, and the challenges this poses for
    scientific HPC users. We close with an overview of exotic and emerging hardware
    technologies, including RISC-V, stencil accelerators, neuromorphic computing,
    analog photonic computing, FPGAs, and quantum computing devices.'
  venue: ''
- title: Neuromorphic Computing
  date: 2026-08
  url: https://doi.org/10.64388/irev10i2-1722321
  category: survey
  subcategory: theory
  authors:
  - Manjula Biradar
  abstract: 'The neuromorphic computing is a process that mimics the processing of
    information at biological synapses. The physical mechanism of neuromorphic computing
    is based on the ion transport at device interface to achieve efficient transfer
    and computation of information at the same location [11,12], which is different
    from logic circuit in digital systems [13,14]. Besides, neuromorphic computing
    is characterized by distributed memory and computational elements [15]. The neuromorphic
    computing can realize high-efficiency massive parallel computing that can conquer
    the limitation of Von Neumann bottleneck. Neuromorphic computing is a paradigm
    of designing hardware and algorithms inspired by the brain’s architecture and
    principles, promising major gains in energy efficiency and new computing capabilities.
    This review provides a comprehensive overview of developments in neuromorphic
    computing from 2019 through 2024. We survey hardware advances – including digital
    neuromorphic chips (e.g. Intel Loihi, IBM TrueNorth, and SpiNNaker), emerging
    device technologies like memristors, spintronic circuits, photonic processors,
    and two-dimensional (2D) material-based devices – that enable brain-like computation
    with vastly lower power than conventional electronics. We also summarize algorithmic
    advances in spiking neural networks (SNNs), covering progress in temporal coding
    strategies, the introduction of surrogate gradient methods for training SNNs like
    deep networks, and biologically plausible learning rules such as e-prop for online
    learning in spiking systems. Furthermore, we discuss key opportunities and gaps:
    the potential of neuromorphic systems to approach aspects of human cognition or
    artificial general intelligence (AGI), applications in medicine (like brain–machine
    interfaces and neural prosthetics) and science, the trade-offs between power efficiency
    and computational precision, and challenges in integrating neuromorphic accelerators
    into existing computing ecosystems. We conclude by highlighting how co-development
    of hardware and algorithms is critical to fulfill the promise of neuromorphic
    computing, and by outlining open research directions on the path toward more brain-like,
    efficient computing architectures.'
  venue: Iconic Research and Engineering Journals
- title: Artificial Intelligence-Driven Metasurfaces Spanning Multidimensional Light
    Field Control and Free Space Computing
  date: 2026-05
  url: https://doi.org/10.3390/mi17060667
  category: survey
  subcategory: theory
  authors:
  - Yuchao Wang
  - Zining Wang
  - Kaifan Li
  abstract: 'Metasurfaces exploit subwavelength scattering elements to manipulate
    light with a level of flexibility that is difficult to achieve using conventional
    optical platforms, making them promising building blocks for next-generation photonic
    systems. Yet the increasing dimensionality of metasurface design spaces and the
    demand for multifunctional responses have exposed the limitations of traditional
    intuition-led design approaches. In this Review, we survey the emergence of artificial
    intelligence (AI)-empowered metasurfaces across three major themes: inverse design,
    multidimensional optical-field control, and free-space optical computing. We first
    summarize the fundamental principle of optical field manipulation and the algorithmic
    approaches to metasurface design, including stochastic optimization, deep neural
    networks, and generative models, with emphasis on their capabilities in rapid
    performance prediction and inverse structural discovery. We next discuss artificial
    intelligence-assisted strategies for engineering multiple spatial, spectral, and
    polarization degrees of freedom in free space. We then highlight the role of AI-empowered
    metasurface architectures in optical information processing and computation. Together,
    these developments point to a powerful framework for integrating machine intelligence
    with meta-optics, with implications for autonomous photonic systems and high-capacity
    optical computing.'
  venue: Micromachines
- title: 'PUH Theorem 286 (Synthesis and Revision) — The Cosmic Web as the Branched-Flow
    Caustic Pattern of the Primordial Core Stream: T159''s ''No Dark Matter Needed''
    Revised — the Caustics Are Made of Cores; T285 Given Its Missing Distribution
    Mechanism; T159''s Kill-Conditions Inherited'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21327077
  category: survey
  subcategory: theory
  authors:
  - Brian Martell
  abstract: 'SYNTHESIS AND REVISION (T286). NOTHING NEW IS DERIVED. Resolves a CONTRADICTION
    between two filed PUH papers: T159 claims "No dark matter needed" (cosmic web
    = caustics of primordial GWs); T285 claims the dark mass of star-poor UDGs IS
    un-accreted primordial Planck cores. PUH cannot hold both. RESOLUTION: apply branched
    flow to the CORE STREAM (massive particles) — which is branched flow''s CANONICAL
    setting, and T159''s own first citation (Topinka et al., electrons in a 2DEG,
    Nature 410, 183 (2001)). The cosmic web becomes the caustic pattern OF THE CORE
    FLOW; the cores ARE the dark mass. T159''s mechanism, predictions, and "no new
    particles" all SURVIVE; only "No dark matter needed" is REVISED. T285 gains the
    distribution mechanism it lacked. T159''s kill-conditions (k^(2/3) P(k) excess;
    bispectrum) are INHERITED. Tags: SYNTHESIS / REVISION / CONJECTURE / KILL-CONDITIONS
    INHERITED / NOT DERIVED. === DESCRIPTION (abstract) === Photonic Universe Hypothesis
    (PUH) — Synthesis and Revision. THE CONTRADICTION. T159 (Universal Branched Flow
    in the E8 Lattice) identifies the cosmic web with the branched-flow caustic pattern
    of primordial gravitational waves through the Planck Core foam, and states in
    its status table and conclusion: "No dark matter needed" — "this picture requires
    no dark matter, no dark energy, and no new particles" (tagged CONJECTURE; basis
    "wave optics only"). T285 (The Skeleton Galaxy Hypothesis), filed one day earlier,
    identifies the dark mass of star-poor ultra-diffuse galaxies — Dragonfly 44 the
    exemplar — with a population of primordial Planck cores that never accreted gas.
    These are two different answers to the same question. PUH cannot hold both. THE
    RESOLUTION. Branched flow is not a wave phenomenon; it is a phenomenon of ANY
    flow — wave or ray, massless or massive — through a weak, smooth, correlated random
    potential. Its CANONICAL experimental realisation is with MASSIVE PARTICLES, and
    it is T159''s own first citation: Topinka et al., "Coherent branched flow in a
    two-dimensional electron gas," Nature 410, 183 (2001). PUH possesses exactly such
    a particle stream: the primordial Planck cores ejected by the Rebound (T196),
    massive, numerous, travelling ballistically before structure forms, through a
    substrate whose density is not perfectly uniform — and in PUH mass IS localised
    lattice density, so the same fluctuation field that refracts waves must deflect
    the cores. THEOREM 286 (synthesis, conjectural): the cosmic web is the branched-flow
    caustic pattern of the primordial core stream. Filaments are the caustic branches,
    where cores concentrate. Nodes, where branches intersect, are clusters. Voids
    are the gaps between branches. And the dark mass observed to inhabit these structures
    IS the core population. Structure is focus, as T159 said — but the thing being
    focused has mass. WHAT SURVIVES IN T159 (four things). (1) THE MECHANISM, strengthened:
    it moves from an extrapolated regime (primordial GWs through Planck foam) to its
    canonical one (massive particles in a weak random potential), where the laboratory
    confirmations actually live. (2) THE PREDICTIONS: the caustic power-spectrum excess
    scaling as k^(2/3) and the three-point bispectrum "key test" are consequences
    of CAUSTIC GEOMETRY, not of what is flowing — they apply unchanged and now describe
    the MATTER distribution directly. (3) "NO NEW PARTICLES": PUH''s cores are folded
    E8 lattice, the substrate itself in a configuration — not a new particle species.
    (4) GW BRANCHED FLOW as a real effect: nothing here denies GWs also branch; what
    is denied is that the GW caustic pattern IS the cosmic web''s matter. WHAT IS
    REVISED. "No dark matter needed" is WITHDRAWN. On the synthesis, dark matter is
    not dispensed with — it is IDENTIFIED. The caustics are not made of nothing; they
    are made of cores, and cores have mass. T159 correctly saw that branched flow
    produces filamentary structure without gravitational instability doing the work,
    and inferred that the dark component might be unnecessary. The inference does
    not follow: producing the PATTERN is not accounting for the MASS, and galaxy dynamics
    (rotation curves, velocity dispersions, DF44''s dynamical mass) measure mass,
    not pattern. WHAT T285 GAINS. The distribution mechanism it explicitly lacked,
    and which external review identified immediately. Caustic nodes are clusters;
    branches are filaments; gaps are voids; halos are the local caustic envelopes.
    And the Skeleton Galaxy takes its place: cores are focused into a node or filament
    junction — the gravitating structure assembles — and whether STARS form depends
    on whether GAS is available there. Where it is, an ordinary galaxy grows on the
    core scaffold. Where it is not, the scaffold stands alone. Dragonfly 44 becomes
    a node that never got its gas. THE UNIFIED CHAIN: Rebound -> primordial core stream
    -> branched flow -> caustic filaments and nodes -> the cosmic web, made of cores
    -> gas accretes where available -> ordinary galaxies; gas absent -> Skeleton Galaxies.
    KILL-CONDITIONS, INHERITED (not newly invented). (1) T159''s caustic P(k) excess
    scaling as k^(2/3), detectable at k ~ 1-10 Mpc^-1 in DESI and Euclid — now a prediction
    about the MATTER power spectrum directly. KILL: small-scale spectra consistent
    with the CDM shape, no k^(2/3) excess at the filed amplitude. (2) T159''s three-point
    bispectrum, named there as "the key test". KILL: no caustic bispectrum signature
    at survey sensitivity. (3) T285-1 remains in force: the rebound mass spectrum
    must satisfy alpha > 2, or the light-core population cannot carry the dark mass
    and the chain fails at its first link. NOT RESOLVED (named, not glossed). (a)
    THE SELF-CONSISTENCY PROBLEM — the sharpest: standard branched flow assumes a
    FIXED background potential, but in PUH the cores ARE the mass and mass IS lattice
    density, so the core stream may generate the very field that focuses it. That
    is a nonlinear problem, not the textbook one. Either an independent source of
    the background fluctuations must be identified (the Rebound''s own inhomogeneity
    being the obvious candidate) or the self-consistent problem must be solved. THIS
    NOTE DOES NEITHER. (b) THE RELATION TO GRAVITATIONAL INSTABILITY: standard cosmology
    builds the web by gravitational amplification of primordial perturbations, quantitatively
    successful from the CMB onward. This note does NOT claim branched flow replaces
    it — the honest possibilities are seeding, coexistence, or redundancy, and the
    k^(2/3) and bispectrum tests are precisely what would discriminate. Claiming replacement
    without that discrimination would repeat T159''s error in a new place. (c) THE
    CAUSTIC DISTANCE is not computed: the particle form requires the substrate fluctuation
    amplitude and the core velocity distribution, the latter gated on the same rebound
    mass spectrum. No numbers are produced here and none are claimed. (d) THE MASS
    SPECTRUM, still. NOT CLAIMED: any derivation; that the cosmic web IS explained
    (the self-consistency problem alone forbids it); that branched flow replaces gravitational
    instability; any numerical result whatever; that the mass spectrum is closer to
    derivation than T285 left it; or that Dragonfly 44 is explained — only that it
    now has a place in a chain running from the Rebound to the observation, with every
    link named and the weak ones marked.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Ultra-low-loss microfiber-knot resonator photonic processor for cost-effective
    feedback-free reservoir computing
  date: 2026-03
  url: https://doi.org/10.1364/opticaopen.31872151.v1
  category: optical-computing
  subcategory: method
  authors:
  - Jianxiang Wen
  - Yang Fulong
  - Suhua Wang
  abstract: High-performance photonic computing fundamentally demands physical memory
    units that both low-loss and cost-effective. In this work, four sets of microfiber-knot
    resonators (MKRs) were fabricated using a three-electrode tapering technique,
    featuring an insertion loss below 0.2dB and quality factors (Q-factors) ranging
    from 104 to 105. The devices are subsequently packaged with polydimethylsiloxane
    (PDMS), maintaining a total loss less than 1.0 dB. Utilizing these packaged MKRs,
    a feedback-free photonic reservoir computing (FF-PRC) system is constructed. Experimental
    results demonstrate with the increasing Q-factor increasing, the normalized mean
    square errors (NMSEs) for the Mackey-Glass and Santa Fe time-series prediction
    tasks dropped from 0.390 and 0.420 to 0.022 and 0.034, respectively, while the
    system achieves a classification accuracy of 97.5% on the MNIST dataset. The proposed
    FF-PRC system, enabled by ultra-low-loss (&lt;0.2dB) MKR, exhibits exceptional
    low-error and high-accuracy performance in processing complex temporal tasks.
    This work eliminates the need for external feedback loops in optical computing,
    offering a standalone, cost-effective, and ultra-low-loss memory unit solution
    for neuromorphic photonic edge nodes.&lt;p&gt;&lt;/p&gt;
  venue: ''
- title: General-Purpose Photonic Computing Primitive for Contemporary Artificial
    Intelligence
  date: 2026-05
  url: https://arxiv.org/abs/2605.23051v1
  category: optical-computing
  subcategory: method
  authors:
  - Shupeng Ning
  - Chenghao Feng
  - Zhenxiang Xu
  - Hanqing Zhu
  - David Z. Pan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic computing offers a promising route to accelerating artificial
    intelligence (AI) by providing high analog bandwidth, low latency, and low energy
    consumption. However, existing optical neural networks (ONNs) struggle with substantial
    hardware overhead and limited support for the dynamic, arbitrary matrix operations
    essential for modern AI architectures. Here we present the dynamic universal encoding
    tensorcore (DUET), a general-purpose photonic computing paradigm based on vectorized
    operand differential interferometric cells (VODICs). By exploiting inherent structural
    symmetry, this design provides a full-range linear encoding interface that directly
    accommodates signed operands. This approach eliminates the sign-based path splitting,
    nonlinear remapping, and auxiliary preprocessing typically required in conventional
    ONNs, thereby reducing latency and minimizing hardware and memory overhead. We
    further implement a hardware-aware training (HAT) strategy to alleviate the impact
    of on-chip non-idealities and ensure stable inference. DUET is experimentally
    validated across diverse architectures and application domains, ranging from image
    classification and medical segmentation to Transformer-based content generation,
    demonstrating competitive performance. By extending optical computing to universal,
    full-range operators across diverse model architectures, DUET provides a viable
    pathway toward general-purpose optical acceleration for contemporary AI workloads.
- title: Spatiotemporally Interleaved Homodyne Photonic Tensor Core
  date: 2026-06
  url: https://arxiv.org/abs/2606.16150v1
  category: optical-computing
  subcategory: method
  authors:
  - Yun-Long Nie
  - Hang Song
  - De-Hui Huang
  - Yi Xie
  - Yu-Xuan Fu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic computing provides ultrahigh bandwidth, low latency and intrinsic
    parallelism, making it a promising route beyond the scaling limits of electronic
    computing. However, existing on-chip photonic computing systems remain constrained
    by persistent trade-offs among high-speed modulation, energy efficiency and large-scale
    integration, limiting their system-level advantages. Here we present a spatiotemporally
    interleaved homodyne photonic tensor core implemented on a thin-film lithium niobate
    (TFLN) platform. By integrating a homodyne photonic matrix with a bus-readout
    time-integrating array, this architecture scales down the high-speed digital-to-analog
    and electro-optic interconversion hardware overhead required for photonic matrix
    operations from O(n^2) to O(n), thereby unlocking system-level scalability. Moreover,
    the architecture employs orthogonal horizontal and vertical crossbars to route
    data and weight signals independently, eliminating the intrinsic beam combining
    loss while enabling ultrahigh-speed synchronous updates of both data and weights.
    Collectively, these features provide a scalable and hardware-efficient foundation
    for high-bandwidth photonic processors targeting general-purpose artificial intelligence
    (AI) computing.
- title: Programmable photonics enabled by ferroionic two-dimensional materials
  date: 2026-07
  url: https://arxiv.org/abs/2607.18061v1
  category: optical-computing
  subcategory: method
  authors:
  - Ghada Dushaq
  - Srinivasa R Tamalampudiand
  - Solomon Serunjogi
  - Mahmoud Rasras
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Artificial intelligence (AI) models are scaling rapidly, exposing fundamental
    limitations in conventional computing architectures, where the physical separation
    of memory and computation imposes substantial energy and latency overheads. Optical
    neural networks offer a viable solution by enabling high-throughput, low-latency
    computation through the intrinsic parallelism of light. However, the scalability
    of photonic computing is constrained by the lack of materials that can provide
    low-loss, energy-efficient, and nonvolatile control of optical phase. Here, we
    discuss the emerging role of ferroionic two-dimensional materials as a platform
    for programmable photonics. Unlike conventional ferroelectrics, where polarization
    arises from bounded lattice distortions, ferroionic systems enable field-driven
    ionic redistribution, providing access to a continuum of stable and reconfigurable
    states. We outline how these material dynamics can be exploited to realize multi-level
    photonic states and nonvolatile phase control. Furthermore, we highlight a back-end
    integration strategy that introduces multifunctionality, including tunable optical
    nonlinearities into pre-fabricated photonic circuits without compromising optical
    performance. By bridging material-level dynamics with device- and system-level
    functionality, ferroionic materials provide a pathway toward reconfigurable, low-loss,
    and energy-efficient photonic computing architectures, opening new opportunities
    for neuromorphic and adaptive photonic systems.
- title: Self-Configuring Universal Multichannel and Multidimensional Integrated Photonic
    Processing Engine
  date: 2026-04
  url: https://arxiv.org/abs/2604.11763v1
  category: optical-computing
  subcategory: method
  authors:
  - Zengqi Chen
  - Wu Zhou
  - Hao Chen
  - Kaihang Lu
  - Wenzhang Tian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Arbitrary manipulation of light across multiple physical dimensions is
    essential for harnessing its parallelism in fundamental research and advanced
    applications, such as optical interconnects, computing, imaging, sensing, and
    quantum networks. However, creating a universal device capable of arbitrary operations
    of multidimensional optical beams has been challenging, primarily due to their
    complex mutual interferences and dynamic transmission characteristics. In this
    study, we experimentally demonstrate a self-configuring integrated photonic processor
    designed for the arbitrary manipulations of multiple optical waves over their
    spatial and polarization dimensions. Despite the random nature of the input speckle,
    the photonic processor relies on an optical singular-value decomposition engine
    to sort all orthogonal input beams and implement arbitrary processing over both
    spatial and polarization dimensions precisely. Notably, the photonic processor
    can be self programmed in situ, enabling versatile functionalities such as beam
    shaping, optical switching, and reconfigurable optical add-drop multiplexing.
    Our findings advance the manipulation of multidimensional optical beams through
    a scalable, CMOS-compatible integration approach, paving the way for fully exploiting
    the parallelism of light in various applications.
- title: Modeling and Analysis of Phase Instability in Photonic Processor
  date: 2026-06
  url: https://arxiv.org/abs/2606.25196v1
  category: optical-computing
  subcategory: method
  authors:
  - Gökhan Elmas
  - Igor Litvin
  - Paul Kohl
  - Janis Nötzel
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Achieving both reconfigurability and stable output signals is a critical
    challenge in the development of integrated photonic circuits for large-scale optical
    quantum information processing. This has led to the creation of multimode photonic
    processors, also known as reconfigurable multimode interferometers, which have
    wide-ranging applications in quantum and classical information processing. However,
    maintaining phase stability in multi-port input signals remains a significant
    hurdle, particularly due to the phase instabilities introduced by active cooling
    systems and temperature drifts in the photonic processor. In this study, we propose
    theoretical models to simulate phase instability in photonic processors and validate
    them against experimental results. Two distinct modeling approaches were employed:
    a Brownian random walk and phase reconstruction based on experimentally observed
    oscillating harmonics. Additionally, we verified and applied our model to a specific
    application for input phase correction using self-feedback control within the
    photonic processor.'
- title: Volumetric Optical Scattering Neural Networks
  date: 2026-05
  url: https://arxiv.org/abs/2605.13177v1
  category: optical-computing
  subcategory: method
  authors:
  - Xuhao Luo
  - Qiang Song
  - Weiwei Cai
  - Lei Chen
  - Enbo Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical neural networks offer a route to low-latency and energy-efficient
    inference by encoding computation in light propagation. However, most existing
    implementations rely on planar photonic circuits or discretely spaced diffractive
    layers, restricting volumetric integration and imposing stringent alignment requirements.
    Here we demonstrate a volumetric optical scattering neural network (OSNN) in which
    densely packed weak scatterers form a three-dimensional, locally connected optical
    computing medium. In contrast to fully connected diffractive architectures, the
    OSNN uses near-field scattering interactions, described under the first-Born approximation,
    to compress optical interconnections into a monolithic volume. We implement this
    concept using resilient inverse design and two-photon nanolithography, yielding
    OSNN devices with a volume of ~$3.8*10^{-4}mm^{3}$ and a record-breaking neuron
    density of $1.0*10^{9}/mm^{3}$. Experimentally, the fabricated classifier achieves
    $94.8\%$ blind-test accuracy on MNIST, while the imager performs optical compressed
    imaging with a $1-μm$ effective resolution and average FSIM values of $0.93$ on
    Fashion-MNIST and $0.91$ on VesselMNIST3D. OSNN paves the way for ultra-dense,
    ultra-compact, and efficient optical computing, creating a universal platform
    for embedded optical intelligence and promising widespread application in AI fields
    ranging from autonomous driving to medical diagnosis.
- title: 'Flat optics for analog computing: from fundamental mechanisms to advanced
    meta-processors'
  date: 2026-04
  url: https://arxiv.org/abs/2604.16849v1
  category: optical-computing
  subcategory: method
  authors:
  - Tingting Liu
  - Jumin Qiu
  - Xintong Shi
  - Qiegen Liu
  - Shuyuan Xiao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: As the explosive growth of visual data increasingly strains the latency
    and energy limits of conventional electronic computing, optical analog computing
    has re-emerged as a disruptive paradigm for zero-power, speed-of-light information
    processing. Propelled by the unprecedented wave-manipulation capabilities of optical
    metasurfaces, this field is undergoing a rapid transition from macroscopic physical
    optics to ultra-compact, on-chip meta-processors. This Review examines the fundamental
    mechanisms of metasurface-empowered optical computing spanning Fourier-domain,
    nonlocal spatial-domain, and interferometric architectures that perform mathematical
    operations, with a particular focus on spatial differentiation and edge detection
    as representative computing tasks. By emphasizing recent breakthroughs, we highlight
    the evolution of meta-processors from static, linear regimes to dynamically reconfigurable,
    nonlinear, and quantum-assisted multidimensional platforms. We also envision how
    the synergy of AI-driven inverse design and the integration of analog meta-front-ends
    with optical neural networks will synergistically revolutionize next-generation
    intelligent machine vision.
- title: Scalable native signed optical computing enabled by dual-wavelength incoherent
    multiplexing
  date: 2026-05
  url: https://arxiv.org/abs/2605.20864v1
  category: optical-computing
  subcategory: method
  authors:
  - Yuan Ren
  - Yong Zheng
  - Ruixue Liu
  - Yunpeng Song
  - Qinfen Huang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Incoherent photonic neural networks (PNNs) provide a robust platform for
    analog optical computing, yet efficient implementation of native signed operations
    remains challenging. Existing incoherent PNNs approaches often require additional
    spatial channels or temporal encoding steps to represent bipolar input signals,
    resulting in hardware overhead that scales with system size. Here, we demonstrate
    a dual-wavelength incoherent photonic architecture that natively supports both
    signed inputs and signed weights on a thin-film lithium niobate platform. By encoding
    complementary signal components onto two wavelength channels and performing computation
    within a shared physical path, the proposed scheme eliminates duplicated weighting
    units. As a result, the additional hardware overhead associated with signed computation
    remains constant per multiply accumulate operation, independent of matrix size.
    The fabricated device exhibits a modulation bandwidth exceeding 40 GHz and achieves
    four-quadrant optical multiplication with a standard deviation error of 1.27%.
    System-level functionality is validated through neural-network classification,
    achieving 95.1% accuracy on the Moons dataset and 91.63% on MNIST. These results
    establish a practical route toward scalable incoherent photonic computing systems
    with native bipolar processing capability.
- title: A unified resource-pool architecture for high-dimensional direct-detection
    optical communication
  date: 2026-06
  url: https://arxiv.org/abs/2606.20004v1
  category: optical-computing
  subcategory: method
  authors:
  - Jingze Liu
  - Zhijuan Gu
  - Xinyang Yu
  - Ziwen Zhou
  - Zhuyixiao Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Increasing optical communication capacity without proportionally increasing
    receiver complexity remains a key challenge for direct-detection links. Conventional
    systems typically assign wavelength, polarization and intensity to fixed, separately
    recovered functions, so that alphabet expansion is accompanied by additional demultiplexing,
    polarization handling, receiver branches and electronic processing. Here we introduce
    a unified resource-pool architecture for high-dimensional direct-detection optical
    communication, in which wavelength, polarization and intensity are jointly organized
    as a composite optical symbol space and recovered through optical-domain joint
    projection rather than dimension-by-dimension separation. The receiver is implemented
    with an integrated disordered photonic processor that transforms each composite
    optical state into a reproducible multi-output electrical fingerprint for single-shot
    direct recovery. In a dual-wavelength transmission experiment, the system resolves
    4096 composite symbols, corresponding to 12 bits per symbol slot, with a bit error
    rate of 4.25e-4 after 10 km standard-fiber transmission. Additional experiments
    demonstrate dense polarization alphabets, wavelength-indexed state-space expansion
    and high-launch-power operation over hollow-core fiber. These results establish
    disorder-enabled joint projection in an integrated photonic processor as a route
    to hardware-efficient high-dimensional direct-detection communication beyond conventional
    dimension-partitioned receiver architecture.
- title: Real-Time Dynamic Crosstalk Tracking and Compensation via Photonic Blind
    Source Separation
  date: 2026-08
  url: https://arxiv.org/abs/2608.06986v1
  category: optical-computing
  subcategory: method
  authors:
  - Dongliang Wang
  - Yikun Nie
  - Dingqian Zhao
  - Dan Yi
  - Gaolei Hu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Space-division multiplexing in few-mode fibers can substantially increase
    optical-link capacity, but its practical deployment is hindered by dynamically
    varying inter-modal crosstalk induced by environmental perturbations. Although
    silicon photonic reconfigurable mode processors have been widely demonstrated,
    continuous adaptation during high-speed intensity-modulation direct-detection
    (IM/DD) transmission remains challenging. Here, we experimentally demonstrate
    real-time tracking and compensation of dynamically varying inter-modal crosstalk
    using a hybrid photonic--electronic framework that combines an integrated silicon
    photonic processor with an FPGA-based control backend. The photonic processor
    performs signal separation in the optical domain, while the FPGA extracts signal
    statistics and implements a blind source separation (BSS)-based feedback algorithm
    without requiring dedicated training sequences. A two-stage optimization strategy
    combines rapid crosstalk suppression with stable continuous tracking under dynamic
    channel variations. We demonstrate photonic blind source separation for signals
    up to 100 GBaud and FPGA-enabled continuous adaptation for two 64 GBaud data channels
    in a few-mode-fiber transmission system. The system maintains bit-error rates
    below $10^{-4}$ under dynamic crosstalk, with a per-update control latency of
    4 ms. These results establish a practical route toward low-latency, hardware-efficient
    adaptive photonic front ends for dynamic high-speed IM/DD space-division-multiplexed
    links.
- title: Scalable Photonic Neural Networks via Surrogate Scattering-Matrix Inverse
    Design
  date: 2026-04
  url: https://arxiv.org/abs/2604.21301v1
  category: optical-computing
  subcategory: method
  authors:
  - Azka Maula Iskandar Muda
  - Uğur Teğin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Inverse-designed nanophotonic media are a promising platform for compact
    optical neural networks, but training them end to end is expensive because each
    adjoint iteration couples the full-wave solver to the dataset minibatch, so the
    number of electromagnetic simulations scales with both the network depth and the
    batch size. We introduce a two-stage surrogate workflow that decouples task learning
    from electromagnetic realization. In the first stage, the trainable optical block
    is represented as a passive complex matrix with bounded singular values and the
    classification task is solved directly in matrix space at negligible cost. In
    the second stage, the selected target operator is transferred to a fabrication-aware
    freeform device through an adjoint problem driven by a Frobenius-norm transmission
    residual and a reflection penalty, which removes the minibatch dependence from
    the full-wave loop and yields a smoother loss landscape than intensity-domain
    cross-entropy. We further introduce a banded-router architecture composed with
    a fixed evanescent-coupling region, which exploits the bandwidth-additive property
    of matrix products to realize dense effective operators within a design region
    roughly half as long as a fully local router would require. The framework is validated
    on three tasks. On MedMNIST, the realized all-optical classifier reproduces the
    surrogate accuracy within $0.6$ percentage points after only 20 adjoint epochs.
    On RSSCN7, the banded router plus evanescent stage improves test accuracy by more
    than 15 percentage points over a linear readout baseline. A Yin-Yang task confirms
    that the same framework supports nonlinear decision boundaries. These results
    indicate that surrogate-guided inverse design is a practical route to training
    compact photonic processors with simulation budgets orders of magnitude smaller
    than direct geometry-to-task pipelines.
- title: 'ReDON: Recurrent Diffractive Optical Neural Processor with Reconfigurable
    Self-Modulated Nonlinearity'
  date: 2026-02
  url: https://arxiv.org/abs/2602.23616v3
  category: optical-computing
  subcategory: method
  authors:
  - Ziang Yin
  - Qi Jing
  - Raktim Sarma
  - Rena Huang
  - Yu Yao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diffractive optical neural networks (DONNs) have demonstrated unparalleled
    energy efficiency and parallelism by processing information directly in the optical
    domain. However, their computational expressivity is constrained by static, passive
    diffractive phase masks that lack efficient nonlinear responses and reprogrammability.
    To address these limitations, we introduce the Recurrent Diffractive Optical Neural
    Processor (ReDON), a novel architecture featuring reconfigurable, recurrent self-modulated
    nonlinearity. This mechanism enables dynamic, input-dependent optical transmission
    through in-situ electro-optic self-modulation, providing a highly efficient and
    reprogrammable approach to optical computation. Inspired by the gated linear unit
    (GLU) used in large language models, ReDON senses a fraction of the propagating
    optical field and modulates its phase or intensity via a lightweight parametric
    function, enabling effective nonlinearity with minimal inference overhead. As
    a non-von Neumann architecture in which the primary weighting elements (metasurfaces)
    remain fixed, ReDON substantially extends the nonlinear representational capacity
    and task adaptability of conventional DONNs through recurrent optical hardware
    reuse and dynamically tunable nonlinearity. We systematically investigate various
    self-modulation configurations to characterize the trade-offs between hardware
    efficiency and computational expressivity. On image recognition and segmentation
    benchmarks, ReDON improves test accuracy and mean intersection-over-union (mIoU)
    by up to 20% compared with prior DONNs employing either optical or digital nonlinearities
    at comparable model complexity and negligible additional power consumption. This
    work establishes a new paradigm for reconfigurable nonlinear optical computing,
    uniting recurrence and self-modulation within non-von Neumann analog processors.
- title: Multi-channel Optical Vision Model
  date: 2026-06
  url: https://arxiv.org/abs/2606.10253v1
  category: optical-computing
  subcategory: method
  authors:
  - Ali Momeni
  - Guillaume Noetinger
  - Tim Tuuva
  - Romain Fleury
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spatial multiplexing is one of the natural strengths of optics, yet in
    optical neural networks, it is often used mainly as parallel throughput. Here,
    we show that spatial multiplexing in an optical neural network can be used not
    only to process multiple inputs in parallel, but also to define a trainable representational
    coordinate of the model. In three implemented scenarios, parallel-input processing,
    class-code readout and channel-mixed feature interaction, spatial channels act
    as independent learners, structured code dimensions, and interacting feature groups.
    The programmable free-space optical processor is trained through an online physical-forward/surrogate-backward
    scheme, where measured optical outputs define the forward pass while a differentiable
    surrogate estimates gradients and is continually fine-tuned during training from
    newly acquired optical data. We demonstrate these channel roles in image classification
    and regression tasks using multi-layer architectures with more than one million
    trainable optical phase parameters. We further implement a hybrid optical-electronic
    vision-language model, in which the optical neural network provides visual tokens
    to a digital transformer decoder for controlled image-captioning tasks. These
    results establish spatially multiplexed optical channels as a programmable feature
    and readout space for hybrid optical vision models.
- title: Programmable Non-Hermitian Synchronization of Light on a Silicon Photonic
    Processor
  date: 2026-05
  url: https://arxiv.org/abs/2605.14653v1
  category: optical-computing
  subcategory: method
  authors:
  - Ze-Sheng Xu
  - Nan Cheng
  - Mohammed S. Elmusrati
  - Rohan Yadgirkar
  - Andrea Cataldo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Synchronization is a pervasive collective phenomenon underlying the firing
    of neurons, the beating of the heart, and the coherent emission of lasers. Across
    these systems, dissipation plays an organizing role, suppressing microscopic differences
    and steering coupled units toward a common macroscopic order. Here we harness
    engineered non-Hermitian dissipation to synchronize light directly in the optical
    domain. Implementing non Hermitian transition matrices on a silicon photonic processor,
    we drive arbitrary multimode optical fields toward a unique collective state with
    equal modal intensities and a globally locked phase, a process we call dissipation-induced
    phase synchronization. The synchronization rate and total optical power throughput
    are independently programmable, enabling control over the dissipative dynamics
    without compromising reconfigurability. These results recast dissipation as a
    functional resource and open a route to reconfigurable on-chip synchronization
    for classical and quantum photonic technologies.
- title: The thin line for optical neural networks towards broad practical relevance
  date: 2026-05
  url: https://arxiv.org/abs/2605.18178v1
  category: optical-computing
  subcategory: method
  authors:
  - Anas Skalli
  - Daniel Brunner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical neural networks promise unmatched efficiency, bandwidth, and latency,
    critical benefits as demand for neural network hardware surges. However, their
    practical value for general-purpose acceleration or specialized applications must
    be proven under application-realistic conditions. We discuss recent insights and
    outline key research priorities.
- title: Hybrid Integration of Quantum Dot Single Photon Sources with Lithium Tantalate
    Photonics for On Chip Routing
  date: 2026-03
  url: https://arxiv.org/abs/2603.12643v1
  category: optical-computing
  subcategory: method
  authors:
  - Kaili Xiong
  - Defeng Shan
  - Xueshi Li
  - Ziliang Ruan
  - Bin Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A promising pathway towards scalable quantum photonic processors involves
    the simultaneous integration of deterministic single-photon sources, low-loss
    photonic circuitry, and fast reconfigurability. Thin-film lithium tantalate on
    insulator (LTOI) offers an exceptional electro-optic response and low optical
    loss at 900 nm wavelength band, yet its lack of efficient quantum emitters has
    hindered progress toward fully integrated quantum technologies. Here, we demonstrate
    heterogeneous integration of indium arsenide quantum dots (QDs) with low-loss
    reconfigurable LTOI waveguides using micro-transfer printing. By directly butt-coupling
    tapered gallium arsenide waveguides with inversely tapered LTOI waveguides, we
    achieve robust and alignment-tolerant inter-waveguide coupling. The hybrid chip
    operates at cryogenic temperatures, enabling deterministic routing of successively
    emitted single photons from the QDs with a halfwave voltage-length product, confirming
    the cryogenic stability of LTOI's electro-optic coefficient. These results establish
    the first demonstration of high-speed on-chip routing of single photons with hybrid
    QD-LTOI circuits, providing a scalable pathway toward integrated quantum photonic
    processors.
- title: Noise in analog programmable-photonic computation
  date: 2026-04
  url: https://arxiv.org/abs/2604.24541v1
  category: optical-computing
  subcategory: method
  authors:
  - Raúl López-March
  - Andrés Macho-Ortiz
  - Francisco Javier Fraile-Peláez
  - José Capmany
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Analog Programmable-Photonic Computation (APC) leverages programmable
    integrated photonics (PIP) to perform high-speed matrix operations using optical
    waves. However, the continuous nature of optical waves that implement the analog
    bits or anbits - the fundamental unit of information in APC - makes computational
    results intrinsically sensitive to physical noise. Here, we establish and experimentally
    validate a comprehensive noise analysis in APC platforms using the geometric representation
    of the anbit in the Generalized Bloch Sphere (GBS). By modeling the physical noise
    sources in PIP circuits as random photocurrent fluctuations at the output of the
    opto-electrical (O/E) converter, and using error propagation theory, the noise
    statistics can be projected onto the GBS. This approach leads to specific noise
    maps in the GBS for each noise source, enabling the identification of the dominant
    noise sources within the APC system. Analytical predictions are numerically and
    experimentally validated on a fabricated silicon PIP chip. Beyond statistical
    characterization of system noise, the proposed model provides quantitative design
    criteria for noise-adapted analog constellations in the GBS, advancing APC towards
    scalable and robust optical computing systems, with potential applications in
    emerging paradigms such as photonic neuromorphic computing.
- title: 'Silicon Photonics Testing: Design for Testability, Fault Detection, and
    Manufacturing Variation Analysis in Photonic Integrated Circuits'
  date: 2026-06
  url: https://arxiv.org/abs/2606.08885v1
  category: optical-computing
  subcategory: method
  authors:
  - Pratishtha Agnihotri
  - Priyank Kalla
  - Steve Blair
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper proposes a design-for-test (DFT) methodology and architecture
    for testing and validation of silicon photonic integrated circuits. We describe
    the design of silicon photonic circuits and components that comprise the proposed
    DFT architecture. The designs are extensively simulated and validated as test-access
    and fault-detection circuitry. We demonstrate how the DFT approach can be deployed
    on photonic integrated circuits and how they can be tested for correct operation,
    in terms of signal power and phase. The application is demonstrated on two distinct
    types of designs -- an optical neural network comprising optical devices in a
    feed-forward topology, and on an optical logic circuit with feedback loops.
- title: Local Variance-Based Calibration of Programmable Photonic Interferometer
    Meshes
  date: 2026-07
  url: https://arxiv.org/abs/2607.14759v1
  category: optical-computing
  subcategory: method
  authors:
  - Gökhan Elmas
  - Igor A. Litvin
  - Janis Nötzel
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Programmable photonic interferometer meshes enable reconfigurable linear
    optical transformations, but their performance depends critically on accurate
    calibration of Mach-Zehnder interferometers and phase shifters. Conventional methods
    often require node isolation, dedicated routing paths, orthogonal training states,
    reference channels, or prior phase-voltage characterization, which become increasingly
    difficult in large thermally tuned meshes. We introduce a local variance-based
    self-calibration method using intensity-only measurements. Controlled phase perturbations
    are applied, and calibration points are identified from minima of the measured
    output-power variance. For Mach-Zehnder interferometers, the variance follows
    a characteristic |sin(theta)| dependence, allowing bar and cross operating points
    to be found without conventional node isolation. For phase shifters, balanced
    interference produces a complementary |cos(phi)| variance signature, enabling
    quadrature calibration through the same statistical principle. We validate the
    method experimentally on an 8 x 8 silicon nitride programmable photonic processor
    using a fully automated two-stage procedure. Starting from random phase settings,
    all Mach-Zehnder interferometers are calibrated first, followed by phase-shifter
    calibration under balanced-interference conditions. As a system-level test, we
    implement an embedded 4 x 4 Hadamard transformation on the 8 x 8 processor using
    a Clements decomposition. These results establish local output variance as a simple
    calibration observable for programmable photonic meshes. The method is compatible
    with discrete random phase ensembles and requires neither conventional node isolation
    nor orthogonal training fields, making it a practical calibration primitive for
    scalable self-stabilizing photonic processors.
- title: 'Beyond white- and black-box modeling tools in optical communications and
    optical computing: physics-informed data-driven modeling'
  date: 2026-07
  url: https://arxiv.org/abs/2607.07274v1
  category: optical-computing
  subcategory: method
  authors:
  - Isidora Teofilovic
  - Sergio Hernandez Fernandez
  - Metodi P. Yankov
  - Christophe Peucheret
  - Darko Zibar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Efficient optimization and control of photonic computing and communication
    systems increasingly rely on accurate surrogate models/digital twins. While data-driven
    models may achieve faster inference than traditional physics-based methods, they
    typically suffer from poor training data efficiency and limited generalizability.
    To address this trade-off, physics-informed data-driven modeling has emerged as
    a powerful hybrid paradigm. This paper presents a comparative analysis of these
    three modeling paradigms across three benchmark use cases: optical amplifiers,
    directly modulated lasers, and interferometer meshes. By evaluating model complexity,
    data efficiency, generalizability, and modularity, this work provides a detailed
    analysis of the respective trade-offs and highlights the advantages of combining
    physical insight with data-driven learning.'
- title: Phase-Drift Limits and Adaptive Quadrature Readout in Programmable Photonic
    Processors
  date: 2026-08
  url: https://arxiv.org/abs/2608.02249v2
  category: optical-computing
  subcategory: method
  authors:
  - Gökhan Elmas
  - Igor A. Litvin
  - Janis Nötzel
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Phase fluctuations between optical inputs limit programmable photonic
    processors because their output powers depend on coherent interference. We study
    the phase-drift penalty that arises when sine and cosine quadratures are measured
    sequentially rather than simultaneously. The analysis is motivated by measurements
    from an eight-mode programmable photonic processor, including 35 free-running
    recordings of 300 s acquired at approximately 125 samples per second per channel.
    These recordings provide an empirical route for estimating the phase-increment
    variance at a selected reconfiguration interval. The estimate is defined at the
    time of the second measurement. For fixed quadrature order, perturbation of the
    atan2 reconstruction gives $e_{C\to S}=-δ_τ\sin^2φ_0+O(δ_τ^2)$ and $e_{S\to C}=-δ_τ\cos^2φ_0+O(δ_τ^2)$.
    Writing $Q_τ=\operatorname{Var}(δ_τ)$, uniform phase averaging gives the first-order
    drift mean-square error $3Q_τ/8$. A phase-predicted ordering rule measures the
    locally less informative quadrature first and the more informative quadrature
    second. Its uniform first-order penalty is $(3/8-1/π)Q_τ$, which is 84.9 percent
    below the fixed-order value. We also derive an increment-aware estimator from
    a local state-space model. Marginalizing the unknown phase increment increases
    the variance of a stale phase observation by $Q_τ$, reducing its Fisher information
    from $I$ to $I/(1+IQ_τ)$. For ideal balanced Poisson detection, the Fisher information
    of each quadrature equals its detected signal-photon number. This yields dimensionless
    architecture boundaries in spatial information and phase-increment variance. Nonlinear
    Monte Carlo simulations validate the perturbative laws, quantify robustness to
    prediction error, and compare simultaneous, fixed-order, increment-aware, and
    adaptive receivers under a common noise model.
- title: Phase singularity enabled polarization switchable analog spatial differentiation
    in an atomic MoS$_2$ planar Fabry-Pérot cavity
  date: 2026-07
  url: https://arxiv.org/abs/2607.21104v1
  category: optical-computing
  subcategory: method
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reconfigurable analog optical computing requires rapid and efficient switching
    between core mathematical operations, such as first- and second-order spatial
    differentiation. Here, we demonstrate a monolayer MoS$_2$ integrated a planar
    Fabry-Pérot (F-P) cavity that performs polarization switchable analog spatial
    differentiation under oblique incidence. By exploiting polarization dependent
    phase singularities, the device satisfies distinct optical transfer functions
    for different-order differentiation at the same operating condition. As a result,
    first-order and second-order derivatives of input images are experimentally realized
    by simply switching the incident polarization. These results establish the planar
    cavity as a compact reconfigurable spatial differentiator, whose computational
    order is controlled solely by light polarization. This approach provides a fast,
    convenient, and integration friendly strategy for tunable optical computing, and
    enables polarization switchable edge detection for image processing, with potential
    applications in real-time object recognition, feature extraction, and optical
    data compression.
- title: Characterization of nested Walsh parity-check filters in a single-photon
    eight-mode register on a cloud photonic processor
  date: 2026-06
  url: https://arxiv.org/abs/2606.18408v2
  category: optical-computing
  subcategory: method
  authors:
  - Emma Tully
  - Jonathan Washburn
  - Megan Simons
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We characterize two nested Walsh parity-check filters implemented on
    Quandela''s Belenos cloud photonic processor in a single-photon eight-mode spatial
    register. The modes are indexed by the vertices of the cube $Q_3$. The filters
    realize the classical $[8,7,2]$ single-parity-check code, the zero-sum neutral
    subspace $\mathcal{N}$ and the $[8,4,4]$ extended Hamming code, the parity-checked
    subspace $\mathcal{S}\subset\mathcal{N}$ with one DC and three face-parity syndrome
    channels. These are first-quantized path/mode encodings of classical codes: the
    experiment verifies leakage suppression and syndrome routing, not error correction
    or protection against photon loss, and all probabilities are conditional on postselected
    single-photon detections. Across more than 340,000 detections, neutral inputs
    show residual DC-port leakage of $0.02\%$-$1.1\%$ (mean $0.6\%$), corresponding
    to $\approx21\times$ suppression relative to the ideal $0.125$ DC-capture baseline
    and $31.6\times$ relative to the measured non-neutral control. Injected DC contamination
    gives a monotonic soft error signal, and the three face-parity syndrome channels
    route to their predicted ports with $94$-$99\%$ selectivity. A sector-preserving
    unitary core keeps leakage far below non-neutral controls over one to three applications,
    with differences dominated by calibration and compilation systematics rather than
    gate-cycle physics. We quantify these limits, including fixed-pattern separator
    bias, $\pm 0.02$ calibration offsets, and compilation scatter near the $10^{-3}$
    leakage level, and report a Hong-Ou-Mandel degradation episode in which suppression
    vanished and recovered after recalibration.'
- title: 18-dB on-chip vacuum squeezing in an adaptively poled lithium niobate waveguide
  date: 2026-05
  url: https://arxiv.org/abs/2605.27607v1
  category: optical-computing
  subcategory: method
  authors:
  - Tushar Sanjay Karnik
  - Xinyi Ren
  - Chun-Ho Lee
  - Bo-Han Wu
  - Mihir Chaudhari
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum squeezed states of light can enhance measurement sensitivity beyond
    classical limits and enable quantum information processing, but scalable low-loss
    sources remain challenging. We demonstrate continuous-wave quantum squeezing on
    a chip, achieving 18 dB of squeezing and 20 dB of anti-squeezing at 1570 nm in
    a 1.6-cm traveling-wave adaptively poled thin-film lithium niobate waveguide.
    A distributed model independently determines facet losses, phase noise, and nonlinear
    interaction strength without prior assumptions, enabling rigorous inference of
    on-chip performance. We estimate a 95% confidence interval of [-18.96, -17.25]
    dB squeezing and [19.96, 21.35] dB anti-squeezing. These values represent the
    highest squeezing reported for any integrated photonic platform and the first
    assumption-free statistical validation of integrated squeezing performance. Our
    results establish thin-film lithium niobate as a high-performance, scalable platform
    for continuous-variable quantum sensing, communications, and photonic computing.
- title: All-optical control of nonlinear emission from resonant metasurfaces
  date: 2026-04
  url: https://arxiv.org/abs/2604.03830v1
  category: optical-computing
  subcategory: method
  authors:
  - Ziwei Yang
  - Lei Xu
  - Gabriel Sanderson
  - Akhshay Bhadwal
  - Luyao Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Nonlinear optics underpins a broad range of photonic technologies, from
    classical and quantum light sources to emerging nonlinear photonic neural networks.
    Yet, conventional nonlinear optical devices exhibit static functionality: their
    transfer characteristics and emission profiles are dictated by the intrinsic nonlinear
    process and locked by fabrication, limiting adaptability. Here, we introduce an
    ultra-thin metasurface platform that enables dynamic reconfiguration of nonlinear
    functionality in a contact-less fashion. By leveraging all-optical control of
    the optical torque exerted on liquid crystal molecules infiltrating a resonant
    metasurface, we achieve tunable polynomial nonlinear transfer functions based
    on third-harmonic generation process. This mechanism further allows real-time
    modulation of nonlinear weighting across different diffraction orders, revealing
    a previously unexplored interplay between mode structure and nonlinear emission.
    Our approach opens up a pathway toward field-programmable nonlinear photonic systems,
    offering unprecedented flexibility for reconfigurable nonlinear signal processing
    and adaptive photonic computing.'
- title: Programmable recirculating bricks mesh architecture for quantum photonics
  date: 2026-04
  url: https://arxiv.org/abs/2604.01369v1
  category: optical-computing
  subcategory: method
  authors:
  - Jacek Gosciniak
  venue: ''
  code_url: ''
  project_url: ''
  abstract: General-purpose programmable photonic processors offer a flexible foundation
    for integrating various functionalities within a single chip. A two-dimensional
    hexagonal waveguide mesh of Mach Zehnder interferometers has been shown to have
    great potential in the field of microwave photonics. Additionally, they are a
    promising platform for the creation of unitary linear transformations, which are
    key elements in photonic neural networks, In this article, we expand the portfolio
    of available applications for recirculating bricks mesh architecture to quantum
    technologies. We will show that a single programmable optical system is capable
    of performing various functions depending on the requirements. In particular,
    we will focus in this work on boson sampling, a task that best demonstrates quantum
    advantage, as well as on tasks that enable the determination of photon indistinguishability,
    which plays a key role in photonic quantum technologies. We will also show that,
    in addition to spatial modes, the same optical system can be equally well-suited
    for work on temporal modes through the implementation of an appropriate number
    of loops.
- title: Transition from Statistical to Hardware-Limited Scaling in Photonic Quantum
    State Reconstruction
  date: 2026-03
  url: https://arxiv.org/abs/2603.12235v2
  category: optical-computing
  subcategory: method
  authors:
  - Attila Baumann
  - Zsolt Kis
  - János Koltai
  - Gábor Vattay
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The theoretical efficiency of classical shadow tomography is predicated
    on a perfect Haar-random unitary ensemble, yet this mathematical ideal remains
    physically unattainable in near-term hardware. Here, we report the experimental
    discovery of a fundamental accuracy bound on integrated photonic processors: a
    ``Hardware Horizon'''' where the reconstruction error undergoes a sharp phase
    transition. While the error initially obeys the predicted statistical scaling
    $\mathcal{O}(M^{-1/2})$, it abruptly saturates at a floor determined by the spectral
    distortions of the realized unitary group. By deriving a phenomenological error
    model, we decouple the competing mechanisms of static coherent spectral distortion
    and dynamic decoherence, demonstrating that this intrinsic noise floor imposes
    a hard bound that statistical accumulation cannot overcome. These findings establish
    that the utility of shadow tomography on NISQ (noisy intermediate-scale quantum)
    hardware is defined by a specific scaling law involving hardware parameters, necessitating
    active compensation strategies to bridge the gap between theoretical purity and
    the noisy reality of integrated photonics.'
- title: 'TRON: Trainable, architecture-reconfigurable random optical neural networks'
  date: 2026-04
  url: https://arxiv.org/abs/2604.16228v2
  category: optical-computing
  subcategory: method
  authors:
  - Ziao Wang
  - Fei Xia
  - Logan G. Wright
  - Tatsuhiro Onodera
  - Martin Stein
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deep learning has triggered explosive growth in the demand for specialized
    hardware processors, thus motivating the development of scalable and reconfigurable
    computing substrates. Optical processors offer a fundamentally different computing
    paradigm, combining massive parallelism and ultrahigh bandwidth with the potential
    for substantial energy savings. However, progress has been constrained by the
    absence of scalable and reconfigurable architectures that can implement a broad
    class of network architectures. Here, we introduce TRON, a scalable and trainable
    optoelectronic deep optical neural network that exploits a multi-scattering medium
    and a DMD as a learnable, high-dimensional dense optical matrix multiplier, processing
    with fixed and tunable optical operations. We perform in-situ optimization of
    the optical parameters involved in the scattering process, together with automated
    neural architecture search (NAS) and optimization directly on optics. The experimental
    results demonstrate that in-situ NAS is essential to discover architectures that
    adapt to both the task and hardware constraints, establishing a viable path towards
    large-scale optical processors for next-generation machine learning and data-intensive
    computing.
- title: General-Purpose Nonlinear Function Approximation via Linear Integrated Photonics
  date: 2026-06
  url: https://arxiv.org/abs/2606.23159v1
  category: optical-computing
  subcategory: method
  authors:
  - Ayana Mizuno
  - Isamu Takai
  - Makoto Nakai
  - Atsutaka Miyamichi
  - Ryuichi Konishi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic computing has emerged as a promising platform for accelerating
    artificial intelligence workloads by enabling low-latency and energy-efficient
    linear operations such as vector-matrix multiplication. However, scalable on-chip
    high-order nonlinear processing remains challenging, limiting the functional versatility
    of current photonic hardware. Here, we present an optoelectronic approach for
    approximating high-order and high-dimensional nonlinear functions. The key to
    this approach lies in optical random Fourier feature mapping, which transforms
    nonlinear function evaluation into an equivalent linear computation. This approach
    enables nonlinear computing within a linear photonic framework, eliminating the
    need for complex optical nonlinear or active materials while preserving scalability
    and computational throughput in a simple silicon photonic circuit. We experimentally
    demonstrate a broad class of nonlinear functions, including tenth-order Legendre
    polynomials, computationally demanding special functions (Voigt, Fermi-Dirac,
    and Fresnel), neural-network activation functions, two-dimensional nonlinear functions,
    and a 10-dimensional softmax layer. This work establishes a general and scalable
    strategy for nonlinear computing in photonic integrated hardware and opens a pathway
    toward fully functional optical accelerators for next-generation computing systems.
- title: Edge-Enhanced Diffractive Neural Networks Based on Spin-Multiplexed Nonlocal
    Metasurfaces
  date: 2026-06
  url: https://arxiv.org/abs/2606.16938v1
  category: optical-computing
  subcategory: method
  authors:
  - Qianqian He
  - Kenan Guo
  - Jumin Qiu
  - Shuyuan Xiao
  - Tingting Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Single-layer diffractive neural networks often face classification accuracy
    bottlenecks due to limited wavefront modulation capabilities. Edge detection,
    as an optical image processing technique, extracts image contours and offers a
    promising way to simplify classification tasks. However, integrating edge detection
    and DNN-based classification on a single chip remains a challenge. Here, we propose
    an integrated nonlocal meta-platform that achieves all-optical edge detection
    and DNN-based classification via spin-multiplexing. By exploiting the dispersion
    properties of the nonlocal Huygens' metasurface, the co-polarized component in
    the output light performs momentum-space filtering for real-time edge detection.
    The cross-polarized component undergoes geometric phase modulation to execute
    image classification within the DNN. We couple quasi-bound states in the continuum
    and magnetic dipole resonances in crescent-shaped nanopillars, achieving a high
    polarization conversion efficiency of approximately $55\%$. This edge-enhanced
    DNN architecture significantly reduces data redundancy, elevating the classification
    accuracy of the single-layer network on the MNIST dataset from $64.2\%$ to $80.7\%$.
    Our work provides a compact, high-efficiency solution for integrated all-optical
    machine vision and intelligent photonic computing.
- title: Multi-channel high-speed flip-chip packaging platform for thin-film lithium
    niobate photonic circuits
  date: 2026-06
  url: https://arxiv.org/abs/2606.15391v1
  category: optical-computing
  subcategory: method
  authors:
  - Zhenzheng Wang
  - Xiangzhi Xie
  - Yikun Chen
  - Yifan Wu
  - Zeyu Luo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: To address the urgent need for multi-channel high-speed electrical interfacing
    of thin-film lithium niobate (TFLN) photonic circuits, we realize a flip-chip
    packaging platform capable of simultaneously delivering 13 high-speed and 32 low-speed
    electronic signals to a centimeter-sized TFLN chip. The platform exhibits low
    flip-chip bonding loss and low inter-channel crosstalk over a broad bandwidth
    up to 50 GHz. Leveraging this packaging platform, we demonstrate high-speed electrical
    interfacing with two proof-of-concept TFLN photonic circuits, namely a 2x8 optical
    switch and an electro-optic comb-based transmitter. The switch achieves arbitrary
    8-channel routing with ~3 dB insertion loss, &lt; -20 dB crosstalk, and an equipment-limited
    switching time of &lt;= 34 ps. The transmitter circuit includes a 50 GHz electro-optic
    comb generator with 2.8-dB flatness, a tunable microring to arbitrarily filter
    one comb line, and a modulator for data transmission at 20 Gbit/s. The packaging
    platform could significantly advance large-scale TFLN circuits in optical communications,
    microwave photonics, and photonic computing.
- title: Programmable recirculating bricks mesh architecture for photonic neural networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.18160v1
  category: optical-computing
  subcategory: method
  authors:
  - Jacek Gosciniak
  venue: ''
  code_url: ''
  project_url: ''
  abstract: General-purpose programmable photonic processors are considered a crucial
    technology because they combine the ultra high-speed, massive bandwidth, and energy
    efficiency of light-based computing with the flexibility of software-defined hardware.
    Unlike application-specific photonic integrated circuits (ASPIC) designed for
    one task, these processors use reconfigurable waveguide meshes to implement various
    functions, such as switching, filtering, or AI computation, on a single chip,
    allowing for rapid prototyping and versatile, on-demand hardware redefinition.
    Here we report a recirculating bricks mesh architecture that can be easily implemented
    in photonic neural networks. It will be shown that a single programmable optical
    system is capable of performing various functions depending on the requirements.
    In particular, we will show that the same network, after being reprogrammed, can
    perform many different functions, ranging from a crossbar network to optical interference
    circuits with variable structures, which can then be subjected to Singular Value
    Decomposition. Furthermore, the "bricks" mesh serves as an excellent foundation
    for implementing a monitoring system capable of monitoring the power in each location
    of the circuit and, subsequently, sel-fcalibrating and stabilizing the circuit
    using a feedback loop.
- title: Implementation of distillation protocols using a recirculating bricks mesh
    network
  date: 2026-05
  url: https://arxiv.org/abs/2605.25911v1
  category: optical-computing
  subcategory: method
  authors:
  - Jacek Gosciniak
  venue: ''
  code_url: ''
  project_url: ''
  abstract: General-purpose programmable photonic processors provide a flexible foundation
    for integrating various functionalities within a single chip. A two-dimensional
    bricks waveguide mesh of Mach Zehnder interferometers has been demonstrated to
    possess considerable potential in the domain of photonic neural networks and quantum
    signal processing. In this article, we propose an expansion of the available applications
    of recirculating bricks mesh architecture to distillation protocols necessary
    for quantum signal processing. These protocols are essential for the heralding
    of the output of single photons, which is characterized by a reduced distinguishability
    error rate. The demonstration will be made of a single programmable optical system's
    ability to realize various distillation protocols with reduced computational resource
    costs. The present study will concentrate on cascaded quantum interferometers
    and Fourier transform-based schemes. It will demonstrate that the bricks mesh
    can implement such schemes, which are unattainable using feed-forward networks,
    without the need for complex out-of-plane integration. The propagation of the
    signal in any direction, along with the utilization of all ports as both input
    and output, facilitates the execution of such transformations with minimal optical
    depth of the circuit and in time scales shorter than the decoherence time.
- title: Octave bandwidth 3D-Printed Couplers for Low-Loss Thin-Film Lithium Tantalate
    Circuits
  date: 2026-06
  url: https://arxiv.org/abs/2606.16398v1
  category: optical-computing
  subcategory: method
  authors:
  - Erik Jung
  - Xinyu Ma
  - Jan Brandes
  - Caghan Ünlüer
  - Shabnam Taheriniya
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Low-loss, broadband photonic integrated circuits (PICs) are critical enablers
    for optical communications, photonic computing, and quantum applications. Lithium
    tantalate on insulator (LTOI) is an emerging photonic platform offering a wide
    transparency window and strong Pockels effect, and thereby enabling efficient
    electro-optic modulation and high data rates. Here, we present the first implementation
    of efficient out-of-plane polymer coupling interfaces fabricated via 3D direct
    laser writing for both fully etched strip and partially etched rib LTOI waveguides,
    achieving ultra-low coupling losses of 0.9 dB (strip) and 1.25 dB (rib) per interface.
    Both coupler types exhibit a 3 dB optical bandwidth spanning more than an octave
    from 850 nm to 1740 nm and maintain stable operation under 1 W optical input power.
    Combined with on-chip waveguides exhibiting propagation losses below 0.1 dB/cm,
    these characteristics represent a key step toward unlocking the full potential
    of LTOI for high-speed optical signal processing with an unprecedented degree
    of parallelism. In addition, the octave-spanning bandwidth enables efficient interfacing
    of both the fundamental and second-harmonic signals, making the platform highly
    attractive for second harmonic generation based quantum squeezing applications.
- title: Harnessing Photonics for Machine Intelligence
  date: 2026-04
  url: https://arxiv.org/abs/2604.10841v1
  category: optical-computing
  subcategory: method
  authors:
  - Hanqing Zhu
  - Shupeng Ning
  - Hongjian Zhou
  - Ziang Yin
  - Ray T. Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The exponential growth of machine-intelligence workloads is colliding
    with the power, memory, and interconnect limits of the post-Moore era, motivating
    compute substrates that scale beyond transistor density alone. Integrated photonics
    is emerging as a candidate for artificial intelligence (AI) acceleration by exploiting
    optical bandwidth and parallelism to reshape data movement and computation. This
    review reframes photonic computing from a circuits-and-systems perspective, moving
    beyond building-block progress toward cross-layer system analysis and full-stack
    design automation. We synthesize recent advances through a bottleneck-driven taxonomy
    that delineates the operating regimes and scaling trends where photonics can deliver
    end-to-end sustained benefits. A central theme is cross-layer co-design and workload-adaptive
    programmability to sustain high efficiency and versatility across evolving application
    domains at scale. We further argue that Electronic-Photonic Design Automation
    (EPDA) will be pivotal, enabling closed-loop co-optimization across simulation,
    inverse design, system modeling, and physical implementation. By charting a roadmap
    from laboratory prototypes to scalable, reproducible electronic-photonic ecosystems,
    this review aims to guide the CAS community toward an automated, system-centric
    era of photonic machine intelligence.
- title: Optical Neural Networks from Coherent Transient Dynamics in Waveguide QED
  date: 2026-05
  url: https://arxiv.org/abs/2605.17752v1
  category: optical-computing
  subcategory: method
  authors:
  - Jiande Cao
  - Yexiong Zeng
  - Franco Nori
  - Ze-Liang Xiang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical neural networks promise ultrafast, low-energy information processing
    by performing computation directly with photons. Current implementations, however,
    are largely restricted to steady-state operation and rely on high-latency electro-optical
    conversion for nonlinear activation. To address these limitations, we propose
    an all-optical fully connected neural network architecture in which the basic
    neuronal functions are realized by coherent transient quantum dynamics. Within
    this framework, phase-tunable nonlocal interference in a giant cavity implements
    programmable synaptic weights; an integrator operating in the bad cavity regime
    performs temporal summation by coherently combining sequential wavepackets; and
    transient Rabi dynamics of a driven two-level system provide nonlinear activation.
    Full-physics simulations demonstrate high classification accuracy on MNIST and
    colored-object recognition tasks. These results eliminate the optoelectronic activation
    bottleneck, reduce latency, and establish transient light-matter dynamics as a
    native physical resource for high-dimensional nonlinear information processing,
    paving the way toward fully optical neuromorphic computing.
- title: 'Information Processing Capacity of Stationary Physical Systems: Theory,
    Data-efficient Estimation Methods, and Photonic Demonstration'
  date: 2026-05
  url: https://arxiv.org/abs/2605.19152v2
  category: optical-computing
  subcategory: method
  authors:
  - Rahul Uma Ramachandran
  - Serge Massar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Physical computing systems provide a promising route toward hardware-native
    machine learning, but their computational capabilities remain difficult to characterize
    in a principled, task-independent, and data-efficient way. We extend the Information
    Processing Capacity (IPC) framework to stationary physical computing systems and
    establish several fundamental results: individual capacities are bounded between
    zero and one, their sum over a complete basis is bounded by the number of readouts,
    and noise strictly reduces this bound. We address the finite-sample estimation
    of IPC and derive the asymptotic form of the systematic positive bias affecting
    naive estimators. Building on these results, we introduce data-efficient estimation
    methods based on Richardson extrapolation and Sobol quasi-random sampling. We
    validate the framework experimentally using a photonic computing system based
    on picosecond laser pulses propagating through a nonlinear optical fibre. By varying
    the laser power and fibre length, we observe systematic shifts of the IPC distribution
    toward higher-order nonlinear capacities induced by the Kerr effect. Finally,
    we demonstrate that the total IPC strongly correlates with performance on benchmark
    machine-learning tasks and provides a reliable estimate of the effective dimensionality
    of the system. These results establish IPC as a practical bridge between the intrinsic
    dynamics of physical computing systems and their machine-learning performance.'
- title: Programmable pixel-mode linear interferometers using multi-plane light conversion
  date: 2026-03
  url: https://arxiv.org/abs/2603.15836v2
  category: optical-computing
  subcategory: method
  authors:
  - Mushkan Sureka
  - Itay Ozer
  - Wenhua He
  - Michael R. Grace
  - Chaohan Cui
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Programmable linear optical interferometers are a core primitive in optical
    signal processing, quantum information processing, and photonic computing. Existing
    photonic-integrated implementations realize arbitrary $M$-mode unitaries using
    Mach--Zehnder-interferometer meshes whose footprint and accumulated loss scale
    with $O(M^2)$ optical components. Here we analyze and experimentally demonstrate
    a programmable architecture for implementing linear optical transformations directly
    on spatially tiled free-space {\em pixel modes} using multi-plane light conversion
    (MPLC). In this architecture, $M$ spatial modes arranged on a transverse lattice
    undergo a unitary transformation and are mapped to $M$ output modes of identical
    geometry through a sequence of programmable phase masks separated by free-space
    propagation segments. Numerical simulations show that arbitrary $M$-mode unitaries
    can be compiled to a desired high fidelity using a number of phase planes that
    scales approximately linearly with $M$. Using a spatial-light-modulator-based
    MPLC, we experimentally demonstrate programmable interferometers acting on up
    to $16$ spatial pixel modes, including tunable beamsplitters, Hadamard unitaries,
    spatial permutations, and partial unitaries on select subsets of modes. These
    results establish MPLC-based pixel-mode interferometers as a promising architecture
    for programmable linear optics with applications in classical and quantum optical
    interconnects, photonic switching, and quantum information processing.
- title: 3D Photonic integration leveraging hybrid-confinement circuits
  date: 2026-05
  url: https://arxiv.org/abs/2605.24990v1
  category: optical-computing
  subcategory: method
  authors:
  - Kanhaya Sharma
  - Adrià Grabulosa
  - Erik Jung
  - Daniel Brunner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Three-dimensional (3D) photonic integration offers a pathway to overcome
    the fundamental scaling limitations of planar platforms by enabling enhanced routing
    flexibility for compact, low-loss, and highly interconnected photonic circuits.
    In this work, we fabricate 3D photonic circuits combining high-confinement air-clad
    waveguides for compact routing with low-confinement polymer-clad waveguides for
    robust single-mode operation within a monolithic platform. Efficient mode transition
    between polymer-clad and air-clad waveguides is demonstrated with a loss of 0.25
    dB per interface. We also realize compact, Euler S- and U-shaped bends with minimal
    bending radii of 10 $μ$m and losses as low as 0.5 dB and 0.4 dB, respectively,
    along with compact adiabatic air-clad splitters exhibiting a splitting loss of
    0.6~dB over a length of 52 $μ$m. Finally, full fabrication of a compact hybrid
    circuit is demonstrated, highlighting the feasibility and scalability of the approach.
    Our work represents a significant step in 3D photonic integration for applications
    including optical neural networks, photonic wire bonding and their potential for
    novel integrated photonic applications.
- title: Engineering Polarization Switching in VCSELs with Custom Aperture Shapes
  date: 2026-08
  url: https://arxiv.org/abs/2608.16597v1
  category: optical-computing
  subcategory: method
  authors:
  - Zifeng Yuan
  - Dewen Zhang
  - Hong-Lin Lin
  - Aaron Danner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We experimentally fabricate and measure vertical-cavity surface-emitting
    lasers (VCSELs) with custom aperture shapes, demonstrating predictable polarization
    control and switching, supporting their use in photonic computation schemes like
    Ising machines with polarization-based information encoding.
- title: 'PROPEL: A Memory-Driven, Adaptive Vector-Flow-Field Router with Process-Aware
    Waveguide Generation for Large-Scale Photonic Integrated Circuits'
  date: 2026-07
  url: https://arxiv.org/abs/2607.29543v1
  category: optical-computing
  subcategory: method
  authors:
  - A Abdur Rahman Akib
  - Eunso Shin
  - Jonathan Rogers
  - Jonathan Wierer
  - Stanley Cheung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits (PICs) are increasing in scale and routing
    complexity, driven by photonic computing, optical switching, programmable interferometer
    meshes, wavelength-routed optical networks-on-chip, and chip-to-chip optical interconnects.
    Manual waveguide planning becomes impractical as designs approach thousands of
    photonic components because routing must satisfy geometric, optical, electrical,
    and manufacturing constraints. This paper presents the Photonic Routing Optimization
    and Placement Engine (PROPEL), a memory-driven, native-accelerated adaptive vector-flow-field
    routing framework with process-aware waveguide generation for large-scale PIC
    design. PROPEL builds a routing kernel based on a bounded vector-flow-field algorithm
    and DRC validation. The same kernel supports passive optical routing, active optical-electrical
    routing, and topology-driven net assignment. C++ accelerates field and routing
    calculations, while Python performs detailed DRC replay, legality checking, route
    commitment, and GDSFactory-based geometry generation. Compared with state-of-the-art
    routing solutions, PROPEL is faster on 17 of 18 shared passive-routing cases,
    with a median speedup of 2.6x and a geometric-mean speedup of 2.5x, while maintaining
    zero design-rule violations. PROPEL also supports length, delay, and optical-path-length
    matching, process-map-aware waveguide generation, route-memory reuse, selective
    rip-up/reroute, and GDS-level legality replay. These capabilities address heterogeneous
    PIC layouts where optical, electrical, process, topology, matching, and manufacturability
    constraints must be handled together.
- title: Thermal stable nonlinear Raman-Nath diffraction and Cherenkov radiation in
    PPKTP crystals
  date: 2026-03
  url: https://arxiv.org/abs/2603.04927v1
  category: optical-computing
  subcategory: method
  authors:
  - Tao Xie
  - YangMing Liu
  - WenXin Zhu
  - XueShi Guo
  - RuiBo Jin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Nonlinear Raman-Nath diffraction (NRND) and nonlinear Cherenkov radiation
    (NCR) are significant nonlinear diffraction phenomena in optics. Previous studies
    have primarily focused on NRND and NCR in uniaxial crystals, particularly in periodically
    poled lithium niobate (PPLN) crystals. However, research on these phenomena in
    biaxial crystals, such as periodically poled potassium titanyl phosphate (PPKTP),
    has been limited, and the study of NCR in PPKTP has not yet been undertaken.In
    this work, we experimentally investigated NRND and NCR phenomena in PPKTP crystals
    under varying incident angles, pump polarizations, poling periods, and crystal
    temperatures. Our findings indicate that PPKTP exhibits over ten times greater
    thermal stability compared to PPLN. This high thermal stability is promising for
    applications in parallel optical computing, as it helps reduce optical mode deviations
    and minimize bit error rates.
- title: Photonic Extreme Learning Machines using Event-Based detection
  date: 2026-07
  url: https://arxiv.org/abs/2607.03975v1
  category: optical-computing
  subcategory: method
  authors:
  - Vicente Rocha
  - Tomas Lopes
  - Joana Teixeira
  - Tiago Ferreira
  - Catarina Monteiro
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Photonic extreme learning machines use random optical propagation, detection
    nonlinearity, and a trained linear readout for energy-efficient and scalable optical
    computing. However, conventional intensity readout with CCD or CMOS cameras constrain
    the dimensionality of the hidden representation space. Here, we experimentally
    replace intensity detection with event-based camera, whose thresholded log-intensity
    response provides alternative pixel-wise hidden representations: first-event time,
    binary activation, and event count. In nonlinear two spiral classification task
    we obtain accuracies of $93\pm 3\%$ with strong intrinsic generalization, and
    comparable ridge and pseudo-inverse performance indicating sample-limited effective
    dimensionality. Regression results reveal sensitivity to systematic optical-intensity
    drift, identifying stability requirements for future event-based PELMs. These
    results establish event-based detection as a route toward richer photonic hidden
    representations while clarifying current limitations.'
- title: 'Beyond the Thin-Layer Limit: Differentiable Volumetric Training for Visible-Range
    Diffractive Neural Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07896v1
  category: optical-computing
  subcategory: method
  authors:
  - Dineth Jayakody
  - Dushan N. Wadduwage
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diffractive deep neural networks (D2NNs) promise miniaturized, power-efficient,
    light-speed optical front-ends for machine vision, yet the most mature demonstrations
    remain in the terahertz regime, built from readily fabricated millimeter-scale
    neurons. Translating D2NNs to the visible range, where nearly all vision pipelines
    operate, was long blamed on the difficulty of fabricating nanoscale neurons; but
    even after recent advances removed that barrier, visible-range D2NNs matching
    their terahertz counterparts remain out of reach. We identify the true obstacle
    as the thin-layer approximation underlying nearly all D2NN training, which treats
    each diffractive layer as an infinitely thin mask. It fails not because of the
    short wavelength, as is commonly assumed, but because the low-refractive-index
    materials (n approximately 1.3-1.5) used at visible wavelengths require relief
    structures thick enough that intra-layer diffraction and phase accumulation become
    significant. To overcome this, we introduce a differentiable beam-propagation
    ($\partial$BPM) layer that models each element as a finite-thickness volume and
    propagates light through it during training, keeping the fabrication-compatible
    height map end-to-end trainable without full-wave simulation in the loop. Across
    MNIST, Fashion-MNIST, and CIFAR-100 classification and imaging, $\partial$BPM
    training substantially reduces the design-to-device mismatch, and full-wave FDTD
    validation raises classification accuracy from 50% to 90% without re-optimization.
    The $\partial$BPM layer thus offers a scalable, physics-aware bridge between efficient
    optical neural-network optimization and fabrication-consistent diffractive design.
- title: Pre-training Enables Extraordinary All-optical Image Denoising
  date: 2026-05
  url: https://arxiv.org/abs/2605.07810v1
  category: optical-computing
  subcategory: method
  authors:
  - Xudong Lv
  - Yuxiang Sun
  - Shuo Wang
  - Nanxing Chen
  - Jun Guan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical neural networks are emerging as powerful machine learning and
    information processing tools because of their potential advantages in speed and
    energy efficiency. The training methods of these physical models, however, remain
    underexplored compared to their digital counterparts and are leading to suboptimal
    performance. This paper reports a pre-training-driven approach that leads to snapshot
    image denoising with substantially improved quality. We demonstrated effective
    free-space optical denoising by a diffractive network optimized by a two-step
    process including (1) pre-training using a massive dataset of 3.45 million diverse
    but simple images and (2) fine-tuning with the corresponding task-specific datasets.
    Compared to conventional Fourier-domain filtering and directly trained diffractive
    networks, such a transfer learning process exhibited prominent advantages for
    denoising images degraded by severe noise, peak signal-to-noise ratio (PSNR) below
    8 dB, while preserving fine image features and improving the PSNR to above 18
    dB. Importantly, the same pre-trained optical network could be consistently fine-tuned
    to process degraded images from highly diverse styles ranging from handwritten
    digits (MNIST) and chest X-rays (ChestMNIST) to CIFAR-10 images and human faces
    (CelebA). We further demonstrated the critical role of our optical denoisers in
    vision-based applications, including face detection, plate recognition, and localization
    of UAVs in noisy conditions.
- title: Fiber Nonlinearity Compensation of Coherent Signals Using Deep Photonic Reservoir
    Computer
  date: 2026-08
  url: https://arxiv.org/abs/2608.17419v1
  category: optical-computing
  subcategory: method
  authors:
  - Yi-Wei Shen
  - Rui-Qian Li
  - Zheng-Can Sun
  - Xing Li
  - Xinyu Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic reservoir computer (PRC) is a promising optical computing framework
    for high-speed optical signal processing, and various reports have shown its functionality
    of linear equalization for intensity-modulation direct-detection communication
    links. However, coherent communication links suffer more from nonlinear impairment,
    whereas its nonlinear equalization is very challenging. Here we demonstrate the
    nonlinear equalization of coherent 16-level quadrature amplitude modulation (16-QAM)
    signals using a deep PRC in experiment. The deep PRC consists of cascading injection-locked
    semiconductor lasers with optical feedback loops. For 16-QAM signals with a transmission
    rate of 240 Gbps and a launch power of 12 dBm, the single-channel PRC with 3 hidden
    layers raises the Q factor by as high as 0.58 dB, while the dual-channel PRC with
    2 hidden layers raises the Q factor by 0.55 dB. In addition, we prove that the
    deep PRC is able to equalize 16-QAM signals of different launch powers and transmission
    distances.
- title: Nanophotonic control of collective many-body states in Kerr solitons
  date: 2026-04
  url: https://arxiv.org/abs/2604.22039v1
  category: optical-computing
  subcategory: method
  authors:
  - Yan Jin
  - Jizhao Zang
  - Sarang Yeola
  - Alexa R. Carollo
  - Nitesh Chauhan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spatially periodic systems of coupled bosons are governed by on-site interactions
    and tunneling between sites, opening a rich phase space of many-body behavior.
    Here, we explore nanophotonic control of collective many-body light states in
    a driven-dissipative Kerr microresonator. We demonstrate a non-equilibrium Mott
    insulator to superfluid transition that arises from the interplay of spatially
    local Kerr interactions that generate and mediate interference among discrete
    frequency modes. A photonic-crystal (PhC) lattice bandgap inscribed on the resonator
    controls linear mode coupling while preserving self-mode Kerr interactions. By
    increasing the PhC bandgap, we suppress nonlinear cross-mode coupling to access
    the Mott-insulator phase, wherein the soliton spectrum forms a flattop frequency
    comb with large and uniform power per mode. In contrast, reducing the PhC bandgap
    restores cross-mode coupling and drives a delocalized superfluid regime characterized
    by long-range phase coherence and a spectrum with non-uniform power distribution.
    Our work shows that many-body physics creates collective states in driven-dissipative
    systems, enabling advances in programmable photonics and quantum-optical computing.
- title: Universal Neural Network Based Calibration and Control of Programmable Classical
    and Quantum Photonic Integrated Processors
  date: 2026-07
  url: https://arxiv.org/abs/2607.09301v1
  category: optical-computing
  subcategory: method
  authors:
  - José Roberto Rausell-Campo
  - Daniele Melati
  - Bhavin Shastri
  - Daniel Pérez-López
  - José Capmany Francoy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Efficient calibration and control of programmable photonic integrated
    circuits are fundamental for scaling quantum and classical optical computing processors.
    While neural network-based models offer an architecture-agnostic solution, existing
    approaches suffer from limited learning and generalization capabilities due to
    the many-to-one mapping problem between sets of control signals and optical responses,
    and biased training datasets derived from uniform current sampling. In this work,
    we propose a universal calibration and control framework employing tandem neural
    networks combined with two novel data generation strategies: architecture-aware
    sampling based on Haar measure principles, and optimized sampling, a physics-agnostic
    approach utilizing differential evolution. We experimentally validate these methods
    on 3x3 and 4x4 coherent MZI meshes, demonstrating that our approach addresses
    the sampling bias inherent in previous works. When evaluated using random unitary
    matrices, our solution outperforms standard uniform sampling baselines by ~2 bits
    of precision. Furthermore, we experimentally extend the application of this framework
    to coherent detection, achieving precise control over both amplitude and phase,
    and validate its impact on photonic neural network tasks.'
- title: Hybrid BaTiO3/TiO2 Metasurface for Efficient Gigahertz-Speed Free-Space Electro-Optic
    Modulation
  date: 2026-07
  url: https://arxiv.org/abs/2608.00286v1
  category: optical-computing
  subcategory: method
  authors:
  - Zhongpeng Sun
  - Kerolos M. A. Yousef
  - Michael Domm
  - Agham Posadas
  - Xudong Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Free-space electro-optic modulators are key to emerging photonic systems,
    yet their performance remains limited by trade-offs between modulation efficiency,
    bandwidth, and device aperture. Here we report a hybrid BaTiO3 (BTO)/TiO2 metasurface
    for large-aperture, efficient, gigahertz-speed free-space electro-optic modulation.
    Combining scalable BTO film growth by radio-frequency magnetron sputtering with
    mature TiO2 nanofabrication, we pattern the metasurface in TiO2 on an unetched
    BTO layer. The resulting devices support guided-mode resonances with quality factors
    exceeding 1300 and an optical confinement factor of ~0.8, while the continuous
    BTO layer makes efficient use of the applied voltage, together maximizing the
    overlap between the optical and driving fields within the BTO. A device with a
    0.3 mm x 0.3 mm metasurface achieves a transmittance modulation efficiency of
    ~0.020 per volt and a -3 dB electro-optic bandwidth of ~0.8 GHz, with an effective
    Pockels coefficient of ~151 pm/V for the BTO. This establishes a scalable route
    to high-performance free-space electro-optic modulators for LiDAR, free-space
    optical communication, and reconfigurable optical computing.
- title: Universal zero-crosstalk photonic integration via slab-engineered mode hybridization
  date: 2026-05
  url: https://arxiv.org/abs/2605.28281v1
  category: optical-computing
  subcategory: method
  authors:
  - Kyungtae Kim
  - Yoseph Shin
  - Seungyong Lee
  - Inki Kim
  - Hyeyoon Jeon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits have emerged as a scalable platform for optical
    computing, communication, and quantum technologies, where high-fidelity optical
    processing is essential. However, as photonic systems scale in complexity, inter-channel
    crosstalk accumulates across cascaded components, fundamentally degrading signal
    fidelity, limiting system-level performance, and constraining integration density.
    Existing crosstalk-suppression strategies rely on specialized nanostructures or
    platform-specific designs, hindering their adoption in standard foundry processes
    and across diverse material systems. Here we establish a universal and foundry-compatible
    route to eliminating crosstalk based on slab-engineered mode hybridization in
    standard rib waveguides. By tailoring the slab thickness, mode hybridization induces
    anisotropic modal perturbations that enable complete cancellation of coupling
    between adjacent waveguides. We experimentally demonstrate zero-crosstalk across
    diverse material platforms, including silicon-on-insulator, silicon nitride, thin-film
    lithium niobate, and germanium-on-insulator, spanning wavelengths from the visible
    to the mid-infrared. Our approach provides a manufacturable route toward scalable,
    high-fidelity, and high-density photonic integration, overcoming the long-standing
    trade-off between signal fidelity and integration density in large-scale photonic
    systems.
- title: Wafer-scale monolithic integration of Ce:YIG films and magneto-optical isolators
    on silicon
  date: 2026-08
  url: https://arxiv.org/abs/2608.09003v1
  category: optical-computing
  subcategory: method
  authors:
  - Tianchi Zhang
  - Yucong Yang
  - Weihao Yang
  - JieJun Su
  - Tianyi Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon integrated cerium doped yttrium iron garnet (Ce:YIG) thin films
    are promising candidates for integrated nonreciprocal photonic devices, cryogenic
    photonic modulators and optical computing applications. However, previously reported
    Ce:YIG thin film on silicon is limited to milimeter sizes. Wafer-scale integration
    and non-destructive characterization of high quality Ce:YIG thin films on silicon
    has been elusive. Here, we report growth of 4-inch wafer-scale Ce:YIG thin films
    on silicon substrates by radio-frequency magnetron sputtering. Strong Faraday
    effect of 2318 deg/cm, low propagation loss of 80 dB/cm and excellent thickness
    uniformity of 3.5% is demonstrated across the 4-inch silicon wafer. Furthermore,
    a custom designed wafer-scale, non-destructive magneto-ellipsometry was established
    to characterize the film thickness, optical constants and magneto-optical constants
    across the wafer. Wafer-scale integration of ring resonator type magneto-optical
    isolators are also demonstrated. Our work demonstrates a step forward toward wafer-scale
    heterogeneous integration and characterization of magneto-optical thin films on
    silicon, providing material candidates for non-reciprocal photonic device arrays,
    magneto-optical in-memory computing networks and integrated magneto-optic magnetometers.
- title: Large-Area Patternable Solar-Powered Bistable Organic Crystalline Film for
    Nonlinear Optical Communication
  date: 2026-06
  url: https://arxiv.org/abs/2606.22980v2
  category: optical-computing
  subcategory: method
  authors:
  - Ankur Khapre
  - Avulu Vinod Kumar
  - Haseeba Nasreen Punathil
  - Biswajit Kumar Barman
  - Bedanta Kumar Deka
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reversible control of crystal symmetry offers a powerful route to programmable
    optical functionality. However, achieving solid-state bistability between centrosymmetric
    and non-centrosymmetric crystalline phases remains a formidable challenge; examples
    of materials that enable stable switching of second-order nonlinear optical (NLO)
    responses are exceptionally rare. Here we report a solar-powered, symmetry-bistable
    organic material based on the photoisomerizable molecule (E/Z)-2-(4-(4-bromophenyl)thiazol-2-yl)-3-(4-
    (dimethylamino)phenyl)acrylonitrile (E/Z-BTDPA). The crystallizable E- and Z-isomers
    adopt distinct molecular packing arrangements that reversibly toggle between these
    states, controlling second-order NLO activity. The E-form exhibits strong second-harmonic
    generation (SHG), whereas the Z-form is SHG-inactive and displays twophoton luminescence.
    This bistable behavior is retained in flexible thin films, where sunlight-driven
    photoisomerization enables reversible photoswitching of the second-order electric
    susceptibility (\c{hi} 2), large-area optical patterning, and real-time NLO communication
    via waveform generation and text-string transcription at telecommunication wavelengths.
    This sustainable strategy bypasses rigid inorganic architectures, establishing
    photoinduced symmetry bistability as a scalable paradigm for all-optical computing
    and advanced communication networks.
- title: Reconfigurable Nonlocal Light-Emitting Metalens Nanolasers via Bound States
    in the Continuum
  date: 2026-07
  url: https://arxiv.org/abs/2607.15852v1
  category: optical-computing
  subcategory: method
  authors:
  - Omar A. M. Abdelraouf
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The development of on-chip, reconfigurable coherent light sources operating
    in the visible spectrum is critical for next-generation optical computing and
    high-speed data processing. Here, we demonstrate an all-optically tunable nanolaser
    based on a hybrid dielectric metasurface. The platform integrates a Rhodamine
    B (Rd B) dye gain medium with a Niobium Pentoxide (Nb2O5) metasurface supporting
    a high-Q Bound State in the Continuum (BIC) resonance. Active, non-volatile tuning
    is achieved by incorporating the low-loss phase change material (PCM) Antimony
    Trisulfide (Sb2S3). We demonstrate room-temperature lasing at 616 nm with Q-factor
    &gt; 2050. A continuous-wave (CW) laser is utilized for the crystallization of
    the PCM, tuning the lasing emission to crystalline at 621 nm with Q-factor &gt;
    1454, while a near-infrared (NIR) ps-laser triggers its re-amorphization. This
    robust, thermally protected optical-only control scheme, combined with a phase-gradient
    metasurface design, realizes a coherent, nonlocal light-emitting metalens for
    simultaneous lasing wavelength tuning and wavefront control. This work provides
    a foundational demonstration of an all-optical tunable metalens-based nanolaser
    for applications in high-speed optical communication, neuromorphic photonics,
    dynamic holographic displays, and reconfigurable quantum light sources.
- title: Binary Amplitude Modulation Suppresses Noise Up-Conversion in Coherent Diffractive
    Optical Networks
  date: 2026-05
  url: https://arxiv.org/abs/2605.30820v1
  category: optical-computing
  subcategory: method
  authors:
  - Hyuntae Lim
  - Kyoungsik Kim
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We establish a fundamental principle in coherent wave-optical computing:
    restricting the modulation manifold from continuous complex-valued to binary amplitude
    suppresses stochastic-noise up-conversion while preserving classification fidelity,
    yielding a counter-intuitive less-is-more robustness law. Seven-layer binary-amplitude-mask
    D2NN (BM-D2NN) achieve 90.9% (MNIST) and 81.9% (Fashion-MNIST) test accuracy,
    within 2~4 pp of continuous-modulation D2NN (C-D2NN). Under pixel-wise Gaussian
    noise N(m,σ^2), spanning zero-mean (shot noise) to nonzero-mean (thermal/readout)
    regimes, BM-D2NN outperform C-D2NN by up to 32.8 pp (MNIST) and 18.5 pp (Fashion-MNIST).
    We analytically derive a noise-contribution metric C, governed by a transmission-bias
    factor K computable from clean data alone, that is consistently smaller for binary
    modulation than for continuous modulation (as verified for all test samples),
    guaranteeing the robustness ordering without noisy simulation. BM-D2NN additionally
    deliver a 6.79-fold higher imaging-plane intensity for clean data input. These
    results establish a quantitative physical principle connecting modulation-manifold
    geometry to noise robustness, applicable to any coherent optical processor in
    the z/λ &gt;&gt; 1 regime.'
- title: From order to chaos in a chip-scale Kerr parametric oscillator
  date: 2026-05
  url: https://arxiv.org/abs/2605.18690v1
  category: optical-computing
  subcategory: method
  authors:
  - Luca O. Trinchão
  - Juan Diego Mazo-Vásquez
  - Miguel Nienstedt
  - Luiz Peres
  - Julius T. Gohsrich
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated photonics has enabled a wide class of chip-scale light sources
    and quantum technologies. Within this field, microresonator-based degenerate optical
    parametric oscillators (DOPOs) have gained prominence. Above a critical power
    threshold, these systems undergo spontaneous symmetry breaking to settle into
    one of two stable, π-phase-shifted states -- a mechanism successfully used for
    quantum random number generation and photonic Ising machines. Here, we show that
    DOPOs based on the Kerr nonlinearity host a significantly broader range of nonlinear
    dynamics than previously explored. Using a silicon nitride microring resonator,
    we experimentally identify Hopf bifurcations that trigger a transition from stationary
    operation to self-sustained oscillations at MHz frequencies. By adjusting pump
    detunings and powers, we achieve turnkey control over these oscillatory regimes,
    navigating the system between stable binary states and periodic limit cycles.
    Furthermore, we report the experimental observation of period-doubling bifurcations,
    which numerical simulations reveal as the precursor to a cascading instability
    culminating in chaos at elevated pump powers. Our results establish a framework
    for controlling nonlinear instabilities in chip-scale parametric oscillators,
    with applications in programmable photonic hardware and dynamical optical computing.
- title: High-efficiency graphene-silicon slot-waveguide microring modulator at 1.5
    μm and 2 μm wavelength bands
  date: 2026-04
  url: https://arxiv.org/abs/2604.08472v1
  category: optical-computing
  subcategory: method
  authors:
  - Chao Luan
  - Deming Kong
  - Yong Liu
  - Yunhong Ding
  - Hao Hu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Electro-optic (E/O) modulators are crucial for optical communication but
    face a trade-off between modulation bandwidth and efficiency. A small footprint
    could reduce the capacitance and increase the bandwidth, however, this usually
    results in a low modulation efficiency. Here, we present an integrated E/O modulator
    that simultaneously achieves wideband large bandwidth and high modu- lation efficiency
    operation by embedding a partially overlapped double-layer graphene on a compact
    silicon slot waveguide microring resonator. At 1550 nm, the graphene-silicon slot-waveguide
    demon- strates a high phase modulation efficiency of Vπ L = 220 V μm, and the
    corresponding microring modulator has a large bandwidth of over 70 GHz, a compact
    active length of 10 μm, and an optical modulation amplitude (OMA) of -1.97 dBm
    under a 3-V voltage swing. The modulator operates at a data rate of 50 Gbit/s
    with an open eye diagram under a 2-V Vpp RF drive voltage. The graphene modulator
    operation is broadband, and we also characterize its performance at 2 μm wavelength
    band. At 2 μm wavelength band, the microring modulator has a large bandwidth of
    over 20 GHz, an OMA of -3.36 dBm under a 6-V voltage swing, and an open eye diagram
    at 20 Gbit/s with a 2-V Vpp RF drive voltage. The difference in performance is
    caused by the bandwidth limit of the 2 μm wavelength band measurement setup. The
    broadband, large bandwidth, compact, highly effi- cient, and energy efficient
    graphene E/O modulator has the potential to enable large-scale graphene photonic
    integrated circuits, facilitating a broad range of applications such as optical
    interconnects, optical neural networks, and programmable photonic circuits.
- title: Attenuation scaling and error analysis of 2f and 4f architectures for free-space
    optical matrix-vector multiplication
  date: 2026-06
  url: https://arxiv.org/abs/2606.23988v1
  category: optical-computing
  subcategory: method
  authors:
  - Dawson Lyles
  - Spencer LaVere Smith
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Free-space optical computing has been suggested as a scalable, high speed,
    and energy efficient platform for performing matrix-vector multiplication (MVM).
    We present two free-space optical approaches for MVM, called the 2f and 4f architectures,
    and model them using wave optics simulations. After constraining the optical modulator
    in our models to have a maximum gain limit, we use our simulations to compare
    2f and 4f MVM performance in terms of computational error and optical signal attenuation
    per MVM. We examine how 2f and 4f signal attenuation per MVM scales with increasing
    MVM problem size for different statistical distributions of matrix elements and
    compare to the expected attenuation from a universal multiport interferometer
    (UMI), commonly used in integrated photonics for MVM. We find that the 2f and
    4f architectures scale more favorably to large problem sizes, experiencing many
    orders of magnitude less attenuation than UMIs for matrix dimension above a thousand
    elements. We furthermore examine how varying modulator space-bandwidth product
    and output slit aperture affect 2f and 4f attenuation and computational error
    across different distributions of matrix elements. We conclude that the preference
    of 2f or 4f MVM depends on the statistics of the matrix used, but that 4f may
    provide more flexibility than 2f.
- title: Robust class-gated single-pixel diffractive optical neural network with random-aberration-aware
    training
  date: 2026-05
  url: https://arxiv.org/abs/2605.31232v1
  category: optical-computing
  subcategory: method
  authors:
  - Xianjin Liu
  - Qiwen Bao
  - Ting Ma
  - Yihuan Liang
  - Yongqiu Lai
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical computing offers the theoretical potential for high-speed, energy-efficient
    inference, yet its practical deployment remains constrained by fundamental input-output
    bottlenecks, particularly the reliance on electronic sensors with limited frame
    rates and stringent alignment requirements between optical components. Here, we
    demonstrate an image-class-gated single-pixel DONN that overcomes these limitations
    by converting spatial complexity into a temporal intensity signature. Using a
    minimal architecture comprising a reconfigurable digital micromirror device and
    a single-pixel photodetector, we implement a virtual optical gate. The system
    time-multiplexes class-specific masks, causing the detector response to peak only
    when the mask index matches the input class. This allows the predicted label to
    be read out via peak timing rather than spatial localization, eliminating 2D sensor
    constraints. To bridge the persistent sim-to-real gap, we introduce a physics-aware
    training strategy using random-phase augmentation. This method renders the model
    intrinsically tolerant to phase aberrations and mechanical misalignments without
    requiring precise hardware modeling. Our prototype achieves 90.0%(MNIST) and 80.0%
    (Fashion-MNIST) accuracy at a readout rate of 5 kHz. By combining gigahertz-compatible
    single-pixel detection with robust and alignment-tolerant training, this work
    provides a scalable, hardware-efficient pathway toward real-time optical intelligent
    sensing.
- title: Micro-electromechanical photonic integrated memristors
  date: 2026-07
  url: https://arxiv.org/abs/2607.21693v1
  category: optical-computing
  subcategory: method
  authors:
  - Matthew Zimmermann
  - Julia M. Boyle
  - Hardit Singh
  - Alex Witte
  - Kevin Palm
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Programmable optical memristors embedded in photonic integrated circuits
    (PICs) are emerging as an important technology for high-speed optical storage
    and in-memory optical computing applications. These devices provide multi-level,
    non-volatile storage of optical phases that can be interrogated at the speed of
    light, enabling parallel data readout or energy-efficient multiply-accumulate
    operations in artificial neural networks. However, there remains several outstanding
    challenges with existing optical memristor technology including durability, material-induced
    optical losses, large-scale reconfigurability, or fabrication yield for realistic
    applications. Here we introduce an analog-programmable photonic memristor based
    on photonic integrated micro-electromechanical (MEMS) cantilevers produced in
    a CMOS foundry. The memristor consists of low-loss silicon nitride waveguides,
    requires no additional back-end materials integration, and is all electrically
    programmed with electrostatic-piezoelectric forces. We demonstrate up to 5-bit
    phase storage levels, 50 kbit/s programming speeds, strain-assisted non-volatility
    lifetimes &gt;1 hour, &gt;1 billion cycle endurance, and stress-tested millions
    of write-read cycles with pseudorandom bit sequences. We further extend the memory
    lifetime to several days with simple electronic refresh circuits in a portable
    battery-powered module, demonstrating a proof-of-concept optical random-access
    memory in static or dynamic configurations. Our MEMS-photonics technology represents
    an important step toward practical optical memristors.
- title: High-dimensional Supermode Photonics Enabled by Hierarchical Supersymmetric
    Transformation
  date: 2026-08
  url: https://arxiv.org/abs/2608.11099v1
  category: optical-computing
  subcategory: method
  authors:
  - Yuan Zhong
  - Kaile Chen
  - Qi Lu
  - Chunxue Wang
  - Jingchi Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modes provide a fundamental degree of freedom for photonic information
    processing, yet conventional multimode waveguides exhibit non-equidistant effective-index
    distributions, making closely spaced modes vulnerable to intermodal crosstalk.
    Supermode photonics can overcome this limitation by geometrically engineering
    coupled waveguide arrays to realize large and equidistant effective-index spacing,
    but precise supermode excitation and detection remain challenging at the subwavelength
    scale. Here, we report a hierarchical second-order discrete supersymmetric (DSUSY)
    transformation method that enables high-purity excitation and extraction of arbitrary
    target supermodes in a compact and scalable architecture. We experimentally demonstrate
    six-supermode multiplexing systems on silicon-on-insulator and silicon nitride
    platforms. Benefiting from the large supermode index spacing and the isospectrality
    of DSUSY transformations, the fabricated devices exhibit low insertion losses
    (&lt;2.6 dB) and intermodal crosstalk (&lt;-11.1 dB) for all channels over a 100-nm
    wavelength range. A high-speed transmission experiment on the silicon device achieves
    an aggregate data rate of 1.2 Tbit/s, with all channel bit error rates below the
    7% hard-decision forward-error-correction threshold. The method can further support
    polarization-insensitive architectures, enabling compact polarization-supermode
    hybrid multiplexing. This work provides a scalable route toward high-dimensional
    supermode photonics for high-capacity optical interconnects, highly parallel AI
    optical computing, and high-dimensional quantum information processing.
- title: Reconfigurable all-optical inference via tunable second-harmonic generation
    and spin-orbit coupling cascade
  date: 2026-06
  url: https://arxiv.org/abs/2606.23290v1
  category: optical-computing
  subcategory: method
  authors:
  - Li Zhang
  - Zikuan Zhuang
  - Ronghao Deng
  - Ling Hong
  - Yu Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spin-orbit coupling (SOC) is widely exploited as a fundamental mechanism
    for generating orbital angular momentum (OAM); however, conventional approaches
    typically lack flexibility and tunability. Here, we introduce a continuously tunable
    second-harmonic generation (SHG)-SOC cascade mechanism modulated by a spatially
    movable nonlinear crystal. Under linearly polarized excitation, the SHG-SOC cascade
    engages synchronously with both degenerate and nondegenerate SHG processes, thereby
    expanding the OAM spectrum and significantly enhancing the information density
    and feature-mapping capacity of the optical field. Moreover, the OAM spectral
    distribution can be continuously reconfigured simply by translating the nonlinear
    crystal. This deterministic physical evolution, which maps simple OAM modes onto
    a tunable high-dimensional OAM space, is mathematically analogous to the high-dimensional
    feature expansion performed by a kernel function of a support vector machine (SVM)
    in machine learning. Such dimensional expansion can project linearly inseparable
    input data into a high-dimensional space where they become linearly separable.
    Exploiting this physics-algorithm analogy, we develop a reconfigurable all-optical
    inference platform. As a proof of concept, we successfully perform classification
    tasks, including the recognition of Iris flowers and Palmer penguins. This work
    establishes a scalable, physically reconfigurable architecture for high-dimensional
    all-optical computing and neuromorphic photonics.
- title: 'Universal Function Approximation via Diffractive Optical Processors: Physical
    Limits, Error Bounds, and Learnability'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04582v1
  category: optical-computing
  subcategory: method
  authors:
  - Md Sadman Sakib Rahman
  - Che-Yung Shen
  - Aydogan Ozcan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a unified theoretical framework connecting classical universal
    approximation theory, Fourier-feature approximation, and diffractive optical processors.
    We show that phase-encoded diffractive processors implement finite Fourier-feature
    expansions whose mathematical completeness follows from Fourier/Stone-Weierstrass
    arguments, while their physical realizability is governed by finite coefficient
    synthesis through optimized spatially varying coherent point-spread functions
    (PSFs). Our analyses derive approximation-error bounds that separate Fourier truncation,
    PSF-synthesis, input phase error, optical hardware, readout, and noise contributions;
    establish scaling relationships linking approximation complexity to optical degrees
    of freedom and input/output space-bandwidth products; derive photon-budget and
    throughput limits imposed by photon statistics; formulate finite-class statistical
    learnability bounds for phase-quantized diffractive function approximators; and
    analyze the impact of spatially incoherent illumination. We further analyze coherent
    optical cascadability and show that quadratic feature expansion through coherent
    mixing and optical readout provides a mechanism for enhanced representation while
    remaining fundamentally distinct from the depth-separation results established
    for digital neural networks. Our analyses provide a rigorous theoretical foundation
    for diffractive nonlinear function approximation and establish quantitative relationships
    among mathematical expressivity, optical hardware resources, statistical learning,
    and physical performance limits, thereby offering general design principles for
    large-scale analog optical computing systems.
- title: 'On-Chip Chiroptical Sensor based on Directional Deflection of Light: A Stern-Gerlach
    Integrated Optical Analog'
  date: 2026-05
  url: https://arxiv.org/abs/2605.30210v1
  category: optical-computing
  subcategory: method
  authors:
  - Josep Martínez-Romeu
  - Alejandro Martínez
  - J. Enrique Vázquez-Lozano
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Chiroptical techniques for detecting and characterizing the chirality
    of matter and artificial nanostructures are traditionally based on their interaction
    with chiral light, typically circularly-polarized fields propagating in free space.
    More recently, these approaches have been extended to integrated photonic platforms,
    offering significant practical advantages. However, the generation of chiral guided
    light is challenging, it requires degeneracy of the fundamental modes of the integrated
    waveguide, which occurs at a single wavelength and limits broadband characterization.
    Here, we introduce and simulate numerically a new alternative integrated optical
    configuration inspired by the Stern-Gerlach experiment, in which a chiral sample
    is illuminated by a linearly polarized light beam. Such a beam exits from a dielectric
    waveguide that propagates the fundamental TE mode, thereby eliminating the need
    for circularly polarized excitation. On this basis, enantio-discrimination is
    achieved through a spatially resolved scheme using a symmetric arrangement of
    optical antennas on either side of the propagation axis. Our simulation results
    suggest that the selective scattering and absorption of the circular polarization
    component matching the chirality of the sample induces an imbalance of (spin)
    angular momentum of the optical field, resulting in a transverse deflection of
    the beam toward the corresponding side. This on-chip platform then provides a
    direct route to chiroptical functionalities under linearly-polarized illumination,
    enabling compact implementations of chiral sensing, spectroscopy, optical computing,
    and communication schemes.
- title: Agentic metasurface design with self-correcting language-model systems
  date: 2026-05
  url: https://arxiv.org/abs/2605.22647v2
  category: optical-computing
  subcategory: method
  authors:
  - Bei Wu
  - Bo Xiong
  - Haiyao Luo
  - Yaqi Li
  - Li Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Automated metasurface design is increasingly important, and recent advances
    in language-model systems are opening a route toward agentic optical design. Yet
    modern metasurface applications, from metalenses and holography to optical computing,
    require long design chains spanning modeling, simulation, coding, optimization
    and evaluation. These chains are error-prone, whereas existing language-model-based
    metasurface tools remain largely limited to simple objectives, predefined pipelines
    or language-to-layout generation. Here we introduce MetaDesigner, a self-correcting
    language-model system for agentic metasurface design. From a natural-language
    optical objective, MetaDesigner plans the design route, retrieves domain knowledge,
    invokes simulation and optimization tools, generates missing tool code and identifies
    errors through a dedicated Verifier. We demonstrate three tasks of increasing
    complexity: an RGB metalens with three independent focal spots, a six-plane full-color
    hologram with an average structural similarity index measure (SSIM) of 0.97, and
    an optoelectronic hybrid neural network for image style transfer. These tasks
    require 74, 136 and 90 reasoning steps, respectively, and the system self-corrects
    errors in frequency mapping, numerical aperture estimation, network-parameter
    counting and loss-function description. These results establish MetaDesigner as
    a self-correcting route to agentic metasurface design, where language-model systems
    can not only execute optical design tasks but also extend, inspect and repair
    the design process itself.'
- title: Emerging Non-Volatile Opto-electronic Resistive Memories for Next-Generation
    Photonic Integrated Circuits
  date: 2026-05
  url: https://arxiv.org/abs/2606.01463v1
  category: optical-computing
  subcategory: method
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits have emerged as a powerful platform for high
    speed communication, sensing, and information processing due to their large bandwidth,
    low latency, and inherent parallelism. However, the absence of efficient, scalable,
    and non-volatile memory elements remains a fundamental limitation for realizing
    fully programmable and adaptive photonic systems. Conventional electronic memories
    introduce significant energy overhead, latency, and architectural inefficiencies
    due to repeated optical electrical conversions. Non volatile opto electronic resistive
    memories or OERMs have recently emerged as a promising solution to address these
    challenges by integrating memory functionality directly within the photonic domain.
    These devices combine resistive switching mechanisms with optical readout, enabling
    persistent state retention, multilevel programmability, and energy efficient operation.
    In this review, we provide a comprehensive overview of OERMs, spanning from fundamental
    physical mechanisms to system level applications. We first discuss the underlying
    resistive switching phenomena, including filamentary conduction, interface type
    switching, phase change transitions, and ionic migration, with particular emphasis
    on their interaction with confined optical modes. We then examine key material
    platforms such as metal oxides, transparent conducting oxides, phase change materials,
    and emerging two-dimensional systems, highlighting their performance trade-offs.
    Furthermore, we analyse device architectures and benchmark their performance in
    terms of switching energy, speed, endurance, and optical modulation efficiency.
    The integration of OERMs into programmable photonic circuits, neuromorphic systems,
    and in-memory optical computing architectures is critically discussed. Finally,
    we outline the major challenges and future research directions toward scalable,
    reliable
- title: Bound state in the continuum induced room-temperature superfluorescence
  date: 2026-04
  url: https://arxiv.org/abs/2604.24204v1
  category: optical-computing
  subcategory: method
  authors:
  - Haijun Tang
  - Hamdi Barkaoui
  - Can Huang
  - Xiong Jiang
  - Yixuan Zeng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Superfluorescence is a collective emission from several quantum emitters
    that initially have random phases and are then synchronized through vacuum field
    interactions. Despite its fascinating prospects in quantum information processing,
    optical computing and advanced photonic devices, a key challenge in harnessing
    superfluorescence is alleviating its reliance on cryogenic conditions. Recently,
    room-temperature superfluorescence has been successfully achieved using upconverted
    nanoparticles and quasi two-dimensional lead halide perovskites. These approaches,
    however, are restricted to a few specific material designs and unsuitable for
    wide promotion. Here, we report a universal strategy to elevate the operating
    temperature of superfluorescence. We reveal that the symmetry-protected optical
    bound state in the continuum (BIC) can break the size limitation of superfluorescence
    (λ^3) and correlate distant but similar emitters without violating the selection
    rules, significantly accelerating synchronization process and promoting the possibility
    of room-temperature superfluorescence. This effect has been experimentally verified
    using a series of BIC metasurfaces made of different lead halide perovskites.
    Key features such as the quadratic increase in transient peak intensity and the
    reduction in pulse width and build-up time at the BIC wavelength confirm the realization
    of room-temperature superfluorescence that is absent in the pristine material.
    A theoretical model is also built to explain the experimental observations. This
    research demonstrates that the operating temperatures of coherent macroscopic
    states can be effectively improved by artificial field, paving a critical step
    towards constructing building blocks for optical and quantum applications.
- title: 'Omni-Photonic Base Station: A Three-Functional-Domain Photonic Architecture
    for Evolutionary 6G Wireless Infrastructure'
  date: 2026-08
  url: https://arxiv.org/abs/2608.13909v1
  category: optical-computing
  subcategory: method
  authors:
  - Dapeng Wang
  - Xiaoxiong Song
  - Ziling Fu
  - Wenyang Cheng
  - Jiayao Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: '6G mobile communications impose immersive communication demands for higher
    data rates and massive connectivity, while emerging integrated sensing-computing-intelligence
    scenarios require base stations to concurrently enhance computing capability,
    guarantee service latency, and realize sensing. We propose the Omni-Photonic Base
    Station-a progressive evolutionary architecture that introduces photonic technologies
    into three functional domains, namely baseband processing, fronthaul transmission,
    and the RF front-end, and obtains system-level gains through cross-domain co-design.
    By introducing photonics, Omni-PBS harnesses the inherent physical advantages
    of ultra-broad bandwidth, ultra-low propagation latency, and native parallelism
    to transcend the aforementioned electronic bottlenecks and fulfill the compound
    demands of 6G scenarios. The optical baseband computing domain employs photonic
    accelerators to perform linear computation-intensive tasks, improving the energy
    efficiency of AI inference by one to two orders of magnitude. The analog optical
    fronthaul domain replaces digital fronthaul with analog radio-over-fiber , which
    eliminates the ADCs/DACs and digital intermediate-frequency chips in the remote
    unit and substantially reduces fronthaul bandwidth requirements. The microwave-photonic
    RF domain breaks through the bandwidth and frequency limitations of electronic
    RF front-ends via optical true-time-delay beamforming, programmable photonic filtering,
    and optical heterodyne frequency conversion. The three domains yield system-level
    gains beyond single-domain summation through four co-design principles: end-to-end
    optical-domain continuity, cross-domain co-design, optical computing resource
    scheduling, and joint optimization of functional splitting.'
- title: Multifunctional Imaging with an Inverse-Designed Nonlocal Metasurface
  date: 2026-06
  url: https://arxiv.org/abs/2606.21051v2
  category: optical-computing
  subcategory: method
  authors:
  - Lincoln Clark
  - Yang Xu
  - Cat-Uyen Phan
  - David J. Byrne
  - Shikun Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Nonlocal metasurfaces enable all-optical processing of spatial information
    in optical fields. Here, we demonstrate a topology-optimised metasurface that
    switches between phase-contrast and brightfield imaging modalities via polarisation
    control, eliminating the need to reposition optical components or use computational
    techniques to image transparent samples. Specifically, for one polarisation state,
    an asymmetric transfer function about normal incidence performs a first order
    derivative on the phase, producing pseudo-3D phase-contrast images of transparent
    biological samples while the orthogonal state returns the result of the identity
    operator. This work extends inverse-design methods to reconfigurable phase-contrast
    microscopy and quantitative analogue optical computation with applications in
    biological imaging, medical diagnostics, and materials characterisation.
- title: Integrated Supermode Photonics Enabled by Supersymmetric Transformation
  date: 2026-04
  url: https://arxiv.org/abs/2604.18999v1
  category: optical-computing
  subcategory: method
  authors:
  - Kaile Chen
  - Qi Lu
  - Yuan Zhong
  - Jingchi Li
  - Yuru Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report a systematic methodology to obtain supermodes with equidistant
    effective index distribution and to excite arbitrary target supermodes with high
    precision. By employing a multi-well optical potential realized by a judiciously
    designed waveguide array, the supported supermodes achieve maximal spacing and
    an equidistant distribution in effective index. More importantly, we develop a
    2nd-order discrete supersymmetric (DSUSY) transformation method that enables the
    excitation and detection of two supermodes at the same time and can be extended
    to any number of supermodes via simple cascading. Together, these findings overcome
    the long-standing bottlenecks in integrated supermode photonics and provide an
    intrinsically scalable route towards harnessing supermodes as a new degree of
    freedom for encoding, transmitting, and processing information. We experimentally
    demonstrate the feasibility and universality of this method by realizing two-
    and four-supermode multiplexing systems. Benefitting from the large effective
    index spacing between supermodes and the isospectral nature of the DSUSY transformation,
    the fabricated devices show low insertion losses (&lt; 2.48 dB at 1550 nm) and
    intermodal crosstalk (&lt; -18 dB at 1550 nm) for all mode channels over a 100-nm
    wavelength range (1500-1600 nm). The high-speed data transmission experiment performed
    on the four-channel system achieves an aggregate data rate of 1.024 Tb/s while
    maintaining considerably low bit error rates, underscoring the potential of supermode
    photonics for high-capacity on-chip optical communications. This work lays the
    foundation for integrated supermode photonics, which uses supermodes as a new
    degree of freedom for light manipulation and opens new avenues for supermode-based
    applications including but not limited to on-chip optical communications, intelligent
    optical computing and quantum information technologies.
- title: Toward scalable and bias-stable optical phased arrays on lithium tantalate
  date: 2026-03
  url: https://arxiv.org/abs/2603.22811v1
  category: optical-computing
  subcategory: method
  authors:
  - Gongcheng Yue
  - Xuqiang Wang
  - Yihan Miao
  - Bowen Chen
  - Yangming Zhan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Ferroelectric materials are an ideal platform for high-speed reconfigurable
    photonic integrated circuits (PICs) for classical and quantum photonic computations,
    communications, and sensing. Most reconfigurable PIC devices achieve their functionalities
    via interference and are therefore highly sensitive to phase errors. Under static
    bias, carrier drift in ferroelectric waveguides induces continuous phase drift,
    creating a severe bottleneck for both PIC functionality and scalability. Here
    we propose achieving bias-stable and scalable ferroelectric PICs by exploiting
    the intrinsically low carrier drift of lithium tantalate (LT). Taking one of the
    PIC devices that is most sensitive to phase drift, the optical phased array (OPA),
    as an example, we designed and fabricated an integrated LT OPA that can keep the
    far-field main lobe 8 dB higher than side lobes for over 4 hours, representing
    at least a two-order-of-magnitude improvement over the state of the art. We demonstrated
    our device's capability in generating arbitrary spatiotemporal waveforms with
    a modulation frequency as low as 0.1 Hz, leading to practical applications in
    optical tweezers, trapped-ion quantum computers, adaptive optics for astronomy,
    AR, 3D printers, LiDAR, and free-space optical communications. Beyond OPA, our
    work establishes LT as a bias-stable, scalable, and high-speed PIC platform for
    large-scale classical and quantum photonic systems.
- title: Mid-infrared single-photon sub-pixel temporal ghost imaging
  date: 2026-05
  url: https://arxiv.org/abs/2605.20768v1
  category: optical-computing
  subcategory: method
  authors:
  - Wen Zhang
  - Kun Huang
  - Zhibin Zhao
  - Huijie Ma
  - Ziyu He
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Temporal ghost imaging (TGI) enables ultrafast temporal signal recovery
    using slow detectors, offering a promising route for high-speed mid-infrared (MIR)
    detection. However, conventional schemes remain limited in temporal resolution
    by the modulation bandwidth or pattern timescale, and are mostly confined to structured
    illumination. Here, we demonstrated a high-resolution MIR single-photon computational
    TGI system, which integrated nonlinear structured detection with sub-pixel temporal
    shifting. A pre-programmed near-infrared pump serves as a temporally optical gate
    to drive sum-frequency generation in a nonlinear crystal. Consequently, MIR waveforms
    at 3.4 $μ$m were upconverted, and captured by a room-temperature silicon detector.
    We realized sub-pixel operation by fractional-bin temporal stepping of the gate
    and multi-shot fusion via pseudo-inverse reconstruction. The sub-pixel shifting
    strategy decouples the achievable resolution from modulation speed, enabling 40
    ps temporal precision at a driving rate of only 3.125 Gbps. This performance surpasses
    both detector jitter and pattern-rate limits, while maintaining single-photon
    sensitivity. The presented paradigm establishes a versatile route for ultrafast
    MIR waveform reconstruction, opening new opportunities in high-resolution infrared
    sensing and quantum photonics.
- title: Mid-infrared single-pixel imaging at the single-photon level
  date: 2026-05
  url: https://arxiv.org/abs/2605.30703v1
  category: optical-computing
  subcategory: method
  authors:
  - Yinqi Wang
  - Kun Huang
  - Jianan Fang
  - Ming Yan
  - E Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Single-pixel cameras have recently emerged as promising alternatives to
    multi-pixel sensors due to reduced costs and superior durability, which are particularly
    attractive for mid-infrared (MIR) imaging pertinent to applications including
    industry inspection and biomedical diagnosis. To date, MIR single-pixel photon-sparse
    imaging has yet been realized, which urgently calls for high-sensitivity optical
    detectors and high-fidelity spatial modulators. Here, we demonstrate a MIR single-photon
    computational imaging with a single-element silicon detector. The underlying methodology
    relies on nonlinear structured detection, where the encoded time-varying pump
    patterns are optically imprinted onto the MIR object image through sum-frequency
    generation. Simultaneously, the MIR radiation is spectrally translated into the
    visible region, thus permitting infrared single-photon upconversion detection.
    Then, the use of advanced algorithms of compress sensing and deep learning allows
    us to reconstruct MIR images under sub-Nyquist sampling and photon-starving illumination.
    The presented paradigm of single-pixel upconversion imaging is featured with single-pixel
    simplicity, single-photon sensitivity, and room-temperature operation, which would
    establish a new path for sensitive imaging at longer infrared wavelengths or terahertz
    frequencies, where high-sensitivity photon counters and high-fidelity spatial
    modulators are typically hard to access.
- title: Single-pump hybrid nonlinearities in transparent conductors
  date: 2026-05
  url: https://arxiv.org/abs/2605.22246v1
  category: optical-computing
  subcategory: method
  authors:
  - Wallace Jaffray
  - Sven Stengel
  - Alexandra Boltasseva
  - Vladimir M. Shalaev
  - Carlo Rizza
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Low-index transparent conducting oxides have attracted significant attention
    because ultrafast optical excitation in these materials can induce exceptionally
    large temporal index gradients. Due to this remarkable nonlinear optical behaviour,
    this material platform enables sub-picosecond, all-optical control of photon energy
    and momentum, with growing relevance for integrated photonics, quantum optics,
    and optical computation. Owing to their hybrid electronic structure, transparent
    conductors exhibit both intraband and interband nonlinearities, previously accessed
    using dual-colour excitation with near-infrared and ultraviolet pumps. Here, we
    show that both excitation regimes can be activated using a single, intense near-infrared
    pump. Above a threshold intensity, the pump drives hot-electron intraband dynamics
    while simultaneously generating higher harmonics that trigger interband excitation.
    The interplay of these two effects sharpens the temporal features of the recorded
    transmissivity which in turn substantially broadens the effective material bandwidth.
    Finally, by comparing linear and circular pumping conditions, we further demonstrate
    that the observed interband nonlinearities originate from harmonic generation
    rather than from direct multiphoton absorption. Our results provide key insights
    into the strong-field optical response in these time-varying photonic materials,
    opening new frontiers for the ultra-fast manipulation of photons in both classic
    and quantum regimes.
- title: Scalable, Energy-Efficient Optical-Neural Architecture for Multiplexed Deepfake
    Video Detection
  date: 2026-05
  url: https://arxiv.org/abs/2605.19360v1
  category: optical-computing
  subcategory: method
  authors:
  - Parnian Ghapandar Kashani
  - Shiqi Chen
  - Aydogan Ozcan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid proliferation of AI-generated visual media has created an urgent
    need for efficient, trustworthy deepfake detection systems. However, existing
    deep learning-based detection methods rely on computationally intensive and energy-demanding
    inference algorithms, limiting their scalability. Here, we present a hybrid digital-analog
    deepfake video detection framework that combines a lightweight digital front-end
    with a spatially multiplexed optical decoding back-end for massively parallel
    analog inference through a programmable spatial light modulator. By simultaneously
    processing 15 or more video streams within a single optical propagation pass,
    the system enables high-throughput and accurate video-level authenticity prediction
    at reduced computational cost compared with purely digital methods. We validated
    this hybrid deepfake video processor using different datasets spanning classical
    face-swapping, real-world deepfake recordings, and fully AI-generated videos.
    Using a spatially multiplexed experimental set-up operating in the visible spectrum,
    we achieved average deepfake detection accuracy, sensitivity and specificity of
    97.79%, 99.86% and 95.72%, respectively, on the Celeb-DF video dataset with 15
    videos tested in parallel in a single optical pass per inference. The multiplexed
    optical decoder also demonstrates resilience against various types of video degradation,
    noise, compression, experimental misalignments and black-box adversarial attacks.
    Our results show that integrating optical computation into AI inference enables
    simultaneous gains in throughput, energy efficiency, and adversarial robustness
    - three properties that are difficult to achieve together in purely digital systems.
- title: 'HoloPathTracer: Fast and Accurate Wave Path Tracing for Holography'
  date: 2026-06
  url: https://arxiv.org/abs/2606.14173v2
  category: optical-computing
  subcategory: method
  authors:
  - Wenbin Zhou
  - Xiangyu Meng
  - Jiankai Xing
  - Xin Liu
  - Suyeon Choi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Holography offers unique advantages for delivering perceptual realism
    while preserving compact form factors in VR/AR. Its perceptual quality, however,
    hinges on encoding rich wavefronts of photorealistic scenes into interference
    patterns and then incoherently multiplexing the resulting wave fields for perception.
    Existing CGH paradigms decouple radiance estimation from wave propagation by pre-rendering
    radiance on discretized scene sectors. This separation between radiometric and
    wave-optical computation inherently limits the range of focus cues and visual
    effects that can be faithfully reproduced, including depth- and view-continuity,
    and physically based material behaviors such as glossy or mirror-like reflection
    and refraction. We present a physically accurate yet computationally efficient
    wave optics rendering framework leveraging path tracing to encode full 3D visual
    cues into phase holograms. Specifically, we employ a Monte Carlo method to solve
    both the rendering equation and the Rayleigh--Sommerfeld integral simultaneously.
    Our algorithm is fully compatible with modern graphics techniques and can generate
    multiple time-multiplexed random holograms with minimal additional time cost via
    Path Reuse. By employing a fast approximation with an ambient radiance cache,
    we realize an order of magnitude convergence speed improvement. The resulting
    coherent wave fields that inherently encode comprehensive visual effects are converted
    into phase-only holograms under complex-amplitude supervision. Through extensive
    simulations and experimental validations on a spatial light modulator-based display
    prototype, we demonstrate faithful holographic reconstructions of natural 3D cues
    and complex materials, including realistic defocus blur, view-dependent effects,
    as well as appearance highlights and reflections.
- title: 'Breaking the Cascade: Compact Nonlinear Optical Computing with Single-Layer
    Encoder-Decoder Co-Localization'
  date: 2026-05
  url: https://arxiv.org/abs/2606.01032v1
  category: optical-computing
  subcategory: method
  authors:
  - Yuntian Wang
  - Alexander Chen
  - Md Sadman Sakib Rahman
  - Aydogan Ozcan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We demonstrate that nonlinear computing can be achieved with a single
    linear diffractive surface under coherent illumination. We introduce a compact
    encoder-decoder co-localization (E+D) architecture in which an input-dependent
    dynamic encoder and a static optimized decoder are integrated within the same
    phase-only diffractive plane. Following free-space propagation, coherent interference
    between the encoder and decoder fields, combined with intensity detection, generates
    programmable nonlinear input-output mappings without requiring nonlinear optical
    materials or multiple diffractive layers. We prove that the proposed E+D optical
    processor is a universal approximator for arbitrary real-valued band-limited nonlinear
    functions and identify the physical factors governing its approximation fidelity,
    including the decoder degrees-of-freedom, detector aperture, and axial propagation
    distance. Crucially, we demonstrate that introducing a trained, frozen phase bias
    to the encoder region systematically enhances functional expressivity, providing
    robustness against coarse phase quantization on spatial light modulators. Using
    this framework, we accurately synthesize diverse nonlinear functions, including
    commonly used neural network activation functions and complex-valued nonlinear
    functions. Finally, we experimentally validate the proposed approach using a visible-light
    optical set-up trained through in situ learning, demonstrating the parallel approximation
    of 9 nonlinear functions in a single optical forward pass. By collapsing nonlinear
    optical computation into a single diffractive surface, the E+D architecture substantially
    reduces hardware and alignment complexity while preserving powerful function-approximation
    capabilities, providing a compact and scalable framework for analog information
    processing.
- title: Visible Spectral-Domain Optical Coherence Tomography for Photonic Integrated
    Circuits Characterization
  date: 2026-03
  url: https://arxiv.org/abs/2603.23815v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yin Min Goh
  - Chao Li
  - Yunchan Hwang
  - Helaman Flores
  - Mahmoud Jalali Mehrabad
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Visible photonic integrated circuits underpin applications ranging from
    AR/VR to quantum control, yet lack a high-resolution, nondestructive diagnostic
    comparable to the optical frequency-domain reflectometry used in infrared silicon
    photonics. Here we adapt spectral-domain optical coherence tomography to measure
    guided-mode back-reflections in visible PICs. Broadband visible light injected
    into a circuit generates back-reflections that interfere with a depth-referencing
    local oscillator, and the resulting spectral fringes are recorded on a spectrometer.
    We validate the approach by resolving multiple round-trip echoes in a waveguide-coupled
    ring resonator using only single-port access. We then extend it to circuits integrated
    with diamond quantum micro-chiplets, clearly resolving input and output facets
    as well as PIC--QMC transition regions. The system achieves shot-noise-limited
    sensitivity, 50 dB dynamic range, 8 um axial resolution in silicon nitride, and
    a 2 mm imaging depth at 6 dB roll-off. SD-OCT therefore provides a practical,
    high-resolution diagnostic for visible PICs that uses a broadband probe source
    and requires only single-port optical access, enabling rapid characterization
    of propagation loss, backscattering, and dispersion.
- title: Silicon Photonics-based Heterodyne Interferometric Imager for free-space
    imaging
  date: 2026-04
  url: https://arxiv.org/abs/2604.03468v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Humphry Chen
  - Mingye Fu
  - Shun-Hung Lee
  - Shelbe Timothy
  - Lawrence Shing
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper reports on the design, fabrication, and demonstration of a
    silicon photonics based heterodyne interferometric imaging system. The photonic
    integrated circuit (PIC) can perform one-dimensional spectroscopy for unique input
    spectrums using a single baseline within its 91 available baselines. The PIC uses
    polarization diversifying gratings to separate incoming light into two distinct
    polarizations, an on-chip 2x4 optical hybrid, and a strong local oscillator (LO)
    to perform the heterodyne measurements. The optical hybrids combine the input
    signals with the LO and splitting them into 2 components pairs for phase sensitive
    measurements. Furthermore, the PIC can perform 2-D image reconstruction by combining
    many baseline pairs to measure the visibility of a simple target. These demonstrations
    show the PIC's capabilities for 1-D spectroscopy and 2-D imaging applications.
- title: Ultra-low loss piezo-optomechanical low-confinement silicon nitride platform
    for visible wavelength quantum photonic circuits
  date: 2026-03
  url: https://arxiv.org/abs/2603.02584v3
  category: silicon-photonics
  subcategory: systems
  authors:
  - Mayank Mishra
  - Gwangho Choi
  - Wenhua He
  - Gina M. Talcott
  - Katherine Kearney
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The stringent demands of photonic quantum computing protocols motivate
    photonic integrated circuit (PIC) platforms with passive optical properties such
    as extremely low losses and correspondingly large circuit depths, as well as active
    optical properties such as high reconfiguration rates, low power dissipation,
    and minimal crosstalk. At the same time, many quantum photonic resource state
    generators, such as single-photon sources and quantum memories, require operation
    in the visible wavelength range. These requirements make the passive optical properties
    of CMOS-fabricated, ultralow-loss, low-confinement silicon nitride waveguides
    especially attractive. However, the conventional active properties of these systems
    based on thermo-optic modulation are plagued by high levels of crosstalk, slow
    modulation rates, and high power dissipation. Although there have been recent
    demonstrations of CMOS-fabricated, visible wavelength, piezo-optomechanical PICs
    that solve the above challenges associated with implementing active functionality,
    these have made use of high-confinement waveguides with currently demonstrated
    losses of order $0.3$-$1~\mathrm{dB/cm}$, precluding circuit depths required for
    scalable quantum algorithms. Here, we demonstrate that combining piezo-optomechanical
    actuation with a low-confinement, ultra-low loss silicon nitride platform addresses
    the scalability challenge while enabling high-performance active functionality
    at visible wavelengths. This platform achieves a propagation loss $0.026~\mathrm{dB/cm}$
    at $780~\mathrm{nm}$, modulation bandwidths in the MHz range, and a phase shifter
    voltage-length product ($V_πL$) of approximately $2.8~\mathrm{\mathrm{V}\cdot\mathrm{m}}$
    and negligible hysteresis. We further demonstrate reconfigurable Mach-Zehnder
    interferometers based on spiral phase shifters with 0.63 dB loss per phase shifter.
- title: Benchmarking Dual-Polarization Silicon Nitride Photonic Integrated Circuits
    for Trapped-Ion Quantum Technologies
  date: 2026-03
  url: https://arxiv.org/abs/2603.22578v3
  category: silicon-photonics
  subcategory: systems
  authors:
  - Carl-Frederik Grimpe
  - Anastasiia Lüßmann-Sorokina
  - Guochun Du
  - Pragya Sah
  - Steffen Sauer
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Trapped ions are one of the most advanced platforms for quantum technologies,
    with applications ranging from quantum computing to precision timekeeping. A crucial
    step towards more compact and scalable systems involves integrating photonic integrated
    circuits (PICs) into surface ion traps to enable on-chip light delivery and optical
    addressing of individual ions. Currently, most implementations rely solely on
    transverse-electric (TE) mode grating couplers, where the emitted light is polarized
    in the plane of the chip. In this work, we design, fabricate and characterize
    silicon nitride (Si\(_3\)N\(_4\)) PIC components, including incoupling structures,
    splitters, and grating couplers that support both TE and transverse-magnetic (TM)
    modes with comparable optical losses. We benchmark the PIC at 760\,nm, which is
    a typical wavelength for Yb$^{+}$-applications. The fabricated grating couplers
    enable the outcoupling of collimated free-space beams for both polarizations,
    exhibiting distinct emission angles. This dual-polarization capability gives more
    flexibility in polarization control and expands the accessible optical design
    space for trapped-ion quantum technologies.
- title: Free-Running Waveguide-Integrated Single-Photon Avalanche Detectors for Visible
    Light
  date: 2026-06
  url: https://arxiv.org/abs/2606.22863v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Aswin Alexander
  - Anirudh R. Ramaseshan
  - Soe M. Thar
  - Thomas Y. L. Ang
  - Jing Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Waveguide-integrated single-photon avalanche detectors (SPADs) are essential
    components of integrated photonics platforms for scalable extreme-low-light applications
    without the use of cryogenics. Here, we demonstrate an integrated SPAD for visible
    light operating at room temperature in a free-running mode without gating. The
    device is based on a doped silicon diode end-fire-coupled to a silicon nitride
    (SiN) photonic integrated circuit (PIC). We investigate a range of lateral and
    vertical doping profile designs, and operate the devices with a simple current-mode
    passive quenching circuit. The optimal device is a laterally-doped p-i-n+ SPAD
    with a maximum photon detection efficiency (PDE) of 1.95 +/- 0.32% for input light
    at 685 nm wavelength, when reverse-biased at an excess of 1.5 V beyond the breakdown
    voltage of 15.0 V. We identify promising avenues for improving device performance,
    which would enable such integrated SPADs to be an attractive choice for cutting-edge
    integrated photonics solutions in quantum technologies, low-light imaging, and
    high-speed communications at visible wavelengths.
- title: Design Considerations for Phase Modulation in Testable Photonic Systems and
    Co-packaged Optics
  date: 2026-06
  url: https://arxiv.org/abs/2606.19674v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Pratishtha Agnihotri
  - Priyank Kalla
  - Steve Blair
  venue: ''
  code_url: ''
  project_url: ''
  abstract: As silicon photonic integrated circuits (PICs) scale in complexity, testing
    and calibration increasingly depend on effective phase modulation mechanisms.
    This work compares thermally induced phase modulation and carrier-based electrical
    modulation in Mach-Zehnder and microring modulators. The devices are designed
    and evaluated for extinction ratio, tuning efficiency, power consumption, and
    modulation bandwidth. The study identifies key trade-offs among modulation speed,
    energy consumption, and tuning controllability that directly influence the suitability
    of these methods for test signal generation and calibration tasks. The results
    highlight the relative advantages and limitations of thermal and electrical approaches
    across different operating regimes. These findings provide practical design guidance
    for selecting phase modulation strategies in scalable silicon photonic systems
    with integrated test and calibration requirements.
- title: High-Endurance, Low-loss Sb2Se3 Optical Switches on Silicon Nitride using
    Transparent Conductive Heaters
  date: 2026-04
  url: https://arxiv.org/abs/2604.11649v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xingshi Yu
  - Ipsita Chakraborty
  - Isaac Johnson
  - Savvas I. Raptis
  - Qianbin Luo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report an electrically actuated, low-loss non-volatile optical switch
    based on the phase-change material (PCM) Sb2Se3 integrated on a silicon nitride
    (Si3N4) platform. The device is fabricated using an 8-inch wafer-scale process
    flow, demonstrating the feasibility of scalable manufacturing for photonic integrated
    circuits (PICs). By employing transparent indium tin oxide (ITO) micro-heaters,
    reversible switching between the amorphous and crystalline states is achieved
    with an extinction ratio of 25~dB and an endurance exceeding 140 million switching
    cycles, establishing a new benchmark for non-volatile integrated photonic memory
    and reconfigurable architectures. Furthermore, multi-level operation beyond 6
    bits can be repeatably demonstrated by tailoring the electrical pulse widths,
    enabling precise control of the optical phase. These results highlight a scalable
    and energy-efficient platform for high-density programmable and non-volatile photonic
    integrated systems.
- title: Lasing from SOI-integrated GaAsSb nanowires via resonator-driven optical
    feedback
  date: 2026-05
  url: https://arxiv.org/abs/2605.20832v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - J. Zöllner
  - C. Doganlar
  - C. García Marcilla
  - S. Meder
  - G. Koblmüller
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon photonic integrated circuits critically depend on compact on-chip
    light sources, for which nanowire (NW) lasers are an attractive solution. However,
    their practical implementation is often limited by broad emission linewidths and
    poor frequency stability resulting from weak optical feedback. Here, we integrate
    individual GaAsSb NWs by transfer-printing onto silicon-on-insulator (SOI) racetrack
    resonators to realize optical feedback at silicon-transparent wavelengths. Finite-difference-time-domain
    simulations reveal efficient coupling between the hybrid NW-waveguide mode and
    the fundamental TE resonator mode, with calculated cavity Q-factors exceeding
    10$^4$. Experimentally, we observe feedback-induced lasing emission at a low threshold
    (P$_{th}$) of 8.6 $\pm$ 1.8 $μ$J/cm$^2$. Compared to identical NW lasers without
    SOI resonator, the linewidth is reduced by more than a factor of four at 3P$_{th}$
    and remains stable below 1.8 meV up to 5P$_{th}$. Our results demonstrate NW-based
    light sources on SOI and show that tailored resonator designs enable improved
    linewidth control and frequency stabilization.
- title: Building reliable 3D photonic integrated circuits and cavities at the wafer
    scale
  date: 2026-04
  url: https://arxiv.org/abs/2604.12889v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yuhao Huang
  - Yunqi Fu
  - Yu Xia
  - Yuemin Li
  - Zheng Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Three-dimensional (3D) photonic integrated circuits (PIC) are emerging
    as an indispensable scheme for high density and multifunctional photonic systems.
    However, the wafer-scale scaling of PICs towards a 3D configuration is constrained
    by two key factors: (i) the trade-off between inter-layer taper efficiency and
    footprint, and (ii) wafer-scale uniformity of inter-layer transition loss. In
    this work, we introduce etch-back assisted chemical mechanical polishing (E-CMP)
    to achieve high wafer-scale uniformity of the spacer layer. Moreover, we break
    the efficiency-footprint trade-off by demonstrating a novel $κ$-engineered taper,
    achieving a reliability metric that is 75\% higher than the traditional linearly
    tapered structure. Building on these design and fabrication developments, we enable
    reliable 3D PICs with typical loss of 0.077 and 0.068 dB/cm on two silicon nitride
    (SiN) waveguide layers and typical 3D transition loss as low as 6 mdB. Furthermore,
    the low 3D transition loss enables the first class of 3D high-Q optical cavities
    occupying two distinct device layers, providing new design space for high-Q optical
    cavities. The scalable fabrication process and design methodology provide routes
    for wafer-scale reliable 3D PICs that are promising in a series of applications
    ranging from photonic interconnects and computing networks to high-density photonic
    sensors and nonlinear photonics.'
- title: Enhancing Co-packaging Optics Enabled Silicon Photonics Security Assurance
    Hardware Fingerprinting
  date: 2026-06
  url: https://arxiv.org/abs/2606.27612v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Liton Kumar Biswas
  - M Shafkat M Khan
  - Himanandhan Reddy Kottur
  - Hao Wang
  - Hamed Dalir
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon photonics enables integration of optical components using standard
    semiconductor processes, greatly improving data communication bandwidth and energy
    efficiency. However, photonics integrated circuits (PICs) face unique security
    challenges, such as counterfeit or tampering threats, that conventional electronic
    security methods do not address. We propose a novel hardware fingerprinting technique
    that embeds two dimensional photonic crystal patterns into the density control
    filler regions of a PIC. Each PhC pattern is designed to resonate a specific visible
    to near infrared wavelengths, producing a distinctive optical signature (based
    on wavelength, polarization, and incident angle) for each device. Finite difference
    time domain (FDTD) simulation using ANSYS Lumerical is employed to optimize nanostructure
    dimensions and spacing so that each device's reflection/absorption spectrum contains
    unique narrowband peaks. No extra fabrication steps or materials are required
    beyond standard lithography, keeping costs low. The embedded nanostructures have
    sub-50nm precision, making forgery extremely difficult. Our method yields a high
    resolution, scalable fingerprint for silicon photonic chips, enabling cost-effective
    device authentication and improved supply chain security.
- title: Ultrawide-angle diffraction-limited 2D beam steering via hybrid integrated
    metasurface-photonic circuit
  date: 2026-04
  url: https://arxiv.org/abs/2604.13233v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Zhiping He
  - Luigi Ranno
  - Padraic Burns
  - Fan Yang
  - Hung-I Lin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Two-dimensional (2D) wide field-of-view (FOV) beam steering is a key enabling
    capability for emerging free-space optical systems, including inter-satellite
    optical links, airborne LiDAR, point-to-point optical wireless communications,
    and collaborative robotic platforms. These applications require rapid acquisition
    and tracking across both azimuth and elevation; architectures that offer wide
    scanning in only one dimension while maintaining limited coverage in the orthogonal
    direction constrain link availability, coverage uniformity, and system agility.
    Here, we demonstrate a chip-scale platform for ultrawide-angle, diffraction-limited
    2D beam steering based on hybrid integration of a silicon photonic integrated
    circuit (PIC) and an optical metasurface. A free-form micro-optical reflector
    efficiently transforms the guided waveguide mode into an expanded free-space beam
    that illuminates an analytically optimized ultrawide-FOV metasurface. The integrated
    system achieves a measured FOV exceeding 160° while maintaining diffraction-limited
    beam quality over a broad angular range at telecom wavelengths. This hybrid PIC-metasurface
    architecture provides a compact and scalable route to high-quality 2D beam steering
    and establishes a practical pathway toward integrated optical projectors for space-based
    optical communications and other applications requiring agile, wide-angle, high-fidelity
    beam control.
- title: Zero-change foundry compatible silicon photonics MEMS optical switch
  date: 2026-08
  url: https://arxiv.org/abs/2608.03146v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Arkadev Roy
  - Daniel Klawson
  - Jianheng Luo
  - Yiyang Zhi
  - Sirui Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large-scale photonic switches are emerging as essential devices for energy-efficient
    optical interconnect in data centers and AI/ML clusters as a key enabler for high-bandwidth
    and low-latency connectivity. Combining micro-electro-mechanical (MEMS) based
    mechanical reconfigurability with silicon photonic integrated circuits can enable
    a large-scale, low-loss, programmable platform required for large-scale optical
    circuit switches. We demonstrate a broadband silicon photonics MEMS switch with
    more than 30 dB extinction ratio operating in C-band using a zero-change foundry-compatible
    process and Back-end-of-Line (BEOL) post-processing. The optical switch element
    exhibits an insertion loss of less than 1.5 dB with a low static power consumption
    of approx 20 nW at maximum actuation voltage. Our results illustrate that MEMS-based
    silicon photonics modulators and phase shifters can be used alongside standard
    silicon photonics components seamlessly in scenarios where performance in terms
    of footprint, extinction ratio, broad bandwidth, and low-loss operation is of
    paramount importance.
- title: A single-step lithography process for reconfigurable SiN photonics with TiN
    heaters and Al interconnects
  date: 2026-06
  url: https://arxiv.org/abs/2606.10898v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Leonardo Limongi
  - Rachele Favaretto
  - Lorenzo Baldessarini
  - Martino Bernard
  - Yong Kwon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Thermo-optic phase shifters are key building blocks in Silicon and Silicon
    Nitride-based reconfigurable photonic integrated circuits. They enable manipulating
    the phase of an optical signal by means of electrically-driven heating of an optical
    waveguide. Conventional fabrication schemes typically require dedicated lithographic
    steps to separately define the resistive heaters, the current transmission lines,
    and the electrical contact pads. This increases the process complexity and slows
    the standard complementary metal-oxide-semiconductor (CMOS) fabrication flows.
    In this work, we present a single-step lithographic process for the realization
    of Titanium Nitride thermo-optic phase shifters and Aluminum interconnects integrated
    on a Silicon Nitride photonic platform. A detailed electro-optical characterization,
    performed on two platforms operating at 810 nm and 1550 nm, revealed $π$-shift
    powers of 92 $\pm$ 2 mW and 120 $\pm$ 10 mW, respectively. Alongside, modulation
    bandwidths of 8.5 $\pm$ 0.3 kHz and 3.83 $\pm$ 0.03 kHz were extracted from combined
    frequency- and time-domain analyses. Our results demonstrate that the proposed
    single-step lithographic metal definition process represents a robust, viable
    and cost-efficient route towards CMOS-compatible reconfigurable Silicon Nitride
    photonics.
- title: An ultralow-loss integrated photonic platform for discrete-variable quantum
    information processing
  date: 2026-06
  url: https://arxiv.org/abs/2606.26910v3
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ruiyang Chen
  - Zeying Zhong
  - Sanli Huang
  - Sicheng Zeng
  - Zhenyuan Shang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits offer a scalable and robust route toward
    quantum information technologies by consolidating photon sources and linear optical
    networks onto compact, wafer-manufacturable chips. Although silicon photonics
    has enabled diverse discrete-variable quantum breakthroughs -- spanning multiphoton
    entanglement, quantum networking, and photonic qubit fusion for quantum computing
    -- scaling these platforms beyond proof-of-principle demonstrations remains severely
    constrained by a critical system-level bottleneck. Optical loss compounds rapidly
    across photon generation, routing, and state analysis, causing multiphoton generation
    probabilities to plummet exponentially as circuit depth and complexity grow. Here
    we overcome this rate-loss barrier by demonstrating a monolithic, ultralow-loss
    silicon nitride (Si$_3$N$_4$) integrated photonic platform engineered for high-performance
    discrete-variable quantum information processing. Our architecture seamlessly
    integrates narrowband photon-pair sources with low-loss qubit-fusion circuits
    and reconfigurable state-analysis interferometers. The on-chip sources prepare
    Einstein-Podolsky-Rosen (EPR) states with a fidelity of 0.9875(3) and exhibit
    near-unity photon indistinguishability, yielding a heralded Hong-Ou-Mandel interference
    visibility of 0.990(6). By executing on-chip fusion of two EPR states, we synthesize
    and characterize four-photon Greenberger-Horne-Zeilinger states with a record
    fidelity of 0.943(8) and a fourfold count rate of 27 Hz -- more than two orders
    of magnitude higher than previous silicon-photonic implementations. Combined with
    standard CMOS-compatible fabrication on 150-mm-diameter wafers, these results
    establish ultralow-loss Si$_3$N$_4$ integrated photonics as a definitive, manufacturable
    platform for deployable, large-scale quantum information processors.
- title: Multifunctional Barophotonic Control of Resonators and Metasurfaces
  date: 2026-05
  url: https://arxiv.org/abs/2605.15065v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ping-Chun Chen
  - Mashnoon Alam Sakib
  - Mariia Stepanova
  - Melika Momenzadeh
  - Maxim R. Shcherbakov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Actively tunable nanophotonic platforms that control light-matter interactions
    enable reconfigurable optical systems and programmable photonic integrated circuits.
    Hydrostatic pressure provides a noninvasive and material-agnostic mechanism for
    modulating the refractive index and resonance conditions without introducing free
    carriers or structural damage. Here, we demonstrate multiple pressure-dependent
    functionalities in silicon nitride nanostructures, including resonance tuning,
    refractive index modulation, and polarization state conversion. Applying a pressure
    of up to 5 GPa, we observe a Fabry-Pérot resonance shift of up to 30 nm and a
    relative refractive index decrease of up to 4%. Based on the results, we design
    and examine, to the best of our knowledge, the first extreme-pressure-tunable,
    polarization-converting metasurface, which tunes the ellipticity and orientation
    angle of the output light. These findings establish pressure-controllable silicon
    nitride as a viable platform for reconfigurable photonics and extreme-environment
    nanophotonic systems, including deep-ocean exploration, planetary interiors, and
    space applications.
- title: DC-to-GHz Modulation In Microring Modulators Using Ferroelectric Nematic
    Liquid Crystal-on-Silicon in a Foundry Photonic Process
  date: 2026-02
  url: https://arxiv.org/abs/2602.20406v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Iman Taghavi
  - Alexander Tofini
  - Edward K. Leung
  - Cory Pecinovsky
  - Nicolas A. F. Jaeger
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon-organic hybrid (SOH) platforms exhibit exceptional electro-optic
    (EO) properties, including high-speed operation, low energy consumption, and compact
    footprints. However, the absence of a scalable poling method for EO polymers,
    combined with the slow switching speeds characteristic of liquid crystals, has
    impeded the integration and compatibility of these materials with commercial silicon
    photonic foundries. On the other hand, the realization of very-large-scale photonic
    integrated circuits (PICs) in the native silicon photonics platform itself is
    impeded by the complexities associated with the wavelength and thermal stabilization
    for microring modulators (MRMs). This study establishes the foundation for a poling-free,
    CMOS-compatible SOH MRM platform by exploiting simultaneous AC phase shifts in
    ferroelectric nematic liquid crystals (FN-LCs). We present the first demonstration
    of an MRM coated with FN-LC, with both the RF signal and the DC bias applied to
    the same electrodes, taking advantage of the dual phase shift uniquely available
    in FN-LC. An EO bandwidth of f$_{-6dB}\approx$ 7.8 GHz is achieved \textendash~
    the highest reported value for an SOH MRM to date. As a proof of concept, we demonstrate
    an approximately linear resonance shift across the full width at half maximum
    ($\approx$ 150 pm/V), with a static power efficiency of $\approx$ 4.5 nW/$π$ for
    an MRM occupying a total footprint of $\approx$ 0.084 mm$^2$ and exhibiting an
    on-chip optical insertion loss of $\approx$ 0.78 dB. Successful infiltration of
    FN-LC, selectively patterned on top of phase shifters, along with optical input/output
    channels established using free-form photonic wire bonds, is demonstrated in the
    proposed PIC.
- title: Frozen mode in coupled single-mode waveguides with gratings
  date: 2026-03
  url: https://arxiv.org/abs/2603.10286v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Albert Herrero-Parareda
  - Nathaniel Furman
  - Bradley J. Thompson
  - Ricky Gibson
  - Ilya Vitebskiy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a systematic methodology for designing slow-light photonic
    integrated circuits with a frozen mode based on a special kind of exceptional
    point of degeneracy (EPD) of order three named stationary inflection points (SIPs).
    This is realized through three-way coupled waveguides with lateral gratings operating
    at telecommunication wavelengths. We provide two designs and analyze sensitivity
    to geometric perturbations. We have fabricated a periodic waveguide with integrated
    taper loads and demonstrate reasonable agreement with full-wave simulations. These
    findings confirm the feasibility of integrating SIP-based delay functionalities
    in standard silicon photonic platforms.
- title: Ion-Implanted Silicon Nanoregions Enable Ultra-Low-Loss Trimming of Cladded
    Photonic Integrated Circuits
  date: 2026-07
  url: https://arxiv.org/abs/2607.08266v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Zhongyu Tang
  - Shabnam Taheriniya
  - Seongmin Jo
  - Xinyu Ma
  - Akhil Varri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits (PICs) have emerged as a key platform for
    information processing, including optical communication and computing. As PIC
    complexity increases, fabrication-induced response deviations accumulate, making
    post-fabrication trimming critical for unlocking their full potential. Here, we
    demonstrate that silicon ion implantation enables scalable, ultra-low-loss trimming
    of cladded PICs by locally forming a high-index silicon-rich region. Structural
    characterization confirms that the silicon-implanted nanoregion is confined to
    the cladding without observable damage to the underlying waveguide. The implantation-induced
    excess loss is below 0.001 dB per π phase shift, while the optical response remains
    stable over a four-month observation period. Automated trimming is demonstrated
    on a photonic crossbar array, reducing the average channel output variation from
    78.5% to 5.9%. These results establish a practical route towards automated, ultra-low-loss
    post-fabrication trimming for large-scale cladded PICs.
- title: Monolithic Integration of Piezo-Optomechanical Photonics and CMOS Electronics
  date: 2026-07
  url: https://arxiv.org/abs/2607.01514v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Matthew Zimmermann
  - Aileen Zhai
  - Andrew J. Leenheer
  - Julia Boyle
  - Mayank Mishra
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Next-generation photonic architectures for AI, sensing, and quantum computing
    require thousands to millions of reprogrammable photonic devices on a chip[1].
    The monolithic integration of Electronically-backed Photonic Integrated Circuits
    (EPICs) allows for very high density electrical interconnection and electronic
    drivers that can scale with photonics. Piezo-optomechanical photonic integrated
    circuits (POMPICs) offer low power consumption, high speed modulation, cryogenic
    compatibility and broadband optical transparency from ultraviolet to infrared
    wavelengths[2,3], but have not been demonstrated with monolithically integrated
    CMOS electronics. Here, we show a fully monolithic, all-CMOS fabricated platform
    for POMPICs co-fabricated with commercial control electronics. 200 millimeter
    photonic wafers are constructed directly on completed CMOS driver wafers by back-end-of-line
    processing, connecting integrated piezoelectric actuators under broadband silicon
    nitride waveguides to a high-density digital backplane comprising &gt;2 million
    electrical connections per die with 6.4x6.4 micron electrode pitch. We introduce
    segmented POMPIC components as Photonic Digital-to-Analog converters (PDACs) that
    convert low-voltage digital electronic signals to multi-bit analog optical phase
    and amplitude modulation, and we demonstrate parallel control of optical phase
    shifters, Mach-Zehnder interferometers, optical routing trees, and tunable ring
    resonators using a standard HDMI interface to program CMOS electronics. We test
    multiple reticles and perform electronic and photonic characterization across
    the entire wafer to establish uniformity and yield, demonstrating wafer-scale
    integration of POMPICs on an electronic backplane and enabling dense, scalable
    electronic control of piezo-optomechanical circuits.
- title: Broadband on-chip Half Maxwell Fisheye
  date: 2026-06
  url: https://arxiv.org/abs/2606.28038v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xin Zheng
  - Quan Yue
  - Jean-René Coudevylle
  - Aziz Benamrouche
  - Ségolène Callard
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In this article, we report on the design and the experimental evidence
    of a Half Maxwell Fish Eye (HMFE), for Silicon Photonics and working at telecommunication
    wavelength. It is designed by implementing a Graded Photonic Crystal operating
    in the non-resonant metamaterial regime. The results of 3D Finite-Difference Time-Domain
    simulations (FDTD) show an excellent broadband focusing capacity. It has been
    urther fabricated via the Silicon On Insulator (SOI) platform for its compatibility
    with CMOS technology. Experimentally, its performances are firstly investigated
    by the means of a fan-shaped set output waveguides. Next, Scanning Near-Field
    Optical Microscopy (SNOM) characterisation confirms the wavefront curving inside
    the HMFE lens. Quantitative analysis of the SNOM results demonstrates its excellent
    focusing performances: the Full Width Half Maximum (FWHM) is $0.466λ_0$ at $λ_0=1550$nm,
    while the thickness of the lens is $3.18λ_0$.'
- title: 'Kramers-Kronig causality in integrated photonics: The spectral tension between
    ultraviolet transition and mid-infrared absorption'
  date: 2026-03
  url: https://arxiv.org/abs/2603.28676v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yue Hu
  - Zhenyuan Shang
  - Chenxi Zhang
  - Yuanjie Ning
  - Weiqin Zheng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Dispersion engineering via geometric confinement is essential to integrated
    photonics, enabling phenomena such as soliton microcombs, supercontinua, parametric
    oscillators, and entangled photons. However, prevailing methodologies rely on
    semi-empirical Sellmeier models that assume idealized material purity, neglecting
    the pronounced dispersion shifts induced by residual impurities like hydrogen-related
    bonds. Here, we demonstrate that these residual bonds fundamentally alter the
    dispersion landscape spanning from the ultraviolet (UV) to the mid-infrared (MIR)
    spectra. Specifically, they introduce MIR vibrational absorption while simultaneously
    modifying UV electronic transition, shifting the bandgap and UV pole. We show
    that the spectral tension between these UV and MIR modifications dictates the
    group velocity dispersion from the visible to the near-infrared (NIR) via the
    Kramers-Kronig causality. We experimentally validate this phenomenon through systematic
    characterization of broadband loss and dispersion in ultralow-loss silicon nitride
    photonic integrated circuits. By rigorously incorporating these effects, we bridge
    the gap between empirical fitting and predictive physical modelling. Our study
    resolves long-standing discrepancies in dispersion engineering, providing precision
    control essential for next-generation integrated photonics.
- title: Quantum-Secure Physical Unclonable Function enabled by Silicon Photonics
    Integrated Circuits
  date: 2026-05
  url: https://arxiv.org/abs/2605.14959v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - G. Sarantoglou
  - N. Tzekas
  - G. Moustakas
  - G. A. Karydis
  - V. Kaminski
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical Unclonable Functions (PUFs) are hardware security primitives
    whose inherent physical complexity can be exploited for secure authentication
    and cryptographic key generation. Silicon photonic devices, owing to their suitability
    for quantum and artificial intelligence applications alongside standard CMOS fabrication
    processes, constitute a highly promising substrate for integrated multifunctional
    PUFs. Despite the advanced security guarantees offered by quantum cryptographic
    protocols and the central role of silicon photonics in quantum technologies, quantum
    readout strategies based on single-photon states for photonic PUFs remain largely
    unexplored. In this work, we experimentally demonstrate a silicon nitride (SiN)
    programmable photonic Mach Zehnder interferometer mesh that implements a unitary
    transformation and operates as a PUF, whose secret physical signature arises from
    uncontrollable waveguide variations during fabrication. Using experimentally derived
    parameters from the SiN integrated mesh, we further introduce and numerically
    evaluate a quantum readout protocol that combines single-photon states with PUFs.
    Maximally mixed quantum states are employed to conceal the underlying unitary
    transformation from passive eavesdropping. Security against adversaries possessing
    devices fabricated under similar conditions is assessed, with authentication performance
    quantified through Monte Carlo analysis of the false acceptance and false rejection
    rates as a function of the number of detected events and corrected errors. The
    results indicate exceptional performance with equal error rates as low as 10 to
    the minus 14, highlighting the potential of quantum secure PUFs for high security
    authentication applications.
- title: High-Beam-Quality Meta-Grating Couplers for Large Collimated Free-Space Beams
    on Silicon-on-Insulator
  date: 2026-07
  url: https://arxiv.org/abs/2607.01477v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Max Schittenhelm
  - Sebastian Häfner
  - Steffen Sauer
  - Stefanie Kroker
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits on the silicon-on-insulator (SOI) platform
    typically interface with free space via grating couplers, but scaling these to
    collimated beams with diameters beyond 100 $μ$m requires a fundamentally different
    regime of extremely weak, spatially distributed coupling. While such large-area
    couplers have been demonstrated, their beam quality has remained largely uncharacterized,
    even though applications such as coupling into high-finesse resonators or trapping
    of cold atoms require both a large aperture and a near-Gaussian profile. This
    article presents an SOI meta-grating coupler that emits collimated, near-Gaussian
    beams of approximately 300 $μ$m waist diameter. The design synthesizes the required
    emission profile from a spatially tailored coupling strength, realized by locally
    varying a sub-wavelength unit cell while independently setting the local emission
    angle. This approach achieves the very low coupling strengths required for large
    beams and yields a measured beam quality of $M^2 \leq 1.10$. The scheme extends
    directly to other target profiles, such as flat-top or higher-order modes, rendering
    meta-grating couplers a practical chip-to-free-space interface for mode-matching-sensitive
    applications.
- title: Qualification pathways for Photonic Integrated Circuits in Astrophotonic
    Space Missions
  date: 2026-08
  url: https://arxiv.org/abs/2608.00834v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Kalaga Madhav
  - Aashia Rahman
  - Máté Ádámkovics
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits (PICs) promise order-of-magnitude reductions
    in the size, weight and power (SWaP) of optical subsystems for astronomy, planetary
    and Earth-observation missions, yet no PIC-specific space-qualification standard
    exists. This paper consolidates the principal NASA and ESA qualification documents
    that apply, or can be tailored, to astrophotonic PICs --- arrayed waveguide gratings,
    photonic lanterns, fibre Bragg gratings, and integrated beam combiners (ABCD,
    discrete beam combiners, nullers) for spectrographs and stellar interferometers.
    A master qualification table lists 19 standard test steps with applicable standards
    and EU/USA test facilities. Two reference mission profiles --- a LEO smallsat
    demonstrator and an HWO-class Lagrange-2 flagship --- yield a tailoring matrix,
    while a TRL-versus-test-coverage roadmap maps each activity onto the NASA/ESA
    readiness levels and review gates. A survey of UV/visible/near-infrared platforms
    relates spectral coverage, maturity and flight heritage, and a radiation-effects
    summary shows passive silica, Si3N4 and laser-written cores are essentially radiation-tolerant
    while active III--V and Ge devices carry the hardness burden. The central outcome
    is a seven-phase qualification template (PIC-SQT) with explicit TRL gates, exact
    test procedures and mission-class tailoring; we further identify qualification
    processes relevant to PICs that current standards do not cover, and document 40+
    years of optical-fibre flight heritage.
- title: A re-entrant chip-free-space photonic interface for telecom-to-Rubidium spectroscopy
  date: 2026-07
  url: https://arxiv.org/abs/2607.15186v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Jia-Lin Chen
  - Ruixin Zhou
  - Deng-Hong Liu
  - You-Long Fan
  - Zhu-Bo Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits (PICs) generate, route, and process light
    with high efficiency, scalability, and functional density on a single chip. Yet
    the tightly confined on-chip modes can not easily access or effectively interact
    with atomic vapors, fluids, gain media, and biological samples. Existing approaches
    require bringing the medium onto the chip or into a weak, tightly confined evanescent
    field, which restricts the interaction volume and the range of accessible media.
    Here, we demonstrate a re-entrant chip-free-space interface in which a thin-film
    lithium niobate circuit frequency-doubles telecom light, emits the 780~nm field
    through a Rubidium vapor cell, and recollects the reflected probe on the same
    chip. This emit-interact-recollect loop resolves the saturated absorption spectrum
    and stabilizes the telecom laser to within $\pm 280$~kHz over 2 hours. Our study
    paves an route to embed external media into PICs through the re-entrant photonic
    interface.
- title: Phase synchronization dynamics of two mutually coupled InP lasers in a quantum
    entropy source
  date: 2026-07
  url: https://arxiv.org/abs/2607.11806v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Berta Martínez-Pàmias
  - Miquel Rudé
  - Cristina Masoller
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum random number generators, at the core of digital trust infrastructures,
    rely on quantum entropy sources (QESs) to produce randomness from physical processes.
    The quantum origin certification of a QES requires a physical model compatible
    with the measured signal of the device. Here, we study Quside Technologies' phase-diffusion
    QES consisting of a photonic integrated circuit (PIC) that uses the interference
    of two indium phosphide (InP) lasers operated in gain-switching by simultaneously
    modulating their pump currents from below to above the threshold. This produces
    intensity pulses in each laser that have random optical phases due to quantum
    spontaneous emission. The lasers' intensities interfere via heterodyning, and
    from the interference signal a random bit is obtained per modulation cycle. While
    this system offers high scalability and compactness, residual coupling between
    the two lasers can induce phase synchronization, thus reducing its extractable
    entropy. Through experiments and simulations of a physical model based on coupled
    stochastic rate equations, we quantify this effect and link laser coupling to
    phase synchronization. We further derive an analytical model for the probability
    distribution of the measured interference intensity, enabling direct extraction
    of the quantum phase difference distribution and laying the groundwork for the
    QES optimization.
- title: 'Nonlinear pluggable optics: Digital signal processing-free Intensity Modulated
    Direct Detection links using analog photonic Next Generation Reservoir Computing'
  date: 2026-06
  url: https://arxiv.org/abs/2606.14052v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Nicholas Cox
  - Joseph Murray
  - Ross T. Schermer
  - Shuo S. Pang
  - Christopher Long
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In this work, we propose a Nonlinear Pluggable Optic (NLPO) transceiver
    that combines the low latency and low power consumption of Linear Pluggable Optics
    (LPO) with the range and robustness of digital signal processing (DSP)-based transceivers.
    The proposed NLPO uses an analog photonic Next-Generation Reservoir Computing
    (NGRC) architecture, constructed on a photonic integrated circuit (PIC), to compensate
    for electrical-domain distortions as well as optical-channel impairments from
    chromatic dispersion and Kerr nonlinearity. Focusing on a simulated 50 GBd PAM-4
    link, we find that the NGRC-based NLPO not only extends the range of LPO, but
    actually outperforms DSP-based solutions as well. Our simulations reveal two key
    advantages compared to DSP-based Intensity Modulation/Direct Detection (IM/DD)
    links: (1) the NGRC can take advantage of the optical phase information without
    requiring a local oscillator and (2) the NGRC can optically sample the transmitted
    data well above the symbol rate without requiring high-bandwidth electronics.
    This work showcases the potential for photonic NGRCs to outperform state-of-the-art
    digital solutions in real-world applications and opens a path to low-latency,
    lower-power IM/DD links at ranges of 10s of km.'
- title: Complex wavefront engineering via decoupled space-time modulation
  date: 2026-05
  url: https://arxiv.org/abs/2605.14468v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Virat Tara
  - Anna Wirth-Singh
  - Johannes E. Fröch
  - Arka Majumdar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Solid-state Spatial Light Modulators (SLMs) are fundamentally limited
    in their ability to achieve high spatial complexity and high temporal bandwidth
    simultaneously. High-speed, low-energy modulation requires sub-wavelength active
    mode volumes, and sophisticated spatial wavefront engineering necessitates an
    ultra-fine pixel pitch. While small pixels can simultaneously solve both, in conventional
    architectures, the dense 2D electrical routing required for such pixels creates
    an insurmountable physical bottleneck. This results in a compromise between the
    SLM refresh rate, number of pixels and the field of view. Here, we demonstrate
    a hybrid architecture that overcomes this limit by spatially decoupling the electrical
    modulation plane from the optical output plane. By integrating a metasurface doublet
    with a photonic integrated circuit (PIC)-based optical phased array (OPA), we
    achieve independent 2D electrical control over each phase-element while simultaneously
    realizing a three-fold reduction in effective pixel pitch. This decoupling allows
    us to maintain the small active volume required for high-speed operation, while
    circumventing the routing constraints of dense spatial array of emitters. We utilize
    this platform to demonstrate tunable varifocal lensing, 2D beam steering, and
    2D holography. Our work provides a scalable foundation for next-generation solid-state
    SLMs that simultaneously offer high speed, low power consumption, and large field
    of view.
- title: Heterogeneously Integrated Balanced Photodetector on an Ultra-Low Loss Silicon
    Nitride Delay Line Interferometer
  date: 2026-07
  url: https://arxiv.org/abs/2607.03008v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Rahul Chawlani
  - Fatemehsadat Tabatabaei
  - Mark W. Harrington
  - Kaikai Liu
  - Steven M. Zhu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Thin core silicon nitride photonics enables ultra-low loss, CMOS foundry
    compatible integration that supports wavelengths from the visible to shortwave
    infrared. Applications that can benefit from the resulting lower cost, improved
    robustness, and portability include quantum sensing and computing, ultra-low noise
    microwave generation, optical clocks, optical gyros, coherent fiber communications,
    and fiber sensing. An important next step is integration of functional circuits
    and systems on chip with heterogeneous integration of active components such as
    high-performance photodetection. Yet to date integrated high-performance photodetectors
    on the thin film silicon nitride platform has remained elusive. In this work,
    we demonstrate heterogeneous integration of an InGaAs on InP substrate Modified
    Uni-Traveling Carrier balanced photodetector with a 15-meter-long unbalanced thin
    core silicon nitride Mach-Zehnder Interferometer with a bandwidth of 0.92 GHz
    and a responsivity of 0.305 A/W at 1550 nm with a propagation loss as low as 2.5
    dB/m at 1600 nm. Using this circuit we demonstrate two functions, a meter-scale
    differential interferometer laser stabilization circuit achieving a nearly 23
    dB noise suppression at 1 kHz offset and an optical frequency discriminator frequency
    noise measurement with high sensitivity across 6 orders of magnitude from 10 Hz
    to 10 MHz. These results demonstrate that the high performance of thin core silicon
    nitride devices can be combined with integrated high-performance photodetection
    to realize on-chip stabilized lasers and circuits and pave the path towards full
    systems on chip.
- title: Steady-State Statistical Modeling of Digitally Stabilized Laser Frequency
    with Markov-State Feedback
  date: 2026-04
  url: https://arxiv.org/abs/2604.06676v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Swarnav Banik
  - Elliot Greenwald
  - Xing Pan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Laser frequency stabilization is conventionally analyzed using continuous-time
    control theory, which accurately models analog feedback but is insufficient for
    digital implementations where quantization, sampling, and stochastic noise shape
    the dynamics. In modern digital laser systems, such as Photonic Integrated Circuit
    (PIC)-based lasers, finite discriminator and actuator resolution, sampling delays,
    and measurement noise introduce stochastic behavior that deterministic models
    do not capture. We present a discrete-time Markov-state framework that models
    the evolution of the quantized actuator in a digital laser frequency lock, with
    state-transition probabilities determined by the frequency discriminator response,
    noise statistics, and implemented digital control logic. The steady-state actuator
    and locked-laser frequency distributions are obtained directly from the unit-eigenvalue
    solution of the transition matrix, providing immediate access to key stability
    metrics without long time-domain simulations. For white frequency noise, we show
    that the Markov formulation is exact under decorrelated sampling and update schemes,
    while correlated discriminator sampling introduces a predictable inflation of
    actuator variance without shifting the operating point. In the presence of colored
    noise, long-range temporal correlations induce sampling-dependent deviations in
    both actuator mean and variance, defining the regime of validity of the memoryless
    Markov description. This framework provides a compact and physically transparent
    tool for analyzing and optimizing digitally stabilized lasers in integrated photonic
    systems.
- title: Low-confinement silicon nitride waveguides manufactured via direct glass
    bonding
  date: 2026-04
  url: https://arxiv.org/abs/2604.12814v4
  category: silicon-photonics
  subcategory: systems
  authors:
  - Mikhail V. Tsvetkov
  - Dmitry V. Obydennov
  - Alexandr S. Rykov
  - Alexandr R. Shevchenko
  - Maxim V. Shibalov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reducing the fabrication cost of photonic integrated circuits while maintaining
    low optical losses and technological simplicity is essential for their wider implementation.
    In conventional manufacturing methods, the dielectric cladding thickness around
    waveguides is usually limited to $\sim20$~$μ$m, which complicates suppression
    of radiative losses and parasitic scattering in low-confinement geometries. In
    this paper, we propose and experimentally demonstrate an alternative technology
    for forming low-confinement waveguides in Borofloat~33 glass by thermal fusion
    bonding of two glass wafers. The waveguide pattern is formed by etching trenches
    with depths on the order of tens of nanometers into the glass, filling them with
    silicon nitride, removing the excess layer, and bonding the planarized glass surfaces,
    thereby forming a thick, symmetric dielectric cladding. As a proof of concept,
    we fabricated straight waveguides with a core height of 50~nm and widths from
    1.3 to 3.5~$μ$m. With butt coupling to standard SMF-28 single-mode fiber at 1550~nm,
    we obtained chip transmissions up to 60\%, corresponding to input/output coupling
    losses of $\sim1$~dB per facet and consistent with numerical estimates. Fabry--Perot
    analysis of high-resolution spectra measured with AR-coated lensed fibers gave
    effective propagation losses down to $0.62\pm0.36$ dB/cm, depending on waveguide
    width and polarization. The proposed approach provides a simple and scalable route
    to low-confinement glass-encapsulated photonic circuits with passive butt coupling,
    promising for long delay lines, external-cavity laser feedback circuits, and ring-resonator
    sensors.
- title: Analysis of a compact interferometric imager
  date: 2026-06
  url: https://arxiv.org/abs/2606.14224v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Laurent M. Mugnier
  - Vincent Michau
  - Hiyam Debary
  - Frédéric Cassaing
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The advent of photonic integrated circuits (PICs) will allow the replacement
    of the large aperture of an optical telescope by a dense array of small apertures
    combined interferometically. The light coming from aperture pairs can be combined
    by a PIC in order to extract interferogram characteristics known as complex visibilities,
    from which the observed object can then be reconstructed. In such a compact interferometric
    imager, the optical components dedicated to image formation in a regular telescope
    are no longer necessary. In particular, such a concept is relevant for space missions
    where weight and size are critical. In this communication, we study such an instrument
    concept, focusing on signal-to-noise considerations. We recall the design basis
    for the field and the spatial resolution, and we show that the spectral resolution
    must be no less than the field to resolution ratio. Then, we analyze the signal-to-noise
    ratio of this concept, assuming that each spatial frequency is recorded only once,
    and compare the signal-to-noise ratio with that of a monolithic telescope. We
    perform the comparison in Fourier space for an identical number of recorded photons.
    We show that the noise propagation of the interferometric imager is identical
    to that of a monolithic telescope that would have a flat Modulation Transfer Function
    with a level roughly given by the ratio of the small apertures' diameter to the
    maximum baseline. We conclude that the noise propagation in low and medium spatial
    frequencies is unfavorable for the interferometric imager.
- title: Low optical loss electrical isolation for multi-section monolithic GaSb-based
    photonic circuits
  date: 2026-08
  url: https://arxiv.org/abs/2608.08629v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Md Ajwaad Zaman Quashef
  - Nouman Zia
  - Jukka Viheriälä
  - Mircea Guina
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Monolithic photonic integrated circuits (PICs) platforms exploiting III-V
    materials combine passive and active waveguide structures in multi-section optoelectronic
    device architectures. Their operation requires high electrical isolation between
    adjacent functional sections without compromising the optical signal. This fundamental
    requirement is addressed for GaSb-based waveguides, which are known to exhibit
    high conductivity of p-type layers reducing the electrical isolation capability.
    To this end, a co-designed electrical-optical isolation strategy based on using
    deeply etched strip waveguides combined with adiabatic ridge-to-strip waveguide
    tapers in GaSb-based multiple-quantum-well heterostructures is proposed. While
    deep etching alone enables isolation resistances of up to 40 k-ohm, it severely
    degrades optical propagation. By introducing optimized adiabatic tapers, we demonstrate
    good optical performance as single-mode continuous-wave lasing in a two-section
    device with integrated absorber, while maintaining an isolation resistance of
    17.3 k-ohm; this corresponds to an approximately 17-fold improvement over previously
    reported GaSb two-section devices. The approach establishes a critical building
    block for the development of monolithic GaSb-based PICs operating above 2 um.
- title: Polarization-Sensitive Third Harmonic Generation in resonant silicon nitride
    Metasurfaces for deep-UV Emission
  date: 2026-04
  url: https://arxiv.org/abs/2604.11238v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Shroddha Mukhopadhyay
  - Maria Antonietta Vincenti
  - Radu Malureanu
  - Crina Cojocaru
  - Michael Scalora
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a combined experimental and theoretical study of enhanced third-harmonic
    generation (THG) in silicon nitride metasurfaces. These structures exhibit strong
    resonant nonlinear responses, enabling up to two orders of magnitude enhancement
    in THG compared to a flat silicon nitride etalon, driven by strong electromagnetic
    field localization. We investigate two polarization-selective metasurface geometries
    supporting transverse electric (TE) and transverse magnetic (TM) resonances, implemented
    in fully planar architecture. When driven by ultrafast near-infrared laser pulses,
    these resonances confine optical energy at the nanoscale, enabling efficient frequency
    up-conversion from the visible to the ultraviolet (UV) and deep-UV spectral regions.
    Through spectral mapping of the nonlinear response under both TE and TM excitation,
    we quantify field confinement, extract the effective nonlinear enhancement, and
    characterize the spectral dependence of the third-harmonic generation efficiency.
    This two-dimensional periodic platform provides a flexible design toolbox for
    engineering polarization-dependent UV and deep-UV light sources. More broadly,
    our results demonstrate that silicon nitride, a CMOS-compatible dielectric, can
    support efficient nonlinear up-conversion deep into the UV. This finding shows
    that access to short-wavelength nonlinear photonics does not require complex materials
    or architectures, but can instead be achieved using widely available dielectrics
    through careful structural design.
- title: Inverse-designed photonic interfaces beyond eigenmode expansion limits
  date: 2026-07
  url: https://arxiv.org/abs/2607.06243v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Chengfei Shang
  - Zhaoxi Chen
  - Yifan Wu
  - Hanke Feng
  - Cheng Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic integrated circuits (PICs) enable optical systems with dramatically
    increased performance, cost-effectiveness, and scalability through enhanced light-matter
    interactions, high-density integration, and mass production. Due to the significant
    mode mismatch between various integrated photonic platforms and optical fibers,
    spot-size conversion interfaces with low-loss, compact footprint, and high manufacturability
    are essential. Conventional spot-size converters based on intuitive designs often
    require multi-layer tapering structures and tiny waveguide tips to adiabatically
    expand the eigenmodes. These rigid design constraints commonly lead to large device
    footprints and the requirements of multiple high-precision lithography steps.
    In this paper, we overcome these limitations using inverse design methods, which
    optimize the coupling efficiency over a large parameter space beyond traditional
    eigenmode evolution limits. Specifically, we demonstrate efficient and ultra-compact
    photonic interfaces on the thin-film lithium niobate (TFLN) platform, where the
    partially etched rib waveguides and non-vertical sidewalls have previously hindered
    the achievement of low-loss waveguide tapers in single-layer configurations. Our
    inverse-designed photonic structures achieve simulated and experimentally measured
    coupling efficiencies as low as 1 dB and 3 dB per facet between TFLN waveguides
    and lensed/ultra-high numerical aperture (UHNA) fiber, with broad 1-dB bandwidths
    exceeding 120 nm. The inverse-designed interfaces are highly compatible with standard
    TFLN PIC components and require only a single high-resolution lithography step.
    More importantly, the design concept transcends traditional eigenmode evolution
    theories and is broadly applicable to a variety of material platforms and application
    scenarios.
- title: Lumerical-Based SiN Half-Band FIR Maximally Flat-Top Optical Filter with
    Low Insertion Loss and High Extinction Ratio at 193 THz
  date: 2026-07
  url: https://arxiv.org/abs/2607.10031v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Md Sanowar Hossain
  - G. K. M. Hasanuzzaman
  - Md Tanvir Mahtab Tulon
  - Md. Rakibul Islam
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a maximally flat-top half-band FIR optical filter
    on a silicon nitride (SiN) platform at 193 THz. Using a cascaded Mach-Zehnder
    Interferometer (MZI) topology simulated in Lumerical INTERCONNECT, MODE, and FDTD,
    the filter achieves insertion losses of 0.1349 dB and 0.1761 dB with extinction
    ratios of 18.317 dB and 23.002 dB for Channel-A and Channel-B, respectively, under
    realistic S-parameter conditions.
- title: Photogalvanic second harmonic generation in Si3N4 for 1 Hz level on-chip
    metrology and spectroscopy
  date: 2026-08
  url: https://arxiv.org/abs/2608.04555v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Andrei Diakonov
  - Roy Zektzer
  - Xiyuan Lu
  - Kartik Srinivasan
  - Liron Stern
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The coherent photogalvanic (PG) effect induces an effective $χ^{(2)}$
    nonlinearity in natively $χ^{(3)}$ silicon nitride integrated photonics, unlocking
    pathways toward chip-scale precision spectroscopy and optical clockworks via second
    harmonic generation (SHG). While quasi-phase-matched PG-SHG using spatially varying
    internal electric fields offers tuning flexibility, it is often accompanied by
    pump-power- and detuning-dependent frequency offsets. Here, we investigate whether
    direct phase-matching---utilizing an intermodal scheme that generates a spatially
    uniform electric field---can support metrologically compatible SHG. By comparing
    the fundamental and doubled optical frequencies in a silicon nitride microresonator,
    we test the preservation of the (2:1) frequency ratio in directly phase-matched
    PG-SHG. We observe a frequency offset of $&lt; 1\mathrm{~Hz}$, contrasting with
    previous limitations in quasi-phase-matched configurations. Furthermore, we measure
    a residual fractional frequency instability of $2\times 10^{-15}$ at $1\mathrm{~s}$,
    averaging down to the $10^{-16}$ level at $1000\mathrm{~s}$, with multi-hour deviations
    remaining below $1\mathrm{~Hz}$. These results establish directly phase-matched
    PG-SHG as a robust, metrologically compatible route to effective $χ^{(2)}$ functionality,
    combining sub-Hz frequency-ratio fidelity and high coherence on a mature integrated
    platform for optical clockworks, self-referencing, and precision spectroscopy.
- title: Monolithic high density integrated photonics on bulk lithium niobate
  date: 2026-08
  url: https://arxiv.org/abs/2608.15936v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Zizheng Li
  - Harmen Smedes
  - Bruno Lopez-Rodriguez
  - Thomas Scholte
  - Simon Groeblacher
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Functional electro-optic (EO) tunable photonic integrated circuits are
    crucial to next-generation information processing and advanced computing, where
    ferroelectric materials such as lithium niobate (LiNbO3) provide outstanding optical
    properties and versatile tuning mechanisms. However, beyond achieving high-performance
    devices, practical deployment of LiNbO3 photonic integrated circuits requires
    rapid and cost-effective scale-up, which remains challenging because of the fabrication
    complexity and high costs of ion-sliced thin-film lithium niobate and wafer bonding
    processes. To address this gap, we demonstrate a fully monolithic photonic platform,
    amorphous silicon carbide (a-SiC) on bulk LiNbO3 crystal substrate, enabling scalable,
    CMOS-compatible, low-cost, and high-density photonic integrated circuits without
    relying on thin-film LiNbO3. This integration approach breaks the long-standing
    cost-performance-scalability tradeoff, and intrinsically eliminates the need for
    sophisticated fabrication processes, including ion slicing, wafer bonding, and
    LiNbO3 etching. It realizes high-density, low-loss, and record high EO tuning
    efficiency of VpiL = 2.87 Vcm on bulk LiNbO3 crystal substrate. Furthermore, leveraging
    slow-light effect near photonic crystal bandgap, an 8.5-fold EO tuning efficiency
    enhancement is achieved, highlighting the platform's capability in confinement
    control and dispersion engineering.
- title: Integration of hBN Single-Photon Emitters into a Hybrid Optomechanical Membrane-in-the-Middle
    Fiber-Cavity
  date: 2026-07
  url: https://arxiv.org/abs/2607.19314v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Patrick Maier
  - Alexander Kubanek
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The integration of membranes into optical resonators plays a key role
    in a variety of applications, including optomechanics. Membranes hosting single
    photon emitters, ideally with access to spin states, open new avenues in optomechanics,
    spin-mechanics and spin-optomechanics. Hexagonal boron nitride is among the most
    promising two-dimensional materials, showing excellent optical and mechanical
    properties combined with the ability to host optically active (spin) defects.
    The deterministic creation of optically active defect centers in hexagonal boron
    nitride membranes and their coupling to optomechanical systems is an outstanding
    challenge. Here, we explore an alternative hybrid approach to establish coupling
    between a single photon emitter in commercially available hexagonal boron nitride
    flakes and a fiber cavity mode. We address technical challenges, such as scattering
    losses arising from uncontrolled flake topography, and establish deterministic
    hexagonal boron nitride positioning on the cavity mirror. For the coupled system,
    we observe cavity-induced spectral enhancement by a factor of up to 100 at room
    temperature. We extend our work by positioning single photon emitters in hexagonal
    boron nitride flakes on a highly strained silicon nitride membrane in a membrane-in-the-middle
    configuration. The mechanical vibrational modes of the silicon nitride membrane
    and cavity-coupled emission from the single photon emitter are simultaneously
    observed. Our work is a first step towards the realization of a cavity optomechanical
    platform with an incorporated single photon emitter and provides a starting point
    to explore hybrid spin-optomechanics.
- title: 'Unlocking the O-Band: high-power, broadband soliton microcomb'
  date: 2026-04
  url: https://arxiv.org/abs/2604.08767v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Dmitrii Stoliarov
  - Nikolay G. Pavlov
  - Aleksandr Donodin
  - Daniel J. Elson
  - Vitaly Mikhailov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The O-band (1260-1360 nm), located near the minimum of chromatic dispersion
    of standard single-mode fiber, is the transmission window of major interest and
    importance for short-reach data-center interconnects. However, full capacity offered
    by this spectral band is yet to be unlocked, due to limited availability of scalable
    multi-wavelength, high-power, low noise O-band light engines. While Kerr microcombs
    in CMOS-compatible silicon nitride resonators provide mutually coherent wavelength
    channels with precise spacing and chip-scale footprints, their practical deployment
    in the O-band has been hindered by limited pump laser power, insufficient per-line
    power and the lack of flat, wideband amplification technologies to uniformly boost
    multiple coherent carriers. Here we demonstrate a high-power O-band soliton microcomb
    architecture that overcomes this bottleneck by combining self-injection-locked
    (SIL) operation in a Silicon Nitride microring with a single-stage bismuth-doped
    phosphosilicate fiber amplifier designed for wideband, flat-top gain. The SIL
    microcomb operates with an 834 GHz free spectral range and spans over 1050-1650
    nm. The amplifier simultaneously boosts 21 O-band lines across 100 nm to powers
    exceeding 0 dBm per carrier without gain flattening or external equalization,
    while preserving low-noise characteristics. We validate each amplified microcomb
    line as a carrier across the entire O-band using dual-polarization 32 GBaud 64-QAM
    coherent transmission. This approach establishes a practical route towards high-power,
    broadband O-band microcomb engines for next-generation data-center interconnects
    and scalable photonic systems.
- title: Measurement of complex scattering matrix in a nano-cavity array for boundary
    scattering tomography
  date: 2026-04
  url: https://arxiv.org/abs/2604.27214v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Andrew Tang
  - Romil Audhkhasi
  - Virat Tara
  - Abhi Saxena
  - Gokul Nath
  venue: ''
  code_url: ''
  project_url: ''
  abstract: On-chip silicon photonic coupled cavity arrays (CCA) are a promising platform
    for quantum simulators, with access to high Quality (Q) factor resonators, tunability,
    and foundry compatibility. Furthermore, scalable two-dimensional (2D) silicon
    photonic CCAs allow for simulation of rich physical phenomena via Hamiltonian
    engineering. However, complete reconstruction of the Hamiltonian is limited by
    access to cavities in the bulk, with current approaches relying on imaging scattered
    light from bulk resonators. These approaches often require additional scatterers
    to be built in, limiting scalability, while also being hampered by imaging technology
    in the near-infrared range. Instead of these approaches, Hamiltonian tomography
    algorithms that require homodyne boundary measurements have been demonstrated
    in literature, however measurements of complex scattering measurements along a
    CCA boundary have not been shown. Here, we experimentally demonstrate an on-chip
    homodyne measurement setup along a single boundary of a $3\times 3$ silicon photonic
    racetrack resonator array and reconstruct the system's edge scattering matrix.
- title: A variability-aware simulation and design workflow for wafer-scale, heterogeneously
    integrated lithium niobate modulators
  date: 2026-05
  url: https://arxiv.org/abs/2605.28765v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Patrick Nenezic
  - Ewoud Vissers
  - Arno Moerman
  - Laurens Bogaert
  - Maximilien Billet
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a variability-aware simulation framework for heterogeneously
    integrated lithium niobate traveling-wave modulators. The framework incorporates
    fabrication-variation data obtained from our dedicated pilot line and enables
    efficient optimisation of geometric parameters to ensure stable device performance
    across wafer-scale manufacturing. The proposed multi-parameter optimisation method
    enables the efficient identification of modulator designs that simultaneously
    achieve target performance metrics (Vpi, optical insertion loss, and 3dB electro-optic
    bandwidth) while maintaining robustness against fabrication-induced variations.
    Using this methodology on two representative modulator architectures, we theoretically
    demonstrate that reliable wafer-scale integration of lithium niobate modulators
    on silicon photonics via micro-transfer printing is feasible and can be systematically
    engineered.
- title: Bloch Siegert Physics in a Reconfigurable Photonic Binary Lattice
  date: 2026-05
  url: https://arxiv.org/abs/2605.08875v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ze-Sheng Xu
  - Liwei Duan
  - Rohan Yadgirkar
  - Andrea Cataldo
  - Adrian Iovan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Bloch Siegert shift, a hallmark correction arising from counter-rotating
    interactions in driven two-level systems, has an exact counterpart in binary lattices
    under static forcing, where it governs resonant long-range tunneling between sites
    separated by odd lattice spacings. Here we report the first experimental realization
    of this correspondence using a 12 mode programmable photonic integrated circuit.
    By implementing a reconfigurable binary lattice with sub-percent control of on-site
    detuning, we observe coherent periodic jumps across four resonance orders and
    quantitatively verify the predicted period law over the full parameter space.
    The measured dynamics exhibit the extreme resonance sensitivity characteristic
    of Bloch Siegert physics and agree closely with the level-anticrossing picture
    of the semiclassical Rabi model. Exploiting the underlying parity structure, we
    further convert intrinsically bidirectional oscillations into cascaded unidirectional
    transport through adaptive sign reversal of the staggered potential, achieving
    fidelities exceeding 0.95 and 0.98 on the same hardware platform. Our results
    establish programmable photonic lattices as a scalable testbed for strongly driven
    quantum-optical phenomena and Floquet-engineered transport.
- title: A broadband, individually addressing two- and three-dimensional photonic
    integrated circuit for trapped-ion qubit control
  date: 2026-07
  url: https://arxiv.org/abs/2607.25062v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Daniel Klawson
  - Yiyang Zhi
  - Bingran You
  - Michael Bareian
  - Elijah Mossman
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Trapped ions provide a high-fidelity platform for quantum information
    processing, yet delivery of multiple, distinct wavelengths across large networks
    of interaction zones remains a bottleneck. Conventional free-space light delivery
    lacks scalability, while on-chip grating couplers suffer from narrow operational
    bandwidth that increases circuit footprint and optical interfacing complexity.
    Here we show a broadband photonic integrated circuit capable of addressing individual
    ions. The circuit combines a planar waveguide lens with a micromirror fabricated
    using two-photon polymerization at wafer scale. This implementation can address
    three individual ions from $λ$ = 405 - 880 nm with -27 dB average intensity crosstalk
    at $5\,μ\mathrm{m}$ pitch. We trap $^{40}\mathrm{Ca}^{+}$ and $^{138}\mathrm{Ba}^{+}$
    ions above such devices, characterize optical crosstalk with barium ions, and
    demonstrate individual repumping of calcium ions. This monolithic photonic architecture
    brings broadband addressing in an on-chip modality to trapped-ion technology.
    More generally, integrating additive manufacturing into quantum devices is poised
    to unlock expanded design space for implementing novel quantum architectures.
- title: Black-Box Coherence Matrix Eigen-Spectroscopy with Programmable Photonics
  date: 2026-08
  url: https://arxiv.org/abs/2608.19353v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Kevin Zelaya
  - Jonathan Friedman
  - Mohammad-Ali Miri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The precise characterization of spatial optical coherence is fundamental
    to emerging applications in optical communications and computational imaging.
    However, extracting the full coherence matrix traditionally requires phase-sensitive
    interferometry, which is highly vulnerable to environmental noise and poses severe
    scalability challenges for integrated photonics. Here, we introduce an architecture-agnostic
    framework for analyzing and controlling partially coherent light on programmable
    photonic circuits. By leveraging the Schur-Horn theorem, our approach systematically
    diagonalizes the incident coherence matrix, relying solely on output intensity
    measurements and entirely circumventing the need for complex phase retrieval.
    We experimentally validate this black-box protocol on a low-depth, non-universal
    photonic integrated circuit, successfully reconstructing the hidden eigenvalues
    of mixed states generated from up to four mutually incoherent sources. Furthermore,
    we demonstrate active, in-situ statistical light control by introducing non-unitary
    amplitude modulation to significantly enhance interference visibility, exposing
    a fundamental physical trade-off between coherence enhancement and optical loss.
    Inherently resilient to hardware constraints and experimental noise, this scalable
    paradigm establishes a robust pathway for realizing ultra-compact, on-chip spatial
    coherence analyzers.
- title: Physics-Based Flow Matching for Full-Field Prediction of Silicon Photonic
    Devices
  date: 2026-05
  url: https://arxiv.org/abs/2605.06929v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Joseph Quaratiello
  - Anthony Rizzo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Designing photonic integrated circuits requires accurate electromagnetic
    field simulations, which remain computationally expensive even for simple device
    geometries. We present PIC-Flow, a generative neural surrogate that predicts electromagnetic
    field distributions for photonic devices given their geometry and operating wavelength
    as an alternative to costly finite-difference time-domain (FDTD) simulations.
    Our approach combines three key ideas: (i) conditional flow matching as the generative
    framework, learning a velocity field that transports Gaussian noise to physically
    valid field solutions; (ii) a real-valued U-Net operating on split real and imaginary
    field channels; and (iii) physics-constrained training through a Helmholtz residual
    loss enforcing $\nabla^2 E_z + k_0^2 \varepsilon E_z = 0$. We introduce an interface-aware
    masking scheme for the Helmholtz residual that excludes dielectric boundary pixels
    where finite-difference stencil errors dominate, yielding a physically meaningful
    compliance metric. The data set consists of 22,500 ground-truth FDTD simulations
    split evenly between multimode interferometers, Y-branches, and directional couplers
    at $λ=1.55\,μ$m in an 80/10/10 split between training, validation, and test sets.
    We evaluate ablations on the network against the held out test devices and also
    show that the model generalizes to held out device classes such as S-bends, tapers,
    and cascaded Y-branches. Rather than a drop-in replacement for FDTD, this work
    establishes a foundation that, with broader data coverage, more compute, and further
    training optimization, could scale toward broadband, device-agnostic field prediction
    with dramatically improved runtime for rapid design-space exploration of complex
    photonic devices and circuits.'
- title: Dielectric-loaded guided-wave electro-optic modulator using bulk rubidium
    titanyl phosphate
  date: 2026-07
  url: https://arxiv.org/abs/2607.19015v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - David Trop
  - Boris Desiatov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Rubidium titanyl phosphate (RTP) is widely used in bulk Pockels cells
    because it combines a useful linear electro-optic response with low dielectric
    permittivity, high electrical resistivity, negligible piezoelectric ringing, and
    high optical-damage tolerance. Its use in integrated or guided-wave modulators
    has been limited by the absence of a mature thin-film RTP platform. Here we propose
    a dielectric-loaded guided-wave modulator in which a silicon nitride strip on
    an unetched bulk RTP crystal forms a near-surface optical mode that overlaps with
    side-electrode fields. The analysis focuses on full-vector optical modes, GSG
    electrostatic and RF response, tensor-aware electro-optic coupling, and device-level
    performance at 1064~nm.
- title: Cavity optomechanics with a suspended resonant mirror
  date: 2026-08
  url: https://arxiv.org/abs/2608.02488v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Trishala Mitra
  - Gurprret Singh
  - Søren Peder Madsen
  - Aurélien Dantan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We investigate optomechanical effects in cavities consisting of a plane-plane
    arrangement of a broadband reflectivity mirror and an ultrathin, suspended resonant
    mirror possessing a high-Q internal optical resonance. We first investigate dispersive
    optomechanics in such cavities on the basis of a generic analytical model as well
    as finite element method simulations of realistic structures. We then report on
    experimental optical spring measurements using a suspended silicon nitride membrane
    patterned with a subwavelength grating. While the observed optical spring variations
    qualitatively match those expected from the dispersive cavity optomechanics model,
    their magnitude is more than two orders of magnitude larger than predicted. We
    surmize that this strong optomechanical interaction is due to photothermal effects
    and put forward a phenomenological model that plausibly supports the observations.
- title: Finite-Size Effect Induced Spatial-Spectral Mode Splitting in Membrane Metasurfaces
  date: 2026-07
  url: https://arxiv.org/abs/2607.00468v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Chih-Zong Deng
  - Mu-Hsin Chen
  - Chun-Hao Chiang
  - Jui-Han Fu
  - Vincent Tung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This work reports the spatial-spectral engineering and finite-size quantization
    of optical modes within a triangular-lattice silicon nitride membrane metasurface.
    Truncating the lattice into a finite square cavity breaks translational symmetry
    and lifts modal degeneracy, splitting optical modes into discrete cavity-envelope
    sub-modes. High-resolution photoluminescence (PL) scanning reveals distinct spatial
    field distributions. The corner-localized sub-mode features the highest Q-factor
    due to multipolar far-field destructive interference, whereas the core-localized
    sub-mode exhibits strong radiative coupling. PL mapping reveals a symmetric, four-fold
    clover-like wavelength arrangement. These results demonstrate that boundary-induced
    deterministic symmetry can override underlying lattice characteristics, offering
    a robust strategy for precise spatial-spectral tailoring of light-matter interactions
    at the nanoscale.
- title: Triply Resonant Photonic Crystal Nanobeam Cavities for Unconditional Photon
    Blockade
  date: 2026-03
  url: https://arxiv.org/abs/2603.20568v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Richard Dong
  - Abhinav Kala
  - Andrew Lingenfelter
  - Michael S. Polania Vivas
  - Matthew D. Stearns
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The development of many scalable quantum technologies requires single-photon
    nonlinearity, such as single-photon blockade, in solid-state systems. Recently,
    it has been shown that single-photon Fock states can, in principle, be unconditionally
    generated using arbitrarily small intrinsic optical nonlinearities in photonic
    cavities. We investigate the feasibility of such a scheme in achieving photon
    blockade in an on-chip silicon photonics platform. We show that a triply resonant
    nanobeam cavity pumped with three monochromatic lasers could achieve such functionalities
    with quality factors $\sim 10^7$ and effective mode volumes $\sim 10^{-2} μm^3$,
    for experimentally feasible incident powers. Using quantum optical simulations,
    we propose an experimental protocol to generate single photons under this scheme.
    The constraints on the cavity design and experimental conditions are thoroughly
    explored to determine feasible regimes of operation.
- title: 'Micro-Transfer Printing of Lithium Niobate on 200 mm Silicon Photonics:
    A High-Speed Heterogeneous Wafer-Scale Platform'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28971v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xiujun Zheng
  - Suzanne Bisschop
  - Arno Moerman
  - Margot Niels
  - Ewoud Vissers
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid growth of artificial intelligence (AI) and other data center
    applications is driving the demand for photonic interconnects that combine high-speed
    with low energy consumption, making scalability a critical requirement. Micro-transfer
    printing (MTP) has emerged as a promising technique for the wafer-scale heterogeneous
    integration of thin film lithium niobate (TFLN) onto silicon photonics (SiPho)
    platforms. Here, we demonstrate heterogeneous SiPho TFLN integration across four
    full 200 mm wafers with a 3sigma placement accuracy down to 420 nm and a printing
    yield of larger than 95percentage. Low insertion loss less than 2 dB over 600
    phase modulators (300 amplitude modulators) is achieved. A half wave voltage of
    4 V in push pull configuration, and high-speed modulation with a bandwith larger
    than 70 GHz is demonstrated on a subset of tested devices.
- title: Scalable 3D silicon nitride photonic interposer for high-density optical
    interconnects
  date: 2026-04
  url: https://arxiv.org/abs/2604.12566v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yu Xia
  - Yuhao Huang
  - Yuemin Li
  - Jie Wang
  - Yunqi Fu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modern computing workloads demand energy-efficient, high-bandwidth interconnects,
    motivating photonic interposers as an alternative to electrical links. Here we
    demonstrate a compact 3D silicon nitride (SiN) photonic interposer prototype comprising
    two routing layers, with the 3D routing scheme optimized by a global optimization
    algorithm. The 3D interposer realizes a fully connected 12-node optical network
    that reduces the total number of intralayer crossings from 495 for all-planar
    routing to merely 150 (69.7% reduction), below the theoretical lower bound of
    153 for all-planar interconnects. Comparing the two schemes, our 3D design achieves
    a 45.8% reduction experimentally in the average loss per waveguide. The proposed
    3D routing architecture also features inherent symmetry and is scalable to higher
    node counts, flexible node placements, additional routing layers, and other operating
    wavelengths, enabling denser, lower-loss photonic interposers for next-generation
    scale-up and high-performance computing (HPC) systems.
- title: Nonlinear Mode Coupling in Silicon Nitride Membrane Resonators
  date: 2026-03
  url: https://arxiv.org/abs/2603.08689v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Soumya Kanti Das
  - Nishta Arora
  - Hridhay A S
  - Akshay Naik
  - Chandan Samanta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Nonlinear interactions between vibrational modes play a crucial role in
    understanding the dynamical response of nanomechanical resonators. Here, we report
    the experimental observation and theoretical modeling of nonlinear mode coupling
    in a high-stress square silicon nitride membrane resonator. We quantify frequency
    shifts of the fundamental mode arising from tension-mediated geometric nonlinearity
    by increasing the amplitude of the fundamental mode and higher-order flexural
    modes. A quantitative theoretical framework based on Kirchhoff-Love plate theory
    is developed, which incorporates both intrinsic Duffing nonlinearity and nonlinear
    intermodal coupling and shows good agreement with experimental measurements for
    the (1,1)-(2,1) and (1,1)-(2,2) mode pairs. We further compute the nonlinear coupling
    matrix across mode families, revealing the role of mode symmetry and spatial overlap
    in governing intermodal interactions. These results establish nonlinear mode coupling
    as a controllable resource for multimode frequency tuning and mechanical transduction.
- title: Imaging-System-Aware Inverse Design of Information-Optimal Color Routers
  date: 2026-08
  url: https://arxiv.org/abs/2608.13019v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Hyoseok Park
  - Yeonsang Park
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Nanophotonic color routers are conventionally optimized under a normal
    plane wave against predefined red, green and blue targets. A camera satisfies
    neither condition: each sensor position receives a spatially incoherent, finite-numerical-aperture
    pupil that tilts with field position. We show that this mismatch changes which
    design is optimal: under the camera pupil, plane-wave-optimized designs correlate
    only weakly with their plane-wave ranking ($r_s = 0.27$), and the optimal structure
    changes with the source. We therefore design a single-etch silicon nitride color
    router directly under this illumination ensemble, scoring it by the imaging information
    its measurements preserve about the reconstructed tristimulus color image. The
    optimized router is predicted to collect $2.8\times$ the photoelectron signal
    of a color-filter array and to preserve more image information than the color-filter
    array below a green-site signal-to-noise ratio of 13.7~dB.'
- title: Subwavelength grating waveguide filter based on cladding modulation with
    phase-change material grating
  date: 2026-05
  url: https://arxiv.org/abs/2605.07715v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - S. Hadi Badri
  - Saeid Gholami Farkoush
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Subwavelength engineering and utilizing phase-change materials with large
    contrast in their optical properties have become powerful design tools for integrated
    silicon photonics. Reversible phase-transition of phase-change materials such
    as Ge2Sb2Te5 (GST) provides a new degree of freedom and opens up the possibility
    of adding new functionalities to the designed devices. We present an optical filter
    based on a silicon subwavelength grating (SWG) waveguide evanescently coupled
    to phase-change material loading segments arranged periodically around the SWG
    core. The effect of the GST loading segments' geometry and their distance from
    the SWG core on the filter's central wavelength and bandwidth are studied with
    three-dimensional finite-difference time-domain simulations. The employment of
    GST in the structure adds a switching functionality with an extinction ratio of
    28.8 dB. We also examine the possibility of using the proposed structure as a
    reconfigurable filter by controlling the partial crystallization of the GST offering
    a blueshift of more than 4 nm.
- title: Graphene-based Photodetector with Engineered Hot Carrier Cooling Dynamics
  date: 2026-05
  url: https://arxiv.org/abs/2605.23646v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yishu Huang
  - Anand Nivedan
  - Florian Ludwig
  - Bohai Liu
  - Michiel Debaets
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Graphene has emerged as a promising material for integration into silicon
    photonics, owing to its ultrafast and broadband photoresponse without the need
    for an external bias voltage. This photoresponse relies on the photo-thermoelectric
    effect created by hot carriers. A key factor underlying the performance of graphene
    photodetectors is the cooling dynamics of these hot carriers. In this work, we
    engineer these dynamics in a WSe2-graphene-WSe2 waveguide-integrated photodetector.
    In particular, by introducing proximity screening by a nearby graphite layer to
    this structure, we prolong the hot-carrier cooling time, leading to an enhanced
    photoresponse. We characterize the cooling dynamics under continuous-wave laser
    excitation by employing a photomixing technique, revealing an increase in the
    cooling time by up to a factor of four. Direct photoresponse measurements show
    that the internal photoresponsivity improves by approximately 50%. Together, these
    results demonstrate the potential of proximity screening to enhance the performance
    of graphene-based photodetectors on an integrated photonics platform.
- title: Silicon Photonic CWDM Filter with Compact Footprint, Low Loss, Flat-Top Transmission
    and High Yield
  date: 2026-05
  url: https://arxiv.org/abs/2605.25106v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Qingzhong Deng
  - Alaa Elshazly
  - Rafal Magdziak
  - Liesbeth Witters
  - Swetanshu Bipul
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A novel silicon photonic CWDM filter design is proposed and experimentally
    demonstrated. The design has achieved flat-top transmission across all dies on
    a wafer, with a device footprint of 48*25 μm2, an insertion loss of 0.24 $\pm$
    0.18 dB, and a channel central wavelength standard deviation of 0.77 nm.
- title: Understanding Intrinsic Loss in Thin-Film Lithium Niobate Ring Resonators
    via Adiabatic Coupling
  date: 2026-04
  url: https://arxiv.org/abs/2604.01922v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xinrui Zhu
  - Hana K. Warner
  - Yunxiang Song
  - Donald Witt
  - Marko Loncar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Thin-film lithium niobate (TFLN) has emerged as a versatile integrated
    photonics platform, combining strong electro-optic and nonlinear effects. Among
    TFLN devices, ring resonators play a central role in filtering, modulation, and
    nonlinear optical processes. However, intrinsic loss, which ultimately limits
    ring performance, is most often summarized by single-valued metrics, and its statistical
    variability across resonances has received limited attention. Here, we show that
    intrinsic loss rates in monolithic TFLN ring resonators follow a statistical distribution,
    comprising a baseline loss and a tail arising from discrete loss events. This
    behavior is revealed by characterizing 2233 resonances, using an adiabatic waveguide-ring
    coupling architecture that selectively excites the fundamental mode and yields
    clean spectra in the ultra-high-Qi regime. We find the most probable intrinsic
    loss rate ki = 2 pi x 10.4 MHz, indicating operation in a low-loss regime comparable
    to state-of-the-art thick silicon nitride platforms.
- title: Strong enhancement of Er3+ emission at room temperature in Si3N4 metasurfaces
  date: 2026-05
  url: https://arxiv.org/abs/2605.02535v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Fengkai Wei
  - Xinru Ji
  - Tobias J. Kippenberg
  - Duk-Yong Choi
  - Carsten Ronning
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report a significant enhancement of room-temperature photoluminescence
    from trivalent erbium-doped (Er3+) silicon nitride (Si3N4) metasurfaces at the
    telecommunication wavelength prepared via ion implantation. The metasurfaces,
    consisting of periodic nanocylinder arrays, are designed to support Mie-type resonances
    that tailor the local density of optical states. By systematically optimizing
    the nanocylinder radii, we achieve a photoluminescence (PL) enhancement factor
    of ~18 at a radius of 390 nm after thermal annealing, which is in excellent agreement
    with our simulations. Time-resolved PL measurements reveal a nearly ten-fold reduction
    in luminescence lifetime, confirming that the enhancement is primarily driven
    by the Purcell effect. Furthermore, we demonstrate that the PL intensity is strongly
    dependent on the Er3+ ion implantation depth, with a four-fold increase in emission
    observed from 20 nm to 80 nm ion range. These results provide a robust pathway
    for integrating efficient, active light sources into CMOS-compatible photonic
    device.
- title: Dissipative acousto-mechanical parametric interface between high-overtone
    acoustics and flexural phonons
  date: 2026-05
  url: https://arxiv.org/abs/2605.24581v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xun Ji
  - Huanying Sun
  - Longhao Wu
  - Qichun Liu
  - Yulong Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-overtone bulk acoustic wave resonators (HBARs) promise advanced phononics,
    yet achieving nonlinearity remains challenging. We demonstrate a radiation-pressure-type
    parametric interaction between GHz HBARs and low-frequency flexural modes in a
    suspended silicon nitride membrane, where mechanical displacement modulates the
    external dissipation rate to enable dissipative acousto-mechanical coupling. Benefiting
    from the high quality factor, the system enters the resolved-sideband regime at
    room temperature, yielding acousto-mechanically induced transparency. We observe
    tunable Kerr nonlinearity and generate coherent HBAR frequency combs via two-tone
    driving. Notably, our dissipative coupling strength is 20 times larger than the
    dispersive coupling, the highest ratio among reported hybrid dissipative-dispersive
    coupling systems, resulting in the experimental observation of amplification in
    the reflection spectra under red-sideband driving. The ability to interface dense
    HBAR modes with a common mechanical resonator provides a scalable on-chip platform
    for multimode phononic information processing, with quantum phononics potentially
    achievable at sub-Kelvin temperatures.
- title: Fourth-harmonic UV light generation in integrated silicon nitride microresonators
  date: 2026-03
  url: https://arxiv.org/abs/2603.03255v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Alekhya Ghosh
  - Arghadeep Pal
  - Haochen Yan
  - Toby Bi
  - Luca O. Trinchão
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated silicon nitride (Si3N4) resonators have emerged as a leading
    platform for nonlinear photonics, yet generating light at wavelength in the ultraviolet
    (UV) has remained elusive in single-resonator systems. Here we report the first
    observation of fourth-harmonic generation reaching the blue and ultraviolet spectral
    regions in an integrated Si3N4 microring resonator. We systematically investigate
    the input-power dependence of the wavelength ranges supporting second-, third-,
    and fourth-harmonic generation, and study the input-power-dependent variation
    of the circulating fourth-harmonic signal in the UV. These results extend the
    operational bandwidth of integrated Si3N4 nonlinear photonic platforms to the
    lower edge of the material transparency window, enabling on-chip UV frequency
    conversion. Near-ultraviolet generation around 400 nm will enable on-chip excitation
    of defect-based quantum emitters in hexagonal boron nitride, enhance Raman spectroscopy
    through increased scattering cross-sections at shorter wavelengths, and support
    compact fluorescence-based bio-imaging platforms exploiting intrinsic cellular
    fluorophores.
- title: Scalable Liquid-Crystal Integrated Silicon Nitride Photonic Circuits for
    Reconfigurable Quantum Interference
  date: 2026-05
  url: https://arxiv.org/abs/2605.07281v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Chunghyun Ahn
  - Yongjin Hwang
  - Sangbaek Lee
  - Jinil Lee
  - Hyunjin Ko
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated quantum photonics requires compact, efficient, and low-power
    phase modulators. While silicon nitride (SiN) is a promising platform, existing
    modulators suffer from high power consumption, thermal crosstalk, or high driving
    voltages. Liquid crystal (LC) offers a compelling alternative because of the large
    index changes and industrial maturity. However, their suitability for supporting
    various applications in the photonic quantum system has not been experimentally
    confirmed.Here, we report the first experimental demonstration that LC-based phase
    modulators integrated on a SiN platform show highly visible quantum interference.
    We fabricated a liquid-crystal integrated Mach-Zehnder interferometer (LC-MZI)
    that achieved CMOS-compatible performance with V_pi * L &lt; 1 V-mm. In two-photon
    interference experiments, the devices exhibited high-visibility quantum interference
    (~98.5%) with voltage-tunable phase control. Furthermore, we validated the scalability
    of our approach by demonstrating wafer-scale fabrication using stepper lithography.
    This work establishes LC-integrated SiN photonics as a scalable, reconfigurable,
    and energy-efficient platform for quantum photonic circuits.
- title: Probe- and Substrate-Dependent Visibility of Mie Resonances in Silicon Nanospheres
  date: 2026-05
  url: https://arxiv.org/abs/2605.11661v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yonas Lebsir
  - Huatian Hu
  - P. A. D. Gonçalves
  - Hiroshi Sugimoto
  - Minoru Fujii
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Silicon nanospheres are high-quality optical resonators and promising
    building blocks for Mie-tronic devices. While the Mie resonances of an isolated
    sphere are well understood, practical implementations require substrates that
    inevitably modify the measured optical response. Here, we investigate how substrates
    alter the observable spectrum of individual nanospheres, focusing on three fundamentally
    different cases: a thin silicon nitride membrane, that emulates a free-standing
    particle, bulk silicon, which is common in experiments, and gold, where mirror
    charges lead to hybrid optical modes. Cathodoluminescence and dark-field spectroscopy,
    combined with electrodynamic simulations, show that the measured resonances are
    not intrinsic to the particle but depend strongly on the environment and the excitation
    mechanism. We find that substrate-induced effects and probe-specific selection
    rules can suppress, enhance, or even invert the spectral signatures of electric
    and magnetic modes. These results provide practical guidelines for interpreting
    and designing substrate-supported dielectric resonators for Mie-tronic applications.'
- title: Erbium-implanted tellurite waveguides with low-temperature post-implantation
    activation and signal enhancement
  date: 2026-08
  url: https://arxiv.org/abs/2608.17028v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yuxuan Gao
  - Batoul Hashemi
  - Bruno L. Segat Frare
  - Niloofar Majidian Taleghani
  - Pooya Torab Ahmadi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this paper, we demonstrate erbium ion implantation and signal enhancement
    in tellurium oxide hybrid waveguides. Silicon nitride strips with a width of 2
    $μ$m and a height of 100 nm were clad with a 110-nm-thick tellurium oxide layer
    to form hybrid waveguides, followed by erbium ion implantation at an energy of
    200 keV and a dose of $1\times10^{15} ions/cm^{2}$, with a projected peak implantation
    depth of approximately 50 nm into the tellurium oxide layer. After low-temperature
    annealing at 150 °C for 30 minutes, the propagation loss decreased from 1.7 to
    0.9 dB/cm, while the erbium lifetime increased from 40 $μ$m to over 800 $μ$m.
    We measure a small-signal enhancement of 9 dB in an 11-cm-long waveguide at a
    wavelength of 1550 nm. These results demonstrate progress towards a low-temperature
    post-ion implantation process for incorporating erbium and other rare earth ions
    into tellurium oxide films for integrated photonic applications.
- title: A 0.08 pJ/bit 56 GBaud Monolithic Optical Receiver Front End for IMDD Photonic
    Links
  date: 2026-05
  url: https://arxiv.org/abs/2605.06808v3
  category: silicon-photonics
  subcategory: systems
  authors:
  - Robert P. Pesch
  - Arjun Khurana
  - Joshua J. Wong
  - Joel Slaby
  - Stephen E. Ralph
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present the design, fabrication, and measurement of a monolithically
    integrated optical receiver analog front end, where low power operation is a primary
    consideration with a goal of supporting 56 Gbaud intensity modulated direct detect
    transceivers. The need for low-power consumption and low-noise operation motivates
    a monolithic, layout driven design approach which begins with circuit topology
    selection and analysis. Various transistor unit cell layout configurations are
    explored, minimizing parasitics, enabling wide analog bandwidth and reduced input
    referred noise. The post-layout analog front end achieves a 28.9 GHz bandwidth
    with a low-frequency gain of 61.7 dBΩ. This circuit was designed within the GlobalFoundries
    FotonixTM monolithic silicon photonics platform. The fabricated device is characterized
    by its DC operation, noise characteristics, and time domain behavior. The final
    design was validated by on-off keyed and PAM-4 electrical eye diagram measurements
    to 64 GBaud, consuming 9.22 mW of power from a 1.2 V supply with less than 737
    nA RMS integrated input referred noise current and 0.08 pJ/bit.
- title: Mid-infrared distributed-feedback lasing from black phosphorus under nanosecond
    excitation
  date: 2026-08
  url: https://arxiv.org/abs/2608.20096v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Julien Brodeur
  - Laure Sène
  - Stéphane Kéna-Cohen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Mid-infrared (MIR) light sources compatible with silicon photonics are
    highly desirable for environmental sensing and free-space optical communications.
    Conventional GaSb-based quantum-well and interband-cascade lasers, however, rely
    on complex epitaxial heterostructures, complicating their integration with silicon
    photonic platforms. Here, we demonstrate a room-temperature MIR surface-emitting
    distributed-feedback (DFB) laser using black phosphorus (b-P) as the active gain
    medium. By deterministically integrating exfoliated b-P flakes onto lithographically
    patterned SiO$_2$ gratings, we obtain narrowband emission with a full width at
    half maximum below 3 nm under 1064 nm optical excitation. The lasing wavelength
    is tunable from 3.79 to 4.05$~μ\text{m}$ through the b-P flake thickness, covering
    a technologically important region of the mid-infrared. Room-temperature thresholds
    as low as $(0.25 \pm 0.07)\ \text{mJ/cm}^2$ are achieved under nanosecond excitation.
    Upon cooling to 110 K, the threshold decreases tenfold to $(0.015 \pm 0.005)\
    \text{mJ/cm}^2$. These results establish planar b-P DFB cavities as a promising
    platform for heterogeneously integrated MIR lasers based on van der Waals semiconductors.
- title: Monolithic Magneto-Optical Mach-Zehnder Isolator Using Laser-Annealed Iron
    Garnet on a Silicon Waveguide
  date: 2026-07
  url: https://arxiv.org/abs/2607.20964v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Tomoya Sugita
  - Reona Motoji
  - Yuki Yoshihara
  - Dan Maeda
  - Hiroki Yamamoto
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Stable silicon photonic circuits require monolithically integrated optical
    isolators based on magneto-optical garnet. However, crystallizing the garnet by
    conventional furnace annealing exposes the entire chip to high temperature and
    degrades the silicon waveguides and the metal electrodes. Here we avoid this degradation
    by using local laser annealing in vacuum to crystallize cerium-substituted yttrium
    iron garnet (Ce:YIG), deposited by ion beam sputtering without a seed layer, directly
    within a silicon-based Mach-Zehnder interferometer. A 915 nm beam heats only the
    garnet region confined in micrometer-scale trenches, leaving the surrounding circuit
    and electrodes intact. The device achieves an isolation ratio of 13.6 dB at a
    wavelength of 1540 nm, corresponding to a Faraday rotation of 0.092$°$/$μ$m, with
    an insertion loss of 20.4 dB and a propagation loss of 9.5 dB. Transmission electron
    microscopy reveals the crystallized Ce:YIG and a ~10 nm boundary region at the
    interface with the Si waveguide. These results demonstrate that thermally sensitive
    silicon photonic devices and magneto-optical thin films requiring high-temperature
    processing can be integrated by a high-throughput technique compatible with mass
    production.
- title: Low voltage and high-bandwidth thin-film lithium tantalate modulator on a
    silicon dioxide substrate
  date: 2026-04
  url: https://arxiv.org/abs/2604.14836v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Zihan Li
  - Alexander Kotz
  - Adrian Schwarzenberger
  - Christian Koos
  - Tobias J. Kippenberg
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modern communication networks demand ever-increasing transmission bandwidth,
    placing stringent requirements on low-cost, high-performance electro-optic modulators.
    Substantial advances have been made in integrated photonics employing lithium
    niobate on insulator. In contrast, photonic integrated circuits based on lithium
    tantalate -- a material already commercially adopted for wireless filters -- have
    been developed, offering reduced DC drift, higher optical power handling, and
    lower birefringence. These advantages enable more complex and dense photonic integrated
    circuits, and make lithium tantalate a promising material platform for next-generation
    integrated electro-optic modulators. However, in contrast to the extensively studied
    thin-film lithium niobate platform, thin-film lithium tantalate modulators have
    only been explored on silicon substrates. Here, we report the first fabrication
    and characterization of thin-film lithium tantalate electro-optic modulators manufactured
    on a 4-inch (100 mm) fused-silica substrate for adapting a low-loss slow-wave
    microwave electrode to improve the electro-optic bandwidth. By employing a slow-wave
    electrode design to achieve velocity matching between microwave and optical signals,
    the demonstrated modulator achieves a 3-dB electro-optic bandwidth of 64 GHz with
    a low half-wave voltage of 1.53 V, with potential to operate at the measured 100
    GHz electrical bandwidth, if the employed spectral biasing is removed. The modulator
    moreover exhibits low bias drift, with a constant switching voltage down to 10
    mHz. This performance enables high-speed data transmission comparable to state-of-the-art
    lithium niobate modulators fabricated on quartz substrates. Using the fabricated
    devices, a net single lane data rate of 440.6 Gbps is achieved using PAM8 signaling.
- title: Single-atom trapping in the evanescent field of an integrated photonic resonator
  date: 2026-05
  url: https://arxiv.org/abs/2605.09532v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Yair Margalit
  - Omri Davidson
  - Oded Zemer
  - Yoad Michael
  - Orel Bechler
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Strong atom-photon interactions on scalable photonic platforms hold significant
    potential for both atomic and photonic quantum information platforms. In particular,
    trapping of a single atom on a planar photonic integrated resonator at the subwavelength
    distances required for strong coupling to the guided modes has remained an outstanding
    challenge. Here we demonstrate efficient trapping of a single ultracold rubidium
    atom within the evanescent field of an integrated silicon-nitride microring resonator,
    at distances of 150-200 nm from the chip surface. Efficient, single-stroke loading
    process is achieved using an evanescent-field mechanism related to Sisyphus cooling,
    in which a single scattering event dissipates the atom's kinetic energy and transfers
    it into a near-surface trap. We observe logarithmic scaling of trapping durations
    spanning from sub-millisecond timescales up to 1 second, without continuous cooling.
    The trapped atom couples efficiently to the resonator, enabling on-chip photon
    collection, photon antibunching, and Purcell-enhanced spontaneous emission with
    single-atom cooperativity exceeding unity. Our results establish the potential
    of CMOS-compatible chip-based atom-photon interfaces for scalable quantum photonic
    circuits.
- title: Dispersion-managed octave soliton microcombs in heterostructured microresonators
  date: 2026-08
  url: https://arxiv.org/abs/2608.09005v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xinghong Li
  - Wenxin Zhang
  - Yiyang Lu
  - Zhaoyi Wang
  - Qingzhuo Xuan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Controlling group velocity dispersion is of fundamental importance in
    ultrafast optics, particularly for supercontinuum generation and optical frequency
    comb synthesis. However, the simultaneous, independent tailoring of multiple dispersion
    coefficients over an ultra-broad bandwidth remains a formidable challenge in conventional
    nanophotonic platforms. Here, we demonstrate a robust strategy for broadband dispersion
    management using heterostructured microresonators comprised of adiabatically concatenated
    waveguides with distinct geometries. By meticulously engineering the local dispersion
    profiles, we can flexibly synthesize the global effective dispersion coefficients
    of different orders, effectively expanding design degrees of freedom beyond conventional
    limits. As a benchmarking demonstration, we fabricate heterostructured silicon
    nitride microresonators using a commercial foundry process and successfully generate
    octave-spanning soliton microcombs with a repetition rate as low as 118 GHz. These
    microcombs feature deterministically tunable dispersive waves operating across
    the 290-310 THz range. Such octave-spanning microcombs with detectable repetition
    rates and carrier-envelope offset frequencies are readily applicable to f-2f self-referencing
    in optical clocks and frequency synthesizers. The proposed heterostructured architecture
    establishes a versatile paradigm for generating ultrawideband soliton microcombs
    with tailorable spectral profiles.
- title: Spiking Photonic Neurons Based on Two-Section InP Quantum-Well Lasers Integrated
    on Silicon
  date: 2026-07
  url: https://arxiv.org/abs/2607.26950v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Menelaos Skontranis
  - Benoit Charbonnier
  - Olivier Girard
  - Adonis Bogris
  - Charis Mesaritakis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this work we experimentally investigate the spiking dynamics of two-section
    InP quantum-well lasers monolithically integrated on silicon. By appropriately
    tuning the electrical bias conditions, we realize multiple neuronal-like operating
    regimes, such as integrate-and-fire and resonate-and-fire, highlighting the device's
    versatility as a high-speed photonic neuron. A systematic investigation of laser
    design parameters, including cavity length and gain/saturable absorber ratio,
    elucidates their impact on spiking-related properties (such as pulse repetition
    frequency) and traces the operational parameter space that unlocks stable spiking.
    Finally, these findings pave the way toward scalable neuromorphic photonic integrated
    circuits, where low-loss silicon synapses coexist with versatile laser neurons.
- title: The influence of strong coupling between single-photon source and spectral
    filter on photon statistics
  date: 2026-05
  url: https://arxiv.org/abs/2605.14807v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ivan V. Panyukov
  - Evgeny S. Andrianov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: One of the most common approaches for coupling optical single-photon sources
    and photonic integrated circuits is to use a cavity. The cavity acts as a spectral
    filter that distorts the light spectrum and changes its statistical properties.
    But in the general case one should take into account not only spectral filtering
    of light but also the spectral filter influence on the single-photon source dynamics.
    We build an effective analytical model for description of the cavity influence
    on the photon statistics of light emitted by the single-photon source as spectral
    filtering only. We show that this model correctly describes the photon statistics
    even in a strong-coupling regime between the single-photon source and the spectral
    filter. Our results can be useful for analytical modeling of photon statistics
    of quantum emitters strongly coupled to various electromagnetic interfaces.
- title: Superconducting single-photon detectors for integrated quantum photonics
  date: 2026-05
  url: https://arxiv.org/abs/2605.14829v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ilya A. Stepanov
  - Oksana I. Shmonina
  - Evgeniy V. Sergeev
  - Aleksandr S. Baburin
  - Danila Yu. Ulyanov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Single-photon detection possibility is a fundamental requirement for quantum
    technologies, including communication, computing and sensing. To achieve scalability
    and practical deployment, increasing attention is being directed toward integration
    of detectors with photonic integrated circuits, which offer compactness and compatibility
    with mass production. Superconducting nanowire single-photon detectors have emerged
    as the leading solution, combining near-unity efficiency, high temporal performance
    and the ability to be embedded across a wide range of photonic material platforms.
    In this review we trace the development of integrated superconducting nanowire
    single-photon detectors from early demonstrations to recent advances, outlining
    the progress in device architectures, material engineering and integration strategies.
    We also discuss performance benchmarks, emerging alternative designs, the future
    opportunities and challenges for this rapidly evolving field.
- title: 'OptiLookUp: An Optical ROM-Based Lookup Table Engine for Photonic Accelerators'
  date: 2026-05
  url: https://arxiv.org/abs/2605.03241v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Ankur Singh
  - Akhilesh Jaiswal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Read-only memory (ROM) provides deterministic access to predefined data
    mappings. Extending ROM concepts to the optical domain enables high-bandwidth,
    low-latency, and parallel memory access, but realizing compact and reconfigurable
    optical ROM remains challenging due to loss, wavelength control, and integration
    constraints. This work presents a high-speed, reconfigurable photonic ROM architecture
    implemented using integrated microring resonators (MRRs). The ROM encodes predefined
    input-output mappings directly in the spectral response of the photonic devices,
    enabling deterministic lookup-based operation without dynamic computation during
    readout. To improve scalability and reduce cumulative insertion loss, the architecture
    employs compact banked sub-arrays that are selectively addressed through an optical
    decoding mechanism. Reconfigurability is achieved using transistor-based optical
    selectors, allowing different ROM banks to be activated without physical light
    rerouting or interferometric structures. The proposed photonic ROM is designed
    and evaluated using device-level simulations based on the GlobalFoundries 45SPCLO
    silicon photonics platform. Simulation results demonstrate reliable operation
    at data rates up to 12.5 GHz, with stable light-to-current transfer characteristics
    obtained through integrated photodiode readout. The optical ROM can be used to
    implement nonlinear activation functions utilised in photonic accelerator architectures,
    including sigmoid, tanh, ReLU, and exponential mappings.
- title: Structure-driven analog optical control in ion-pumped SrFeO$_{3-δ}$ thin-film
    devices
  date: 2026-06
  url: https://arxiv.org/abs/2606.22154v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Alicia Ruiz-Caridad
  - Paul Nizet
  - Francesco Chiabrera
  - Xavier Vea
  - Philipp Langner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Electrochromic devices (ECDs) offer a compelling route toward low-power,
    non-emissive optical modulators with nonvolatile states. However, their widespread
    implementation is hindered by limitations in operating voltage, switching speed,
    color tunability, and long-term stability. Mixed ionic-electronic conductors (MIECs)
    provide a promising alternative platform, enabling optical modulation through
    ion-driven redox and structural transformations. Oxygen-based MIECs offer enhanced
    durability, environmental robustness, and compatibility with oxide electronics
    and silicon photonics, yet remain largely underexplored for electrochromic and
    photonic applications. Here, we demonstrate structure-driven analog optical control
    in an ion-pumped SrFeO$_{3-δ}$ thin-film device by undergoing reversible oxygen-driven
    phase transitions between brownmillerite and perovskite structures. Phase transition
    is accompanied by pronounced changes in its electronic structure and optical constants.
    By harnessing these ion-induced structural transformations and integrating an
    optically passive Al$_2$O$_3$ interference layer, we achieve continuous and reversible
    modulation of optical transmittance and color. These results provide a general
    framework for ion-driven analog photonic and electrochromic devices and highlight
    the potential of oxygen-based MIECs for next-generation ionochromic systems compatible
    with silicon-based photonic platforms.
- title: Bright Telecom Spin-Photon Interface in Silicon Photonics
  date: 2026-07
  url: https://arxiv.org/abs/2607.18435v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Carolina Crosta
  - Amirehsan Alizadehherfati
  - Purbita Purkayastha
  - Kyu-Young Kim
  - Jasvith Raj Basani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon is an attractive host for scalable quantum photonics, but the
    absence of bright telecom-band emitters with optically addressable spin states
    has limited its use for spin-photon interfaces. Here we demonstrate the Al1-center,
    an aluminum--carbon defect in silicon, as a bright waveguide-integrated single-photon
    emitter with a ground-state spin. Using isotopically purified silicon-on-insulator
    nanophotonic devices, we isolate individual Al1-centers and observe high-purity
    single-photon emission with $g^{(2)}(0)=0.04$ without background subtraction.
    Time-resolved photoluminescence spectroscopy reveals a fast excited-state lifetime
    of 135 ns, nearly an order of magnitude shorter than the benchmark provided by
    the well-studied T-center. Resonant photoluminescence excitation measurements
    further resolve the zero-phonon transition and reveal a narrow homogeneous linewidth
    reaching 47 MHz, threefold narrower than the T-center under comparable temperature.
    Through magneto-optical spectroscopy, we resolve the spin-dependent transitions
    of the bound-exciton manifold and achieve spin-selective optical pumping, fulfilling
    the prerequisite for quantum state initialization and readout. These results establish
    the Al1-center as a bright telecom-band spin-photon interface in silicon photonics
    and introduce a promising platform for integrated quantum networks.
- title: All-band photonic integrated optical parametric amplification
  date: 2026-05
  url: https://arxiv.org/abs/2605.22704v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Nikolai Kuznetsov
  - Zihan Li
  - Tobias J. Kippenberg
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical amplifiers are ubiquitous in science and technology and are the
    workhorse of modern communications. Currently, virtually all amplifiers rely on
    atomic resonances, such as rare-earth-doped fibers, or are based on III-V semiconductors.
    Fueled by emerging applications, there is increased demand for amplifiers that
    are high-gain, broadband, low-noise, and deliver high output power outside traditional
    wavelength ranges. Over the past few decades, it has been shown that optical parametric
    amplifiers (OPAs) can address this challenge. Pioneering works on highly nonlinear
    optical fibers or bulk crystals have demonstrated their potential, but high pump
    powers and long fiber length limited their practical use. Recently, a renaissance
    of OPAs has occurred with the demonstration of photonic integrated circuits, which
    exhibit higher effective nonlinearity and enable wider bandwidths. Yet they require
    ultra-low loss, highly precise dispersion engineering, and large chip footprints,
    limiting OPA performance to date. Here, we overcome these limitations and, using
    periodically poled thin-film lithium tantalate (PPLT) photonic integrated circuits,
    we demonstrate continuous-wave optical parametric gain up to 23.5 dB, with a flat-top
    profile spanning across an 850 nm-wide optical wavelength window, corresponding
    to 100 THz and covering all communication bands. Moreover, on-chip output signal
    power as large as 313 mW in the optical O-band is achieved. We further realize
    all-optical inter-band modulation transfer between the C- and O-bands. Our approach
    uses cascaded second-order nonlinear processes that provide high effective third-order
    nonlinearities while preserving the wide material bandgap. These results establish
    PPLT integrated photonic circuits as a scalable platform for broadband optical
    amplification and frequency conversion across wavelengths where rare-earth doped
    amplifiers are absent.
- title: Cryogenic Graphene-Based Phase Modulators for Quantum Information Processing
  date: 2026-04
  url: https://arxiv.org/abs/2605.00112v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Leonard Barboza Navarro
  - Maria Carolina Volpato
  - Alisson Ronieri Cadore
  - Pierre-Louis de Assis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Electro-optic modulators are key components for photonic quantum computing,
    particularly in fully cryovenic integrated platforms where low loss and compactness
    are critical. We present a systematic theoretical investigation of compact dual-layer
    graphene (DSLG) electro-optic phase modulators integrated on silicon nitride waveguides,
    with emphasis on cryogenic operation. By combining electromagnetic simulations
    with a physically consistent description of graphene conductivity based on the
    Kybo formalism, we analyze the interplay between electrostatic tuning, optical
    mode confinement, and material-dependent losses. We show that cryogenic operation
    enhances device performance by sharpening the Fermi-Dirac distribution, enabling
    access to the Pauli-blocking regime at lower Fermi levels and reducing the required
    modulation length. Through optimization of the waveguide geometry, dielectric
    spacer thickness and permittivity, and graphene quality, we identify regimes that
    simultaneously minimize insertion loss and device footprint under realistic voltage
    constraints. The optimized designs achieve near-pure phase modulation with insertion
    losses below 0.3 dB and modulation lengths below 50 um at 10 K, while maintaining
    GHz-scale bandwidths. These results provide quantitative design guidelines for
    low-loss, compact, cryogenic graphene phase modulators for scalable integrated
    quantum photonics.
- title: Intrinsic Limitations of Single Layer Polychromatic Metalens for Virtual
    Reality Visors
  date: 2026-07
  url: https://arxiv.org/abs/2607.03565v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Myunghoo Lee
  - Ben Nguyen
  - Zhihao Zhou
  - Prannav Jayashanker
  - Shane Colburn
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Virtual and augmented reality (VR/AR) visors require compact and lightweight
    optics. Metalenses have been widely proposed as ultrathin replacements for bulky
    refractive eyepieces, with performance typically assessed using point spread function
    (PSF) and modulation transfer function (MTF) measurements. Here, we design, fabricate,
    and characterize a single-layer silicon nitride metalens optimized for the three
    emission peaks of an RGB OLED display, and benchmark it against refractive and
    Fresnel eyepieces. Under coherent illumination, the metalens exhibits a tightly
    confined PSF and strong mid-to-high spatial-frequency MTF, suggesting excellent
    optical performance. However, when evaluated in a realistic system-level VR testbed
    incorporating incoherent OLED illumination, a dynamic-pupil eye model, and near-eye-relevant
    focal lengths, the same device exhibits pronounced ghosting and background haze.
    We show that these artifacts arise from the intrinsic multifocal nature of polychromatic
    diffractive focusing and demonstrate that common mitigation strategies such as
    narrowband filtering and long-focal-length relay optics merely mask, rather than
    resolve, the issue. Our results establish that meta-optics for AR/VR must be evaluated
    under realistic system-level conditions to reveal their true imaging performance.
- title: High-Power Laser Drives Motion in Ultra-thin Photonic Crystal Lightsails
    via Radiation Pressure
  date: 2026-06
  url: https://arxiv.org/abs/2606.20149v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Lucas Norder
  - Ata Keşkekler
  - Richard A. Norte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Laser-driven lightsails have emerged as a promising route for accelerating
    ultralight spacecraft to high speeds using beamed optical energy. Realizing this
    concept pushes the limits of light-matter interaction, materials science, structural
    engineering, and nanomechanical design. A central challenge is to create nanophotonic
    reflectors that combine ultralow mass, large illuminated area, and survival under
    high optical power densities. No previous experiment has combined these constraints
    in a single structure sufficient to produce measurable radiation-pressure displacement.
    Here, we report the largest subwavelength tethered lightsails to date: nanoscale-thickness,
    millimeter-wide silicon nitride membranes patterned with billions of holes. Despite
    their subwavelength thickness, they achieve 99% reflection through resonant photonic
    modes, combining ultralow areal density with high reflectivity. Their compliance
    enables radiation-pressure displacements of up to 1.75 micrometer, a 50,000-fold
    increase over previous lightsail optomechanical responses. These thin mirrors
    are shown to withstand and maintain high reflectivity under directed laser intensities
    comparable to optical intensities at the surface of the Sun. Together, these results
    establish a testbed for high-power nanophotonics, directed-energy systems, and
    light-driven propulsion, defining the practical limits of ultrathin photonic materials
    under intense optical loading.'
- title: Localized crystallization of Ce:YIG thin films on Si using CO2 laser annealing
    for integrated nonreciprocal photonic device applications
  date: 2026-07
  url: https://arxiv.org/abs/2607.17905v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Xinran Ji
  - Junxian Wang
  - Tianchi Zhang
  - Xuan Zhao
  - Di Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Laser annealing (LA) technique has emerged as an effective method for
    localized crystallization of magneto-optical (MO) garnet thin films on semiconductor
    substrates. However, no studies have explored the crystallization and magneto-optical
    (MO) properties of cerium-substituted yttrium iron garnet (Ce:YIG, Ce1Y2Fe5O12)
    thin films for integrated photonic device applications using LA technique. In
    this study, we provide a comprehensive investigation into the laser annealing
    of Ce:YIG films deposited on SiO2 substrates and silicon nitride photonic waveguides
    for integrated nonreciprocal photonic device applications. Garnet phase was successfully
    observed in films grown on SiO2 substrates, and SiN waveguides with laser annealing
    of sputtered Ce:YIG films on top of a laser annealed Y3Fe5O12 seed layer. The
    magneto-optical (MO) properties of Ce:YIG films on oxidized Si substrates were
    found to be comparable to those prepared by rapid thermal annealing (RTA). A Mach-Zehnder
    Interferometer (MZI) type optical isolator based on Ce:YIG film on SiN was fabricated,
    exhibiting a saturation Faraday rotation of -2317.7 deg/cm and propagation loss
    of 188.2 dB/cm. Isolation ratio of 27.1 dB and insertion loss of 10.1 dB were
    achieved at 1552.7 nm wavelength.
- title: Supercontinuum generation in 2D graphene oxide film coated SiN waveguides
  date: 2026-03
  url: https://arxiv.org/abs/2603.07440v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - David J. Moss
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Enhanced supercontinuum generation (SCG) is experimentally demonstrated
    in integrated silicon nitride (Si3N4) waveguides incorporating highly nonlinear
    graphene oxide (GO) in the form of two dimensional (2D) films. Onchip integration
    of the 2D GO films with precise control of their thickness is realized by using
    a transfer free and layer by layer coating method. The control of the film length
    and coating position is achieved via window opening in the upper silica cladding
    of the photonic integrated chips. Detailed SCG measurements are performed using
    the fabricated devices with different waveguide geometries and GO film thicknesses,
    and the results are compared with devices without GO. Significantly improved spectral
    broadening of ultrashort optical pulses with ultrahigh peaks powers exceeding
    1000 W is observed for the hybrid devices, achieving up to 2.4 times improvement
    in the spectral bandwidth relative to devices without GO. Theoretical analyses
    for the influence of GO film thickness, coating length, coating position, and
    waveguide geometry are also provided by fitting the experimental results with
    theory, showing that there is still significant room for further improvement.
    This work opens up a promising new avenue towards improving the SCG performance
    of photonic integrated devices by incorporating functional 2D materials.
- title: Transmission of signals in the 300 GHz band with a bit-error rate below ${10}^{-9}$
    using a soliton comb
  date: 2026-05
  url: https://arxiv.org/abs/2605.12348v2
  category: silicon-photonics
  subcategory: systems
  authors:
  - Mantaro Imamura
  - Ryo Sugano
  - Ayaka Yomoda
  - Atsuro Shirasaki
  - Koya Tanikawa
  venue: ''
  code_url: ''
  project_url: ''
  abstract: To address the increasing demand for ultra-high-capacity wireless communication,
    terahertz (THz) frequencies near 300 GHz are attracting attention as a new spectral
    frontier. This work presents the first experimental demonstration of error-free
    (BER $&lt; 1\times10^{-9}$) 10 Gbps transmission in the 300 GHz band using a soliton
    microcomb generated in an integrated silicon nitride (SiN) microring resonator.
    While many previous microcomb-based THz demonstrations have focused on coherent
    modulation formats and operation near the forward-error-correction (FEC) limit,
    this work investigates a simple intensity-modulation/direct-detection (IM-DD)
    on-off keying (OOK) architecture suitable for low-complexity THz links and fiber-wireless
    integrated systems. Although the experiment was conducted in a short back-to-back
    waveguide configuration, the generated THz wave enabled stable low-BER transmission
    without FEC or advanced offline signal processing. Analysis of the error-free
    threshold power indicates the feasibility of free-space transmission over several
    tens of meters with high-gain antennas and THz-band amplifiers. These results
    demonstrate the feasibility of robust low-complexity THz photonic links based
    on soliton microcombs for short-range fiber-wireless integrated systems.
- title: High-speed mid-infrared single-photon upconversion spectrometer
  date: 2026-05
  url: https://arxiv.org/abs/2605.30701v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Tingting Zheng
  - Kun Huang
  - Ben Sun
  - Jianan Fang
  - Yongyuan Chu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Sensitive and fast mid-infrared (MIR) spectroscopy is highly attractive
    in a variety of applications including astronomical observation, pharmaceutical
    synthesis, and environmental monitoring. However, the performance of conventional
    MIR spectrometers has long been hindered by the limited sensitivity of narrow-bandgap
    detectors and/or the deficient brightness of broadband light sources. Here, we
    devise and implement an ultra-sensitive and broadband MIR upconversion spectrometer,
    which integrates a supercontinuum source covering 1.5-4.2 $μ$m based on a silicon
    nitride nanophotonic waveguide. High-efficiency and low-noise nonlinear frequency
    upconversion is realized based on coincidence pulsed pumping with spectro-temporal
    optimization, which enables to leverage silicon detectors for facilitating MIR
    single-photon spectroscopy at 0.2 photons/nm/pulse. Furthermore, the upconversion-based
    array spectrometer is manifested with high-speed spectral acquisition rates beyond
    200 kHz, which is about ten-fold faster than the state-of-the-art scan rates for
    FTIR-based spectrometers at a comparable spectral resolution. The achieved features
    of broadband spectral coverage, single-photon sensitivity, and sub-MHz refreshing
    rate might open up new possibilities in infrared transient spectral measurements
    in combustion analysis, high-throughput sorting and reaction tracking, among others.
- title: Broadband silicon photonic phase shifters driven by gradient optical forces
  date: 2026-07
  url: https://arxiv.org/abs/2607.08558v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Guillermo Arregui
  - Sander Jæger Linde
  - Magnus Vejby Nielsen
  - Bingrui Lu
  - Nikolaj B. Hougs
  venue: ''
  code_url: ''
  project_url: ''
  abstract: While initially deployed for optical interconnects, silicon photonics
    is increasingly being explored as a hardware platform for programmable optical
    systems, including linear optical processors, neuromorphic photonic networks,
    quantum photonic circuits and multiplexed sensor arrays. Common to most existing
    implementations is that light is controlled with electronics, and even basic demonstrations
    wherein light directly controls light remain limited. Here we demonstrate a broadband
    all-optical silicon photonic phase shifter based on an optomechanically mediated
    light-light interaction arising from the gradient optical force. Our device concept
    relies on slot-mode waveguides suspended by subwavelength gratings, which provide
    mechanical support while preserving optical confinement. We demonstrate all-optical
    phase shifting using a guided pump beam co-propagating with the signal beam, with
    only 60 $μ$W required to achieve a $π$ phase shift in a 178.6 $μ$m-long device.
    In addition, we measure the required pump power across a wide parameter space
    and find quantitative agreement with a lumped force-equilibrium model. Since the
    actuation relies on an all-optical geometric deformation rather than on material-index
    tuning, the approach avoids local electrical connections to the active element,
    carries no Kramers-Kronig absorption penalty, and is naturally compatible with
    cryogenic quantum photonic platforms.
- title: 'STEPIC: High-Speed Imaging via Spatio-Temporal Encoding in Photonic Integrated
    Circuits'
  date: 2026-05
  url: https://arxiv.org/abs/2605.29551v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Andrea Ciceri
  - Giacomo Corrielli
  - Giulia Bertolini
  - Cinzia De Marco
  - Vera Cappelletti
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-speed imaging of cells in flow is essential for probing cellular
    heterogeneity in large populations. Existing imaging approaches based on single-pixel
    detection and spatio-temporal encoding provide exceptional speed, but typically
    rely on bulky free-space optics, long dispersive elements, and are prone to alignment
    instabilities. Here, we introduce STEPIC Microscopy, the first fully integrated
    on-chip system for high-speed imaging via spatio-temporal encoding in photonic
    integrated circuits. Our platform leverages waveguides, splitters, fiber delay-lines,
    and 3D optical remappers to encode spatial information into the temporal domain,
    enabling robust image reconstruction of cells flowing through microchannels. The
    monolithic architecture provides a compact and robust platform for high-throughput
    bioimaging, enabling scalable and practical implementations of ultrafast imaging
    systems.
- title: Mid-infrared germanium-on-silicon waveguide sensor for therapeutic drug monitoring
    of phenytoin
  date: 2026-03
  url: https://arxiv.org/abs/2603.01862v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - David J. Rowe
  - Siyu Chen
  - Mihai-Adrian Panainte
  - Callum J. Stirling
  - Pin Dong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report the design, fabrication and characterization of evanescent mid-infrared
    germanium-on-silicon waveguide sensors for therapeutic drug monitoring (TDM).
    TDM requires rapid and accurate quantification of serum drug levels but existing
    clinical assays rely on laboratory-based instrumentation that limits point-of-care
    deployment. In this work, tunable diode laser absorption spectroscopy was used
    to analyze dried samples of the anti-seizure medication phenytoin in the spectral
    region of $λ$ = 5.6 - 6.0 $μ$m. A limit of detection of 2.20 mg/L was achieved
    for extracted samples, where phenytoin was first added to human serum and subsequently
    isolated using liquid-liquid extraction. This limit is significantly below the
    therapeutic window of 10 - 20 mg/L for phenytoin, enabling detection of sub-therapeutic
    concentrations. At the same time, the sensor maintains a consistent dose-dependent
    response up to 40 mg/L, demonstrating its capability to quantify concentrations
    across the therapeutic window and above the upper therapeutic limit. This validates
    the use of silicon photonics for biomedical infrared spectroscopy for patients
    undergoing drug therapy, whether the serum-drug concentration is either too high
    or too low. These results highlight the potential of mid-IR integrated photonics
    to form the basis of compact, scalable platforms for point-of-care TDM.
- title: Electrically-pumped near-infrared VCSEL epitaxially-grown on Si
  date: 2026-07
  url: https://arxiv.org/abs/2607.18873v1
  category: silicon-photonics
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The monolithic integration of compact laser sources onto silicon remains
    a critical bottleneck for the scalable development of silicon photonics. In particular,
    the direct epitaxial growth of near-infrared vertical-cavity surface-emitting
    lasers (VCSELs) on silicon has long been hindered by the simultaneous requirements
    of low crystalline defect density in the active region and smooth interfaces in
    the distributed Bragg reflector (DBR) mirrors, both essential to achieving high
    cavity quality factors and low lasing thresholds. Here, we report the direct epitaxial
    integration of near-infrared VCSELs on silicon substrates using a two-step growth
    strategy specifically designed to suppress defect propagation while preserving
    mirror interface abruptness. This approach enables effective confinement of threading
    dislocations away from the active region and ensures high-reflectivity DBRs with
    excellent structural uniformity. Structural and optical characterizations reveal
    an epitaxial stack of high crystalline quality, leading to laser performance comparable
    to VCSELs commonly grown on GaAs substrates. We demonstrate, for the first time,
    directly grown VCSELs on silicon wafers exhibiting threshold currents of only
    a few milliamperes. These results establish a decisive proof of concept for the
    monolithic integration of good-performance VCSELs onto silicon platforms and open
    a viable pathway toward fully integrated, low-cost silicon-based photonic systems.
- title: Self-stabilization of microcombs
  date: 2026-07
  url: https://arxiv.org/abs/2607.19614v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Krishna Twayana
  - Fuchuan Lei
  - Junyong Choi
  - Jungwon Kim
  - Victor Torres-Company
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical frequency combs form phase-locked spectral lines arranged on an
    equidistant grid fully defined by two degrees of freedom, i.e., the repetition
    rate and frequency offset. Stabilizing these parameters to a common frequency
    reference results in a coherent frequency ruler, central for modern precision
    metrology. However, extending this level of stability to chip-scale microcombs
    remains an outstanding challenge. Here, we demonstrate a self-stabilizing mechanism
    based on self-injection locking of a selected comb line via an external feedback
    loop. This process establishes a second anchor point in addition to the pump,
    thereby constraining the comb's frequency noise dynamics. We show that, with an
    appropriate choice between pump frequency noise and feedback strength, collective
    fluctuations of the repetition rate are strongly suppressed. The result is a microcomb
    exhibiting ultralow phase noise and dramatically reduced timing jitter. In a 100
    GHz silicon nitride soliton microcomb, we achieve an unprecedented combination
    of high-conversion efficiency, sub-Hertz intrinsic linewidth across the entire
    C band, and an integrated timing jitter of 1 fs. This approach enables chip-scale
    microcombs with remarkable noise performance and fs-level pulse stability, surpassing
    conventional noise limits and opening new avenues for precision metrology at the
    chip scale.
- title: Single-Aperture Dual-Color Ion Addressing with a DUV-Compatible Bilayer Grating
  date: 2026-07
  url: https://arxiv.org/abs/2607.23529v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Gyanendra Yadav
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multi-wavelength optical control is a scaling bottleneck for trapped-ion
    hardware: separate surface emitters consume trap area, interrupt the electrode
    plane, and expose charge-sensitive dielectric near the ions. Here, a vertically
    stacked silicon-nitride bilayer routes the $^{40}\text{Ca}^+$ qubit and repump
    fields-729.4 and 854.2 nm-through one electrode aperture and focuses them $70~μ\text{m}$
    above the chip. Three-dimensional FDTDX predicts $0.10~μ\text{m}$ color separation
    and near-diffraction-limited spots along the ion-chain axis. Multi-level depth-allocation
    apodization enables this architecture by encoding the coupling envelope in discrete
    etch levels rather than sub-resolution linewidths. Every feature satisfies a strict
    $\ge 125\text{ nm}$ deep-UV rule using two etch depths per film. Full-3D Ansys
    Lumerical simulations independently corroborate directionality, spot size, and
    repump efficiency. At a common 50 nm reporting grid, the DUV-compatible device
    matches a 63 nm electron-beam design on the qubit channel (focusing efficiency
    0.286 vs 0.288; crosstalk -24.0 vs -24.3 dB). Vertical integration therefore converts
    wavelength scaling from a lateral-footprint penalty into a layer-allocation problem,
    providing a pathway toward compact multi-color photonic interfaces for trapped
    ions and other chip-addressed quantum emitters.'
- title: Harnessing bound states in the continuum for quantum and nonlinear photonics
    in silicon nitride microresonators
  date: 2026-08
  url: https://arxiv.org/abs/2608.07426v1
  category: silicon-photonics
  subcategory: systems
  authors:
  - Eduardo C. Lima
  - Marco Clementi
  - Alice Viola
  - Matteo Galli
  - Daniele Bajoni
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this work we theoretically and experimentally investigate bound states
    in the continuum (BICs) in a reconfigurable integrated photonic structure, focusing
    on spontaneous four-wave mixing. We consider a configuration in which only one
    mode, the idler, is tuned to the BIC condition, and show that suppressing the
    radiative loss of this single mode profoundly reshapes the overall nonlinear dynamics.
    In particularly, we realize electrically tunable Friedrich-Wintgen BICs with Q
    &gt; 10^6 in an interferometrically coupled silicon-nitride microresonator. Although
    inaccessible through linear excitation, the BIC is populated by four-wave mixing
    and read out through its radiative photon partner. In the low-gain regime, we
    investigate the spectral, correlation, and coherence properties of the generated
    photon pairs, revealing distinctive signatures in the signal-idler correlations
    and an extracted signal whose coherence time approaches the intrinsic-loss-limited
    lifetime of the dark idler. In the high-gain regime, making one mode participating
    in optical parametric amplification a BIC enhances the parametric gain by 12 dB
    and lowers the oscillation threshold by 1.6 dB. These results establish BICs as
    a tool for mode-selective lifetime engineering, enabling control over both biphoton
    wavepackets and the threshold dynamics of integrated parametric devices.
- title: Inverse-designed meta processing units for multi-task near-field photonic
    computing
  date: 2026-07
  url: https://arxiv.org/abs/2607.08360v1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Chu Wu
  - Zeyu Cai
  - Songtao Yang
  - Ruoyu Shen
  - Yinan Zhao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated photonic neural networks require optical operators that are
    simultaneously compact, matrix-general and compatible with task-level reconfigurability.
    Here we introduce a meta processing unit (MPU), an inverse-designed near-field
    photonic device that implements local complex matrix transformations within a
    shallow-etched silicon region. Each 2x2 operator occupies 9.6 umx4.8 um and is
    designed as a reusable passive matrix primitive that can be combined with reconfigurable
    MZI neurons. We demonstrate a 3-bit quantized MZI-equivalent unitary device library
    with an effective reconstruction precision of 3.32 bits. Beyond unitary operators,
    we validate arbitrary complex 2x2 matrix fitting and a cascaded 4x4 matrix operation
    with 92.7% fidelity. We further integrate the MPU with active photonic components
    and hardware-in-the-loop training, achieving test accuracies of 83.5% and 80.9%
    on dual-task vowel recognition. In large-scale EMNIST simulations, a fine-grained
    neuron-level MPU replacement strategy reaches 87.64% average accuracy at 90% shared-MPU
    replacement, outperforming a layer-level baseline by 7.26 percentage points. These
    results establish inverse-designed MPUs as compact passive matrix operators for
    heterogeneous, hardware-adaptive photonic neural networks.
- title: 'Memory in Integrated Photonic Neural Networks: From Physical Mechanisms
    to Neuromorphic Architectures'
  date: 2026-04
  url: https://arxiv.org/abs/2604.22620v1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Alessandro Foradori
  - Ilya Auslender
  - Stefano Biasi
  - Stefano Gretter
  - Alessio Lugnan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid scaling of artificial neural networks has exposed fundamental
    limitations of conventional von Neumann computing architectures. In these systems,
    the physical separation between memory and processing creates a bottleneck, as
    computational capabilities outpace the ability of memory and interconnects to
    supply and retrieve data. In contrast, biological neural systems inherently co-localize
    computation and memory through distributed, dynamical processes. Neuromorphic
    computing seeks to emulate this paradigm by leveraging physical substrates whose
    intrinsic dynamics simultaneously encode and process information. Among emerging
    platforms, silicon photoncis offer a compelling approach due to its high bandwidth,
    low-loss propagation, and inherent parallelism. This review examines the role
    of memory in integrated photonic neuromorphic systems, with emphasis on the physical
    mechanisms that provide volatile (short-term) and non-volatile (long-term) memory
    in silicon-on-insulator and hybrid silicon-on-insulator platforms. Drawing inspiration
    from digital, biological, and photonic memory architectures, we classify existing
    approaches based on their underlying physical principles. We cover implementations
    ranging from delay lines and slow-light structures to multistable dynamics and
    structural memory based on charge trapping and phase-change materials. We then
    discuss how these mechanisms support photonic neural network architectures, including
    feed-forward, reservoir computing, spiking and hybrid optoelectronic recurrent
    systems, and assess their relevance for time-dependent singal-processing tasks
    such as channel equalization in telecommunications. This review aims to establish
    a unified framework for understanding memory and learning in neuromorphic photonics
    and outlines key challenges and opportunities for scalable, energy-efficient neuromorphic
    hardware.
- title: Hardware Implementation of Photonic Spiking Hash Retrieval
  date: 2026-03
  url: https://arxiv.org/abs/2603.02738v1
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Shangxuan Shi
  - Shuiying Xiang
  - Xintao Zeng
  - Yonghang Chen
  - Wanting Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Hashing retrieval is a pivotal technology for large-scale similarity search,
    widely applied in retrieval-augmented generation (RAG) for large language models
    (LLMs), massive image repositories, and bioinformatics sequence matching. However,
    traditional electronic hashing implementations face severe bottlenecks in power
    consumption and latency when processing high-dimensional data, while existing
    photonic neural networks often lack robust mechanisms for direct binary code generation
    under analog noise. To address these challenges, we propose a hardware-software
    co-designed photonic spiking hashing framework. We utilize the nonlinear thresholding
    dynamics of a distributed feedback laser with saturable absorber (DFB-SA) to realize
    the final binarization of a single-step spiking neural network (SNN). Crucially,
    a hardware-aware quantization margin loss is introduced to maximize the decision
    margin, effectively mitigating bit flips caused by optical intensity fluctuations.
    Validated on MNIST (image) and 20 Newsgroups (text) datasets, our system demonstrates
    robust binary code generation and high retrieval accuracy comparable to digital
    baselines. Most significantly, the proposed photonic architecture exhibits superior
    efficiency with an encoding latency of 2.294 ns/query and an energy consumption
    of 73.70 pJ/query. This work offers a robust and viable path for ultra-fast, energy-efficient
    optoelectronic neuromorphic computing in high-throughput information retrieval
    tasks.
- title: Small-scale photonic Kolmogorov-Arnold networks using standard telecom nonlinear
    modules
  date: 2026-04
  url: https://arxiv.org/abs/2604.08432v2
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Luca Nogueira Calçado
  - Sergei K. Turitsyn
  - Egor Manuylovich
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Photonic neural networks promise ultrafast inference, yet most architectures
    rely on linear optical meshes with electronic nonlinearities, reintroducing optical-electrical-optical
    bottlenecks. Here we introduce small-scale photonic Kolmogorov-Arnold networks
    (SSP-KANs) implemented entirely with standard telecommunications components. Each
    network edge employs a trainable nonlinear module composed of a Mach-Zehnder interferometer,
    semiconductor optical amplifier, and variable optical attenuators, providing a
    four-parameter transfer function derived from gain saturation and interferometric
    mixing. Despite the constrained functional form of these optical nonlinearities,
    SSP-KANs comprising only a few optical modules achieve strong nonlinear inference
    performance across classification, regression, and image recognition tasks, approaching
    software baselines with significantly fewer parameters. A four-module network
    achieves $94.3$\% (IQR: $90.3$--$97.4$\%, 10~seeds) accuracy on nonlinear classification
    benchmarks; a seven-module network attains $R^2 = 0.986 \pm 0.015$ on six-input
    regression. Performance remains robust under realistic hardware impairments, maintaining
    high accuracy down to 6-bit input resolution and 14 dB signal-to-noise ratio.
    By using a fully differentiable physics model for end-to-end optimisation of optical
    parameters, this work establishes a practical pathway from simulation to experimental
    demonstration of photonic KANs using commodity telecom hardware.'
- title: Picometer-Scale Spatial Symmetry Breaking in Active Transmissive Metasurfaces
  date: 2026-04
  url: https://arxiv.org/abs/2604.15185v2
  category: photonic-neural-networks
  subcategory: method
  authors:
  - Martin Thomaschewski
  - Ruzan Sokhoyan
  - Elisabetta Schneider
  - Harry Atwater
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Active transmissive metasurfaces are central building blocks for future
    compact, cascadable optical systems, enabling the stacking of multiple functional
    layers for advanced dynamic beam shaping, photonic neural networks, depth sensing,
    and holography. We present a transmissive electro-optic metasurface based on silicon-on-lithium-niobate,
    where an array of silicon waveguides with periodic perturbations, individually
    controlled at the 100 pm scale, supports well-defined high-Q (&gt;2000) guided-mode
    resonances (GMRs). We incorporate interdigitated push-pull electrodes between
    subwavelength-spaced GMR elements to locally tune the refractive index in the
    lithium niobate substrate, thereby shifting the GMR resonance and enabling opposite
    phase and amplitude modulation between neighboring radiative elements. In a geometrically
    symmetric metasurface, this effect introduces electro-optic beam splitting via
    diffraction, with diffraction efficiencies as high as 3%. By introducing controlled
    passive resonance detuning via 100 pm scale perturbation shifts, we realize a
    Vernier-type enhancement mechanism through geometrical symmetry breaking, thereby
    increasing the efficiency of amplitude modulation six-fold , and achieving modulation
    depths of 40% at $\pm$30 V. This work demonstrates the potential of active and
    passive resonance control enabled by high-Q GMR structures for efficient electro-optic
    modulation or multifunctional sensing.
- title: Boson Sampling with a reconfigurable 128 modes 3D integrated photonic circuit
  date: 2026-05
  url: https://arxiv.org/abs/2605.04162v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Simone Di Micco
  - Francesco Hoch
  - Alessandro Ciorra
  - Daniel Carvalho de Salles
  - Nicolò Spagnolo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated quantum photonics has emerged as one of the leading platforms
    for scaling quantum information processing, offering compact, stable, and low-loss
    hardware with precise phase and mode control. Advances in integrated photonics
    architectures and active programmability now enable complex, high-dimensional
    transformations essential for quantum advantage tasks. We introduce an integrated,
    reconfigurable 3D photonic device with 128 modes for manipulation of single-photon
    quantum states (Qolossus 3D). Leveraging a continuously coupled architecture and
    thermo-optic programmability, the platform implements reconfigurable unitary transformations
    at unprecedented scale for integrated quantum optics. Exploiting indistinguishable
    single photons demultiplexed from a quantum dot source, we perform Boson Sampling
    across the large-dimensional chip and analyse the resulting output distributions
    for up to 4 photons. We then exploit it to demonstrate randomness generation via
    Boson Sampling. Agreement with theoretical predictions validates both the device's
    reconfigurable operation and the generation of random numbers. Our results highlight
    the scalability, stability, and precise control of integrated photonics for quantum
    information processing.
- title: Parameter-Shift Rules for Gradients in Boson Sampling Experiments
  date: 2026-07
  url: https://arxiv.org/abs/2607.15160v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Marius Trudeau
  - Pierre-Emmanuel Emeriau
  - Nicolás Quesada
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Using a robust photon loss model for photonic quantum experiments, we
    derive $n-$th order parameter-shift rules for computing gradients of Fock boson
    sampling transition probabilities where $n$ photons are sent into a lossy interferometer.
    We also show that in general it is not possible to generalize this gradient recipe
    to the case of Gaussian boson sampling. Only in the specific case where the transmission
    matrix of the interferometer can be factorized as a diagonal loss matrix premultiplied
    by a pure unitary it is possible to obtain parameter-shift rules with a finite
    order given by twice the total number of photons detected. We demonstrate the
    efficacy of the proposed method by comparing its performance against finite differences
    on real hardware.
- title: Weak Permanent Anti-Concentration for Random Gaussian Matrices in Boson Sampling
  date: 2026-07
  url: https://arxiv.org/abs/2607.22088v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Fei Meng
  - Bin Cheng
  - Jianan Li
  - Man-Hong Yung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent demonstrations of quantum computational advantage have been driven
    largely by sampling problems. A prominent model, boson sampling, involves sampling
    from the output distribution of a linear optical network. However, its classical
    hardness hinges on two plausible yet less-studied conjectures: the average-case
    hardness of approximating Gaussian permanents, and the permanent anti-concentration
    conjecture (PACC). The PACC is a purely mathematical assertion regarding the distributional
    properties of random Gaussian matrices. While the typical magnitude of the permanent
    has been established for discrete random matrices, the complex Gaussian case,
    which governs transition amplitudes in linear optical networks, has remained open.
    Here, we establish a weak anti-concentration bound by upper-bounding the probability
    that a random Gaussian permanent is superexponentially smaller than its standard
    deviation. Tightening this bound to an inverse-polynomial fraction would prove
    the original PACC. As a corollary, we establish the typical magnitude of Gaussian
    permanents, on par with Tao and Vu''s seminal result for Bernoulli matrices. Combined
    with the Aaronson-Arkhipov framework, our result implies that classically simulating
    boson sampling to within a superexponentially small total variation distance would
    collapse the polynomial hierarchy, assuming the remaining conjectures hold.'
- title: Boson Sampling as a Probe of Chaotic and Integrable Quantum Dynamics in a
    Photonic Chip
  date: 2026-05
  url: https://arxiv.org/abs/2605.25398v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yuancheng Zhan
  - Khen Cohen
  - Norman T. W. Koo
  - Kian Hwee Lim
  - Hui Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum chaos plays a key role in understanding complex quantum dynamics,
    while integrated photonics offers unique advantages for quantum applications,
    including high-speed operation, scalability, and programmable unitary transformations.
    However, integrated photonic approaches to probing quantum chaos remain largely
    unexplored, owing to the absence of a clear connection between programmable photonic
    dynamics and established chaos diagnostics. In this work, we establish Fock-state
    boson sampling as a practical probe of quantum chaos by exploiting the sensitivity
    of multiphoton interference to the random-matrix properties of underlying single-particle
    unitary dynamics. More importantly, we design and fabricate a programmable quantum
    photonic chip to experimentally implement this framework, achieving the first
    integrated-photonic demonstration of quantum-chaos probes based on boson sampling.
    Experimental results show that the three complementary probes proposed in this
    work, namely the distance to Porter--Thomas statistics, Shannon entropy, and Out-of-Time-Ordered-Correlator-equivalent
    observables, exhibit close agreement with theoretical predictions and consistently
    distinguish chaotic and integrable dynamics. Our work provides a scalable route
    for investigating complex quantum dynamics on programmable photonic platforms
    while leveraging the intrinsic advantages of boson sampling through multiphoton
    interference and complex output statistics.
- title: Universal linear manipulation via routing and projective measurements
  date: 2026-08
  url: https://arxiv.org/abs/2608.05003v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Alessio Baldazzi
  - Sonia Mazzucchi
  - Lorenzo Pavesi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multiport interferometers with $N$ ports are basic devices in both classical
    and quantum photonics. Ideally, they implement a linear unitary transformation
    between the input and output electric field vectors with $N$ components, each
    associated with a spatial mode of classical coherent light or a single photon.
    Standard designs for a fully reconfigurable universal multiport interferometer
    are given by the Reck or the Clements schemes. In this work, we introduce routing
    schemes to implement a generic unitary transformation on classical coherent light
    or single photons using linear or tree geometries via multiple projective measurements
    on a single detector with the minimum number of components. Then, we generalize
    this result to the case of any multi-photon state for scattershot boson sampling
    experiments with multi-routing schemes. Finally, we test the robustness of routing
    schemes compared to universal schemes with respect to losses and phase noise.
- title: 'Generative modeling with Gaussian Boson Sampling: classically trainable
    Bosonic Born Machines'
  date: 2026-03
  url: https://arxiv.org/abs/2603.11195v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Zoltán Kolarovszki
  - Bence Bakó
  - Michał Oszmaniec
  - Changhun Oh
  - Zoltán Zimborás
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum generative modeling has emerged as a promising application of
    quantum computers, aiming to model complex probability distributions beyond the
    reach of classical methods. In practice, however, training such models often requires
    costly gradient estimation performed directly on the quantum hardware. Crucially,
    for certain structured quantum circuits, expectation values of local observables
    can be efficiently evaluated on a classical computer, enabling classical training
    without calls to the quantum hardware in the optimization loop. In these models,
    sampling from the resulting circuits can still be classically hard, so inference
    must be performed on a quantum device, yielding a potential computational advantage.
    In this work, we introduce a photonic quantum generative model built on parametrized
    Gaussian Boson Sampling circuits. The training is based on the efficient classical
    evaluation of expectation values enabled by the Gaussian structure of the state,
    allowing scalable optimization of the model parameters through the maximum mean
    discrepancy loss function. We demonstrate the effectiveness of the approach through
    numerical experiments on photonic systems with up to 805 modes and over a million
    trainable parameters, highlighting its scalability and suitability for near-term
    photonic quantum devices.
- title: A diode nanocavity for fast, efficient and tunable emission of highly entangled
    photon pairs and Fourier-transform-limited single photons
  date: 2026-07
  url: https://arxiv.org/abs/2607.11494v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ievgen Brytavskyi
  - Thomas Oberleitner
  - Christian Weidinger
  - Maximilian Aigner
  - Gabriel Undeutsch
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deterministic sources of entangled photon pairs and indistinguishable
    photons are expected to play a key role in photonic quantum technologies. Semiconductor
    quantum dots are promising candidates due to their on-demand emission and compatibility
    with nanophotonic structures. However, current implementations face trade-offs
    between extraction efficiency, Purcell enhancement, as well as charge noise that
    causes blinking and degrades indistinguishability. Here we demonstrate a tunable
    nano-optoelectronic device based on a quantum dot embedded in a p-i-n diode circular-Bragg-grating-resonator
    and featuring extraction efficiencies up to 0.55(6) and Purcell-factor of $\sim$8.
    The device generates wavelength-tunable entangled photon pairs with suppressed
    blinking and raw (corrected) concurrence &gt; 0.89 (0.91) over a range of 1.6
    nm. The very same source also emits single, nearly Fourier-limited and highly
    indistinguishable photons with raw (corrected) $\mathcal{V}_{\text{HOM}}$ = 0.951(4)
    (0.988(6)). These results demonstrate a viable platform for semiconductor quantum
    photonics.
- title: Photon Sorting with a Quantum Emitter
  date: 2026-04
  url: https://arxiv.org/abs/2604.21758v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Kasper H. Nielsen
  - Etienne Corminboeuf
  - Benedikt Tissot
  - Love A. Pettersson
  - Sven Scholz
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-quality photonic Bell state measurements (BSMs) enable scalable universal
    quantum computing and long distance quantum communication. However, when implemented
    with linear optics, BSMs are fundamentally probabilistic, introducing substantial
    hardware overheads and limiting noise tolerance in photonic quantum computing
    architectures. Nonlinear interactions at the single-photon level can overcome
    these limitations by enabling near-deterministic photon-photon gates. Here, we
    demonstrate a passive photon-sorting circuit based on the induced nonlinearity
    arising from photon scattering in a solid-state quantum emitter. The scattering
    is implemented in a directional waveguide-emitter coupling interface and embedded
    on-chip into a linear optical circuit, through which we demonstrate sorting of
    one- and two-photon components with a success probability of 62%. We find that
    the current system can enable BSMs with a 57% post-selected success probability
    without ancillary photons, exceeding the linear-optical limit of 50%, and can
    be readily improved to &gt;65% with design optimisations.
- title: Linear optical fan-out gates using fewer ancillary single photons with enhanced
    success probability
  date: 2026-08
  url: https://arxiv.org/abs/2608.15608v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Wen-Qiang Liu
  - Hai-Rui Wei
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic quantum gates are fundamental building blocks for a wide range
    of optical quantum information processing tasks. We propose an efficient linear-optical
    scheme for implementing a post-selected three-qubit fan-out gate (also known as
    a controlled-NOT-NOT gate) using only two ancillary single photons and linear
    optical elements. The scheme can be generalized to an $n$-qubit fan-out gate,
    requiring $(n-1)$ ancillary single photons and $(3n-3)$ polarizing beam splitters
    (PBSs), with a success probability of $\left(\frac{1}{4}\right)^{n-1}$. Compared
    to the standard gate decomposition approach, which requires $(2n-2)$ ancillary
    single photons, $(5n-5)$ PBSs, and yields a success probability of $\left(\frac{1}{8}\right)^{n-1}$.
    Our scheme significantly reduces the resource overhead and improves the success
    probability. We further evaluate the gate performance and demonstrate improved
    robustness compared to gate decomposition-based methods.
- title: Industry-ready spin-photon interfaces for hybrid photonic quantum computing
  date: 2026-06
  url: https://arxiv.org/abs/2606.27787v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hêlio Huet
  - Hubert Lam
  - Thibaut Pollet
  - Petr Steindl
  - Alice Bernard
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Hybrid photonic quantum computers, combining stationary matter qubits
    and flying photonic qubits, offer an intrinsically networked and resource-efficient
    route to large-scale, error-corrected quantum computation. Their core components
    are cavity-coupled matter qubits that act as light--matter interfaces, enabling:
    high-efficiency on-demand single-photon generation, stable near-unity photon indistinguishability
    and spin--multi-photon entanglement. Semiconductor quantum dots in microcavities
    are a leading platform for realizing such devices. Yet reaching the performance,
    reproducibility and spin-coherence thresholds for large-scale error correction
    remains a major challenge requiring industrial fabrication and control. Here we
    report thousands of monolithic semiconductor quantum-dot devices fabricated using
    a III--V pilot production-line process compatible with large-scale deployment.
    Systematic control of source parameters yields state-of-the-art efficiency and
    supports a path to optical losses below fault-tolerance thresholds. Using field-quadrature
    state reconstruction as a stringent joint test of efficiency and indistinguishability,
    we observe near-unity photon quantum purity stable over tens of minutes and a
    record single-photon Wigner-function negativity. We further demonstrate seven-partite
    spin--multi-photon entanglement and spin coherence extendable to microsecond timescales
    in the low-magnetic-field regime. Finally, photons from distant sources are as
    indistinguishable as photons emitted successively by a single source. These results
    establish foundry-compatible III--V quantum dots as a scalable platform for hybrid
    photonic quantum computing.'
- title: The subthreshold issue of fusion-based quantum computing
  date: 2026-06
  url: https://arxiv.org/abs/2606.28490v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Matthias C. Löbl
  - Love A. M. Pettersson
  - Jan Dragašević
  - Susan X. Chen
  - Oliver A. D. Sandberg
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Fusion-based quantum architectures are the leading approach to photonic
    quantum computing. However, the sub-threshold regime, where logical error rates
    must reach the levels required by useful applications, has received little attention.
    We show that in this regime, fusion failure imposes a noise floor on the logical
    error rate that prevents all-linear-optics architectures from reaching the required
    rates at low overhead. For fusion-based architectures using quantum emitter spins,
    we show that the noise floor is reduced by orders of magnitude at a lower overhead.
- title: Single-photon-boosted type-I fusion gates
  date: 2026-03
  url: https://arxiv.org/abs/2603.27315v3
  category: quantum-photonics
  subcategory: theory
  authors:
  - A. A. Melkozerov
  - S. S. Straupe
  - M. Yu. Saygin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Fusion measurements are a key primitive for linear-optical quantum computing
    and quantum networks. Type-I and type-II fusion gates are widely used to combine
    small entangled resource states into larger photonic states, but without ancillary
    resources their success probability is limited to $1/2$. Existing $3/4$-efficient
    type-I schemes rely on entangled Bell-pair ancillary states, whose preparation
    is itself probabilistic and resource-intensive. Here we propose a boosted type-I
    fusion gate using only four ancillary single photons and standard linear-optical
    primitives. For multiqubit GHZ and graph states, the gate succeeds directly with
    probability $5/8$, while a distillation protocol converts partially entangled
    outcomes into additional successful events, raising the total success probability
    to $11/16$ after one stage and asymptotically to $3/4$. We quantify the practical
    advantage of this scheme by estimating the photonic resources required for generating
    representative large entangled photonic states and show that the proposed gate
    significantly reduces the required overhead compared with existing schemes. These
    results expand the set of resource-efficient linear-optical primitives and enable
    a substantial reduction in the resource requirements for scalable photonic quantum
    computing and quantum communication.
- title: Efficient training of photonic quantum generative models
  date: 2026-03
  url: https://arxiv.org/abs/2603.08793v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Felix Gottlieb
  - Chayma Faraji
  - Rawad Mezher
  - Brian Ventura
  - Shane Mansfield
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The topic of generative learning has gained traction within the field
    of quantum machine learning, in particular with the advent of train-on-classical,
    deploy-on-quantum methods. This approach exploits the properties of intermediate-complexity
    circuits whose training can be simulated classically efficiently, but that generally
    require quantum hardware for the corresponding sampling problem. Quantum linear
    optics possess similar properties, which allow us to propose an efficient training
    procedure for photon-native quantum generative models based on the maximum mean
    discrepancy, where the deployment of the model corresponds to the task of boson
    sampling. We provide numerical results, propose datasets, and we also explore
    how initialization strategies, kernel and ansatz choice affect the training.
- title: Gaussian Boson Sampling for Asset Clustering in Statistical Arbitrage Portfolios
  date: 2026-07
  url: https://arxiv.org/abs/2607.19279v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Dayne Marcus Lopena
  - Daniel Buguks
  - Zhenghao Li
  - Ewan Mer
  - Shana H. Winston
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Gaussian Boson Sampling (GBS) provides a native photonic quantum heuristic
    for sampling dense subgraphs from adjacency matrices, offering a scalable physical
    approach to combinatorial graph search problems. Simultaneously, correlation matrix
    clustering algorithms, such as Spectral and SPONGE, have established robust benchmarks
    for identifying co-moving assets from correlation matrices in statistical arbitrage
    (StatArb) strategies. In this work, we map S&amp;P 500 residual correlation data
    into GBS-compatible adjacency matrices. We benchmark those classical clustering
    algorithms against two quantum clustering algorithms, GBS Boost and our novel
    GBS Roots, to construct dynamic, market-neutral portfolios over a rolling one-year
    window. Simulations across distinct macroeconomic regimes reveal that quantum
    clustering generates superior alpha within large stock universes during periods
    of high volatility, effectively isolating structural market idiosyncrasies. Crucially,
    this economic advantage persists under simulated low-loss conditions and extends
    into high-loss regimes via the application of coherent displacement to compensate
    for photon loss. Our findings underscore the efficacy of GBS-derived graph clustering
    in constructing robust StatArb portfolios, establishing a quantum foundation for
    broader quantitative finance applications.
- title: High fidelity photon-photon gates by scattering off a two-level quantum emitter
  date: 2026-03
  url: https://arxiv.org/abs/2603.10805v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Love A. Pettersson
  - Victor R. Christiansen
  - Klaus Mølmer
  - Anders S. Sørensen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a scheme for implementing a high-fidelity non-linear phase
    shift on a photonic state. The scheme is based on repeated scattering off a two-level
    quantum emitter embedded in a chiral or one-sided waveguide. The waveguide is
    equipped with elements inducing second-order dispersion and temporal phase shifts,
    which effectively form a harmonic trap and confine the photon pulses to a Gaussian
    shape. The same quantum emitter can be used for each scattering, and thus, only
    one quantum emitter is needed in this scheme. To illustrate the application of
    our scheme for photonic quantum computing and quantum communication, we analyze
    the implementation of a control-Z gate and a deterministic Bell-state analyzer
    for photonic qubits. Through numerical optimization, we show that we can reach
    a control-Z gate fidelity of $\mathcal{F} \sim 99.2\%$ ($\mathcal{F} \sim 96\%$)
    and a success probability of $P_s \sim 99.6 \%$ ($P_s\sim 98 \%$) for a Bell-state
    measurement with $N=17$ ($N=5$) scatterings.
- title: Quantum photonic frequency processor on thin-film lithium niobate
  date: 2026-03
  url: https://arxiv.org/abs/2603.11471v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ran Yang
  - Wei Zhou
  - Dong-Jie Guo
  - Hong-Ming Ke
  - Linrunde Tao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid development of photonic quantum information processing necessitates
    precise and programmable control over optical frequency, a capability critical
    not only for achieving photon indistinguishability but also for exploiting a virtually
    unbounded frequency dimension. However, efficient and scalable processing of frequency-encoded
    photon states remains challenging, primarily due to the limited nonlinear optical
    interaction in most photonic materials. Here, by harnessing the high-performance
    thin-film lithium niobate electro-optic (EO) platform, we demonstrate an integrated
    quantum photonic frequency processor that enables coherent and programmable control
    of photon frequency with high precision. We establish a scalable architecture
    for frequency-encoded quantum information processing. Using a fully integrated
    photonic chip, we realize a universal set of frequency-encoded quantum logic gates,
    including arbitrary single-qubit rotation gates and the two-qubit controlled-phase
    gate. Furthermore, we demonstrate its application in high fidelity characterization
    of frequency-bin entangled states. Our work reveals the unprecedented potential
    of utilizing the frequency degree of freedom in integrated quantum photonic systems.
- title: Benchmarking the ORCA PT-2 Boson Sampler using Minimum Dominating Set Problems
  date: 2026-05
  url: https://arxiv.org/abs/2605.30935v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Jessica Park
  - Susan Stepney
  - Irene D'Amico
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We use boson sampling as part of a gradient-free variational algorithm
    (the Binary Bosonic Solver) to solve a minimum dominating set problem and compare
    these results to a number of exact and heuristic classical algorithms. The boson
    sampling has been performed on the physical PT-2 time-bin interferometer from
    ORCA Computing. The PT-2 device has been tested here using both a single- and
    double-loop configuration and the results are compared based on the best found
    solution and the overall run time. With the parameters used in this experiment,
    the boson sampler is outperformed by the classical methods, but we hypothesise
    that this is due to insufficient samples and iterations. We classically simulate
    boson sampling in a single-loop configuration to break down the runtime for individual
    algorithmic components, allowing for estimates of when boson sampling may outperform
    classical methods. This study recommends a watching brief on boson sampling as
    the complexity of the interferometer is improved and the loss in the hardware
    is reduced allowing for better performance from the associated algorithms.
- title: Electronic and Photonic Integration of Single Quantum Emitters in 2D Materials
  date: 2026-05
  url: https://arxiv.org/abs/2605.05721v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Sahil D. Patel
  - Sean Doan
  - Luka Jevremovic
  - Kamyar Parto
  - Galan Moody
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Single-photon sources that are bright, pure, and interference-ready are
    essential for quantum communication and photonic quantum information processing,
    but many solid-state platforms still rely on bulky optical excitation, careful
    alignment, and post-selection to achieve useful linewidth, stability, and brightness.
    Scalable quantum photonics instead requires turnkey quantum-light engines that
    can be triggered on demand, stabilized against environmental noise, and efficiently
    interfaced with fibers or photonic circuits. This review surveys recent progress
    in electronic and photonic integration of single quantum emitters in two-dimensional
    materials, focusing on localized excitonic emitters in transition metal dichalcogenides
    and defect-based color centers in hexagonal boron nitride. On the electronic side,
    we discuss electrical injection, fast modulation, electrostatic stabilization,
    and Stark tunability as routes to suppress blinking, spectral wandering, and charge-noise-induced
    broadening. On the photonic side, we review waveguide and resonator platforms
    that funnel emission into well-defined optical modes and, in some cases, enhance
    radiative rates through the Purcell effect. We connect these integration strategies
    to key source metrics, including single-photon purity, brightness, spectral stability,
    and photon indistinguishability. We conclude that the next stage of progress will
    depend on co-designed electronic and photonic architectures that jointly optimize
    on-demand operation, stabilization, tunability, and packaging-compatible optical
    interfacing.
- title: Quantum light source with lithium tantalate for scalable photonic quantum
    circuits
  date: 2026-06
  url: https://arxiv.org/abs/2606.01657v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yun-Ru Fan
  - Bo-Wen Chen
  - Dan Xu
  - Cheng-Li Wang
  - Hong Zeng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Thin-film lithium tantalate (TFLT) has emerged as a promising integrated
    photonic platform owing to its low photorefractive noise, high optical damage
    threshold, and reduced birefringence, attracting increasing interest for scalable
    photonic technologies. Here, to the best of our knowledge, we demonstrate the
    first quantum light source with TFLT via spontaneous four-wave mixing, bridging
    the gap between the rapidly advancing classical TFLT ecosystem and integrated
    quantum photonics. The fabricated microring exhibits a free spectral range of
    350~GHz and an optical quality factor of $10^6$, enabling efficient cavity-enhanced
    nonlinear interactions. Correlated photon pairs are generated across the telecom
    band from 1510 to 1570~nm, with a photon pair generation rate of 24 $\mathrm{MHz/mW^{2}}$
    at a wavelength of 1535.04 nm. The source delivers strongly antibunched heralded
    single photons with $g^{(2)}_{H}(0)=0.071\pm0.004$ at a heralding rate of 170
    kHz, while the unheralded statistics yield $g^{(2)}(0)=1.93 \pm 0.05$, indicating
    near-single-temporal-mode emission. Energy-time entanglement is further confirmed
    by a raw two-photon interference visibility of $92.55\pm0.94\%$, well above the
    Bell-inequality violation threshold. These results establish TFLT as a manufacturing-compatible
    platform for scalable photonic quantum circuits, paving the way for the monolithic
    co-integration of classical and quantum photonic functionalities.
- title: Photonic Quantum-Enhanced Knowledge Distillation
  date: 2026-03
  url: https://arxiv.org/abs/2603.14898v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Kuan-Cheng Chen
  - Shang Yu
  - Chen-Yu Liu
  - Samuel Yen-Chi Chen
  - Huan-Hsin Tseng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Photonic quantum processors naturally produce intrinsically stochastic
    measurement outcomes, offering a hardware-native source of structured randomness
    that can be exploited during machine-learning training. Here we introduce Photonic
    Quantum-Enhanced Knowledge Distillation (PQKD), a hybrid quantum photonic--classical
    framework in which a programmable photonic circuit generates a compact conditioning
    signal that constrains and guides a parameter-efficient student network during
    distillation from a high-capacity teacher. PQKD replaces fully trainable convolutional
    kernels with dictionary convolutions: each layer learns only a small set of shared
    spatial basis filters, while sample-dependent channel-mixing weights are derived
    from shot-limited photonic features and mapped through a fixed linear transform.
    Training alternates between standard gradient-based optimisation of the student
    and sampling-robust, gradient-free updates of photonic parameters, avoiding differentiation
    through photonic hardware. Across MNIST, Fashion-MNIST and CIFAR-10, PQKD traces
    a controllable compression--accuracy frontier, remaining close to teacher performance
    on simpler benchmarks under aggressive convolutional compression. Performance
    degrades predictably with finite sampling, consistent with shot-noise scaling,
    and exponential moving-average feature smoothing suppresses high-frequency shot-noise
    fluctuations, extending the practical operating regime at moderate shot budgets.'
- title: Efficient classical training of model-free quantum photonic reservoir
  date: 2026-04
  url: https://arxiv.org/abs/2604.12441v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Rosario Di Bartolo
  - Valeria Cimini
  - Giorgio Minati
  - Danilo Zia
  - Luca Innocenti
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Model-independent estimation of the properties of quantum states is a
    central challenge in quantum technologies, as experimental imperfections, drifts,
    and imprecise models of the actual quantum dynamics inevitably hinder accurate
    reconstructions. Here, we introduce a training strategy for photonic quantum extreme
    learning machines in which both the learning stage and the optimization of the
    measurement settings are performed entirely with classical light, while inference
    is carried out on genuinely quantum states. The protocol is based on the identity
    between the normalized output intensities following the evolution of coherent
    states through a linear optical reservoir, and the output statistics obtained
    with separable input quantum states. Building on this correspondence, we implemented
    a model-free, gradient-based optimization of the reservoir measurement projection
    directly on experimental data, without relying on a prior model of the device
    transformation. We experimentally show that the resulting classical-to-quantum
    transfer enables accurate reconstruction of single-qubit Pauli observables for
    previously unseen single-photon states, and extends to the estimation of a two-qubit
    entanglement witness for arbitrary bipartite states. Beyond demonstrating a qualitatively
    distinct form of out-of-distribution generalization across the classical-to-quantum
    boundary, our results identify a practical route to fast, adaptive, and resource-efficient
    training of photonic quantum learning devices.
- title: Scalable Quantum Interference from Indistinguishable Quantum Dots
  date: 2026-03
  url: https://arxiv.org/abs/2603.25684v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Sheena Shaji
  - Suraj Goel
  - Julian Wiercinski
  - Frederik Brooke Barnes
  - Moritz Cygorek
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum interference of indistinguishable photons is the foundation of
    photonic quantum technologies, yet scaling from a few to many identical quantum
    light sources remains a major challenge. In solid-state platforms, spatial and
    spectral inhomogeneity and resource-intensive architectures impede scaling. As
    a result, interference between remote, independent quantum emitters has been thus
    far limited to pairs. Here we introduce a wavefront-shaping approach that enables
    scalable interference from multiple indistinguishable quantum dots on the same
    chip. Using programmable spatial light modulators, we independently excite, collect,
    and route emission from spatially distinct, yet spectrally degenerate dots. Scaling
    from two to five indistinguishable emitters, we verify interference through cooperative-emission
    phenomena and Hong-Ou-Mandel two-photon interference, thereby establishing a route
    towards large-scale, programmable quantum photonic architectures.
- title: Rapid Gaussian Boson Sampling Circuit Screening for GKP States Creation via
    a Two-Stage Machine Learning Surrogate
  date: 2026-06
  url: https://arxiv.org/abs/2606.05992v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Mohammad Amin Khanpour
  - Hossein Davoodi Yeganeh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Gottesman-Kitaev-Preskill (GKP) states are essential non-Gaussian resources
    for fault-tolerant photonic quantum computing, enabling logical qubit encoding
    with intrinsic robustness against errors. Several approaches to GKP state preparation
    have been explored, including measurement-based protocols in circuit QED and trapped-ion
    systems, cat-state breeding, and photon-subtraction schemes. However, these methods
    are either restricted to specific platforms or require deep non-Gaussian resource
    chains with exponentially low success probabilities. Gaussian Boson Sampling (GBS)
    offers a compelling all-photonic alternative by generating non-Gaussian states
    through measurement-induced nonlinearity, without the need for matter-based ancilla
    or active feedforward. Nevertheless, its practical implementation is limited by
    the exponential computational cost of evaluating matrix hafnians-#P-complete functions
    that govern photon-number probabilities. To address this challenge, we introduce
    a two-stage Histogram Gradient Boosting surrogate pipeline that predicts, without
    any hafnian computation, the optimal heralding pattern, circuit fidelity, and
    post-selection probability for candidate GBS circuits, while reserving exact quantum
    simulation exclusively for surrogate-selected candidates. Trained on circuit configurations
    across 3-5 optical modes, the surrogate achieves 90.0% GKP-detection accuracy
    on a held-out set, representing a 23.7 percentage-point improvement over the baseline,
    with a fidelity mean absolute error of 0.032 and a log-scale post-selection probability
    $R^2 = 0.837$, reducing the total simulation burden by approximately 90%.
- title: Displaced Gaussian Boson Sampling for enhanced max-clique search
  date: 2026-05
  url: https://arxiv.org/abs/2605.27522v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ewan Mer
  - Zhenghao Li
  - Shang Yu
  - Ian A. Walmsley
  - Raj B. Patel
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Gaussian Boson Sampling (GBS) is capable of solving certain classes of
    graph problems owing to the samples produced by such a device having a connection
    to the hafnian matrix function. In particular, a GBS device has been shown to
    provide an enhancement in the search of cliques -- or complete subgraphs -- in
    undirected weighted graphs over classical algorithms. A graph can be mapped to
    a GBS experiment by configuring the squeezing parameters of the input states and
    programming the linear optical network. In practice, limited squeezing and photon
    loss degrade the performance of the GBS device for max-clique search. In comparison,
    coherent states -- often considered a classical resource due to their Poissonian
    statistics -- can be readily prepared across many modes using an attenuated laser.
    In this paper, we report an enhancement of the success rate of GBS in finding
    maximum weighted cliques by adding displacements under lossy conditions or when
    a limited amount of squeezing is available. Moreover, we report that this enhancement
    can be scaled up to large graphs with limited resource overheads.
- title: General framework for anticoncentration and linear cross-entropy benchmarking
    in photonic quantum advantage experiments
  date: 2026-04
  url: https://arxiv.org/abs/2604.15258v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Zoltán Kolarovszki
  - Ágoston Kaposi
  - Zoltán Zimborás
  - Michał Oszmaniec
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic architectures are one of the leading platforms for demonstrating
    quantum computational advantage, with Boson Sampling and Gaussian Boson Sampling
    as the primary schemes. Yet, we lack for these photonic primitives a systematic
    theoretical understanding of linear cross-entropy benchmarking (LXEB), which is
    a central tool for testing quantum advantage proposals. In this work, we develop
    a representation-theoretic framework for the classical computation of average
    LXEB scores and second moments of output probability distributions, covering a
    range of quantum advantage experiments based on scattering $n$-photon states through
    $m$-mode Haar-random interferometers. Our methods apply in any regime, including
    the saturated regime, where the (expected) number of photons is comparable to
    the number of optical modes. The same second-moment techniques also allow us to
    prove anticoncentration for traditional Fock-state Boson Sampling in the saturated
    regime. Interestingly, for Gaussian Boson Sampling second moments are not sufficient
    to establish a meaningful anticoncentration statement. The technical core of our
    approach rests on decomposing two copies of the $n$-particle bosonic space $\mathrm{Sym}^n(\mathbb{C}^m)$
    into irreducible representations of $\mathrm{U}(m)$. This reduces two-copy Haar
    averages to computing purities of initial states after partial traces over particles,
    highlighting the role that particle entanglement plays for LXEB and anticoncentration.
- title: Proof of the hiding conjecture for Gaussian boson sampling with an arbitrary
    number of squeezed input modes
  date: 2026-08
  url: https://arxiv.org/abs/2608.19314v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Laura Shou
  - Alexey V. Gorshkov
  - Victor Galitski
  - Sarah H. Miller
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Gaussian boson sampling (GBS) is a sampling task proposed to demonstrate
    quantum advantage. We consider Gaussian boson sampling on $M$ optical modes, with
    $K$ equally squeezed input modes and $N$ observed photon counts. We complete the
    proof of the hiding conjecture for Gaussian boson sampling with an arbitrary number
    of squeezers $K$, which is a part of the argument for classical hardness of GBS.
    In particular, we show that for any $K$ and $N=o(\sqrt{K})$, the symmetric product
    $MK^{-1/2}U_{NK}U_{NK}^T$, for $U_{NK}$ the top left $N\times K$ submatrix of
    an $M\times M$ Haar random unitary $U$, is close in total variation distance to
    both an $N\times N$ symmetric complex Gaussian matrix $\mathbf G$ with independent
    entries, and the symmetric product $GG^T/\sqrt{K}$ for $G$ an $N\times K$ matrix
    of iid standard complex Gaussians. We show however that the density-based instance
    generating method of [Aaronson and Arkhipov, Theory Comput. 9, 143 (2013), Lemma
    5.8] used to efficiently implement a hiding procedure fails for Gaussian boson
    sampling with $K=cM$ if $c&lt;1/2$. Instead we use approximate instance generating
    to implement the hiding for the usual classical hardness reduction.
- title: Symbolic Quantum State Representation and its Simulation
  date: 2026-03
  url: https://arxiv.org/abs/2603.11824v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Simon Sekavcnik
  - Janis Noetzel
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce a symbolic operator framework for simulating quantum photonic
    systems that works directly with the canonical commutation relations and the Weyl
    algebra. Unlike existing Fock-space or Gaussian simulators, our method treats
    temporal wave packets and polarization modes in a continuous setting and does
    not rely on discretization or Hilbert-space truncation. Device operations are
    expressed as algebraic rewrite rules acting on creation and annihilation operators,
    allowing exact evolution of finite-photon states through linear optical networks.
    As an illustration, we reproduce Hong-Ou-Mandel interference for Gaussian pulses
    with controlled temporal and spectral mismatch.
- title: Universality of Classically Trainable, Quantum-Deployed Boson-Sampling Generative
    Models
  date: 2026-03
  url: https://arxiv.org/abs/2603.11014v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Andrii Kurkin
  - Ulysse Chabaud
  - Zoltán Kolarovszki
  - Bence Bakó
  - Zoltán Zimborás
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent work on the instantaneous quantum polynomial-time (IQP) quantum-circuit
    Born machine (QCBM) highlights a promising paradigm for generative modeling: train
    classically, deploy quantumly. In this setting, the training objective can be
    evaluated efficiently on a classical computer, while sampling from the resulting
    model may still be classically intractable. Furthermore, in the IQP-QCBM framework,
    extending the model family with ancillary qubits has been proven to yield universality.
    This paper asks whether similar results hold for linear-optical generative models.
    To this end, we introduce the Boson Sampling Born Machine (BSBM). Our analysis
    retraces analogous steps as were found for IQP-QCBMs with twists. Using recent
    results that enable classical approximation of broad classes of expectation values
    in linear optics, we show that BSBMs can be trained classically for wide families
    of loss functions. Next, we argue that "basic" BSBMs are not universal generative
    models, and that universality can be achieved by expanding the model while preserving
    efficient classical training and sampling hardness. In our approach, we introduce
    and analyze the role of constant-function postprocessing, generalizing the construction
    for IQP-QCBMs, which under suitable conditions can lead to universality while
    preserving the hardness of classically simulating the models. We showcase a family
    of BSBMs, characterized by a single hyperparameter, that allows for a monotonic
    increase in expressivity toward universality while retaining the capacity to represent
    ostensibly hard distributions. Furthermore, we discuss the possible modalities
    for the efficient classical training, in the sense of efficient estimation of
    gradients of the loss function.'
- title: Automated discovery of high-probability heralded schemes for path-entangled
    states
  date: 2026-07
  url: https://arxiv.org/abs/2607.25501v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Marcello Armezzani
  - Colin P. Lualdi
  - Xuemei Gu
  - Paul G. Kwiat
  - Mario Krenn
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Entangled states of light lie at the heart of photonic quantum technologies,
    from distributed quantum communication to quantum-enhanced measurement and information
    processing. Their practical generation, however, remains constrained by the weak
    interactions between photons, which make the deterministic assembly of large multiphoton
    entangled states a central challenge in quantum optics. In this work, we use AI
    techniques to discover heralded linear-optical schemes for path-entangled states
    and show that the resulting solutions can be elevated from individual circuits
    to a new scalable family. This family contains previously known constructions
    as special cases while generally providing exponential and super-exponential improvements
    over those, and its extension to broader classes of target states shows how automated
    discovery can reveal transferable physical understanding. By presenting compact
    experimental proposals for large path-entangled states, our results provide both
    a theoretical advance in photonic heralding and a route towards a substantial
    leap in experimentally accessible multiphoton entanglement.
- title: 'Optimizing photon-number distributions of Gaussian states in the presence
    of loss: Towards minimizing the impact of loss in Gaussian boson sampling'
  date: 2026-03
  url: https://arxiv.org/abs/2603.20401v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hendrik Ellenberg
  - René Sondenheimer
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We analyze the impact of photon loss on the photon-number statistics of
    Gaussian states. Specifically, we propose and carefully evaluate several methods
    to mitigate deviations in the photon-number distributions of lossy (displaced)
    squeezed vacuum states from those of their lossless counterparts. These methods
    rely on appropriately redefining the parameters of Gaussian states when the loss
    budget is known in order to recover, as closely as possible, the desired photon-number
    distribution associated with each target state. While it is intrinsically hard
    to directly optimize the photon-number distribution of high-dimensional, correlated
    multimode Gaussian states, the proposed methods are instead based on optimizing
    specific key properties such as fidelity, phase-space functions, low-order moments
    of the underlying photon-number statistics, or overlap with the vacuum state.
    In particular, our results show that optimizing the fidelity between a pure Gaussian
    target state and a modified Gaussian state that has passed through a loss channel
    does typically not result in closeness of the corresponding photon-number distributions.
    Furthermore, we show that correcting for the vacuum overlap minimizes the deviation
    in the photon-number distribution for large parameter ranges which we explicitly
    prove for single-mode squeezed vacuum and provide numerical evidence for general
    (displaced) squeezed vacuum states. As photon loss is a key limitation for Gaussian
    boson sampling, our results provide insights into the feasibility and limitations
    of such photonic quantum simulations in lossy environments and offer guidelines
    for mitigating these imperfections.
- title: Fundamental limits of parameter estimation with heralded optical non-Gaussian
    states generated from Gaussian resources
  date: 2026-08
  url: https://arxiv.org/abs/2608.06239v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Shohei Kiryu
  - Kazufumi Tanji
  - Yoshihiro Ueda
  - Kosuke Fukui
  - Masahiro Takeoka
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Non-Gaussian states can exhibit large quantum Fisher information (QFI)
    in quantum sensing. In optical systems, however, its generation is often probabilistic
    via the boson-sampling type conditional operation and thus its generation rate
    is limited. This probabilistic generation of non-Gaussian resource should be taken
    into account for evaluation of the sensing performance. Then a natural question
    arising is whether the use of heralded probabilistic non-Gaussian states is better
    than that of the original deterministic Gaussian states for quantum sensing. In
    this paper, we answer to this question for single-parameter phase-estimation.
    By using photon-number conservation in passive linear optical systems, we show
    that heralded state preparation before parameter encoding can be mapped to a postselection
    problem after parameter encoding for phase estimation. This mapping allows the
    success probability of heralding to be included naturally in the metrological
    performance. We introduce an effective quantum Fisher information (EQFI), defined
    as the success-probability-weighted QFI of the heralded outputs, and prove that
    it cannot exceed the QFI of the original Gaussian inputs. The result highlights
    the importance of resource counting in quantum sensing toward better understanding
    of the resource efficient advantage of optical quantum sensing.
- title: 'Boson sampling beyond the dilute regime: second moments and anti-concentration'
  date: 2026-04
  url: https://arxiv.org/abs/2604.14323v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hela Mhiri
  - Hugo Thomas
  - Léo Monbroussou
  - Ulysse Chabaud
  - Zoë Holmes
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Boson sampling is a leading candidate for demonstrating quantum advantage
    in photonic systems. Despite significant experimental and theoretical progress,
    a characterization of its output statistics remains incomplete. This is especially
    true beyond the dilute regime, where photon collisions and bunching become significant.
    The associated saturated regime, characterized by mode number growing linearly
    with photon number, or more generally sub-quadratically, is precisely the regime
    of greatest experimental interest. As a consequence, anti-concentration of the
    output distribution--a key ingredient in hardness arguments--remains poorly understood
    in boson sampling. In this work, we leverage representation-theoretic tools to
    address this gap, obtaining closed-form expressions for second moments of generic
    particle-number-preserving bosonic observables. We express these quantities in
    terms of Hilbert-Schmidt norms of projections onto irreducible components of the
    operator space and show that these projection norms admit compact analytical expressions
    by exploiting the underlying symmetry structure. Focusing on Fock state output
    probabilities, we further establish anti-concentration beyond the dilute regime.
    Together with recent complexity-theoretic results, our findings strengthen hardness
    guarantees for boson sampling in experimentally interesting settings.
- title: Robust Ion-Photon Entanglement via Polarization-to-Time-Bin Conversion
  date: 2026-07
  url: https://arxiv.org/abs/2607.07805v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ana Luiza Ferrari
  - Denton Wu
  - Mika A. Zalewski
  - Norbert M. Linke
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Time-bin photonic qubits are well-suited for quantum network applications
    due to their robustness to polarization instability in fiber links and potential
    for heterogeneous networks. In this work, we implement the first entanglement-preserving
    polarization-to-time-bin conversion of a photon qubit in an entangled state with
    a matter qubit, together with the independent work of Haen \textit{et al.} \cite{haen2026telecom}.
    Photons initially generated with polarization encoding are converted to the time-bin
    basis through a polarization-discriminating asymmetric Mach--Zehnder interferometer.
    The photonic qubits are generated via the $1092$~nm transition of a $^{88}$Sr$^{+}$
    ion. We measure state fidelity bounds of $0.906 \pm 0.011 \le \mathcal{F} \le
    0.934\pm 0.011$, with conversion error $&lt; 0.028$, and find this fidelity shows
    no statistically significant reduction under depolarizing noise, even at full
    depolarization strength.
- title: 'Approximating the Permanent of a Random Matrix with Polynomially Small Mean:
    Zeros and Universality'
  date: 2026-04
  url: https://arxiv.org/abs/2604.01367v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Frederic Koehler
  - Pui Kuen Leung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We study algorithms for approximating the permanent of a random matrix
    when the entries are slightly biased away from zero. This question is motivated
    by the goal of understanding the classical complexity of linear optics and \emph{boson
    sampling} (Aaronson and Arkhipov '11; Eldar and Mehraban '17). Barvinok's interpolation
    method enables efficient approximation of the permanent, provided one can establish
    a sufficiently large zero-free region for the polynomial $\mathrm{per}(zJ + W)$,
    where $J$ is the all-ones matrix and $W$ is a random matrix with independent mean-zero
    entries. We show that when the entries of $W$ are standard complex Gaussians,
    all zeros of the random polynomial $\mathrm{per}(zJ + W)$ lie within a disk of
    radius $\tilde{O}(n^{-1/3})$, which yields an approximation algorithm when the
    bias of the entries is $\tildeΩ(n^{-1/3})$. Previously, there were no efficient
    algorithms at biases smaller than $1/\mathrm{polylog}(n)$, and it was unknown
    whether there typically exist zeros $z$ with $|z| \ge 1$. As a complementary result,
    we show that the bulk of the zeros, namely $(1 - ε)n$ of them, have magnitude
    $Θ(n^{-1/2})$. This prevents our interpolation method from contradicting the conjectured
    average-case hardness of approximating the permanent. We also establish analogous
    zero-free regions for the hardcore model on general graphs with complex vertex
    fugacities. In addition, we prove universality results establishing zero-free
    regions for random matrices $W$ with i.i.d. subexponential entries.
- title: Programmable non-Gaussian quantum light source with state and temporal-waveform
    tunability
  date: 2026-05
  url: https://arxiv.org/abs/2605.02536v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hiroko Tomoda
  - Yu Nishizawa
  - Akihiro Machinaga
  - Takahiro Kashiwazaki
  - Takeshi Umeki
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A versatile quantum light source capable of programmably generating a
    variety of quantum light is a key enabler for photonic quantum technologies. In
    particular, independent control over both the output quantum state and its temporal
    waveform is essential for realizing diverse functionalities and enhancing processing
    performance. However, conventional sources of optical non-Gaussian states, a crucial
    resource for photonic quantum information processing, typically emit fixed states
    with predetermined temporal waveforms, lacking their programmability. Here, we
    propose a programmable non-Gaussian quantum light source that offers independent
    and arbitrary tunability of both the quantum state and the temporal waveform within
    a single platform. As a distinctive feature, our approach employs a heralding
    scheme in which these two properties are indirectly engineered to user-defined
    targets by manipulating the light in the heralding channel, thereby avoiding optical
    losses associated with direct manipulation of the heralded quantum light. We develop
    a prototype and demonstrate the generation of single-photon, Schrödinger cat,
    and two-photon states in a variety of unconventional temporal waveforms without
    degradation in state quality. This platform provides a versatile tool for tailoring
    quantum light to specific applications, significantly expanding the capabilities
    of photonic quantum technologies.
- title: Photonic qubit encoding interconversion for heterogeneous quantum networking
  date: 2026-04
  url: https://arxiv.org/abs/2604.02081v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Vedansh Nehra
  - Richard J. Birrittella
  - Christopher C. Tison
  - Benjamin K. Malia
  - Zachary S. Smith
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum information processing, communication, and sensing networks are
    being developed with various qubit platforms that use different encoding schemes.
    Connecting quantum network nodes to distribute entanglement requires matching
    photon qubit basis encoding. In this work, we implement an interconversion protocol
    which converts photon qubit encoding from the polarization basis to the time-bin
    basis, transmits the photons through a transport fiber with large fluctuations
    in polarization, and converts back to polarization encoding for ease of measurement.
    This interconversion scheme faithfully transmits a polarization Bell state across
    the transport fiber by converting sources of infidelity to changes in transmission
    rate. These results illustrate a practical approach for interfacing distinct qubit
    platforms to enable modular and flexible operation in heterogeneous quantum networks.
- title: Time-Delocalized Local Measurements in an Indefinite Causal Order
  date: 2026-04
  url: https://arxiv.org/abs/2604.11878v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yann Valibouse
  - Martí Cladera-Rosselló
  - Michael Antesberger
  - Patrick Lima
  - Philip Walther
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Processes with indefinite causal order (ICO), such as the quantum switch,
    are an emerging resource for quantum tasks and a fundamental test bed for studies
    of temporal correlations in quantum mechanics. A limitation of past photonic implementations
    of the quantum switch, however, is their inability to perform measurements inside
    the switch without either destroying the superposition of causal orders or delaying
    readout until the after the quantum switch. Measurements where the results are
    read out locally are needed for several applications of ICO, but also for a loophole-free
    verification of ICO. Here, we overcome past limitations by introducing a $\mathit{local}$
    measurement scheme and coupling the photon in the switch to a $\mathit{time-delocalized}$
    ancilla system. We experimentally realize this protocol using a photonic quantum
    switch with post-selected linear optical logic gates. Our method ensures that
    the measurement apparatus interacts with the system at two distinct times and
    yet yields a single outcome. We use a quantum eraser measurement to preserve the
    ICO, which we certify by measuring a causal witness and finding a negative value
    of $\mathcal{C}_W \approx -0.305 (1)$. Furthermore, by explicitly realizing a
    time-delocalized ancilla system, our protocol not only enables a new class of
    quantum switch protocols requiring local readout, but also provides a general
    method for path-coherence-preserving measurements with broad applications beyond
    ICO.
- title: 'Gaussian boson sampling: Benchmarking quantum advantage'
  date: 2026-04
  url: https://arxiv.org/abs/2604.12330v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ned Goodman
  - Alexander S. Dellios
  - Margaret D. Reid
  - Peter D. Drummond
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum computers solve intractable problems which classically require
    an exponentially long time to compute. With the development of large-scale experiments
    that claim quantum advantage, a vital issue has now emerged. What are the errors,
    and how do they affect the complexity of the problem solved? Large-scale Gaussian
    boson sampling (GBS) experiments give an example in which random numbers are generated.
    Despite classical hardness, these have computable benchmarks for checking data
    validity. While there are other quantum computing architectures, Gaussian boson
    sampling is uniquely testable at all scales. Several large, pioneering quantum
    computing (QC) experiments have been carried out to investigate quantum advantage.
    Here, we introduce a highly scalable but classical algorithm that can solve GBS
    approximately. Our numerical simulation of the output count data is closer to
    the exact solution than current experiments up to 1152 modes. This algorithm outperforms
    all previous classical, approximate algorithms and scales efficiently to larger
    experiments. Our results show that effects beyond losses can cause the errors
    that allow classical simulability. This work will lead to more precise algorithms
    and is a step towards understanding how QC quantum advantage is affected by the
    underlying physics.
- title: Integration of diamond nanobeams with SnVs on Al2O3 waveguides for scalable
    quantum photonic chip application
  date: 2026-06
  url: https://arxiv.org/abs/2606.18711v1
  category: quantum-photonics
  subcategory: theory
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Tin vacancy (SnV) centers in diamond are promising solid state qubits
    for integrated quantum photonics. Here, we fabricate and characterize a diamond
    on Al2O3 dual taper waveguide structure containing SnV centers, demonstrating
    optical coupling between the diamond nanobeam and the underlying Al2O3 waveguide.
    The devices are realized using a bilayer fabrication approach compatible with
    wafer scale lithography. Clear guided SnV- emission is observed in all optically
    active devices, indicating effective optical coupling in the integrated structure.
    These results demonstrate a scalable fabrication approach toward integrating diamond
    color centers with photonic waveguides.
- title: Experimental demonstration of entanglement sudden death induced by natural
    dissipation
  date: 2026-07
  url: https://arxiv.org/abs/2607.08078v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yan Wang
  - Hao-Long Zhang
  - Jia-Hao Lü
  - Ken Chen
  - Wen Ning
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Any quantum system inevitably interacts with its natural environment,
    which can be modeled as a Markovian reservoir consisting of a continuum of electromagnetic
    field modes. The quantum coherence of qubits in a zero-temperature natural reservoir
    decays asymptotically, whereas the quantum entanglement of two qubits coupled
    to such reservoirs may disappear in a finite time. This phenomenon, referred to
    as entanglement sudden death (ESD), has been simulated with artificially engineered
    dissipative channels, but ESD induced by natural dissipative channels has not
    been confirmed. We here present the first demonstration of natural-dissipation-induced
    ESD for two photonic qubits, each stored in a leaky resonator of a superconducting
    circuit. The disentanglement dynamics of the two photonic qubits is monitored
    with two ancilla superconducting qubits, which can be controllably coupled to
    the corresponding leaky resonators. The techniques developed in our experiment
    pave the way for experimental exploration of entanglement dynamics in natural
    environments.
- title: Certification of the genuine resolution of photon number resolving detectors
  date: 2026-06
  url: https://arxiv.org/abs/2606.14365v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Jef Pauwels
  - Towsif Taher
  - Roope Uola
  - Boris Korzh
  - Nicolas Brunner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photon-number-resolving (PNR) detectors are essential components of photonic
    quantum technologies, yet thus far, no practical metric exists to certify how
    many photons they can genuinely resolve in a single measurement. Here we introduce
    an operational framework for quantifying the capability of a PNR detector to distinguish
    between different numbers of photons, i.e. its genuine resolution. In turn, we
    develop a practical and scalable protocol for certifying the genuine resolution
    of a detector, which is based on coherent state probes. We apply the method to
    a 28-pixel photon-number-resolving superconducting nanowire single-photon detector
    (PNR-SNSPD) and certify genuine four-outcome resolution. Our work highlights the
    critical requirements in terms of detector efficiency towards achieving high genuine
    resolution. This approach provides an operational benchmark for PNR detectors
    and fills a crucial gap in the characterization of photonic quantum devices.
- title: Near-Optimal Mode Scaling for Finite-Dimensional Boson Sampling via Lie-Algebraic
    Leakage Bounds
  date: 2026-07
  url: https://arxiv.org/abs/2607.11708v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Chon-Fai Kam
  - En-Jui Kuo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Boson sampling demonstrates quantum advantage through the interference
    of indistinguishable particles, with output probabilities governed by matrix permanents.
    Realizing it on deterministic, matter-based platforms requires encoding the bosonic
    modes in finite-dimensional local Hilbert spaces, which introduces a leakage channel
    absent in linear optics: multi-particle bunching beyond the local truncation $d$.
    We develop a unified framework for non-interacting sampling on the irreducible
    representations of compact Lie groups, in which the transition amplitude is the
    immanant of a submatrix of the single-particle transition matrix, recovering the
    permanent in the bosonic case. Within this framework we bound the bunching leakage
    through a Dyson-series analysis: decomposing the correlated many-body leakage
    operator into independent random matrices and applying non-commutative concentration
    inequalities, we prove, in a Gaussian model of the transition matrix, that its
    spectral norm concentrates at $\tilde{O}(\sqrt{n})$ rather than the $O(n)$ worst-case
    of prior spin-based emulations; the passage to the physical Haar ensemble is reduced
    to a single submatrix-comparison input, verified at leading order. Exact numerics
    across local dimensions $d=2$--$5$ indicate that the bound is tight, the Haar-ensemble
    norm matching the closed form $\sqrt{d(n-d+1)}$ to sub-percent accuracy. This
    tightens the required mode number from $m=Ω(n^4)$ to the near-optimal $m=\tildeΩ(n^{1+2/(d-1)})$;
    for a spin-1 representation ($d=3$) the overhead falls to $m=\tildeΩ(n^2)$, matching
    the collision-free threshold. The result is independent of particle statistics
    and applies across finite-dimensional Lie-symmetric architectures, quantifying
    the spatial resources needed to preserve sampling hardness.'
- title: Frequency-Time Multiplexing for Near-Deterministic Generation of n-Photon
    Frequency-Bin States
  date: 2026-03
  url: https://arxiv.org/abs/2603.03576v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Alex Fischer
  - Nathan T. Arnold
  - Colin P. Lualdi
  - Kelsey Ortiz
  - Michael Gehl
  venue: ''
  code_url: ''
  project_url: ''
  abstract: One of the primary challenges of photonic quantum information processing
    is the on-demand preparation of multiple single-photon-level quantum states from
    probabilistic photon pair sources. Motivated by recent developments in frequency-bin-encoded
    photonic quantum information processing, here we consider active time multiplexing
    to generate n-photon states, where n single photons with n distinct frequencies
    occupy the same spatiotemporal mode. We devise an approach that uses optical quantum
    memories to manipulate the temporal mode of heralded single photons and an array
    of fiber Bragg grating reflectors to jointly manipulate the frequency and temporal
    modes of the photons, overlapping n photons in n separate frequency bins into
    a single spatiotemporal mode. We calculate multiphoton state generation rates
    that, accounting for loss, are realistically achievable with commercially available
    hardware. Using only a single free-space switchable delay loop for an optical
    quantum memory, this scheme could feasibly produce 8-photon states at an average
    rate of 1 kHz.
- title: A single programmable photonic circuit for universal quantum measurements
  date: 2026-03
  url: https://arxiv.org/abs/2603.20085v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Wen-Zhe Yan
  - Lan-Tian Feng
  - Zhibo Hou
  - Yuan-Yuan Zhao
  - Carles Roch i Carceller
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Programmable photonic quantum processors face a critical challenge: despite
    significant advances in quantum state preparation and manipulation, measurements
    remain limited to projective techniques. Here, we demonstrate a programmable measurement
    processor that overcomes this limitation by enabling arbitrary quantum measurements
    within a scalable circuit framework. Our large-scale integrated photonic architecture
    achieves precise coherent control of ancillary quantum systems, realizing a universal
    four-dimensional quantum measurement device. We benchmark the processor by performing
    measurement tomography on 100 randomly selected measurements, achieving an average
    fidelity of 97.7%. The processor''s performance exceeds the theoretical limits
    of projective measurements in three key quantum information tasks: state discrimination
    (with 23 times lower error), state estimation (with 10.6% higher fidelity), and
    randomness generation (with 37% more randomness yield), demonstrating its high
    operational quality. This work establishes a fully programmable quantum measurement
    processor, advancing the development of universal quantum operations for photonic
    quantum information processing by providing the key missing component.'
- title: Epitaxial single T centres in silicon-on-insulator
  date: 2026-07
  url: https://arxiv.org/abs/2607.06272v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Christian H. Christiansen
  - Kasper H. Nielsen
  - Alisha Nanwani
  - Sebastiano Guaraldo
  - E. Laurits Piehorsch
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spin-photon interfaces based on silicon quantum emitters offer a scalable
    platform for quantum computing and networking. However, achieving coherent photon
    emission remains a primary challenge due to stringent material quality requirements.
    To overcome this, we utilise high-purity molecular-beam epitaxy (MBE) to epitaxially
    incorporate single T centres in silicon-on-insulator (SOI) wafers. We demonstrate
    single T-centre emission coupled to a nanophotonic waveguide and observe significant
    suppression of homogeneous broadening, yielding optical linewidths as narrow as
    30 MHz using natural silicon for crystal growth. These results establish epitaxial
    T centres as a robust foundation for coherent spin-photon interfaces in silicon
    quantum photonics.
- title: Fixed-order postselected CHSH reference acquisition for parity-constrained
    spatial-mode qubits on a commercial cloud photonic processor
  date: 2026-08
  url: https://arxiv.org/abs/2608.18153v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Emma Tully
  - Jonathan Washburn
  - Megan Simons
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report a fixed-order Clauser-Horne-Shimony-Holt (CHSH) acquisition
    and reporting protocol for two encoded photonic qubits on Quandela's commercial,
    cloud-accessible Belenos processor, executed end-to-end by external users through
    the public cloud interface. Each logical qubit is a two-dimensional spatial-mode
    subspace in the seven-dimensional zero-sum sector of an eight-mode single-photon
    register, and a target postselected linear-optical controlled-$Z$ (ideal success
    probability $1/9$) couples the registers on $16$ of $24$ modes. The primary quantity
    is the operational CHSH score $S$ on accepted logical coincidences, with each
    complete four-setting pass as the experimental unit. Eight sequential same-day
    passes each gave a raw score above $2$; session means were $2.40$ and $2.58$ (sample
    standard deviations $0.15$ and $0.03$), with excess dispersion $Q/ν=6.1$ ($ν=7$).
    Count-pooled secondary descriptors are $S_{\mathrm{count}}=2.485\pm0.019$ and
    a fixed-ratio efficiency-reweighted model scenario $S^{\mathrm{rw}}_{\mathrm{count}}=2.380\pm0.021$,
    whose weakest reweighted pass ($2.040\pm0.062$) overlapped $2$ within $1σ$. The
    reweighting is an archived-metadata model scenario, not a corrected platform score;
    an ad hoc $κ\in[1.2,1.8]$ stress scan (not a calibrated uncertainty band) spans
    $2.341$-$2.441$. Setting order was fixed, the compiled mapping was not returned,
    and residual remote-setting marginals remain, so the data support an operational
    reference acquisition rather than an entanglement-witness or cross-platform benchmarking
    claim. The parity-check terminology labels the encoding subspace; no syndrome
    measurement was performed. Count records, job identifiers, circuit-construction
    code, and analysis are openly archived with content hashes for the submitted targets.
- title: Quantum Resource Theory of Lasers
  date: 2026-02
  url: https://arxiv.org/abs/2602.19749v1
  category: quantum-photonics
  subcategory: theory
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Lasers serve as the fundamental workhorses of photonic quantum technologies,
    with perfectly coherent light fields being essential for many protocols that generate
    nonclassical light, implement coherent control schemes, and initialize qubits.
    However, no laser is absolutely ideal and the implications of deviations from
    perfect coherence in quantum technological tasks remain unclear. In this study,
    we theoretically and experimentally explore the quantum coherence properties of
    lasers from a resource theory perspective, establishing a significant connection
    between photonics, quantum optics, and quantum information science. We demonstrate
    that the maximum achievable quantum coherence for laser light is constrained by
    spontaneous emission and the purity of the dephased laser field state. As a critical
    example application in quantum information protocols, we show that the quantum
    coherence of a laser field with a given mean photon number directly governs the
    maximum purity attainable when initializing a qubit in a superposition state through
    resonant driving. Our findings are highly relevant for bridging applied physics
    and engineering with integrated photonic quantum technologies and resource theories,
    paving the way for reliable benchmarking of various coherent light sources for
    applications in photonics and quantum protocols.
- title: Local controllability of heralded quantum linear optics
  date: 2026-06
  url: https://arxiv.org/abs/2606.19470v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Tommaso Francalanci
  - Nicolò Spagnolo
  - Mario Sigalotti
  - Eliott Z. Mamon
  - Ulysse Chabaud
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic linear optical networks provide a versatile platform for quantum
    information processing and quantum state engineering. However, the set of states
    that can be generated using passive linear optics alone is fundamentally constrained
    by bosonic symmetries. Heralding, based on conditional measurements on auxiliary
    modes, is a widely used technique to overcome these limitations and effectively
    enlarge the set of accessible states. Despite the widespread use of heralding,
    it is often unclear how specific ancillary resources impact the overall reachability
    of the target space. In this work, we investigate the local controllability of
    photonic states in linear optical networks by analyzing the rank of the Jacobian
    of the output state with respect to the underlying unitary circuit, which provides
    a quantitative measure of the dimension of the accessible tangent space at a given
    configuration. Our analysis ranges from passive linear optics to heralded linear
    optics, where auxiliary resources and conditional measurements are included. Within
    this framework, we quantify how different resources enlarge the locally accessible
    state space beyond that of passive linear optics and determine the resources required
    for the Jacobian rank to reach its maximal value, thereby achieving full local
    controllability. As maximal local rank is a necessary condition for global reachability,
    our framework offers a systematic tool to assess and compare the accessible state
    space of measurement-based photonic architectures, and to establish practical
    criteria for the resources needed in high-dimensional quantum state engineering.
- title: Scalable on-chip integration of diamond color centers for cryogenic quantum
    photonics
  date: 2026-04
  url: https://arxiv.org/abs/2604.06984v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - H. Kurokawa
  - K. Sato
  - M. Kamata
  - S. Ishida
  - H. Matsukiyo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Chip integration of quantum emitters is a crucial milestone for scalable
    quantum photonic information processing. Among optically active defect centers
    for quantum photonics, diamond color centers are promising because of their long
    spin coherence times and high photon emission rates. However, for a coherent-photon
    emission, they typically require a cryogenic environment to protect optical coherence
    from thermal phonons, which makes chip integration challenging. In this paper,
    we develop a chip-integrated diamond photonic crystal cavity embedding an ensemble
    of nitrogen-vacancy (NV) centers. We confirm cryogenic operation by observing
    Purcell enhancement of NV-center emission via an edge-coupled optical fiber. This
    result demonstrates successful integration of diamond color centers, a photonic
    crystal cavity, and an optical waveguide-fiber package, representing a key step
    toward scalable diamond-based quantum communication platforms.
- title: Structured Cavity Quantum Electrodynamics
  date: 2026-07
  url: https://arxiv.org/abs/2607.21012v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Shunfa Liu
  - Jiantao Ma
  - Hanqing Liu
  - Yangpeng Wang
  - Xueshi Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A cavity quantum electrodynamics (cQED) system consisting of a confined
    single photon and a single quantum emitter serves as a fundamental block for quantum
    optics and photonic quantum technologies. The canonical optical mode employed
    in the conventional cavity quantum electrodynamics features a uniform polarization
    distribution, leading to the scalar light-matter interaction in most existing
    experiments. Despite the rapid progress in the generation of structured light
    with spatially varied polarizations, the structured light-matter interaction,
    especially at the single quanta level, is highly intriguing yet largely unexplored.
    Here, we present the structured light-matter interaction at the single-photon
    level in a semiconductor cavity quantum electrodynamics system. Four distinct
    structured cavity modes that are spectrally close to each other are constructed
    in a micropillar cavity. By spatially locating a single epitaxial quantum dot
    (QD) at the periphery of a semiconductor micropillar cavity and spectrally tuning
    the QD emission wavelength into the resonances of the structured cavity modes,
    cavity-enhanced single-photon emissions with spin-locked chiral orbital angular
    momentum (OAM) and engineerable spin-orbit entanglements are achieved within a
    single wavelength-scale device. Our work opens an unexplored paradigm of structured
    quantum light-matter interactions and may further advance chiral quantum optics
    and high-dimensional photonic quantum technology.
- title: Parity-Based Time-Bin Encoding Enabling SWAP Between Polarization and Time-Bin
    Qubits
  date: 2026-07
  url: https://arxiv.org/abs/2607.27144v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Adam Sultan
  - Connor Kupchak
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multi-degree-of-freedom photonic quantum processing requires routing between
    degree-of-freedom (DOF) qubit encodings on a single photon. A SWAP between polarization
    and time-bin qubits is Multi-degree-of-freedom photonic quantum processing requires
    routing between degree-of-freedom (DOF) qubit encodings on a single photon. A
    SWAP between polarization and time-bin qubits is an advantageous primitive for
    such architectures, however conventional early/late time-bin encoding does not
    support bidirectional logical time-bin flips from late to early which limits the
    ability to implement certain quantum operations. We introduce a parity-based time-bin
    encoding in which logical $\vert 0 \rangle_T$ and $\vert 1 \rangle_T$ correspond
    to even and odd multiples of a spacing $Δt$, so that a physical delay of $Δt$
    implements $\vert 0 \rangle_T \leftrightarrow \vert 1 \rangle_T$. This encoding
    is the enabling ingredient that makes a polarization-controlled delay line implement
    $\mathrm{CNOT}_{P \rightarrow T}$ and aligns naturally with periodic refractive
    index modulation for $\mathrm{CNOT}_{T \rightarrow P}$. Composing three such CNOT
    operations sequentially results in a deterministic SWAP between polarization and
    time-bin degrees of freedom. We analyze field-based modulation polarization-rotation
    error probability and timing-resolution constraints set by both EOM drive electronics
    and photon detection.
- title: Full-Stack High-Volume Quantum Networking Architecture based on Photonic-Integrated
    Tin Vacancy Centers in Diamond
  date: 2026-08
  url: https://arxiv.org/abs/2608.11630v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hamza Raniwala
  - Ian Christen
  - Helaman Flores
  - David Starling
  - Ryan Murphy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Solid state quantum emitters are a leading platform for photonic quantum
    networking with memory nodes. However, the inhomogeneous distribution of quantum
    emitters, as well as several environmental factors (i.e. strain and electric fields)
    spread the frequency spectrum of the qubits, making them distinguishable and therefore
    not a reliable resource for distributed quantum entanglement. In this paper, we
    demonstrate a full-stack approach to integrating nearly indistinguishable tin
    vacancy (SnV$^-$) quantum emitters on a frequency-tunable photonic interposer
    that overcomes the native distribution and static variation of quantum emitters
    for an indistinguishable photonic quantum networking platform. We demonstrate
    a silicon nitride-on-insulator photonic integrated circuit (PIC) with accompanying
    multiphysics digital twin (MPhDT) that guides discovery of SnV$^-$ strain-tuning
    parameters and informs construction of a multi-channel quantum repeater node.
    On this node, we achieve the first simultaneous demonstration of spectral tuning
    of the zero phonon line (ZPL) at GHz scale; coherent electron spin control with
    gate times of $&lt;80$ ns; strongly- and weakly-coupled nuclear spin detection;
    and commercial fiber array-coupled readout of a SnV$^-$ center. Finally, we propose
    and simulate improvements to the architecture that achieve 99.96% connectivity
    of $ N \sim 1000$ emitters spanning the inhomogeneous distribution of SnV$^-$
    centers in strained diamond, where distributed quantum entanglement may be realized.
- title: Nonreciprocal Photon Blockade in an Asymmetric Cavity
  date: 2026-06
  url: https://arxiv.org/abs/2606.10319v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Shao-Xiong Wu
  - Jin-Na Fan
  - Dan Yan
  - Cheng-Hua Bai
  - Qiannan Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We propose a scheme to realize tunable and strong nonreciprocal photon
    blockade (PB) in an asymmetric Fabry-Pérot cavity. The setup consists of a single-mode
    optical cavity trapping a two-level atom, with the cavity coherently driven by
    a laser and the atom pumped by an auxiliary control field of the same frequency.
    By engineering quantum interference between multiple excitation pathways by adjusting
    the amplitude and relative phase of the control laser, we identify two distinct
    optimal control conditions that enable directional suppression of two-photon states.
    Under optimal control conditions, strong nonreciprocal PB is achieved, with a
    nonreciprocal ratio exceeding 30 dB over a broad operational bandwidth. The proposed
    protocol requires only standard coherent laser sources and is compatible with
    current cavity QED experimental setups, offering a practical and scalable platform
    for nonreciprocal quantum photonics.
- title: Experimental simulation of non-equilibrium quantum piston on a programmable
    photonic quantum computer
  date: 2026-03
  url: https://arxiv.org/abs/2603.10647v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Govind Krishna
  - Rohan Yadgirkar
  - Balakrishnan Krishnakumar
  - Andrea Cataldo
  - Ze-Sheng Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum fluctuation relations provide a microscopic formulation of thermodynamics
    beyond equilibrium, but experimentally accessing many-body quantum work statistics
    remains an outstanding challenge. The quantum piston constitutes a canonical model
    of boundary-driven nonequilibrium dynamics, where finite-time deformation of a
    confining potential generates non-adiabatic transitions, dissipation and irreversibility.
    Here we experimentally simulate the nonequilibrium dynamics of a two-boson quantum
    piston on a programmable photonic quantum computer. Using two indistinguishable
    photons, we encode a truncated piston propagator through a quasi-unitary embedding,
    with an ancilla mode representing leakage into higher-energy states outside the
    resolved manifold. This architecture enables direct reconstruction of thermodynamic
    transition statistics for both expansion and compression protocols as functions
    of driving speed and final trap length. We observe the crossover from quasi-adiabatic
    to strongly non-adiabatic evolution and show that bosonic interference restructures
    the resulting two-particle Fock-state populations and work distributions. The
    measured statistics are in close agreement with theoretical predictions and satisfy
    the Jarzynski equality across expansion and compression protocols for cyclic driving
    we further quantify irreversibility through dissipated work and state overlap.
    Our work identifies programmable photonic quantum hardware as a powerful platform
    for simulating nonequilibrium quantum thermodynamics and for experimentally resolving
    how indistinguishability and many-body interference shape quantum work, dissipation
    and entropy production.
- title: A high-performance quantum pulse gate in thin-film lithium niobate
  date: 2026-08
  url: https://arxiv.org/abs/2608.09346v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Silia Babel
  - Alejandra Alarcón
  - Laura Serino
  - Christian Golla
  - Laura Bollmers
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In this work, we demonstrate a quantum pulse gate (QPG) in thin-film
    lithium niobate. QPGs enable the selective manipulation and detection of temporal
    modes of quantum light and form the basis of numerous applications in photonic
    quantum technologies. To date, their widespread adaption is held back by two main
    limitations: restricted wavelength and polarization combinations of the involved
    fields and low normalized conversion efficiencies. We overcome these limitations
    through developing a QPG in thin-film lithium niobate. We design a waveguide geometry
    that provides the required dispersion properties for a highly efficient type-0
    sum-frequency generation.We verify our design through mapping of the phase matching
    intensity, and demonstrate high-quality QPG operation by measuring a temporal-mode
    selectivity of (96.8$\pm$1.7)% on par with existing QPGs. Thanks to the strong
    confinement in thin-film lithium niobate, we succeed in demonstrating an internal
    conversion efficiency of (89.6$\pm$0.1)% for a pump power of only 20mW in front
    of our sample. This yields a lower-bound estimate for the normalized conversion
    efficiency of (1810$\pm$10)$\mathrm{W}^{-1}\mathrm{cm}^{-2}$, three orders of
    magnitude higher than in previous QPGs. Our results establish thin-film lithium
    niobate as ideal platform for high-performance QPGs and are a major step towards
    practical QPGs for photonic quantum technologies.'
- title: 'Kaiwu-PyTorch-Plugin: Bridging Deep Learning and Photonic Quantum Computing
    for Energy-Based Models and Active Sample Selection'
  date: 2026-02
  url: https://arxiv.org/abs/2602.19114v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Hongdong Zhu
  - Qi Gao
  - Yin Ma
  - Shaobo Chen
  - Haixu Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper introduces the Kaiwu-PyTorch-Plugin (KPP) to bridge Deep Learning
    and Photonic Quantum Computing across multiple dimensions. KPP integrates the
    Coherent Ising Machine into the PyTorch ecosystem, addressing classical inefficiencies
    in Energy-Based Models. The framework facilitates quantum integration in three
    key aspects: accelerating Boltzmann sampling, optimizing training data via Active
    Sampling, and constructing hybrid architectures like QBM-VAE and Q-Diffusion.
    Empirical results on single-cell and OpenWebText datasets demonstrate KPPs ability
    to achieve SOTA performance, validating a comprehensive quantum-classical paradigm.'
- title: Generation and detection of squeezed light on a single silicon photonic chip
  date: 2026-07
  url: https://arxiv.org/abs/2607.15461v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Oliver M. Green
  - Bethany Puzio
  - Rowan A. Hoggarth
  - Rachel N. Clark
  - Edward C. R. Deacon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The ability to generate and detect quantum states of light on a single
    integrated photonic device is essential to scale quantum photonics into useful
    quantum technologies. Integrating the required capabilities into complementary-metal-oxide-semiconductor
    compatible monolithic chips can reduce cost and unlock new functionality through
    miniaturisation. In this work we demonstrate a single silicon-on-insulator photonic
    integrated circuit for the monolithic generation and detection of quantum light
    on a commercially available platform that operates entirely at room temperature.
    Specifically, we leverage spontaneous four-wave mixing in silicon waveguides to
    produce squeezed light which is subsequently detected by photodiodes operating
    in a pulsed homodyne detector configuration on the same chip as the source. We
    directly measure $0.25(1)$ dB of squeezing, including contributions from waveguide
    propagation loss and detection inefficiency, and include a detailed analysis of
    the impact of nonlinear loss on the squeezing levels achievable using this platform.
- title: Engineering of Dual Wavelength, Polarization Selective Metalenses in Silicon
    Carbide
  date: 2026-08
  url: https://arxiv.org/abs/2608.17506v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Xiaoying Huang
  - Ziwei Yang
  - Konosuke Shimazaki
  - Kritsana Saego
  - Otto Cranwell Schaeper
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spin defects in silicon carbide (SiC) are promising candidates for integrated
    quantum photonics, offering long-lived spin states and near-infrared emission
    suitable for low-loss photonic integration and fibre-based quantum communication.
    However, light extraction from these defects remains challenging due the relatively
    high refractive index of SiC. Metalenses offer a compact approach to enhance light
    collection by engineering the wavefront directly at the material interface. Here,
    we design and fabricate monolithic metalenses from SiC bulk material that simultaneously
    operate at 860 and 1240 nm, matching with emission from the nitrogen vacancy and
    silicon vacancy colour centers. By independently engineering the phase response
    at both wavelengths, the metalens enables collection and polarization manipulation
    of the emitted light. We further employ the metalenses to demonstrate optically
    detected magnetic resonance of both defects simultaneously. These multifunctional
    metalenses provide a compact optical interface for scalable integrated SiC photonic
    devices.
- title: Poling-free Spontaneous Parametric Down Conversion without for Silicon Carbide
    and Lithium Niobate photonics
  date: 2026-04
  url: https://arxiv.org/abs/2604.17723v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Tim F. Weiss
  - Hamed Arianfard
  - Yang Yang
  - Alberto Peruzzo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: State-of-the-art photon sources based on spontaneous parametric down-conversion
    (SPDC) currently rely on artificial structuring of the material nonlinearity to
    satisfy phase-matching conditions. This technique, known as periodic poling, is
    available only in a limited number of material platforms and introduces additional
    fabrication steps and errors, which are detrimental to up-scaling efforts. Here,
    we present a device architecture that enables SPDC of a wide range of frequencies
    without the need for periodic poling. We present explicit designs and calculations
    for 4H Silicon Carbide on-insulator, in which SPDC photon generation is so far
    unavailable, and thin-film Lithium Niobate on-insulator, a state-of-the-art quantum
    photonics platform. Our design, based on mode conversion and subsequent modal
    phase-matched SPDC, facilitates a CMOS compatible $χ^{(2)}$ platform, and simplifies
    photon sources by removing the requirement of periodic poling and the associated
    additional fabrication complexity.
- title: Physics-Informed Discrete-Event Simulation of Polarization-Encoded Quantum
    Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.07289v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Abderrahim Amlou
  - Amar Abane
  - Cory M. Nunn
  - M. V. Jabir
  - Van Sy Mai
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We extend the SeQUeNCe discrete-event simulator with physics-based models
    for polarization-encoded photonic quantum networks. Our framework integrates Jones-calculus
    optical components, including an SPDC Bell-state source, wave plates, and polarizing
    beam splitters, together with a multi-section fiber model capturing polarization
    mode dispersion, chromatic dispersion, and Raman noise from coexisting classical
    traffic. We validate the simulator by reproducing experimentally reported spectra,
    polarization correlations, quantum state tomography, and dispersion- and Raman-induced
    noise. The resulting platform enables hardware-parameterized prediction of entanglement
    distribution performance under realistic deployment conditions.
- title: Matrix phase-space representations for quantum symmetries
  date: 2026-06
  url: https://arxiv.org/abs/2606.12769v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Peter D. Drummond
  - Alexander S. Dellios
  - Margaret D. Reid
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce a general phase-space representation that includes global
    quantum symmetries in the basis expansion. This method, called matrix phase-space,
    projects the basis onto a reduced Hilbert space, which can greatly reduce sampling
    errors of many-body quantum simulations and unifies several previous phase-space
    methods. The purpose of this paper is to provide detailed proofs of basic theorems
    and operator identities. We also treat several different types of symmetries.
    To illustrate the benefits of matrix phase-space methods, we give a detailed derivation
    of a recent application to the topical problem of verifying the outputs of Gaussian
    boson sampling (GBS) quantum computers with photon number resolving detectors.
    This has exponential complexity, and using parity symmetry reduces sampling errors
    by very large factors relative to earlier methods.
- title: 'Q-PhotoNAS: Hybrid Quantum Neural Architecture Search Framework on Photonic
    Devices'
  date: 2026-05
  url: https://arxiv.org/abs/2605.22097v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Farah Elnakhal
  - Alberto Marchisio
  - Nouhaila Innan
  - Gabriel Falcao
  - Muhammad Shafique
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic quantum computing is a promising platform for scalable quantum
    machine learning, but designing effective hybrid architectures remains challenging
    under hardware and optimization constraints. Existing approaches rely on manually
    tuned architectures that fail to account for the collaboration between classical
    preprocessing, phase encoding, and photonic circuit structure, limiting both accuracy
    and hardware compatibility. In this paper, we propose a neural architecture search
    framework for hybrid photonic quantum-classical models that combines genetic algorithm-based
    search with learnable quantum phase encoding to systematically explore the joint
    design space of classical and quantum components. Our framework encodes 19 hyperparameters
    across six gene groups and evolves a population of hybrid architectures using
    group-based crossover, per-gene mutation, and elitism, evaluating each candidate
    on a short training budget before full retraining of the best found design. We
    evaluate our framework on two image classification benchmarks, Digits and MNIST,
    achieving final validation accuracies of 99.44% and 98.78%, respectively, with
    first-principles execution time estimates on the Quandela Ascella photonic QPU
    projecting single-image inference at ~67 ms (Digits) and ~149 ms (MNIST). Our
    quantum contribution analysis further shows that the photonic layer extracts non-redundant
    features orthogonal to the classical pathway, providing a measurable accuracy
    advantage over classical-only baselines. Our results demonstrate that automated
    architecture search is both practical and impactful for hybrid photonic systems,
    opening the way for systematic design space exploration of quantum AI on photonic
    devices.
- title: Saturable absorption in defect-rich diamond nanophotonics
  date: 2026-03
  url: https://arxiv.org/abs/2603.11367v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Christopher Coutts
  - Nicholas J. Sorensen
  - Elham Zohari
  - Sean McNaney
  - Sigurd Flågan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diamond is a leading quantum photonics platform due to its ability to
    host qubits based on crystal defects such as nitrogen-vacancy centres. Fabricating
    nanophotonic devices from defect-rich diamond, which underpins many quantum sensing
    technologies, promises enhanced performance and integrability of diamond quantum
    sensors. Here we demonstrate microdisk cavities fabricated from defect-rich diamond
    that support optical modes with high quality factor (${Q}\sim7\times10^4$ at $1042\,$nm)
    and show that they exhibit saturable absorption. Power-dependent spectroscopy
    measurements spanning 979$\,$nm to 1604$\,$nm are used to observe intensity-dependent
    cavity loss and extract wavelength-dependent absorption coefficients and saturation
    intensities. At 1047$\,$nm, we observe saturation and measure a saturation intensity
    of $2.1\,(8)\,$MW/cm$^2$ and an absorption coefficient of $0.53\,(2)\,$cm$^{-1}$.
    These results provide insight into defect-mediated optical loss in diamond nanophotonics
    and suggest strategies to harness defect-induced nonlinearities in future diamond
    photonic devices.
- title: Geometry-enabled magnetic resilience in superconducting nanowire single-photon
    detectors
  date: 2026-05
  url: https://arxiv.org/abs/2605.10968v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Marinus C. van der Maas
  - Lin Jin
  - Ilhan Tunç
  - Raymond Vermeulen
  - Henri Ervasti
  venue: ''
  code_url: ''
  project_url: ''
  abstract: While magnetic fields and superconductors are both central to classical
    and quantum technologies, their combined use is often challenging, as magnetic
    fields significantly affect superconducting device performance. In superconducting
    nanowire single-photon detectors (SNSPDs), magnetic fields drastically reduce
    detection efficiencies, hampering their application in magnetically-active classical
    and quantum photonics. Here, we systematically characterize the performance of
    NbTiN SNSPDs under magnetic fields and show the enhancement of their intrinsic
    detection efficiency (IDE) at lower bias currents and its suppression at higher
    currents. This leads to SNSPD performance degradation through reduced or disappearing
    saturation plateaus. We show that the magnitude of this degradation is highly
    dependent on nanowire width and demonstrate width-optimized SNSPDs with saturating
    IDE for a wide range of photon energies under application-relevant magnetic fields.
    Minimizing degradation in superconducting devices under magnetic fields enables
    applications like detector-integrated spin-optic and atomic quantum processors,
    high-sensitivity magnetometry, and quantum transduction.
- title: Electrically Reconfigurable Silicon Carbide Nanophotonic Cavities on Thin-Film
    Lithium Niobate
  date: 2026-08
  url: https://arxiv.org/abs/2608.00372v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - San Lam Ng
  - Georgii Grechko
  - Vladislav Bushmakin
  - Rainer Stöhr
  - Vadim Vorobyov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Interfacing integrated photonics with solid-state spin defects holds great
    promise for future quantum networks, but the scaling of spin-photon architectures
    is hindered by frequency mismatches arising from fabrication-induced variations
    in photonic cavity resonances and the inhomogeneous optical transition frequencies
    of individual spins. These challenges call for a photonic platform with deterministic
    and wide-range tunability. Here, we demonstrate a hybrid nanophotonic platform
    based on direct bonding of silicon carbide photonic crystal nanocavity arrays
    onto thin-film lithium niobate on insulator, enabling deterministic electrical
    tuning of multiple SiC nanocavities into mutual spectral resonance. By exploiting
    the strong electro-optic response of lithium niobate, we achieve continuous and
    wide-range cavity tuning of 380 GHz ($\sim$1.1 nm), sufficient to compensate both
    cavity disorder and spin inhomogeneity. The nanocavities balance strong optical
    confinement with electrical tunability, exhibiting a theoretical Purcell factor
    of approximately 400. This hybrid platform enables electrically reconfigurable
    spin-photon interfaces for large-scale integrated quantum photonics.
- title: Many-Body Amplified Nonclassical Photon Emission in Cavity-Coupled Atomic
    Arrays
  date: 2026-04
  url: https://arxiv.org/abs/2604.15604v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Tang Jing
  - Yuangang Deng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The generation of high-performance nonclassical light remains a cornerstone
    of quantum technologies, yet faces a fundamental trade-off between emission purity
    and brightness. Here, we demonstrate that cavity-mediated many-body spin-exchange
    interactions provide a route to overcome this constraint by collectively amplifying
    spectral anharmonicity. In a cavity-coupled atomic array with a programmable relative
    phase $φ$, the resulting interference-interaction mechanism reshapes the dressed-state
    manifold and enables deterministic switching between distinct quantum emission
    regimes. For $φ=0$, constructive interference yields high-purity single-photon
    emission with antibunching improved by four orders of magnitude while preserving
    strong photon flux. Conversely, for $φ=π$, destructive interference creates a
    dark single-photon manifold, resonantly activating two-photon processes to produce
    bright and pure photon-pair bundles. Our work establishes interference-engineered
    many-body interactions as a scalable mechanism for on-demand quantum light generation
    and open a new avenue for harnessing collective many-body physics in quantum photonics.
- title: A Conceptual Technology-Dependent Framework of Ternary Quantum Gates
  date: 2026-04
  url: https://arxiv.org/abs/2604.23242v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Ali Al-Bayaty
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper introduces a conceptual framework of technology-dependent ternary
    quantum gates that could be implemented and fabricated into future superconducting
    and photonic quantum systems for operating 3-valued quantum bits (qutrits). The
    "technology-dependent" means that such ternary quantum gates are on-purpose designed
    analogy to the contemporary binary quantum gates. Conceptually, the final built
    technology-dependent one-, two-, and three-qutrit gates are Chrestenson, Z3, 01,
    02, 12, +1, +2 (including their corresponding inverse and controlled gates), a
    non-phase relative SWAP gate, and a cost-effective Toffoli gate, which is a generic
    ternary Galois Field (GF3) multiplication and addition circuit.
- title: Compressed Quantum Operators and Roots of Hermite Polynomials
  date: 2026-06
  url: https://arxiv.org/abs/2606.24792v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Serge Adonsou
  - Guillaume Dauphinais
  - David W. Kribs
  - Rajesh Pereira
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The fundamental position and momentum operators of quantum mechanics are
    unbounded, but finite rank compressions of the operators can be considered to
    obtain partial information on the operators and their properties. Motivated by
    problems in photonic quantum computing, we bring together results from quantum
    theory and the theory of orthogonal polynomials to show that a natural finite
    rank compression of the position and momentum operator representation on Fock
    space Hilbert space has eigenvalues given by roots of the classical Hermite polynomials.
    We discuss the corresponding compressed displacement operators and potential applications
    in approximate quantum error correction.
- title: Multi-parameter two-photon polarimetry at the quantum limit
  date: 2026-06
  url: https://arxiv.org/abs/2606.27428v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Joseph Niblo
  - Luca Maggio
  - Russell M. J. Brooks
  - Joseph Ho
  - Vincenzo Tamma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic quantum metrology has demonstrated advantages in precision and
    resource efficiency for a wide range of applications, with several schemes approaching
    the fundamental quantum Cramér-Rao precision bound (QCRB). However, the intrinsic
    incompatibility of quantum measurements represents a hurdle in extending these
    advantages to the simultaneous estimation of multiple parameters. In this paper,
    we present an experimental protocol approaching the QCRB simultaneously in two
    polarisation parameters, across a wide range of the parameter space, with as few
    as $\sim 200$ photon pairs, offering advantages for polarimetric sensing for dim
    sources such as in X-ray astronomy or photosensitive samples.
- title: Deterministic linear-optical computing with symmetry-based qubits
  date: 2026-04
  url: https://arxiv.org/abs/2604.06584v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - David S. Simon
  - Christopher R. Schwarze
  - Anthony D. Manni
  - Abdoulaye Ndao
  - Alexander V. Sergienko
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A particular type of linear optical multiport, the Grover four-port, has
    previously been shown to couple the spatial symmetry of a photon to its direction
    of travel. It is shown here that use of a nonstandard choice of qubit, based on
    symmetry, allows Grover four ports to act as compact, low-resource deterministic
    linear optical controlledNOTgates, with no post-selection or ancilla measurements
    required. This approach allows programmable devices, made from Grover multiports
    in combination with other standard optical components, that can implement multiple
    different one-, two-, and three-qubit gates, including the Fredkin and Toffoli
    gates.
- title: Hyperloss from coherent spatial-mode mixing in quantum-correlated networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.21982v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Stephan Grebien
  - Julian Gurs
  - Roman Schnabel
  - Mikhail Korobko
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Quantum-correlated networks distribute quantum resources such as squeezed
    and entangled states. These states are central to modern quantum technology, including
    photonic quantum computing, quantum communications, non-destructive biological
    sensing and gravitational-wave detection. Even for squeezed states of light -
    the most robust quantum-correlated resource - loss-induced decoherence remains
    the dominant obstacle to strong quantum advantage in in large-scale interferometric
    and networked quantum systems. Common design assumption in these applications
    is treating mismatches between spatial modes as a small, incoherent loss. Here
    we show that this picture can fail: coherent spatial-mode mixing with higher-order
    spatial modes can produce an apparent loss exceeding 100% relative to the initial
    squeezing, a regime we term hyperloss. We experimentally demonstrate hyperloss
    in a minimal two-node quantum network: with only 8% mode mismatch, a 5.8dB squeezed
    state is converted into an effectively thermal state with no quadrature squeezing,
    eliminating the quantum advantage. Because the effect is coherent, it is controllable:
    lost correlations can be recovered by tuning differential spatial-mode phases
    (e.g., Gouy-/propagation-phase). We demonstrate this recovery experimentally,
    not only eliminating the hyperloss, but even significantly suppressing the mode
    mismatch loss, with 15% geometric mismatch acting like only ~2.8% effective loss.
    Hyperloss is a design-limiting mechanism for all quantum networks with squeezed
    light, from from photonic quantum processors to large-scale interferometers and
    distributed quantum-sensing networks. Our results provide a practical route to
    avoid hyperloss and turn mode mismatch into an explicit, phase-aware design parameter
    for future quantum technologies.'
- title: Algorithmic Advantage on a Gate-Based Photonic Quantum Neural Network
  date: 2026-05
  url: https://arxiv.org/abs/2605.10801v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Solomon McKiernan
  - Luca Sapienza
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We report on a gate-based variational quantum classifier implemented with
    single photons and probabilistic gates, to emulate the standard quantum circuit
    model framework. We evaluate the expressive power of two deployable quantum neural
    networks (QNNs) by computing their effective dimension, a capacity measure grounded
    in a proven generalization-error bound, and compare them with classical artificial
    neural networks (ANNs) of equivalent trainable-parameter count. Supervised binary
    classification tasks are used to benchmark performance across photonic and superconducting
    QNNs, both of which exhibit superior converged (lower) cross-entropy loss and
    (higher) prediction accuracy relative to matched-parameter ANNs. For a nonlinearly
    separable task, our photonic QNN with a single pair of trainable parameters successfully
    converged (loss 0.04 and accuracy 100%), whereas the equivalent ANN failed to
    learn the decision boundary, saturating at random-guessing performance. We simulate
    photonic quantum circuits, training them on the XOR problem and a two-class Iris
    subset using gradient-free optimization, and assess their robustness to sampling
    errors under realistic noise processes including photon loss and phase-shifter
    imperfections. Circuits with comparatively high effective dimension were deployed
    remotely on a six-qubit photonic quantum processor, achieving classification accuracies
    of up to 100% in both online and offline learning settings. Notably, even the
    simplest QNN deployed, with just two trainable parameters, successfully solved
    tasks that classically require ANNs with at least quadruple the number of parameters,
    suggesting an emergent algorithmic advantage. Overall, these results demonstrate
    a clear proof-of-principle that gate-based QNNs can be realized and trained effectively
    on current photonic hardware, providing proof of algorithmic advantage on a gate-based
    photonic QNN.
- title: Rydberg-Mediated Nonlinear Quantum Optics
  date: 2026-08
  url: https://arxiv.org/abs/2608.02992v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yun-Hui He
  - Chang-Cheng Li
  - Xu Shen
  - Jing-Xu Bai
  - Xiao-Feng Shi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Rydberg atoms have emerged as a versatile platform for quantum optics
    due to their exaggerated properties, particularly their strong long-range interactions,
    which enable a new regime of light-matter interaction. By mapping the interactions
    between Rydberg atoms onto photons, effective photon-photon interactions can be
    realized at the single-photon level, thereby overcoming the intrinsic weakness
    of conventional optical nonlinearities. In this review, we first introduce the
    fundamental physical principles of Rydberg-mediated quantum optics, and then discuss
    some key developments, including single-photon engineering, photonic quantum gates,
    contactless nonlinear optics, and quantum entanglement, providing a comprehensive
    overview of the current state and prospects of this rapidly developing field.
- title: Modeling the Quantum Photon Statistics in Hybrid Light-Matter Integrated
    Circuits
  date: 2026-05
  url: https://arxiv.org/abs/2605.23286v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Mathias Van Regemortel
  - Vincenzo Ardizzone
  - Eugenio Maggiolini
  - Armando Rastelli
  - Daniele Sanvitto
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Strong light-matter coupling between a guided electromagnetic mode and
    an excitonic semiconductor transition gives rise to exciton-polaritons with optical
    nonlinearities far exceeding those of conventional photonic platforms. Utilizing
    these nonlinearities in the few-particle regime, where quantum signatures such
    as photon antibunching, sub-Poissonian statistics and non-trivial inter-mode correlations
    become accessible, is a central goal of integrated quantum photonics. Yet, a quantitative
    theoretical framework connecting realistic waveguide parameters to measurable
    non-classical photonic output is absent. Here, we present a comprehensive framework
    for predicting and benchmarking quantum photon statistics in polaritonic integrated
    circuits, using state-of-the-art experimentally achieved device parameters for
    (Al)GaAs waveguide platforms. By mapping the pulsed nonlinear waveguide dynamics
    onto a bosonic quantum circuit representation that explicitly incorporates dissipation,
    we identify experimentally accessible quantum signatures across two circuit configurations:
    a single waveguide in a free-space interferometric configuration and a fully integrated
    multimode coupled-waveguide circuit. We further show that slow-light engineering
    of the polariton dispersion offers a practical route to amplifying the effective
    nonlinearity, pushing quantum signatures beyond Gaussian statistics.'
- title: All-optical quantum memory using bosonic quantum error correction codes
  date: 2026-03
  url: https://arxiv.org/abs/2603.21721v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Kaustav Chatterjee
  - Niklas Budinger
  - Kian Latifi Yaghin
  - Lucas Borg Clausen
  - Ulrik Lund Andersen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reliable quantum memory is essential for scalable quantum networks and
    fault-tolerant photonic quantum computing. We present a quantitative analysis
    of an all-optical quantum memory architecture in which a Gottesman-Kitaev-Preskill
    (GKP) encoded qubit is stored in a fibre loop and periodically stabilized using
    teleportation-based error correction. By modelling fibre propagation as a pure-loss
    channel and representing each correction round as an effective logical map acting
    on the Bloch vector, we obtain a compact description of the full multi-round memory
    channel. We show that syndrome decoder optimization plays a crucial role in the
    experimentally relevant finite-squeezing regime. The optimal decoder deviates
    from standard square-grid GKP decoder in both tile-size and tile-shape, leading
    to significant improved logical performance. Using this optimized decoding strategy,
    we identify a squeezing-dependent optimal spacing between correction nodes that
    maximizes the memory lifetime. Remarkably, this optimal segment length is largely
    independent of the desired storage time, providing a simple and practical design
    rule for fibre-loop quantum memory. We further find a squeezing threshold of approximately
    6.7 dB below which intermediate error correction becomes counterproductive, while
    above threshold the achievable storage time increases approximately exponentially
    with squeezing. For example, at 17 dB squeezing, storage times exceeding 400 ms
    can be achieved with logical infidelity below 1%. These results establish clear
    performance benchmarks and reveal the fundamental trade-off between photon loss,
    squeezing, and correction frequency in continuous-variable architectures. Our
    findings provide actionable design principles for near-term photonic quantum memory
    and clarify the path toward scalable all-optical fault-tolerant quantum storage.
- title: 'Parameter-Efficient Continuous-Variable Photonic Quantum Neural Networks
    for Edge Quantum AI: Demonstration in Oral Cancer Detection'
  date: 2026-06
  url: https://arxiv.org/abs/2606.28252v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Akshay Bhagwan Sonawane
  - Sophie Choe
  - Lakshman Tamil
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Early detection of oral cancer markedly improves clinical outcomes, yet
    specialized diagnostic tools remain scarce in low-resource settings. Smartphone-based
    screening is a scalable alternative but needs lightweight models that run within
    edge-hardware constraints. Hybrid classical-quantum architectures are emerging
    candidates for parameter-efficient learning, yet most rely on qubit hardware that
    needs cryogenic operation, unsuitable for edge deployment. Continuous-variable
    (CV) photonic quantum computing, which operates at room temperature, offers a
    complementary route. We investigate a hybrid classical-CV quantum classifier for
    oral cancer detection from smartphone images. The pipeline combines a MobileNetV1
    feature extractor, principal component analysis to 16 dimensions, and a parameterized
    CV-QNN of displacement, interferometric, and Kerr gates on a photonic backend.
    We propose a simplified $Φ\circ D \circ U_1$ CV-QNN architecture that cuts trainable
    parameters 40-45% relative to the standard CV-QNN layer of Killoran et al. (2019a),
    and identify dimensionality-reduction and encoding-restriction strategies that
    mitigate barren plateaus, raising loss-gradient variance by roughly 58 orders
    of magnitude. Whether the simplified layer beats the full layer is width-dependent:
    the full layer holds a small but significant edge at two qumodes, whereas the
    simplified layer is significantly better at four qumodes using 44% fewer parameters.
    The strongest model, a four-qumode simplified CV-QNN with only 18 parameters,
    attains the highest validation AUC of all models, exceeds a 55-parameter classical
    baseline using 67% fewer parameters, and reaches 100% calibrated test accuracy
    across all seeds. These results support CV photonic quantum machine learning for
    parameter-efficient, room-temperature medical image classification and motivate
    progress toward edge quantum AI.'
- title: Measurement-defined control of single-particle interference
  date: 2026-04
  url: https://arxiv.org/abs/2604.17767v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Tai Hyun Yoon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Interference is conventionally attributed to path-accumulated phase differences,
    with measurement treated as a passive readout. Here we demonstrate that single-particle
    interference is governed by the relative phase between the prepared quantum state
    and the detector-defined measurement basis -- a joint quantity that is operationally
    inaccessible in any conventional interferometer. Using coherently seeded entangled
    nonlinear biphoton sources, we show that independently scanning the pump phase
    difference, the seed phase difference, or the signal interferometric phase each
    produces identical sinusoidal fringes ($V\approx0.99$) -- a three-scan equivalence
    impossible in any two-mode interferometer. The fringe visibility is continuously
    controlled through the idler-state overlap, directly encoding quantum distinguishability
    without idler detection. The same measurement-defined interference law persists
    from the single-photon to the high-flux regime. The bright-dark collective-state
    structure demonstrated here unifies coherent population trapping and electromagnetically
    induced transparency in atomic $Λ$-systems, discrete photonic interference, and
    single-slit diffraction within a common framework differing only in dark-subspace
    dimensionality, establishing measurement-defined photonic modes as a fundamental
    resource for quantum photonics.
- title: Cascaded Metasurface Interferometer for Multipath Interference with Classical
    and Quantum Light
  date: 2026-03
  url: https://arxiv.org/abs/2603.25090v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Rebecca Aschwanden
  - Nicolás Claro-Rodríguez
  - Ruizhe Zhao
  - Patricia Kallert
  - Tobias Krieger
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Beamsplitters represent fundamental components in both classical and quantum
    optical systems, enabling the distribution of light, as well as the generation
    of interference, superposition and entanglement. However, optical networks constructed
    from conventional bulk 2x2-beamsplitters encounter inherent scalability issues,
    as the number of required beamsplitters scales quadratically with the number of
    optical modes for a fully connected network. Metasurfaces offer a promising route
    to overcome these constraints. By manipulating light at the wavelength scale compact
    optical components with advanced functionalities can be constructed, which address
    several modes simultaneously. In this work, we design and experimentally utilize
    a metasurface as a multiport beamsplitter. Furthermore, we realize a multimode
    interferometer composed of two cascaded metasurfaces. We characterize the individual
    and cascaded metasurfaces using classical light, showing controllable splitting
    ratios through tunable phase relations. We then expand the approach to quantum
    light, employing single photons to demonstrate second- and third-order photon
    correlations, as well as single photon interference across multiple spatial paths.
    These results establish metasurface-based multiport beamsplitters as a scalable
    and reconfigurable platform bridging classical and quantum photonics.
- title: Benchmarking Quantum Extreme Learning based on Gaussian Boson Sampling
  date: 2026-06
  url: https://arxiv.org/abs/2606.15230v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Daniel Montesinos
  - Gian Luca Giorgi
  - Roberta Zambrini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reservoir models offer a hardware-efficient learning paradigm for noisy
    intermediate-scale quantum devices by exploiting untrained quantum dynamics as
    a fixed feature map and restricting optimization to a simple classical readout
    layer. We propose a quantum extreme learning machine implemented using gaussian
    boson sampling and an encoding strategy that achieves high classification accuracy
    while reducing optical resource requirements. Classical inputs are jointly encoded
    in the squeezing parameters and in the interferometer unitary, enabling sampling-based,
    highly nonlinear feature maps while leveraging large-scale GBS output statistics,
    which are conjectured to be classically intractable. We systematically compare
    multiple families of quantum features accessible in the same setup and find that
    photon-number sampling probabilities provide the best performance, consistent
    with their higher effective feature dimensionality. Finally, we benchmark against
    classical nonlinear baselines and analyse robustness under noisy scenarios, showing
    competitive performance with fewer trainable parameters and indicating practical
    promise for near-term photonic implementations.
- title: Bipartite Gaussian Boson Sampling for Hamiltonian Cycles in Directed Graphs
  date: 2026-06
  url: https://arxiv.org/abs/2606.28775v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Miaomiao Yu
  - Jingyi Lv
  - Yan Wang
  - Kun Wang
  - Ping Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Bipartite Gaussian boson sampling (BipartiteGBS) produces output probabilities
    governed by squared permanents of submatrices of arbitrary complex matrices, matching
    the nonsymmetric structure of directed graphs. Most GBS-based graph algorithms,
    however, rely on symmetric hafnian structure and are formulated for undirected
    problems. Here we propose a BipartiteGBS-based framework for directed-graph heuristic
    optimization. We introduce Max-Perm as a canonical optimization task for BipartiteGBS
    and derive a closed-form sampling enhancement factor relative to uniform classical
    sampling in this idealized setting. We then use permanent-biased BipartiteGBS
    samples to guide a genetic algorithm for the celebrated directed Hamiltonian cycle
    problem. Numerical experiments on Erdős--Rényi random directed graphs show that
    the resulting BipartiteGBS-enhanced algorithms improve success rates over a standard
    genetic algorithm and yield longer valid paths when no Hamiltonian cycle is found,
    while ablation tests indicate that BipartiteGBS-guided initialization is the dominant
    contributor. These results show how permanent-based photonic sampling can provide
    useful algorithmic guidance for asymmetric combinatorial search.
- title: Linear Optical Schemes to Postselect High-Dimensional Dicke States
  date: 2026-04
  url: https://arxiv.org/abs/2604.14516v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Daniel Bhatti
  - William J. Munro
  - Seungbeom Chin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multipartite entanglement is an essential quantum resource for various
    distributed quantum applications. One promising method for preparing multipartite
    entanglement is to interfere independent photons at linear optical interference
    setups. While heralding the successful interference and thereby the state generation
    is often costly, postselecting entangled states provides an achievable alternative
    in this framework. We introduce a family of interference schemes for postselecting
    symmetric qudit Dicke states, useful resources in quantum communication and variational
    quantum computing. We present schemes with and without ancillary photons and show
    that using ancillary photons can exceed the upper bound on the success probability
    of schemes without ancillary photons. Our results accommodate a wide range of
    linear optical schemes, providing multiple viable approaches for postselecting
    Dicke states.
- title: Linear-optical test of quantum contextuality with sequential measurements
  date: 2026-05
  url: https://arxiv.org/abs/2605.18112v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Jiaqi Liu
  - Bita Olamaei
  - Lijian Zhang
  - Ali Asadian
  - Saleh Rahimi-Keshari
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantum contextuality provides a fundamental signature of nonclassical
    behavior that cannot be explained by noncontextual hidden-variable models. We
    propose and experimentally implement a linear-optical setup for demonstrating
    Kochen-Specker contextuality via a violation of the KCBS inequality using single
    photons. Our scheme employs sequential measurements realized with linear-optical
    networks and on-off photodetectors. The construction ensures that each co-measured
    observable is implemented by the same physical operation across different contexts.
    Our experimental results demonstrate a clear violation of the KCBS inequality
    and robustness against photon loss. Beyond fundamental investigations, the proposed
    setup provides a practical tool for probing non-classicality and photon-number
    statistics of quantum states, which in turn enables the verification of single-photon
    sources.
- title: Analytic Cancellation of Interference Terms and Closed-Form 1-Mode Marginals
    in Canonical Boson Sampling
  date: 2026-03
  url: https://arxiv.org/abs/2603.02272v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Jiang Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Although the $k$-mode marginal distributions of Canonical Boson Sampling
    (CBS) are known to be computable in polynomial time, the physical mechanism driving
    this computational efficiency remains mathematically opaque. In this work, we
    provide a direct, bottom-up physical derivation of the exact 1-mode marginal distribution
    in CBS, computable in $\mathcal{O}(R^2)$ time, where $R$ is the total number of
    photons. We explicitly bridge this physical derivation with the mathematical theory
    of rank-1 matrix permanents, proving that multiphoton interference natively reduces
    to a symmetric polynomial scaled by a factorial bosonic bunching factor. Crucially,
    we demonstrate that our recursive combinatorial formulation circumvents the algorithmic
    overhead of characteristic function methods, entirely bypassing the need for polynomial
    interpolation or Fourier transforms. Finally, we apply this formula to identify
    macroscopic signatures of bunching, providing a rigorous, highly scalable metric
    for distinguishing genuine quantum interference from classical distinguishable-particle
    models using standard threshold detectors.
- title: Molecular Docking with Quantum Circuit Evolution
  date: 2026-07
  url: https://arxiv.org/abs/2607.12060v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Gleydson Fernandes de Jesus
  - Bruno Oziel Fernandez
  - Marcelo A. Moret
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Molecular docking is an important step in drug discovery, enabling the
    evaluation of receptor-ligand affinity while reducing experimental costs and increasing
    the number of possible tests. However, the high computational cost associated
    with molecular docking remains a limiting factor that can restrict both the experimental
    precision and the scale of the problems being addressed. To improve the future
    applicability of molecular docking, recent works have proposed the use of quantum
    algorithms based on Gaussian Boson Sampling quantum computers and also gate-based
    quantum computers. In this work, we propose the use of Quantum Circuit Evolution
    (QCE) for solving the molecular docking problem, a gate based and gradient-free
    quantum evolutionary method whose evolution is driven by the random application
    of unitary operations to a quantum circuit. The proposed algorithm demonstrated
    the ability to find the best solution to the problem in fewer steps than the methods
    presented in previous studies, exhibiting fast and stable convergence.
- title: On-chip generation of multi-qubit graph states with high-dimensional encoded
    single photons
  date: 2026-08
  url: https://arxiv.org/abs/2608.03012v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Lan-Tian Feng
  - Bo-Hao Zhang
  - Di Liu
  - Pan Gong
  - Yu-Yang Ding
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic multi-qubit entanglement is key to optical quantum information
    processing, particularly universal quantum computing. Yet multi-photon sources
    suffer from low emission efficiency, making single-photon high-dimensional encoding
    an appealing alternative. Here we propose an explicit and resource-efficient high-dimensional
    encoding approach to achieve the target multi-qubit quantum state. The technically
    challenging preparation of multi-photon quantum states is replaced by single-photon
    operations involving high-dimensional expansion, routing, and multi-layered quantum
    measurement. Besides, each photon in the resource multi-photon quantum state can
    be used to encode multiple qubits in a distributed manner, and a larger entangled
    state will be constructed. We demonstrate this approach using programmable photonic
    integrated circuits, where multi-qubit graph states--including the Greenberger-Horne-Zeilinger
    state and the cluster state--are generated and characterized. We additionally
    demonstrate the Grover search algorithm using the single-photon cluster state.
    Our findings unlock a novel route towards diverse entangled state generation with
    photons and advance large-scale and universal photonic quantum information processing.
- title: 'From the Hong-Ou-Mandel Effect to Quantum Sensing: Interference of Nonclassical
    Light with Partial Distinguishability and Noise'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03636v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Matheus Eiji Ohno Bezerra
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This thesis explores the interference of nonclassical states of light,
    particularly Fock and Gaussian states, in noisy linear interferometers, with applications
    to quantum information and quantum sensing. Using the phase-space formalism, analytical
    tools based on generating functions are developed to describe quantum optical
    interference in a unified way. For multiphoton Fock states, new zero probability
    events (suppression laws) are identified beyond the previously derived symmetry
    permutation principle, revealing rich interference structures that is degraded
    with photon distinguishability. For Gaussian states, the Hafnian-based description
    of Gaussian Boson Sampling is extended to include partial distinguishability via
    the overlap matrix of the internal state of the photons. Finally, the link between
    these interference effects and quantum multiparameter estimation is examined for
    the simultaneous estimation of phase and loss. This study shows that while probe
    incompatibility can vanish for optimized non-Gaussian states and some two-mode
    Gaussian states, at high photon number, measurement incompatibility remains a
    fundamental constraint even in this limit.
- title: 'The quantum-advantage resource in multimode OPA light: Identification, optimization,
    extraction'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18605v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Vitaly Kocharovsky
  - Kunwar Kalra
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce the notion and reveal remarkable properties of quantum complexity
    resource contained in a mixed multimode Gaussian state and providing universal
    quantitative characterization of its quantum advantage. The notion is based on
    convex optimization, multimode photon number statistics, Hafnian Master Theorem,
    and #P-hard complexity. We consider pulsed OPAs targeting maximal quantum complexity
    resource and thousands of multipartite-entangled squeezed modes of output light
    via nonlinear, spatio-temporally nonadiabatic generation inside OPA and optimized
    extraction out of OPA. We show that such figure of merit is more realistic than
    Bloch--Messiah supermodes and guides to multimode OPAs opening new paths to important
    applications in quantum information science such as generation of 3D cluster states
    for one-way photonic quantum computing and demonstration of quantum advantage.'
- title: Entanglement and circuit complexity in finite-depth random linear optical
    networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.14277v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Laura Shou
  - Joseph T. Iosue
  - Yu-Xin Wang
  - Victor Galitski
  - Alexey V. Gorshkov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We study the growth of entanglement and circuit complexity in random passive
    linear optical networks as a function of the circuit depth. For entanglement dynamics,
    we start with an initial Gaussian state with all $n$ modes squeezed. For random
    brickwall circuits, we show that entanglement, as measured by the Rényi-2 entropy,
    grows at most diffusively as a function of the depth. In the other direction,
    for arbitrary circuit geometries we prove bounds on depths which ensure the average
    subsystem entanglement reaches within a constant factor of the maximum value in
    all subsystems, and bounds which ensure closeness of the random linear optical
    unitary to a Haar random unitary in $L^2$ Wasserstein distance. We also consider
    robust circuit complexity for random one-dimensional brickwall circuits, as measured
    by the minimum number of gates required in any circuit that approximately implements
    the linear optical unitary. Viewing this as a function of the number of modes
    and the circuit depth, we show the robust circuit complexity for random one-dimensional
    brickwall circuits scales at most diffusively in the depth with high probability.
    The corresponding Gaussian unitary $\tilde{\mathcal U}$ for the approximate implementation
    retains high output fidelity $|\langleψ|\mathcal U^\dagger \tilde{\mathcal U}|ψ\rangle|^2$
    for pure states $|ψ\rangle$ with constrained expected photon-number.
- title: Scalable generation of heralded single photons via active feed-forward switching
    of a fiber delay line
  date: 2026-06
  url: https://arxiv.org/abs/2606.16741v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Xavier Barcons Planas
  - Helen M. Chrzanowski
  - Janik Wolters
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quasi-deterministic single-photon generation is a key requirement for
    many photonic quantum technologies. Photon sources based on spontaneous parametric
    down-conversion (SPDC) are widely used for producing high-quality photons; however,
    the probabilistic nature of the process limits the generation of synchronized
    multi-photon states. Here, we demonstrate temporal synchronization of multiple
    photon-generation events using a free-space-fiber hybrid delay line with feed-forward
    control, enabling fast and efficient switching and scalable operation. Narrow-band,
    telecom-wavelength photons compatible for fiber transmission are heralded from
    a monolithic cavity SPDC source and synchronized across 20 time bins. This yields
    a sixfold enhancement in synchronized rates and enables multi-photon synchronization,
    with only a marginal increase of higher-order photon-number contributions.
- title: Air-stable bright entangled photon-pair source from graphene-encapsulated
    van der Waals ferroelectric NbOI2
  date: 2026-03
  url: https://arxiv.org/abs/2603.04082v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Mayank Joshi
  - Mengting Jiang
  - Yu Xing
  - Yuerui Lu
  - Jie Zhao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Van der Waals (vdW) ferroelectrics are emerging nonlinear photonic materials
    that combine large second-order susceptibility \c{hi}(2) with heterostructure
    compatibility, offering an attractive route toward miniaturized spontaneous parametric
    down-conversion (SPDC) sources. However, vdW SPDC sources operating under continuous
    irradiation in air remain limited in low brightness and poor operational stability,
    as oxygen and moisture exposure, together with pump-induced heating, lead to material
    degradation and permanent damage. Here we demonstrate an air-stable, bright SPDC
    source based on ferroelectric NbOI2 enabled by graphene encapsulation. Graphene
    provides robust environmental protection and can effectively supress pump induced
    degradation by enhancing heat dissipation. We report a record photon-pair generation
    absolute rate of 258 Hz and a normalized brightness of 19,900 Hz/(mW.mm). Leveraging
    this stabilized platform, we further generate polarization entangled photon pairs
    with 94% fidelity with respect to the maximally entangled Bell states from graphene-encapsulated
    90° twisted bilayer NbOI2. Our results establish a practical and air-stable vdW
    ferroelectric SPDC platform that overcomes key limitations of existing vdW quantum
    light sources and provides a viable pathway toward scalable, integrated entangled
    photon sources for on chip quantum photonics.
- title: Compact system development of efficient quantum-entangled photon sources
    towards deployable and industrial devices
  date: 2026-04
  url: https://arxiv.org/abs/2604.02024v1
  category: quantum-photonics
  subcategory: theory
  authors:
  - Yared G. Zena
  - Moritz Langer
  - Ahmad Rahimi
  - Abhishikth Dhurjati
  - Pavel Ruchka
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Entangled photon pair sources are a key enabling technology for quantum
    communication and networking, yet their deployment beyond laboratory environments
    is hindered by system-level complexity, limited operational stability, and insufficient
    industry compatibility. Here, we demonstrate a rack-based, mobile quantum light
    source architecture based on a semiconductor quantum dot emitter that directly
    addresses these challenges through modular system integration and automated operation.
    The source generates polarization-entangled photon pairs with an entanglement
    negativity 2n of up to $0.98(1)$, confirming near-maximal entanglement quality.
    In continuous, hands-off operation over a six-hour time window, the system achieves
    an average single-photon emission rate of $697(8)$ kHz and a maximum rate of $740(7)$
    kHz, while maintaining 2n-value of more than $95$ $\%$. These results are enabled
    by the integration of optical excitation, collection, cryogenic operation, and
    control electronics within a standardized rack footprint, together with automated
    monitoring. By demonstrating simultaneously high entanglement quality, sustained
    brightness, and long-term operational stability in an industry-aligned system
    architecture, this work advances semiconductor quantum dot sources toward deployable
    entangled photon sources for applied quantum photonics.
- title: Improved Cryogenic Photodiode Optical Biasing for Low-Noise and Low-Jitter
    Superconducting Nanowire Single-Photon Detectors
  date: 2026-06
  url: https://arxiv.org/abs/2606.07140v2
  category: quantum-photonics
  subcategory: theory
  authors:
  - Jia-Hao Hu
  - Wei-Jun Zhang
  - Wen-Shuo Yu
  - Yu-Ze Wang
  - Dong-Wei Chu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We experimentally demonstrate an improved optical biasing scheme for
    superconducting nanowire single-photon detectors (SNSPDs), which employs a cryogenic
    InGaAs-InP photodiode (PD) as a local bias source. It is found that, under illumination
    from a stable external light source, this PD generates a stable photocurrent in
    a cryogenic environment (~2.3 K), with fluctuations in the photocurrent primarily
    attributed to fluctuations in the incident optical power. Furthermore, by screening
    and effectively blocking stray photons leaking from the PD, which give rise to
    background dark counts, we have achieved an SNSPD exhibiting an ultra-low intrinsic
    dark count rate of 1e-4 cps. Utilizing this improved optical biasing technique,
    our SNSPD achieved performance comparable to that obtained under conventional
    electrical biasing: a system detection efficiency of 80.7%, a background dark
    count rate of 32.6 cps, and a minimum timing jitter of 57.5 ps. These results
    indicate that cryogenic-PD-based optical biasing serves as a viable, low-noise,
    and low-jitter alternative to traditional electrical biasing. Moreover, this work
    offers useful design guidance for the future development of PD-based low-noise
    bias sources and for the construction of all-photonic SNSPD systems tailored for
    high-precision quantum photonics applications.'
- title: Heterogeneously Integrated Squeezed-Light Generation and Detection on a Single
    Photonic Chip
  date: 2026-08
  url: https://arxiv.org/abs/2608.13218v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Haoran Chen
  - Benjamin Westcott
  - Fatemehsadat Tabatabaei
  - Xiangwen Guo
  - Shuman Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Squeezed light underpins quantum-enhanced sensing and continuous-variable
    quantum information processing, and integrated photonics offers a route to producing
    it at scale. Universal to these applications are squeezed-light generation and
    measurement. Importantly, quantum measurements serve not only as readout but also
    as active operations in quantum-state evolution. However, integrating squeezed-light
    generation and photodetection on the same photonic chip has remained challenging
    because they impose fundamentally conflicting material requirements: low optical
    loss to preserve quantum correlations, but efficient photon absorption for photodetection.
    Here, we demonstrate squeezed-light generation, routing, and balanced homodyne
    detection integrated on a single photonic chip through heterogeneous integration.
    A two-mode squeezed quantum microcomb comprising 34 quantum modes is measured
    with approximately 3 dB squeezing. Our work establishes a scalable architecture
    for fully integrated squeezed-light quantum photonic systems, unifying quantum-state
    generation, processing, and detection on a single chip.'
- title: Bifurcation structure of soliton self-injection locking in microresonators
  date: 2026-06
  url: https://arxiv.org/abs/2606.29921v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - S. Deshmukh
  - T. M. Schneider
  - A. Tikan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-injection locking (SIL) of a diode laser to a high quality-factor
    microresonator has recently become increasingly important in hybrid integrated
    photonics, providing access to compact sub-Hz linewidth lasers. It was also shown
    to facilitate the access to dissipative Kerr solitons - the key to a low-noise
    coherent frequency comb on a photonic chip. However, the existence and stability
    ranges of SIL soliton states in experimentally controlled parameters are still
    not fully understood. Here we study the bifurcation structure of solutions in
    a model of soliton SIL in the weak-backscattering limit. We show that SIL produces
    soliton-number-dependent existence ranges of multi-soliton solutions in free-laser
    detuning and feedback phase parameters. We identify exclusive single-soliton existence
    regions and demonstrate dynamical access to single solitons in this region by
    direct numerical simulations using prescribed parameter sweeps.
- title: Single-Shot Realization of 10000-Mode Octave-Spanning Artificial Gauge Fields
  date: 2026-06
  url: https://arxiv.org/abs/2606.23960v3
  category: integrated-photonics
  subcategory: systems
  authors:
  - Lida Xu
  - Apurva Padhye
  - Supratik Sarkar
  - Alireza Parhizkar
  - Christopher J. Flower
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Artificial gauge fields (AGFs) enable photons and other bosons to emulate
    fermionic phenomena such as chiral edge transport and quantum Hall phases; however,
    existing theories and realizations remain confined to narrow bandwidths under
    single-mode approximation. We introduce a general theoretical framework for ultra-broadband,
    multi-modal dispersion-corrected AGFs in both linear and nonlinear regimes. Using
    integrated photonics, we realize over 100 distinct AGFs hosting more than 10,000
    modes across nearly an optical octave -- the first frequency-comb realization
    of the integer quantum Hall model for photons. Leveraging Kerr nonlinearity, we
    achieve single-shot AGF control beyond waveguide dispersion, robust to wafer-scale
    fabrication variations. Our results establish a new regime of ultra-broadband
    multimodal AGFs, opening pathways to exotic dispersion-corrected AGF dynamics
    and simulations, as well as volume-manufacturable device functionalities such
    as waveguide-dispersion-resilient photonic circuits, and AGF-enabled programmable
    nonlinear and quantum optics and optoelectrics.
- title: A cavity-less architecture for high-power integrated frequency combs
  date: 2026-05
  url: https://arxiv.org/abs/2605.27528v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Mrinmoy Roy
  - Joshua A. Palacios
  - Shuva Roy
  - Darren D. Hudson
  - Andrea Blanco Redondo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photonic chip-based frequency combs have emerged as a transformative platform,
    enabling compact, scalable, and high-performance multiwavelength sources with
    far-reaching impact across science and technology. Most commonly, these sources
    leverage the cavity enhancement of the nonlinearities to produce a spectrum of
    equidistant frequency lines via cascaded four-wave mixing in high-quality microresonators
    pumped with a continuous wave tone. While the presence of the resonator inherently
    enables low-power threshold operation, it also brings intrinsic limitations in
    efficiency, tunability, and power per line. Here, we propose and demonstrate a
    cavity-less approach for the generation of optical frequency combs on-chip, which
    relies on non-degenerate cascaded four wave mixing in dispersion engineered integrated
    photonic waveguides. The results presented here enable previously inaccessible
    regimes of pump-to-comb conversion efficiency, wide-range continuous line-spacing
    tunability, and power per line for coherent comb states. This work opens new research
    opportunities in nonlinear integrated photonics and pathways toward high-capacity
    optical interconnects, scalable photonic AI accelerators, and other power-constrained
    integrated systems.
- title: Photonic-chip-based generation of sub-100-femtosecond optical frequency combs
  date: 2026-08
  url: https://arxiv.org/abs/2608.04931v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Weiqiang Xie
  - Zhengshun Lei
  - Zeyu Xiao
  - Yudi Zhao
  - Xing Zou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Sub-100-fs optical pulses and frequency comb sources have been revolutionizing
    a wide range of applications, from ultrafast optical science to optical frequency
    standard and measurement. To date, the leading techniques for generating such
    pulses in practical systems rely on tabletop mode-locked lasers, which inherently
    suffer from high system complexity, limited long-term reliability, and pronounced
    environmental sensitivity. Meanwhile, driven by advances in photonic integration,
    chip-scale approaches have sought to realize miniaturized pulse sources. However,
    simultaneously achieving sub-100-fs duration, ideal pulse shape, and a broadband
    flat-topped spectrum remains a significant challenge. Here, we address these challenges
    by combining two key photonic chip technologies: TFLN EO modulators for picosecond
    seed pulse generation, and highly nonlinear optical loop mirrors (NOLM) based
    on AlGaAsOI nanowaveguides for efficient temporal pulse cleaning and spectral
    broadening. In theoretical simulation and experiment, we show that for an input
    seed pulse centred at ~1550nm, a single-stage AlGaAs NOLM with a loop length of
    1cm can produce flat-topped, nearly tenfold spectral broadening and over tenfold
    compression of pulse width, and more than 10dB suppression of pulse pedestals.
    Using initial EO comb pulses with ps-level durations at repetition rates of 10-20GHz,
    we demonstrate photonic-chip-enabled pulses with an unprecedented duration of
    55fs and a flat-topped comb spectrum whose 10dB optical bandwidth exceeds 90nm.
    Our results highlight the remarkable potential of photonic chip technologies to
    realize high-repetition-rate, miniaturized sub-100-fs optical pulse generators
    with the prospect of superior stability and operability. The demonstrated photonic-chip-based
    sub-100-fs optical frequency comb sources may establish a new paradigm for both
    scientific research and practical applications.'
- title: A Wafer-Scale Heterogeneous III-V-on-Silicon Nitride Quantum Photonic Platform
  date: 2026-05
  url: https://arxiv.org/abs/2605.17738v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Lillian Thiel
  - Boqiang Shen
  - Jasper R. Venneberg
  - Melissa A. Guidry
  - Nic Arnaud
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Heterogeneous integration of gain and strongly nonlinear materials with
    ultra-low-loss silicon nitride (SiN) photonics offers a route to scalable quantum
    circuits, but concurrent wafer-scale manufacturability, low interlayer loss, and
    high performance have been challenging to realize. Here we demonstrate a wafer-scale
    III-V-on-SiN quantum photonic platform that directly integrates III-V layers to
    foundry-fabricated SiN circuits. The SiN layer provides 200-300 nm thick waveguides
    with $&lt;1$ dB/m loss and a mature passive photonics ecosystem, while III-V materials
    provide large $χ^{\left(2\right)}$ and $χ^{\left(3\right)}$ nonlinearities for
    parametric gain, frequency conversion and quantum light generation. Adiabatic
    interlayer couplers yield $&lt;25$ mdB loss to InGaP waveguides and resonators
    with intrinsic quality factors exceeding $10^6$, enabling $15\times$ brighter
    entanglement sources and efficient nonlinear conversion on SiN. Integrated components--including
    low-loss beam splitters, waveguide crossers, and tunable interferometers--are
    complemented by III-V lasers and InP photodetectors with amplifiers achieving
    up to $99^{+1}_{-12}\%$ quantum efficiency and $3$ GHz bandwidth. This architecture
    unites ultra-efficient sources, nonlinear elements and detectors on a wafer-scale,
    low-loss platform, establishing a path toward large-scale, low-noise quantum photonic
    systems.
- title: Segment-chirped periodically poled lithium niobate waveguides for broadband
    supercontinuum generation
  date: 2026-05
  url: https://arxiv.org/abs/2605.30941v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yue Li
  - Xiaodong Shi
  - Sakthi Sanjeev Mohanraj
  - Mengyao Zhao
  - Xu Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Supercontinuum generation is a key technology in nonlinear optics, supporting
    a wide range of applications in frequency metrology and spectroscopy. Integrated
    photonics offers a promising route toward compact and efficient supercontinuum
    sources, yet extending the bandwidth while maintaining high spectral flatness
    remains a central challenge. Here we demonstrate an integrated broadband supercontinuum
    source based on segment-chirped periodically poled lithium niobate (SC-PPLN) nanophotonic
    waveguides. By discretizing the chirped poling profile into independently optimized
    segments, this approach enables high-fidelity ferroelectric domain inversion with
    near-ideal duty cycles and establishes broadband quasi-phase matching, overcoming
    the domain inhomogeneity and efficiency limitations commonly encountered in conventional
    chirped poling. The engineered phase-matching landscape supports efficient wavelength
    conversion and simultaneous activation of multiple second- and third-order nonlinear
    processes. Experimentally, we achieve a spectrally flat supercontinuum spanning
    three optical octaves, from 320 nm in the ultraviolet to 2600 nm in the mid-infrared.
    These results establish segment-chirped poling as a practical strategy for broadband
    wavelength conversion and supercontinuum generation in integrated photonics.
- title: Nanophotonic dispersion engineering in tantala-based microresonators with
    ultralow-loss claddings
  date: 2026-08
  url: https://arxiv.org/abs/2608.17277v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Alexa R. Carollo
  - Atasi Dan
  - Jizhao Zang
  - Haixin Liu
  - Nitesh Chauhan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Integrated photonics optimized to leverage low loss, nonlinear-optical
    processes and optoelectronic integration requires robust optical cladding materials
    and associated fabrication process flows. We develop low-loss silicon dioxide
    (SiO$_2$) claddings with tantalum pentoxide (Ta$_2$O$_5$, tantala) integrated
    photonics to realize robust, high intrinsic quality factor ($Q_i$) microresonators
    and photonic-crystal resonators (PhCRs) for soliton microcomb generation. Specifically,
    we introduce a full-wafer, low-temperature process compatible with two tantala-based
    films: pure tantala and an amorphous metal-oxide mixture of titanium dioxide (TiO$_2$,
    titania) and tantala. Combining tantala with titania enhances the film''s resistance
    to damage from the SiO$_2$ cladding deposition process, offering access to high
    $Q_i$ above $4 \times 10^6$ in fully cladded microresonators. Our platform supports
    low-loss edge couplers, group-velocity dispersion engineering by waveguide geometry,
    access to nanophotonic structures particularly to control phase-matching, and
    high dimensional tolerance in devices across an entire wafer. Using the platform,
    we explore the generation of high-efficiency, dark-soliton microcombs with repetition
    frequency from 50 GHz to 500 GHz, which supports applications such as photonic
    artificial intelligence acceleration, electronic signaling, and optical data communication.'
- title: Engineering Disordered Many-particle Plasmonic Nanoclusters for Wafer-scale
    Uniform and Giant Electromagnetic Field Enhancement
  date: 2026-07
  url: https://arxiv.org/abs/2607.06003v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Minjun Kim
  - Vasanthan Devaraj
  - Hyeon-Seok Seo
  - Seongjae Eom
  - Jeong-Su Lee
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Scalable plasmonic technologies face a critical trade-off: few-body architectures
    offer high enhancement but are sensitive to fabrication flaws, while scalable
    methods like solid-state dewetting yield large, low-enhancement gaps. We introduce
    a paradigm shift using a many-body plasmonic architecture inspired by statistical
    mechanics. By moving toward the continuum limit (N&gt;&gt;1), local geometric
    variations are statistically averaged out, effectively decoupling optical performance
    from microscopic disorder. We implement this concept via a lithography- and etching-free,
    multi-step dewetting strategy, creating wafer-scale nanoclusters. This process
    strategically forms a robust many-body system by introducing numerous small satellite
    nanoparticles between larger particles. Crucially, this design achieves a high
    collective enhancement that surpasses even optimized few-body systems, despite
    having larger individual gaps. Under optimized conditions, these substrates exhibit
    a surface-enhanced Raman scattering enhancement factor approaching 4 x 108 with
    unprecedented reproducibility (RSD of ~10%). This scalable, low-cost concept establishes
    a practical route toward reproducible wafer-scale nanophotonic platforms for sensing,
    spectroscopy, and quantum technologies.'
- title: 'Nonlinear Nanophotonic Chip-space Interfaces: On-chip Generation of Structured,
    Topological and Spatiotemporal Lights Via Nonlinear Čerenkov Radiation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.06360v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Dunzhao Wei
  - Bo Chen
  - Shuai Wan
  - Yixuan Wang
  - Jiantao Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Miniaturized and reconfigurable interfaces between confined optical modes
    within integrated photonic chips and structured light propagating in free space
    would serve as a cornerstone for fundamental optical science and modern photonic
    technology. In this work, we exploit the anisotropic nonlinear susceptibility
    tensors associated with thin-film lithium niobate to construct nanophotonic chip-space
    interfaces capable of flexibly generating and multi-dimensionally engineering
    structured light via injections of photons to on-chip waveguides. By harnessing
    the nonlinear Čerenkov radiation in integrated nonlinear microring resonators,
    we successfully tailor the spatial profile, polarization state, emission wavelength,
    topological charge and temporal wave packet of structured optical vortices, exhibiting
    reconfigurabilities and tuning ranges far beyond the state-of-the-art. To further
    showcase the capabilities of our platform, we use a single pump to generate tunable
    optical skyrmions via the spin-orbit coupling and multi-state integrated vortex
    microcombs in the visible range via synergistic $χ^{(2)}$ and $χ^{(3)}$ nonlinear
    optical processes. Our work bridges the research fields of structured light and
    integrated nonlinear optics, providing unprecedented opportunities for spatiotemporal
    light generation and on-chip multidimensional nonlinear optics.
- title: Practical Limits on Integrated Squeezers
  date: 2026-06
  url: https://arxiv.org/abs/2606.02524v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Devin J. Dean
  - Taewon Park
  - Lars S. Madsen
  - Alex Terrasson
  - Sam Robison
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent experiments have demonstrated the successful generation and detection
    of moderately squeezed vacuum states with integrated photonics. However, in order
    to benefit from the reduced noise of highly squeezed light, many different noise
    sources must be mitigated. Here, we quantify the fundamental limits these noise
    sources impose on squeezing measurements and find surprising generality across
    different platforms and designs. We combine these different limitations into a
    simple model that provides practical guidance for the design and benchmarking
    of next-generation integrated squeezed-light systems.
- title: 'Photonic Theta Cavity: Engineering Bound States in the Continuum in Topological
    Resonators Beyond the Limitations of Near Field Coupling'
  date: 2026-07
  url: https://arxiv.org/abs/2607.09915v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Eric Seabron
  - Robert E. Coleman
  - Chuanyu Lian
  - Malcolm Bogroff
  - Carlos Rios
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Theta Cavity is a unique topological resonator architecture which
    utilizes interferometric coupling to overcome fundamental design limitations associated
    with near-field evanescent coupling which currently dominates the design space
    for integrated photonics. The defining device physics is established by the mirror
    symmetric cross junctions which preserves efficient power transfer between a waveguide
    and ring resonator creating a strongly correlated phase relationship between the
    multiple paths. The unique mode selection physics allows for interference driven
    suppression of radiative pathways enabling strong cavity confinement and the emergence
    of Bound States in the Continuum (BICs). Analytical models reveal non-Hermitian
    optical band structure displaying non-trivial topological transitions between
    BIC and quasi-BIC modes that are robust to attenuation, temperature variations,
    and typical fabrication non-idealities, which is critical for overcoming intrinsic
    limitations associated with silicon based integrated photonics. The Theta Cavity
    architecture also circumvents limitations that arise from proximity requirements
    of the physical gap used in near-field coupled waveguides which enables a flexible
    design space for new devices. In this study, we demonstrate phase mediated long-range
    strong coupling of multiple ring resonators in the Nested Theta Cavity architecture
    showcasing band structure hybridization resulting in the formation of anti-crossing
    bandgaps, Dirac crossings, and Fano resonances. The photonic Theta Cavity architecture
    provides a scalable, topologically robust platform for engineering modes across
    a multidimensional parameter space with high resilience to perturbation and attenuation,
    enabling a new approach for the designing of integrated cavity devices.
- title: 'Seidr update: photonic ''black magic'' for high-contrast interferometry
    using kernel-nulling and photonic lanterns'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03280v2
  category: integrated-photonics
  subcategory: systems
  authors:
  - Nathan K Long
  - Daniel S Dahl
  - Christopher H Betters
  - Julia J Bryant
  - Nick Cvetojevic
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Seidr is a new interferometric beam combiner within the Asgard Suite,
    utilizing infrastructure common to the BIFROST instrument at the Very Large Telescope
    Interferometer. Seidr combines hybrid mode-selective photonic lantern injection
    modules with a kernel-nulling photonic chip backend to enable deep H-band nulling
    for high-contrast studies of exoplanets, exomoons, and circumstellar dust. This
    instrument update summarizes Seidr's current design maturity and recent simulations
    of the point source - to - lantern outputs. We also outline progress on our neural
    network-based wavefront estimation scheme, which uses the photonic lantern outputs
    to sense phase fluctuations, designed to feed back to Baldr's deformable mirror,
    and improve nuller light injection.
- title: Frequency combs and coherent dissipative structures in nonlinear optical
    microresonators
  date: 2026-04
  url: https://arxiv.org/abs/2604.05897v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Tobias Herr
  - Alexey Tikan
  - Tobias J. Kippenberg
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Laser-driven high-Q Kerr-nonlinear optical microresonators enable parametric
    oscillation with low-power continuous-wave lasers and host a variety of coherent
    dissipative structures, including dissipative Kerr solitons and switching waves.
    These time-periodic structures constitute coherent optical frequency combs, and
    photonic-chip integration has miniaturized them to the chip scale. Such photonic-integrated,
    microresonator-based frequency combs - often termed 'microcombs' or 'Kerr combs'
    - have been demonstrated in various system-level and scientific applications.
    They complement femtosecond-laser-based frequency combs when high repetition rates,
    broad bandwidths, or high power per comb line are needed. This review introduces
    the field of microcombs and outlines the fundamental physical principles governing
    the generation of coherent frequency combs in microresonators.
- title: Ultrafast programmable Bragg reflection in photonic integrated circuits
  date: 2026-07
  url: https://arxiv.org/abs/2607.14565v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yunxiang Song
  - Pawan Ratra
  - Danxian Liu
  - Jiayu Yang
  - Zhongshu Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Distributed Bragg reflectors (DBRs) are foundational building blocks of
    classical and quantum photonic technologies. However, their optical responses
    are typically fixed upon fabrication, limiting circuit robustness, reconfigurability,
    and functionality in applications from high-speed communications to quantum computing.
    Here, we demonstrate photonic chip-based programmable DBRs at telecommunications
    wavelengths, which are formed by electro-optically inducing refractive index contrast
    between periodic ferroelectric domains in thin-film lithium niobate waveguides.
    We achieve voltage-controlled Bragg reflection from zero to near-unity, and gigahertz-speed
    reflectivity modulation. Our results bring DBRs into the ultrafast programmable
    regime, opening new opportunities in topological photonics, cavity quantum electrodynamics,
    integrated lasers, and optical interconnects. The interplay between nanoscale
    ferroelectric domain engineering and strong electro-optic nonlinearity establishes
    a new design strategy for nanophotonic devices, otherwise inaccessible in bulk
    media.
- title: Bounded frequency lattices in integrated lithium niobate coupled ring cavities
  date: 2026-03
  url: https://arxiv.org/abs/2603.01422v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Hiep X. Dinh
  - Armandas Balčytis
  - Guanghui Ren
  - Mei Xian Low
  - Arnan Mitchell
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Synthetic dimensions provide a powerful tool that uses comparatively simple
    structures to probe high-dimensional topological physics, in which edge states
    emerging at lattice boundaries are of great importance. However, the demonstration
    of lattice boundaries in synthetic dimensions is relatively nascent. In this work,
    we realize an integrated coupled ring system in a thin-film lithium niobate photonic
    platform that enables the simulation of one-dimensional frequency crystal lattice
    with sharp boundaries, attaining suppression for two coupling terms with a single
    auxiliary cavity. Their effect on tight-binding lattice dynamics was verified
    by acquiring discretized band structures of an N = 7 site lattice. The ability
    to create robust frequency-space boundaries is a key step toward the realization
    of topological systems that harness bulk-edge correspondence as well as optical
    information processing in a photonic chip.
- title: Deleterious effect of photon-phonon coupling on microcavities in their application
    as quantum sources
  date: 2026-07
  url: https://arxiv.org/abs/2607.21743v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Y. Sacha C. L. S.
  - G. C. Rickli
  - J. Dipold
  - R. A. Kögler
  - Paulo Nussenzveig
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In quantum systems, the contact with the environment is detrimental to
    the purity of the state, thus limiting the practical use of entangled sources
    in quantum information applications. This loss of purity is observed in the form
    of additional noise in the tomography of the state. We investigate this noise
    dependence in $Si_3N_4$ micro-cavities, previously used for quantum state generation,
    and demonstrate that the dependence of this noise on the temperature is compatible
    with a coupling of the photonic chips to a thermal reservoir. The control of this
    noise source is a necessary condition for the efficient implementation of these
    devices as sources of entangled states in quantum networks.
- title: And Yet Another FEM-Based Mode Solver for Dielectric Waveguides
  date: 2026-04
  url: https://arxiv.org/abs/2604.12014v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Ergun Simsek
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a full-vector finite element method (FEM) mode solver for dielectric
    waveguides based on a mixed Nedelec-Lagrange discretization of Maxwell's curl
    equations in the frequency domain. The formulation combines edge elements for
    transverse field components with nodal elements for the longitudinal component,
    enabling accurate modeling of hybrid modes while effectively suppressing spurious
    solutions. The solver is implemented in both MATLAB and Python with an emphasis
    on reproducibility, computational efficiency, and accessibility, including compatibility
    with cloud-based platforms. Numerical validation is performed on representative
    waveguide structures, demonstrating excellent agreement with COMSOL Multiphysics,
    with relative errors below 0.05%. Convergence studies confirm the expected accuracy
    trends with mesh refinement, while highlighting the trade-off between computational
    cost and precision. The proposed implementation provides a flexible and reliable
    open-source tool for integrated photonics research and education.
- title: Autonomous agentic design for photonics
  date: 2026-05
  url: https://arxiv.org/abs/2606.00915v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Prashanta Kharel
  - Amin Khavasi
  - Xinzhong Chen
  - Tyler W. Hughes
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce an automated, agent-driven approach to the design of photonic
    devices. We instruct large language models (LLMs) to solve photonic design problems,
    given access to software tools for performance evaluation (through numerical simulations)
    and quantitative acceptance criteria (e.g., fabrication rules, geometric constraints,
    physical-consistency checks). Within this context, agents run autonomous design
    loops (propose, simulate, evaluate, iterate) and generate devices with state-of-the-art
    performance. We demonstrate this approach in two stages: First, we run it individually
    on four canonical problem classes in photonic chip design: a) passive components
    (waveguide bends, splitters, crossings, etc.); b) active devices (silicon microring
    modulators (MRMs)); c) radio-frequency (RF) devices (traveling-wave electrodes
    for a Mach-Zehnder modulator (MZM)); d) chip layout (electrical routing). Then,
    we combine the previous studies in one demonstration to produce a silicon photonic
    modulator, incorporating layout, charge transport, optical mode, and RF electrode
    design. The approach generalizes to any problem that combines a numerical simulator
    with performance criteria that an LLM can evaluate.'
- title: 'Project RAINBOW: An all-integrated all-optical ultrafast dual-comb chip'
  date: 2026-05
  url: https://arxiv.org/abs/2605.17092v2
  category: integrated-photonics
  subcategory: systems
  authors:
  - Tushar Malica
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'A train of periodic optical pulses gives an optical frequency "comb"
    that acts as a precise ruler for light measurement due to its equally spaced frequencies.
    Today, such pulses last millionths of a billionth of a second (Femtoseconds/fs)
    and associated comb spans billions of frequencies (Terahertz), similar to a discretized
    rainbow ranging from ultraviolet to infrared light. This is the core technology
    in many optic-based applications like atomic clocks and secure communication.
    Despite its obvious value, these remain mostly confined to research labs for being
    complex, expensive, and power-hungry. One promising solution is to use laser mode-locking:
    a technique that forces a laser to emit short coherent pulses. While chip-size
    systems have already been demonstrated, this approach still lacks flexibility
    and performance in repetition rate and bandwidth simultaneously. This research
    proposal leverages the industrialization of integrated photonic chips to develop
    a first-ever all-integrated two-coloured pulsed source with durations of a few
    hundred fs. It will engineer a novel turn-key device that will 1) pioneer the
    demonstration of modelocked pulses at two separate central frequencies originating
    from the same laser, 2) fit on a fingertip, and 3) be compatible with generic
    foundry processes, and thus, mass-manufacturable. Sustained generation of such
    pulses is intricate with little knowledge about light-material interaction at
    this scale. The chip will emit two broadband combs using one control parameter.
    These combs will have synergetic comb properties and coupled through one gain
    medium. Thus, we will create a new ultra-broadband comb resulting in unprecedented
    phase correlation between the two sub-combs. Simultaneously, the device will be
    significantly smaller, lighter, cheaper, and more power-efficient than its free-space
    rivals, reducing the gap between lab and market.'
- title: Reconfigurable and Recyclable Low-Threshold Quasi-BIC Lasers via a Tunable
    polymer Coating
  date: 2026-03
  url: https://arxiv.org/abs/2603.16422v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Xiaolin Wang
  - Jiayao Liu
  - Zimeng Zeng
  - Hongyu Yuan
  - Zhuoyang Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reconfigurable and sustainable microcavity lasers are highly desirable
    for next-generation integrated photonics. Here, we report a recyclable, low-threshold
    quasi-bound state in the continuum (q-BIC) laser fabricated via low-cost, high-throughput
    interference lithography. By introducing a polyvinyl alcohol (PVA) coating on
    a dye-doped photonic crystal, we suppress out-of-plane symmetry breaking, which
    reinforces optical confinement and reduces the lasing threshold. The q-BIC modes
    are further tuned through tailoring the refractive-index of the PVA layer by using
    Kramers-Kronig relation via Rhodamine 6G doping, demonstrating a wavelength shift
    of 7.14 nm and a sensitivity of 215 nm RIU as a sensing prob. More importantly,
    lasing modes are reversibly tuning via precisely controlling the coating thickness.
    Exploiting the dissolving and re-coating process, the laser is repeatedly reconfigured
    while maintaining performance. This work provides a sustainable and adaptive platform
    for sensing and reconfigurable photonic systems.
- title: 'The Bragg Frequency Convertor: A Meeting Between Spatial and Temporal Periodicities
    For Selective Parametric Frequency Translation'
  date: 2026-03
  url: https://arxiv.org/abs/2603.07124v3
  category: integrated-photonics
  subcategory: systems
  authors:
  - Sajjad Taravati
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This study introduces the Bragg Frequency Converter, a spatiotemporal-periodic
    grating concept that extends conventional Bragg gratings into the dynamic domain
    for pure parametric frequency conversion. By selectively time-modulating either
    the high-index or low-index layers of a quarter-wave stack, the structure achieves
    directional frequency conversion: high-index modulation yields efficient down-conversion,
    while low-index modulation produces up-conversion. This layer selectivity stems
    from the asymmetric Bloch mode distribution and associated phase-matching conditions.
    One practical realization, based on a silicon rib waveguide with periodic sidewall
    corrugations and selective doping of the high-index segments, is presented and
    analyzed. A coupled-mode theory is developed to explain the mechanism and validated
    through full-wave simulations. An experimental setup using optical pumping is
    also proposed for practical implementation. The theoretical and numerical results
    establish temporal Bragg gratings as a versatile, reconfigurable platform for
    spurious-free frequency conversion with applications in optical signal processing
    and integrated photonics.'
- title: On-Chip Interferometric Excitation of an Infinity-Loop Microresonator
  date: 2026-04
  url: https://arxiv.org/abs/2604.08029v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Davide Olivieri
  - Bülent Aslan
  - Stefano Biasi
  - Riccardo Franchi
  - Lorenzo Pavesi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated photonics is a powerful platform for exploring Hermitian and
    non-Hermitian physics. Beyond device geometry, controlling how resonators are
    driven is crucial to access and tailor their modes. Coherent excitation via multiple
    input ports (interferometric excitation) enables such control, but its accurate
    description requires extending standard temporal coupled-mode theory to include
    interference between excitation pathways. Experimental realizations have so far
    been limited by phase-unstable, off-chip interferometers. Here we implement a
    fully integrated, phase-stable interferometric excitation scheme for an infinity-loop-microresonator,
    an established structure operating on an exceptional surface, and use it to test
    the extended theory. Phase-resolved measurements in the linear and thermo-optic
    nonlinear regimes show that the relative phase between inputs governs the intracavity
    energy distribution, enabling up to a twofold increase of the circulating power
    compared to single-port excitation. This integrated platform enables reproducible
    studies of phase-dependent effects and coherent-control schemes in non-Hermitian
    photonic devices.
- title: In-situ integrated nonlocal Huygens metasurfaces enable robust vortex beams
    from multimode fibers
  date: 2026-08
  url: https://arxiv.org/abs/2608.09609v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Mingke Jin
  - Jieyu Zheng
  - Chaoyang Wang
  - Yuhao Fang
  - Gongkai Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A fundamental hurdle for multimode fiber (MMF) integrated photonics is
    achieving robust and deterministic wavefront shaping against fiber perturbation,
    which induces random modal interference and scrambles the real-space output into
    speckle patterns. Existing wavefront shaping methods typically rely on pixelated
    phase or polarization pre-compensation, rendering them highly sensitive to fiber
    deformation. Here, we show that in-situ integration of a silicon nonlocal metasurface
    onto an MMF end facet enables direct conversion of arbitrary speckle patterns
    into optical vortex beams without pre-compensation. The metasurface supports overlapped
    Mie resonances and nonlocal bound states in the continuum (BICs), yielding high-transmission
    bands by satisfying the generalized nonlocal Huygens condition. Through momentum-space
    coupling between MMF modes and Huygens-BICs with topological polarization-vortex
    nature, the output maintains doughnut-shaped profiles under static and dynamic
    perturbations, demonstrating exceptional robustness against fiber deformation.
    This approach provides a compact, alignment-tolerant platform for robust structured
    light generation in MMFs for endoscopy, optical trapping and communications.
- title: On-Chip Quantum Randomness Amplification
  date: 2026-06
  url: https://arxiv.org/abs/2606.12173v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Lang Li
  - Yutian Wu
  - Giulio Chiribella
  - Ravishankar Ramanathan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Randomness amplification, the task of extracting uniform private bits
    from biased seeds that may be partly known by a malicious third party, is of central
    importance in cryptography. The highest security in this task is provided by a
    class of quantum protocols known as device-independent, which however are challenging
    to integrate into scalable devices. Semi-device-independent (SDI) protocols are
    a promising alternative that guarantees security under few natural assumptions,
    such as bounds on the amount of energy used by the devices. Here, we provide the
    first demonstration of SDI randomness amplification on an integrated silicon photonic
    chip, achieving a throughput rate of 20 Mbps suitable for practical applications.
    This rate is achieved through a novel technique for SDI entropy certification,
    which delivers strictly tighter von Neumann entropy bounds compared to existing
    methods and remains valid even if the preparation and measurement devices share
    quantum correlations. Overall, the methods developed in this work enable the integration
    of SDI technology into portable telecom devices, opening up a new generation of
    quantum cryptographic hardware.
- title: Polarization Engineering of Second-Harmonic Generation in 3R-MoS$_2$ Waveguides
  date: 2026-02
  url: https://arxiv.org/abs/2603.00562v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Renkang Song
  - Junbo Xu
  - Yanzhen Yin
  - Yu Yin
  - Xu Jiang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Chip-scale nonlinear optics enables strong light-matter interactions within
    compact devices, serving as a fundamental platform for multifunctional integrated
    photonics from classical optical signal processing to quantum information technologies.
    Transition metal dichalcogenide (TMDC) waveguides have recently emerged as a highly
    promising platform owing to their giant material nonlinearity and extended interaction
    lengths. To date, however, research has predominantly focused on conversion efficiency,
    leaving the mechanisms governing the polarization state of nonlinear signal largely
    unexplored. Here, we establish a comprehensive framework for engineering the polarization
    of second-harmonic generation (SHG) in 3R-MoS$_2$ waveguides. By synergizing polarization-resolved
    measurements with theoretical modeling, we reveal that the SHG polarization is
    determined by guided-mode interactions constrained by waveguide geometry and crystal
    symmetry, and further reshaped during propagation. We demonstrate that thickness-dependent
    guided-mode confinement and in-plane crystal symmetry provide robust, static control
    over SHG polarization, while propagation length offers a dynamic tuning knob for
    continuously tailoring the nonlinear output. Our findings provide a deterministic
    approach for on-chip polarization engineering, opening opportunities for reconfigurable
    nonlinear light sources and quantum photonic circuits.
- title: Direct Wafer Bonding of Crystal-Ion-Sliced GaP Thin Films for Photonic Applications
  date: 2026-08
  url: https://arxiv.org/abs/2608.02251v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Hossein Esfandiar
  - Emanuel Glück
  - Fabian Ganss
  - Ulrich Kentsch
  - Dennis Arslan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Gallium phosphide (GaP) is a promising material platform for integrated
    photonics because of its high refractive index, broad optical transparency, and
    strong second-order nonlinear response. Here, we demonstrate GaP-on-insulator
    thin films fabricated by crystal ion slicing and direct wafer bonding, using fused
    silica and SiO$_2$/Si/Si thermally oxidized silicon substrates as representative
    platforms. Unlike GaP thin-film platforms that rely on heteroepitaxial growth
    or sacrificial-layer release, the presented approach enables the flexible integration
    of crystalline GaP thin films, independent of both donor and target substrates.
    Following post-transfer annealing, the films exhibit near-bulk crystalline quality
    with low residual strain, smooth surfaces suitable for nanophotonic fabrication,
    and homogeneous bonding interfaces. Furthermore, annealing restores the linear
    optical dispersion (n and k) approaching that of epitaxially grown GaP with estimated
    plane wave absorption loss of 0.9 dB/cm at 1550 nm in the telecom C-band. The
    demonstrated approach establishes a scalable pathway toward high-quality GaP thin-film
    photonics compatible with versatile heterogeneous integration and back-end-of-line
    CMOS processing.
- title: Storage of telecom-band time-bin qubits in thin-film lithium niobate
  date: 2026-05
  url: https://arxiv.org/abs/2605.13545v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Xiao-Jie Wang
  - Yong-Teng Wang
  - Zi-Wei Zhao
  - Yong-Min Li
  - Tian-Shu Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated photonics has emerged as a promising platform for quantum communication
    and quantum computation. Thin-film lithium niobate (TFLN) has gained significant
    attention in this field due to its exceptional optical properties, enabling the
    realization of numerous integrated photonic devices. However, quantum memory,
    which serves as a universal building block for the quantum internet, has not yet
    been demonstrated in TFLN. In this study, we realized the first on-chip quantum
    memory using erbium ions doped TFLN. The developed quantum memory achieves a storage
    time of 400 ns with an efficiency of 1.95%, significantly outperforming conventional
    waveguide delay lines. The multimode capability is demonstrated by successfully
    storing four temporal modes. Furthermore, single-photon-level coherent pulses
    are encoded into time-bin qubits and stored with a fidelity of 96.8% , surpassing
    the classical limit achievable by measure-and-prepare strategy. Our results demonstrate
    the first on-chip quantum memory for telecom-band time-bin qubits in TFLN, providing
    a key building block toward integrated quantum registers and repeaters for scalable
    quantum information processing.
- title: Anderson Localization with Single Photons from a Quantum Emitter
  date: 2026-05
  url: https://arxiv.org/abs/2605.03251v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Simon J. U. White
  - Diego N. Bernal-García
  - Toan Trong Tran
  - Igor Aharonovich
  - Alexander S. Solntsev
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Anderson localization of light is a fundamental emergent phenomenon in
    disordered systems. In arrays of coupled waveguides, it suppresses transport and
    causes photons to remain localized near the excitation site as coupling disorder
    increases. Here, we experimentally demonstrate Anderson localization using single
    photons emitted by a single-photon emitter in hexagonal boron nitride at room
    temperature. Despite the limited temporal coherence of the emitter, the photons
    undergo pronounced Anderson localization, evidenced by exponentially localized
    output intensity profiles in disordered waveguide lattices. Beyond the experimental
    demonstration, we develop a general theoretical framework for wave propagation
    in disordered tight-binding systems, showing that the configuration-averaged output
    intensity converges to a stationary spatial distribution at large propagation
    distances. In the case of off-diagonal disorder, this stationary profile is characterized
    by an effective localization length that exhibits a robust inverse-variance scaling
    with the disorder strength. These results establish defect-based room-temperature
    emitters as practical platforms for studying Anderson localization in integrated
    photonics and support their use in applications that exploit controlled disorder,
    including neuromorphic and quantum photonic architectures.
- title: High-power-handling ultra-compact acousto-optic modulators using one-dimensional
    topological interface states on thin-film lithium tantalate
  date: 2026-04
  url: https://arxiv.org/abs/2604.13925v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yuqi Chen
  - Wenfeng Zhou
  - Min Sun
  - Xun Zhang
  - Xin Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recent advances in integrated photonics have enabled on-chip signal modulation
    and processing through localized photon-phonon interactions. For acousto-optic
    devices, compact footprint and high efficiency are essential for dense integration,
    while strong power handling is critical for stable operation in demanding applications.
    However, it remains challenging to achieve these features simultaneously on existing
    integrated platforms. Here, we propose and experimentally demonstrate, for the
    first time on a thin-film lithium tantalate platform, an ultra-compact acousto-optic
    modulator based on topological interface states. Benefiting from the strong optical
    confinement of the topological boundary state, the device achieves a footprint
    of 0.13 by 0.12 mm2 and a half-wave voltage-length product of 0.491 Vcm. We further
    demonstrate stable acousto-optic modulation at an on-chip optical power of up
    to 28 dBm (630.9 mW), highlighting the strong power-handling capability of the
    thin-film lithium tantalate topological structure. This work provides a compact
    and high-power solution for microwave-to-photonic transduction and shows the potential
    of the thin-film lithium tantalate for robust integrated photonic systems.
- title: Freeform super-oscillatory optics for CMOS-integrated THz super-resolution
    imaging
  date: 2026-08
  url: https://arxiv.org/abs/2608.04711v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Jin Chen
  - Liang Gao
  - Hao Guo
  - Zhi Chao Chen
  - Kang Jie Lin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The diffraction limit fundamentally constrains the spatial resolution
    of far-field imaging systems. While near-field techniques can circumvent this
    limit, their inherently short working distances (WD) severely restrict practical
    applications. Super-oscillatory lenses (SOLs) offer a far-field alternative; however,
    conventional SOLs are plagued by discrete operating wavelengths, low efficiencies
    (below 5%), and formidable trade-offs among numerical aperture, chromatic aberration,
    and depth of focus (DOF). Here, we introduce a nonlocal, nonlinear-curvature mechanism
    to design a freeform SOL that achieves ultrabroadband (0.3 to 1 THz), achromatic
    super-resolution focusing with an unprecedented efficiency of 44%. Operating at
    a 9 mm WD, the lens maintains a consistent sub-diffraction full-width at half-maximum
    (FWHM) of around 0.45 wavelength alongside an extended DOF of around 10 wavelengths.
    By integrating a compact 65-nm CMOS oscillator-radiator array, we establish an
    advanced imaging platform capable of resolving complex 2D and 3D sub-millimeter
    features (down to 0.15 mm). Readily scalable to the optical regime via two-photon
    lithography, this freeform SOL paradigm paves the way for next-generation, high-performance
    integrated photonics.
- title: Coupling nitrogen vacancy centers in silicon carbide to nanophotonic resonators
  date: 2026-02
  url: https://arxiv.org/abs/2602.21505v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Ivan Zhigulin
  - Konosuke Shimazaki
  - Samuel M. Stephens
  - Angus Gale
  - Karin Yamamura
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon carbide (SiC) is a promising platform for scalable quantum technologies
    owing to its well-established, wafer-scale industrial processing. SiC also hosts
    a variety of optically active color centres including the nitrogen vacancy defect
    that has a spin-triplet ground state. However, strong phonon coupling in the infrared
    range limits photon extraction from these defects. Here, we use nanophotonic structures,
    specifically micro-pillar and micro-disk resonators, to enhance optical collection
    and spin-readout. The micro-pillar geometry yields a 4-fold increase in photon
    collection, accompanied by a 2.4-fold reduction in spectral noise in optically
    detected magnetic resonance measurements. Consequently, the magnetic field sensitivity
    is improved by 24%. The large mode volume of the micro-disk supports resonances
    spanning 1150-1250 nm, enabling broadband coupling to nitrogen vacancy emission
    lines. Our results demonstrate that fabrication of scalable photonic structures
    efficiently improves performance of silicon carbide color centers for integrated
    quantum light generation and sensing.
- title: Energy-efficient programmable integrated photonics via optimized Euler rotations
  date: 2026-05
  url: https://arxiv.org/abs/2605.19570v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Pablo Martínez-Carrasco Romero
  - Andrés Macho-Ortíz
  - José Roberto Rausell-Campo
  - Francisco Javier Fraile-Peláez
  - José Capmany Francoy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Programmable integrated photonics (PIP) has emerged as a powerful on-chip
    platform for optical signal processing and computing, enabling the implementation
    of reconfigurable N$\times$N unitary matrix transformations through meshes of
    tunable interferometers, which realize 2$\times$2 unitary matrices. However, the
    energy consumption associated with phase-shifter actuation is becoming a major
    limitation to the scalability of PIP platforms. Here, we introduce a geometric
    framework for energy optimization in PIP circuits by exploiting the representation
    of 2$\times$2 unitary matrices as concatenations of basic Euler rotations on the
    Bloch sphere. We show that equivalent implementations of the same N$\times$N unitary
    matrix (N $\geq$ 2) can exhibit markedly different energy costs depending on the
    rotation trajectories on the Bloch sphere implemented by each interferometer.
    Leveraging this insight, we identify minimum-energy configurations by systematically
    selecting the shortest rotation trajectories. We experimentally and numerically
    validate the proposed approach in diverse silicon PIP architectures, including
    feedforward and multipurpose hexagonal meshes, neural network accelerators, and
    photonic quantum-gate implementations. These results establish a general route
    toward more energy-efficient large-scale PIP processors for classical and quantum
    signal processing and computing applications.
- title: Security Risks of VOA-Induced Luminescence in Chip-Based quantum key distribution
  date: 2026-04
  url: https://arxiv.org/abs/2604.18422v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zijian Li
  - Chenyu Xu
  - Xin Hua
  - Yongqiang Du
  - Xin Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated photonics is widely regarded as a key enabler for scalable
    quantum key distribution (QKD), offering compactness, stability, and compatibility
    with semiconductor fabrication. Despite rapid advances in chip-based QKD, the
    implementation security of integrated photonic components remains insufficiently
    understood. Here we present the first systematic study of an implementation-level
    security vulnerability associated with p-n junction-based variable optical attenuators
    (VOAs), a ubiquitous component in integrated QKD transmitters. We theoretically
    and experimentally demonstrate that electrically biased p-n junction VOAs emit
    spontaneous luminescence. Using a single-photon-sensitive spectral measurement
    technique, we identify the emission wavelength to be centered around 1107 nm,
    well separated from the C-band quantum signals. This spectral separation gives
    rise to a previously unrecognized wavelength-resolved side channel, enabling potential
    wavelength-splitting attacks without directly disturbing the encoded quantum states.
    By incorporating the measured luminescence into a quantitative security analysis,
    we show that even extremely weak emission can lead to non-negligible information
    leakage. Our findings reveal a fundamental and previously overlooked security
    risk in photonic integrated QKD systems and highlight the necessity of security-aware
    device design for future integrated quantum communication technologies.
- title: Robust and Active Visible-Light Integrated Photonics on Thin-Film Lithium
    Tantalate for Underwater Optical Wireless Communications
  date: 2026-03
  url: https://arxiv.org/abs/2603.14346v2
  category: integrated-photonics
  subcategory: systems
  authors:
  - Changjian Guo
  - Xingjie Li
  - Xiaofeng Wu
  - Jiajie Deng
  - Wenchang Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Visible-light integrated photonics enables compact platforms for sensing,
    precision metrology, and free-space data links at visible wavelengths. However,
    many applications remain limited by the lack of high-speed and robust modulators
    in the blue-green band. Here we report, both operating at 532 nm, thin-film lithium
    tantalate waveguides of propagation losses of dB/cm scale and modulators with
    a flat frequency response to ~50 GHz. The modulator remains stable when delivering
    5 dBm modulated optical power for an hour, which cannot be achieved by thin-film
    lithium niobate based counterparts under similar conditions and structures. System-level
    underwater optical wireless communication (UWOC) is validated with 112-Gb/s transmission
    over 3-m and 64-Gb/s transmission over 9-m underwater links. This represents the
    first integrated external modulator based UWOC system, overcoming the bandwidth-power-chirp
    trade-offs of traditional directly modulated laser-based systems. We further demonstrate
    dual-drive modulators for optical single-sideband and electro-optic frequency-comb
    generations in the green-wavelength band. These results provide a foundation for
    complex, robust, and active visible-light photonic integrated circuits for underwater
    optical applications.
- title: Limits of heralded photonic Bell-state generation in the presence of loss
  date: 2026-08
  url: https://arxiv.org/abs/2608.01549v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Kevin J. Randles
  - Manuel H. Muñoz-Arias
  - Mohan Sarovar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-quality entangled states of photons underlie quantum information
    science (QIS) applications across communication, sensing, and computing. In many
    discrete-variable photonic QIS architectures, large application-ready states (e.g.,
    cluster states, repeater graph states) are constructed via fusion measurements
    on small entangled seed states, of which Bell states are the fundamental example.
    The quality of seed-state generation therefore sets a baseline for application
    performance, making it crucial to understand this process under realistic error
    mechanisms, particularly in integrated photonics experiments. In this work, we
    analyze five heralded schemes for generating event-ready photonic Bell states,
    contrasting their heralding probabilities, fidelities, and error robustness. We
    develop a hierarchy of error models, progressing from an analytically tractable
    lumped-loss model to realistic heralded single-photon sources with multiphoton
    emission errors and finally to integrated frequency-bin implementations with architecture-dependent
    loss. Across these models, we find that schemes based on higher-order multiphoton
    interference provide superior fidelity robustness in low-loss implementations,
    while lower-photon-number schemes can be preferable when probabilistic sources
    or lossy beamsplitters dominate the resource cost. Our results provide design
    guidance for integrated discrete-variable quantum photonics, with particular relevance
    for frequency-bin architectures where active beamsplitter loss can determine the
    optimal resource-state-generation strategy.
- title: Non-reciprocal electrooptic intermodal scattering with momentum engineered
    RF waves
  date: 2026-02
  url: https://arxiv.org/abs/2602.21527v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Jieun Yim
  - Gwan In Kim
  - Violet Workman
  - Seho Kim
  - Omar A. Barrera
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spatiotemporal modulation approaches have been often employed as alternatives
    for producing optical non-reciprocity without magneto-optic materials. Unidirectional
    inter-modal scattering, enabled by either acousto-optic or electro-optic (EO)
    modulation, is a promising method in this category as it can directly modify optical
    dispersions and even enables linear non-reciprocal photonic devices in the strong
    coupling limit. While EO approaches are often preferred for their practicality,
    it is challenging to generate the large spatiotemporal momentum required for inter-modal
    phase matching without EO drive schemes involving multiple drive stimuli. Here,
    we demonstrate highly selective non-reciprocal inter-modal EO scattering enabled
    by a single high-index radiofrequency (RF) traveling wave stimulus. Our experimental
    demonstration is performed on a thin-film lithium niobate integrated photonics
    platform, in which we engineer a slow-wave radiofrequency (SWRF) transmission
    line with an effective RF index &gt; 9 that natively generates the required RF
    momentum while simultaneously maintaining strong RF-optical mode overlap. By additionally
    engineering the interaction length, we achieve a directional ~20 dB non-reciprocal
    scattering contrast. The SWRF architecture provides a scalable route to magnetic-free
    non-reciprocity and establishes momentum-engineered RF waves as a powerful tool
    for next-generation, fully integrated non-reciprocal photonic systems.
- title: Band Engineering of Exciton Polaritons in Resonant Polaritonic Metasurfaces
  date: 2026-07
  url: https://arxiv.org/abs/2607.19868v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Polina Pantiukhina
  - Daria Smirnova
  - Kirill Koshelev
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Polaritonic metasurfaces provide a versatile platform for engineering
    hybrid light-matter states through the interplay of optical resonances and excitonic
    excitations. Yet, predictive models often remain phenomenological and rely on
    coupled-mode equations. Here, we develop an effective Hamiltonian framework for
    exciton polaritons in resonant polaritonic metasurfaces, derived from a semiclassical
    single-pole description of excitonic polarization and a Green's-function description
    of guided-mode resonances. The resulting non-Hermitian Hamiltonian rigorously
    incorporates resonant photonic harmonics, multiple excitonic degrees of freedom,
    and radiative losses. The model reveals selection rules governing photonic-excitonic
    coupling classified by orbital multipole index and polarization, and shows that
    the minimal number of excitonic degrees of freedom equals the number of relevant
    photonic modes. We apply the framework to a bulk van der Waals WS$_2$ metasurface
    patterned into a hexagonal lattice of triangular holes and uncover a new geometry-controlled
    topological transition driven by dipole-quadrupole band inversion, distinct from
    the conventional breathing-honeycomb-lattice transition. Full-wave simulations
    confirm the predicted topological phase diagram and the emergence of photonic
    and polaritonic edge states at a topological interface. Our results establish
    a theoretical multimode framework for geometry-controlled bandstructure engineering
    in polaritonic metasurfaces, with applications in topological, chiral, and quantum
    integrated photonics.
- title: Non-volatile integrated photonics on lithium tantalate-on-insulator
  date: 2026-07
  url: https://arxiv.org/abs/2607.23247v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yuhang Li
  - Miao Deng
  - Xun Zhang
  - Cheng Zeng
  - Chijun Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Scalable reconfigurable photonic integrated circuits require low-loss,
    high-speed optical control without continuous holding power. Yet widely used thermo-optic
    tuning and continuously biased electro-optic tuning consume static power and introduce
    thermal crosstalk or bias drift. Here we demonstrate a monolithic non-volatile
    photonics platform on lithium tantalate-on-insulator (LTOI). In congruent x-cut
    lithium tantalate, the switched ferroelectric-domain configuration is retained
    after the write field is removed. On the same LTOI platform, we demonstrate a
    waveguide propagation loss of approximately 0.05-0.06 dB/cm and multilevel non-volatile
    phase tuning in separate devices. The programmed states remain distinguishable
    through $10^{6}$ write cycles. Weighted segmented electrodes resolve 137 phase
    positions across a $π$ range, corresponding to an analogue phase-setting resolution
    of approximately $0.007π$. We further combine non-volatile phase control with
    high-speed electro-optic modulation to achieve zero-static-power bias control
    of a &gt;110 GHz modulator and a 59.3 dB extinction ratio after non-volatile trimming.
    At the system level, an image-edge-detection chip achieves a measured energy efficiency
    of 3.48 TOPS/W. These results establish LTOI as an integrated photonics platform
    that combines persistent optical reconfigurability with low-loss routing and high-speed
    electro-optic modulation.
- title: Millisecond optical coherence and strong collective coupling in an integrated
    telecom rare-earth photonic platform
  date: 2026-08
  url: https://arxiv.org/abs/2608.08221v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Kah Jen Wo
  - Pavel A. Dmitriev
  - Karthik Dasigi
  - Fumiya Hanamura
  - Steven Touzard
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-range quantum network nodes require the combination of strong light-matter
    coupling, long coherence times and in situ spectral control at telecom wavelengths.
    The coherence of erbium in integrated devices is held back by its hosts, which
    do not simultaneously provide the weakly magnetic nuclear-spin environment and
    the well-defined substitutional sites found in coherence-optimised bulk crystals.
    Here we bring such an optimised crystal onto a photonic chip, by bonding an Er${^{3+}}$:CaWO${_{4}}$
    host without an adhesive interlayer to a high-${Q}$ electro-optically tuneable
    thin-film lithium niobate microring resonator. At an effective temperature of
    ${75}$ mK and a field of only ${0.2}$ T, the bonded ensemble retains an effective
    homogeneous linewidth of ${289\pm34}$ Hz (${T_\text{M}=1.10\pm0.13}$ ms), with
    spectral diffusion proceeding at ${86\pm18}$ Hz and saturating at ${1.5\pm0.2}$
    kHz. Electro-optically tuning the resonator through the erbium optical transition
    resolves an avoided crossing with a collective cooperativity of ${C=6.7\pm0.4}$.
    Exploiting superhyperfine coupling to the host's ${^{183}}$W nuclear spins, we
    store and retrieve optical phase information over ${5}$ s with a visibility of
    ${0.935\pm0.015}$. Strong collective coupling, millisecond coherence and in situ
    spectral tuning in a single device thus establish heterogeneous integration leveraging
    coherence-optimised hosts as a route to scalable telecom quantum networks.
- title: A complete photoluminescence polarization palette from a photonic-crystal
    slab
  date: 2026-08
  url: https://arxiv.org/abs/2608.15590v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - A. V. Peretokin
  - M. V. Stepikhova
  - N. A. Gippius
  - A. A. Bogdanov
  - S. G. Tikhodeev
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Integrated light sources with tailored polarization are essential for
    integrated photonics, optical communication, sensing, and structured-light applications.
    However, generating a broad set of polarization states from spontaneous emission
    usually relies on structures with broken mirror, rotational, or inversion symmetries,
    or on emitters with predefined polarization properties. Here, we demonstrate a
    complete photoluminescence polarization palette in a single achiral photonic-crystal
    slab with a hexagonal lattice of holes and embedded self-assembled Ge(Si) nanoislands.
    We show that the polarization of the emitted light is governed by the interplay
    among modes with different symmetries rather than by the properties of unpolarized
    emitters. Along the high-symmetry directions of the Brillouin zone, symmetry enforces
    purely linear emission and enables direct polarization-based classification of
    the photonic-crystal modes. Away from these directions, all Stokes parameters
    become non-zero, providing full-Stokes control of photoluminescence and highly
    polarized emission. We further demonstrate polarization vortices associated with
    symmetry-protected and Friedrich-Wintgen bound states in the continuum, as well
    as radiating polarization singularities not associated with bound states in the
    continuum. Through appropriate geometric optimization, the same platform supports
    photoluminescence with a full polarization palette as well as polarization vortices.
    Our results establish achiral photonic-crystal slabs as monolithic sources of
    symmetry-programmable photoluminescence polarization.
- title: Universal free-space photonic circuits for polarized structured light
  date: 2026-05
  url: https://arxiv.org/abs/2605.31216v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Dilip Paneru
  - Paola Savarese
  - Alessandro Bisio
  - Francesco Di Colandrea
  - Filippo Cardano
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Traditional linear-optical schemes for implementing discrete unitary
    transformations rely on multi-channel interferometers, typically composed of regular
    meshes of beam splitters and phase shifters. These architectures are well-suited
    to integrated photonics, where scalability and miniaturization are central requirements.
    In free space, universal transformations of optical modes have often been pursued
    through propagation in structured or inverse-designed optical systems, offering
    advantages in terms of addressable optical modes, reconfigurability, and flexible
    detection schemes. Here, we present a complementary approach: a collinear free-space
    photonic circuit that implements the standard interferometric paradigm in a Hilbert
    space of polarized structured-light modes. The circuit exploits spin-orbit coupling
    between circular polarization and optical modes carrying quantized transverse
    momentum, so that conventional beam splitters and phase shifters are replaced
    by structured optical materials acting directly on selected spin-orbit modes.
    In our demonstration, liquid-crystal metasurfaces serve as mode beam splitters
    and phase shifters, and we experimentally realize representative gates in a four-mode
    space. We further show how the architecture generalizes to larger numbers of modes,
    providing a scalable route to arbitrary unitary transformations in free space.
    Numerical optimization over random target unitaries supports the universality
    of the proposed scheme. These results establish a framework for universal free-space
    photonic circuits encoded in structured light and structured matter.'
- title: On-Chip Neodymium-Doped Lithium Niobate Microdisk Laser with Self-Induced
    Pulsing
  date: 2026-04
  url: https://arxiv.org/abs/2604.22397v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yuxuan He
  - Jiangwei Wu
  - Xiangmin Liu
  - Feiyang Shen
  - Feng Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Rare-earth-doped materials constitute the foundation of conventional solid-state
    lasers, but their bulk-crystal form is inherently incompatible with photonic integration,
    making it challenging to realize compact, high performance nanoscale laser sources.
    Lithium niobate on insulator (LNOI), with its exceptional electro-optic and nonlinear
    optical properties, has emerged as one of the most promising platforms for integrated
    photonics. Combining Nd3+ doping with LNOI offers the unique possibility of uniting
    the efficient gain provided by Nd3+ ions with the excellent characteristics of
    LNOI. However, on-chip laser emission from Nd:LNOI has not been demonstrated previously.
    In this work, we report the first realization of an integrated Nd:LNOI microdisk
    laser, demonstrating lasing at 1094.17 nm under 785.10 nm pumping with a low threshold
    of 146 uW and a slope efficiency of 1.962*10^(-5). Beyond continuous-wave operation,
    we further observe self-induced laser pulsing on the hundred-microsecond scale,
    with a laser-pulse duration down to 500 us and an oscillation period of 6.45 ms,
    arising from nonlinear thermo-optic-photorefractive dynamics. We demonstrate stable
    continuous wave lasing and self-induced pulsed emission within a monolithically
    integrated Nd:LNOI cavity. Our results expand the operational degrees of freedom
    for LNOI-based lasers and open a new direction toward deeply integrated gain with
    intrinsic nonlinear dynamical processes.
- title: Scattering-Induced Loss in Ferroelectric Photonic Devices
  date: 2026-05
  url: https://arxiv.org/abs/2605.04353v2
  category: integrated-photonics
  subcategory: systems
  authors:
  - Jonah Townsend
  - Enzo Conceição Picinini
  - Rogério de Sousa
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Ferroelectric materials have colossal optical nonlinearities, but their
    integration into quantum photonic chips is made challenging by the additional
    loss mechanisms that they introduce. Here we present a perturbative theory that
    expresses non-absorptive (elastic) photon scattering-induced loss as a functional
    of a general spectral density for spatial fluctuations of electric permittivity.
    We apply the theory to calculations of attenuation coefficients $α$ in slab waveguides
    in order to compare two distinct loss mechanisms: Interface roughness and ferroelectric
    domain disorder. Our theory can account for realistic roughness without special
    symmetry considerations, and it demonstrates how to use electron microscopy images
    of ferroelectric domains to obtain explicit numerical predictions for $α$. Loss
    is maximum when the mean domain length is comparable to the wavelength of light
    (Mie regime), indicating that, for telecom wavelengths, sub-micron domains (Rayleigh
    regime) or single domain waveguides provide equivalent strategies for reducing
    loss.'
- title: Interference-engineered shortcut to perfect state transfer
  date: 2026-08
  url: https://arxiv.org/abs/2608.18794v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yichuan Zhang
  - Xuanyu Liu
  - Zemeng Lin
  - Wange Song
  - Shuang Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Achieving fast, high-fidelity state transfer is fundamental to scalable
    integrated photonics and quantum information processing. While adiabatic evolution
    provides inherent robustness against control and fabrication imperfections, its
    requirement for slow driving leads to impractically long propagation distances
    in photonic circuits. Existing acceleration strategies, such as shortcuts to adiabaticity
    (STA), can dramatically shorten evolution times but generally rely on non-native
    auxiliary couplings or delicate Hamiltonian engineering that are difficult to
    implement in practice. Here we introduce evolution-pause synthesis (EPS), an interference
    engineered shortcut protocol that achieves fast, near-perfect state transfer strictly
    within the native system Hamiltonian. It achieves this by treating transient excitations
    as coherent resources and canceling their accumulated amplitudes via strategically
    interleaved pauses. By decoupling relative dynamical phase accumulation from parameter
    variations, EPS steers open transition trajectories into a closed loop in complex
    amplitude space, enabling perfect state transfer without auxiliary fields or complex
    parameter detours. We demonstrate this mechanism in Landau-Zener dynamics and
    extend it to a multilevel STIRAP process, achieving an 11.8-fold acceleration
    over the adiabatic baseline. Further, we experimentally validate EPS on a silicon
    photonic platform, realizing high-fidelity state transfer in a $16\,μ\mathrm{m}$
    footprint, a nearly tenfold reduction in device length compared with a $150\,μ\mathrm{m}$
    adiabatic reference. EPS offers a general hardware-compatible framework for fast,
    practical coherent control across wave and quantum platforms.
- title: Orbital Angular Momentum Locking via Bound States in the Continuum
  date: 2026-05
  url: https://arxiv.org/abs/2605.31154v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Enrico Baù
  - Connor Heimig
  - Jonas Biechteler
  - Lina Rohrer
  - Michael Hirler
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical vortices are electromagnetic fields twisting around a phase singularity,
    resulting in quantized orbital angular momentum (OAM). When such vortices are
    formed by evanescent hybrid light-matter quasiparticles known as polaritons, they
    are referred to as polaritonic vortices (PVs). The nanometer-scale topologically
    robust features of such PVs promise to enable applications for lasing and thermal
    emission at deeply subwavelength scales. However, many conventional techniques
    are prone to producing multimode PVs due to poor mode selectivity, resulting in
    OAM mixing that degrades vortex purity and limits their performance for high-fidelity
    optical information encoding and multi-dimensional imaging. To overcome this limitation,
    we introduce a platform that generates deeply subwavelength PVs through quasi-bound
    states in the continuum (qBICs) in dielectric metasurfaces. In contrast to existing
    approaches, the qBIC intrinsically locks the PV to a single OAM and makes it robust
    against the polarization state of the excitation, including linear, elliptical
    and circular polarization. We experimentally realize qBIC-driven PVs through the
    interference of hyperbolic phonon polaritons (HPhPs) in hexagonal boron nitride
    by exploiting the highly uniform out-of-plane electric fields generated by the
    photonic qBIC, characterized via scattering scanning near-field optical microscopy.
    This results in HPhPs with a wavelength of around 30-40 smaller than the incident
    light, thereby enabling ultra-dense packing of multiple robust PVs with distinct
    OAM. Our platform brings PVs to the photonic chip scale, enabling applications
    in structured optical information transfer and communications.
- title: Raman-Assisted Multiband Nonlinear Frequency-Conversion Network in a High-Q
    LTOI Microdisk
  date: 2026-07
  url: https://arxiv.org/abs/2607.18729v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zhifan Fang
  - Yuxuan He
  - Zhangning Pan
  - Xianfeng Chen
  - Yuping Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: On-chip nonlinear frequency conversion offers a key route to broadband
    coherent light sources, but spanning telecom, visible, and ultraviolet wavelengths
    within a single resonator remains challenging. Lithium tantalate-on-insulator
    (LTOI), which has recently emerged as a promising material platform for integrated
    photonics, combines strong Raman activity, a large second-order nonlinearity,
    broad optical transparency and high resistance to photorefractive damage, thereby
    attracting increasing attention for on-chip nonlinear frequency conversion. Here,
    we experimentally demonstrate a Raman-assisted multiband frequency-conversion
    network in a high-Q LTOI microdisk with a loaded quality factor of 2.48x10^6.
    The resonant pumping produced high-purity single-mode Raman lasing with a 3.14
    mW threshold, 32.44% slope efficiency, and an excellent side-mode suppression
    ratio (SMSR) of 29.5 dB. Under a nearby pump condition, we also observe multiple
    Stokes components together with an anti-Stokes line on the short-wavelength side
    of the pump. The resulting multiple intracavity Stokes fields subsequently acted
    as frequency seeds for cascaded chi^(2) processes, producing near-infrared and
    visible signals and extending the emission to 312.6 nm in the ultraviolet. These
    findings establish the cooperative action of Raman gain and second-order nonlinearity
    across widely separated spectral bands within a single microcavity. The device
    therefore offers a route toward integrated multiband light sources and a platform
    for studying coupled nonlinear dynamics.
- title: Raman suppression in nanophotonics enabled by multimode spectral filtering
  date: 2026-05
  url: https://arxiv.org/abs/2605.09219v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Yunxiang Song
  - Jinsheng Lu
  - Xinrui Zhu
  - Danxian Liu
  - Zongda Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Miniaturized photonic cavities generating nonlinear optical states of
    light are central to telecommunications and metrology applications. The emergence
    of such states is primarily underpinned by the ubiquitous Kerr nonlinearity that
    is present in all media. However, stimulated Raman scattering (SRS), an additional
    process inherent to many materials, has been shown to critically hinder the states'
    formation, imposing fundamental constraints on the choice of photonic platforms.
    Here, we introduce a novel strategy for the suppression of SRS in nanophotonic
    devices, adaptable to diverse Raman spectral responses. This is achieved by controlling
    the coupling and loss among multiple transverse spatial modes of the system, tailored
    across ultrabroad spectral bandwidths. Specifically, we combine nanometrically-corrugated
    Bragg gratings and tapered waveguides that, together enable co-directional multimode
    coupling and mode-selective filtering. We use lithium niobate as an exemplary
    Raman-active material to realize the concept, and we demonstrate the robust generation
    of two distinct Kerr nonlinear states (corresponding to coherent optical frequency
    combs) using the fabricated devices. The simplicity and generality of the concept
    suggest wide applicability to classical and quantum light generation on many technologically-relevant
    platforms nominally plagued by SRS (e.g., silicon and diamond photonics). More
    broadly, our multimode spectral shaping and filtering concept opens a path forward
    for highly-structured, wavelength-specific losses in nanophotonic waveguides and
    cavities, with potential applications in ultrafast and nonlinear integrated photonics.
- title: Octave-Spanning Terahertz Quarter-Wave Plates Based on Over-Coupled Fabry-Pérot
    Resonances in Reflective Metal-Dielectric-Metal Metasurfaces
  date: 2026-04
  url: https://arxiv.org/abs/2604.03487v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Tae Gwan Park
  - Chun-Chieh Chang
  - Antoinette J. Taylor
  - Abul K. Azad
  - Hou-Tong Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Compact devices for broadband polarization control in the terahertz (THz)
    regime are challenging due to the intrinsic phase dispersion of birefringent materials
    and resonant structures. Here, we demonstrate high-performance broadband THz quarter-wave
    plates based on over-coupled metal-dielectric-metal reflective metasurfaces. The
    devices operate as single-port anisotropic Fabry-Pérot cavities in which the phase
    dispersion of over-coupled resonances is engineered to produce an approximately
    constant relative phase delay between orthogonal field components. By tailoring
    the metasurface geometry, efficient linear-to-circular polarization conversion
    is achieved while maintaining high reflectance. Four complementary metasurface
    designs, operated at an incidence angle of $45^\circ$, collectively cover the
    0.25--3 THz frequency range accessible to a typical THz time-domain spectroscopy
    system. Each device exhibits an approximately octave-wide bandwidth with an axial
    ratio below 3\,dB and polarization conversion efficiencies exceeding 80\% across
    most of the operating band. Systematic optimization suppresses coupling to higher-order
    diffraction and surface wave modes, further extending the usable bandwidth while
    preserving the required phase relationship. The metasurfaces are compatible with
    wafer-scale fabrication, and experimental results show excellent agreement with
    simulations. These findings establish over-coupled reflective metasurfaces as
    a robust and versatile platform for broadband THz polarization control.
- title: Hz-resolution wide-span photonic integrated terahertz signal analyzer
  date: 2026-07
  url: https://arxiv.org/abs/2607.03442v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Aleksei Gaier
  - Jiawen Liu
  - Ekaterina Mironova
  - Gabriel Julg
  - Ileana-Cristina Benea-Chelmus
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Wide-span spectral and noise characterization at millimeter-wave and terahertz
    frequencies is increasingly important for emerging wireless, sensing, and spectroscopy
    systems, yet remains challenging for conventional electronic instrumentation because
    of the complexity and calibration burden of extender-, multiplier-, and mixer-chain
    architectures. Here we show that photonics can provide attractive alternatives
    to this highly challenging electronic instrumentation through an antenna-coupled
    thin-film lithium niobate electro-optic receiver. Our implementation performs
    fast spectral reconstruction across the widely separated WR 9.0 (80-125 GHz) and
    WR 2.8 (240-380 GHz) bands with a single component, with carrier-frequency errors
    below 3 MHz, scan speeds up to 25 THz/s, and a displayed average noise level below
    -104 dBm/Hz. We then extend to Hz-level resolution and demonstrate phase-noise
    characterisation capabilities across these ultra-wide bands by using a mode-locked
    femtosecond-laser frequency comb as a sampling clock, mapping high-frequency carriers
    to aliased intermediate-frequency tones. We validate the method by measuring the
    phase noise of 90.225 GHz and 270.675 GHz carriers using the same chip and system
    configuration. We further improve the sensitivity of the phase-noise measurement
    through cross-correlation between two optical probe-pulse channels. Finally, we
    show that the same technique can be applied synchronously to ten widely spaced
    frequencies distributed across more than 100 GHz, with the option to quantify
    their mutual coherence. These results establish TFLN integrated photonics as a
    scalable route toward compact millimeter-wave/terahertz instrumentation.
- title: Voltage-Programmable Photon Statistics Using a High-Extinction Thin-film
    Lithium Niobate Modulator
  date: 2026-04
  url: https://arxiv.org/abs/2604.12644v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Julian Rasmus Bankwitz
  - Ravi Pradip
  - Julius Römer
  - Frank Brückerhoff-Plückelmann
  - Falk Ebert
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Controlling the statistical properties of light, namely the fluctuations
    in photon arrival, entropy and number, is essential for both classical and quantum
    photonics. While integrated systems provide tunable control over amplitude, phase,
    and wavelength, real-time modulation of photon statistics has remained a long-standing
    challenge. Herein, we introduce the concept and experimental realization of a
    photon statistics transducer: a high-extinction, broadband electro-optic device
    capable of deterministically shaping photon-number distributions at nanosecond
    timescales. Our approach employs a cascaded thin-film lithium niobate (TFLN) Mach-Zehnder
    amplitude modulator delivering more than 50 dB extinction, enabling precise suppression
    and release of coherent seed light from an integrated InP laser. By exploiting
    the interplay between seed suppression and erbium-doped fiber amplifier dynamics,
    we demonstrate smooth, voltage-controlled switching between Poissonian and super-Poissonian
    photon statistics, with second-order coherence g2(0) tunable from 1.0 to 1.7.
    Complementary measurements with superconducting nanowire single-photon detectors
    further show photon-flux control down to sub-photon levels, highlighting the potential
    for future operation with non-classical sources. The photon statistics transducer
    thus establishes statistical modulation as a new functional primitive in integrated
    photonics. Applications range from entropy generation and secure communication
    to neuromorphic and hybrid quantum-classical processing, where controlled randomness
    and entropy are essential resources. By enabling programmable transitions between
    statistical regimes using only electronic drive signals, our work lays the foundation
    for adaptive, entropy-aware photonic systems that bridge classical and quantum
    domains.'
- title: Photonic Exponential Approximation via Cascaded TFLN Microring Resonators
    toward Softmax
  date: 2026-03
  url: https://arxiv.org/abs/2603.12934v3
  category: integrated-photonics
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid growth of large-scale AI models has intensified energy consumption
    and data-movement challenges in modern datacenters. Photonic accelerators offer
    a promising path by executing the linear matrix multiplications of transformer
    inference at high throughput and low energy. However, the softmax attention layer,
    which requires element-wise exponentiation followed by normalization, still relies
    on electronic post-processing, creating an electro-optic conversion bottleneck
    that negates much of the potential photonic advantage. We present a cascaded micro-ring
    resonator (MRR) architecture that synthesizes the per-channel exponential function
    required by softmax, e^{x_n - max(x)}, over a finite interval with tunable worst-case
    relative error. A control signal detunes each ring via an electro-optic mechanism;
    a weak probe at fixed frequency experiences Lorentzian transmission, and cascading
    N identical stages yields a multiplicative transfer function whose logarithm is
    approximately linear. We derive mapping rules, depth-scaling estimates, and a
    minimax fitting formulation, and validate the framework with three-dimensional
    FDTD simulations of X-cut thin-film lithium niobate (TFLN) add-drop micro-ring
    resonators. Direct multi-ring FDTD validation extends to a five-ring cascade and
    confirms agreement with theory primarily over the upper operating range; deeper
    cascades and higher quality factors are assessed analytically. The cascade implements
    the per-channel exponential block, the key missing nonlinearity for photonic softmax.
    We further present a WDM-parallel chip architecture with closed-loop PI feedback
    that completes the full softmax-exponentiation, summation, and normalization-on
    a single photonic chip without per-channel normalization circuitry.
- title: Thin-film lithium tantalate for ultraviolet integrated electro-optic modulator
  date: 2026-05
  url: https://arxiv.org/abs/2605.02758v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Chupao Lin
  - Patrick Nenezic
  - Arno Moerman
  - Konstantinos Akritidis
  - Tom Vanackere
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The realization of integrated, high-speed ultraviolet (UV) modulation
    is pivotal for the advancement of quantum information processing, portable atomic
    clocks, and secure solar-blind communications. While mature photonic platforms
    have facilitated sophisticated system-level integration across visible and infrared
    spectra, high-speed active modulation in UV remains with traditional bulk crystals.
    Consequently, a scalable integrated solution that simultaneously combines low
    insertion loss and extreme compactness with high modulation efficiency has remained
    challenging. Here, we report the first integrated UV electro-optic modulator on
    a thin-film lithium tantalate (TFLT) platform. By employing a compact lumped-electrode
    design, we achieve a record-low VπL of 85 mV\cdot cm at 375 nm, providing an up
    to four orders of magnitude improvement in terms of bandwidth/Vπ L over bulk technologies.
    The device demonstrates a robust extinction ratio of 22.7 dB, a low insertion
    loss of 1.3 dB, and a Vπ of 4.2V. Although the measured 3-dB bandwidth of 922
    MHz is currently limited by photodetector performance, the small device footprint
    of 1.16 mm and electrode design of 200 μm indicate intrinsic potential for high-speed
    operation beyond 67 GHz which is confirmed by the electrical-to-electrical response.
    This work establishes TFLT as a disruptive platform for wafer-scale compatible
    active UV photonics, enabling the next generation of scalable quantum and communication
    systems.
- title: High-Stress Si3N4 Reflective Membranes Monolithically Integrated with Cavity
    Bragg Mirrors
  date: 2026-03
  url: https://arxiv.org/abs/2603.02490v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Megha Khokhar
  - Lucas Norder
  - Paolo M. Sberna
  - Richard A. Norte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-stress silicon nitride (Si3N4) membranes represent the state-of-the-art
    for cavity optomechanics, combining ultralow dissipation, optical transparency,
    and full compatibility with wafer-scale nanofabrication. Yet their integration
    into high-finesse optical cavities has remained difficult, typically requiring
    bonding or alignment-sensitive assembly that limits scalability and long-term
    stability. Here, we introduce a monolithic, wafer-level integration strategy that
    directly suspends high-stress Si3N4 photonic-crystal membranes above thermally
    compatible SiN/SiO2 distributed Bragg reflectors (DBRs) capable of withstanding
    the high temperatures required for stoichiometric Si3N4 growth. A defect-free
    amorphous-silicon sacrificial layer and stiction-free plasma undercut yield vertically
    coupled cavities with sub-micron spacing-forming self-aligned resonators within
    seconds of release. Owing to the intrinsic tensile stress, the suspended membranes
    exhibit atomic-scale sagging, ensuring near-ideal cavity parallelism and long-term
    stability. Optical reflectivity measurements reveal cavity finesse exceeding 800
    with nanoscale gaps between mirrors. Mechanical ringdown measurements show Q &gt;
    10^5, indicating that DBR integration preserves the low-dissipation character
    of high-stress Si3N4. This demonstrates that the integration process preserves
    the material's exceptional dissipation dilution, supporting straightforward extension
    to high-Q nanomechanical architectures reported in the literature. The resulting
    Si3N4-DBR platform unites optical and mechanical coherence with high fabrication
    yield and design flexibility, enabling scalable optomechanical devices for precision
    sensing and quantum photonics.
- title: Quantum squeezing in an all-resonant periodically poled lithium niobate microresonator
  date: 2026-02
  url: https://arxiv.org/abs/2602.22693v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Xinyi Ren
  - Reshma Kopparapu
  - Tushar Sanjay Karnik
  - Chun-Ho Lee
  - Kiwon Kwon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Quantum noise limits the sensitivity of optical measurements, but squeezed
    states of light enable quantum-enhanced metrology, sensing, and information processing.
    Most on-chip squeezed-light sources rely on Kerr ($χ^{(3)}$) nonlinearities, remain
    limited by pump power and excess loss constraints. Quadratic ($χ^{(2)}$) platforms
    instead provide stronger parametric interactions, lower pump power requirements,
    and greater spectral engineering flexibility. Here, we demonstrate strong, broadband
    squeezed-light generation on a thin-film lithium niobate (TFLN) photonic chip
    using a dual-resonant optical parametric amplifier implemented in a single periodically
    poled LN (PPLN) microresonator. Near-full-depth domain inversion is achieved simultaneously
    with highly over-coupled resonances, exhibiting escape efficiencies exceeding
    90% and intrinsic quality factors above 2.5 million in a 0.6 mm$^2$ X-cut TF-PPLN
    resonator, enabling efficient squeezing at 1587 nm when pumped at 793.5 nm. Operating
    in the continuous-wave regime, we directly measure -0.81 dB of squeezing below
    the shot-noise limit with a pump power of 27 mW, together with +4.29 dB of anti-squeezing.
    From these measurements, we infer an on-chip squeezing level of -7.52 dB $\pm$
    0.22 dB (95% confidence interval: [-7.96,-7.10] dB), and an on-chip anti-squeezing
    level of +9.62 dB $\pm$ 0.25 dB. We demonstrate single-mode squeezing at degeneracy
    with a squeezed-light spectrum exceeding 10.3 THz. This work reports the highest
    squeezing ratio among integrated $χ^{(2)}$ cavity platforms and the first quasi-phase
    matched, fully resonant $χ^{(2)}$ cavity squeezer on chip, establishing a scalable
    route to fully integrated power-efficient squeezed-light sources for quantum-enhanced
    sensing and metrology.'
- title: 'Right Device, Right Place: Variation-Aware Placement and Design Optimization
    for Robust Photonic Lattice-Filter Demultiplexers'
  date: 2026-07
  url: https://arxiv.org/abs/2607.14526v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zahra Ghanaatian
  - Edwin K. P. Chong
  - Mahdi Nikdast
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We propose a Bayesian co-optimization framework for robust integrated
    photonic lattice-filter demultiplexers, jointly optimizing device placement and
    design parameters under fabrication and thermal variations. Results show 75% better
    spectral matching and 45% lower calibration power.
- title: Experimental quantum telecloning across silicon photonic chips
  date: 2026-08
  url: https://arxiv.org/abs/2608.11718v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zicong Wen
  - Kai Wang
  - Bochi Wu
  - Leizhen Chen
  - Yan-Qing Lu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Telecloning -- the combination of quantum teleportation and cloning --
    offers a powerful mechanism to disseminate unknown quantum states to multiple
    spatially separated recipients with optimal fidelity. Despite its conceptual importance
    for quantum networks, an experimental demonstration of symmetric qubit quantum
    telecloning remains elusive, particularly due to the challenges of generating
    multipartite entangled resource states and implementing stable multi-photon interference
    across distributed nodes. Here, we realize the optimal 1 to 2 symmetric quantum
    telecloning using a scalable silicon photonic platform. We implement a six-photon
    protocol using two independent, fiber-linked photonic chips: one generating a
    heralded input state and the other preparing a four-photon entangled resource
    state. By performing an interchip Bell-state measurement, we successfully distribute
    the input state into two optimal clones at remote nodes. We observe an interchip
    cloning fidelity of 78.45 $\pm$ 1.39%, exceeding the classical limit of 2/3 by
    8 standard deviations. Our results demonstrate the robust generation and manipulation
    of complex multi-photon states between integrated chips, providing a foundational
    building block for large-scale multi-party quantum networks.'
- title: Meter-long broadband chirped Bragg gratings for on-chip dispersion control
    and pulse shaping
  date: 2026-04
  url: https://arxiv.org/abs/2604.12564v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zhaoting Geng
  - Yitian Tong
  - Chuchen Zhang
  - Huajun Tang
  - Zhenmin Du
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Precise on-chip dispersion control is essential for advanced integrated
    photonic technologies, enabling applications ranging from high-speed communications
    and sensing to signal processing and biomedical imaging. However, existing on-chip
    dispersion control methods still suffer from substantial loss and a limited dispersion-bandwidth
    product (DBP) far from application needs. As a result, on-chip systems continue
    to rely exclusively on off-chip dispersion control solutions provided by optical
    fiber or bulky free-space optics. To overcome these limitations, we design and
    fabricate meter-long chirped spiral Bragg gratings (CSBGs) on the ultra-low-loss
    silicon nitride (SiN) photonic platform for advanced dispersion control. Our device
    achieves a 10-nanosecond group delay with customizable bandwidths exceeding 10
    nanometers within a compact footprint of only 30 $\text {mm} ^2$, surpassing the
    physical limits of fiber-based grating devices. More importantly, CSBGs can simultaneously
    possess the characteristics of high stability, low latency, and a large DBP, thanks
    to the ultra-low-loss SiN platform with a loss of only 0.3 dB/m. Leveraging the
    precise and stable dispersion profile, we demonstrate high-fidelity pulse shaping
    and compression of electro-optic frequency combs (EOCs) with a 1-GHz repetition
    rate centered across the entire reflection bandwidth. The compressed pulse has
    an on-chip peak (average) power of 21.6 watts (580 milliwatts). Furthermore, we
    showcase for the first time the application of on-chip pulse-compressed EOC in
    wavelength-swept coherent anti-Stokes Raman scattering (CARS) microscopy. Our
    work provides integrated photonics with a long-sought, scalable, and robust solution
    for high-performance on-chip dispersion control, empowering a new generation of
    on-chip functionalities.
- title: Photonic timing-engineered solitons for dual-microcomb metrology
  date: 2026-02
  url: https://arxiv.org/abs/2602.20582v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zihao Wang
  - Guoliang Li
  - Changrui Liu
  - Yue Hu
  - Zeying Zhong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Dissipative microcavity solitons offer a route to integrate comb-based
    metrology systems on photonic chips. However, integrated solitons generally lack
    agile control of comb parameters, particularly pulse timing control, hindering
    their application in quantum-limited metrology. Here we introduce dynamical soliton
    trapping to enable optically timing-engineered microcombs (OTEM). By injecting
    an auxiliary laser to anchor one of the microcomb lines, we create a potential
    well to trap and steer the soliton. Thus, soliton timing can be engineered by
    phase modulating the injected laser. Theory and measurement reveal the fast response
    bandwidth of the OTEM, which enabled a soliton slew rate of 31.3 ps/$μ$s, surpassing
    existing time-programmable fiber laser combs by more than two orders of magnitude.
    Leveraging the timing scan, we used a single OTEM for single-pixel and parallel
    ranging by retrieving the phase of the multi-heterodyne beat spectrum. Picometer-scale
    ranging precision was achieved, establishing new record for optical absolute ranging.
    Our work can transform timing-engineering of microcavity solitons and endow integrated
    dual-microcomb metrology systems with enhanced precision.
- title: Near-Field Characterisation of Guided Modes in WS2 Nanobeams and Quasi-Bulk
    Crystals
  date: 2026-07
  url: https://arxiv.org/abs/2607.00694v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zara S. Taylor
  - Luke M. Hallacy
  - Xuerong Hu
  - Oliver T. Williams
  - Simone Strohmair
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The exceptionally high in-plane refractive index, low sub-bandgap absorption,
    and strong optical anisotropy of WS2 make it a promising material platform for
    next-generation integrated circuits for nanophotonics. Its layered van der Waals
    structure further enables heterogeneous integration with silicon photonics and
    emerging two-dimensional optoelectronic materials. However, despite increasing
    interest in the waveguiding properties of WS2, experimental studies of wavelength-dependent
    modal confinement and attenuation remain limited. Additionally, though the extinction
    coefficient of WS2 is expected to be near-negligible beneath the bandgap, reported
    values span orders of magnitude, leading to large uncertainty in predicted modal
    decay lengths and wafer-scale integration feasibility. To resolve these ambiguities
    we perform hyperspectral cavity-enhanced imaging, determining high-resolution
    upper and lower bounds on the extinction coefficient of WS2 within the visible-NIR
    edge. We further employ scattering-type scanning near-field optical microscopy
    (s-SNOM) to probe TE0, TM0, and higher-order modes in both quasi-bulk and nanobeam
    WS2 waveguides across the 800-1400 nm spectral range, enabling identification
    of mode-specific trends in wavevector dispersion and loss. This work simultaneously
    assesses s-SNOM as a probe of waveguide performance, and we find that while absolute
    loss values depend on measurement geometry, s-SNOM reliably captures relative
    modal trends and provides upper bounds on propagation loss, supporting its use
    as a diagnostic tool for anisotropic waveguides. We further identify significant
    artefacts in nanobeam measurements arising from transverse interference and spatial
    sampling effects when the structure size approaches the excitation wavelength,
    which can shift extracted effective indices by up to 0.25.
- title: 'Light Coils: MRI with Fully Optical Data and Power Transmission'
  date: 2026-07
  url: https://arxiv.org/abs/2607.04211v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Zining Liu
  - Morteza Teymoori
  - Jakob Gerlach
  - Reza Aghabagheri
  - Henning Helmers
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In MRI, dense receiver coil arrays with a high number of coil elements
    are used to efficiently detect and encode the signal. Further increasing the number
    of coils is hampered by electrical cabling and massive electronics that introduce
    electromagnetic coupling, integration complexity and even safety constraints.
    Here we introduce the novel Light Coils concept, a fully optical MRI receive architecture
    in which data transmission, front-end power delivery, and coil detuning are all
    implemented optically, thereby reducing the massive galvanic cabling to a few
    optical fibers. For signal encoding, Mach-Zehnder modulators (MZM) are used to
    convert the MR signal from each coil onto a C-band optical carrier. The preamplifiers
    are driven via a power-over-fiber (PoF) system that uses a high-efficiency photovoltaic
    (PV) cell for optical-to-electrical power conversion. A pulse-sequence-triggered
    optical path controls active detuning. Jointly optimizing modulator bias, optical
    power and front-end gain under realistic receiver chain conditions, Light Coils
    can match the signal-to-noise ratio (SNR) of conventional RF coil systems with
    galvanic cables at MZM input powers of 5-10mW and photonic power converter inputs
    of 80-100mW. At a clinical 3T MRI system, we show in vivo human brain imaging
    with a single-channel Light Coil element with an image quality and SNR comparable
    to a conventional coaxial readout using the identical coil element. Extending
    the concept to a four-channel array using dense wavelength-division multiplexing
    over a single fiber, we demonstrate wavelength-selective routing with inter-channel
    optical isolation exceeding 28dB, reduced noise correlation compared with the
    galvanic reference, and parallel imaging. These results establish a scalable route
    towards lightweight, modular, and potentially ultra-dense MRI receive arrays based
    on integrated photonics and power-over-fiber.
- title: MEMS Fiber-Tip Photoacoustic Spectrometer for In Situ Microscale Trace Gas
    Sensing
  date: 2026-07
  url: https://arxiv.org/abs/2607.03021v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Xingjie Liu
  - Mengqi Wu
  - Ping Lu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: To meet the stringent requirements for miniaturized and highly sensitive
    trace gas sensing in space-constrained scenarios, including power equipment monitoring,
    minimally invasive biomedical diagnostics, and in situ lithium-battery analysis,
    we report a MEMS-integrated fiber-tip photoacoustic spectrometer (MFPAS). The
    device incorporates a Fabry-Perot (F-P) photoacoustic sensor formed by directly
    butt-coupling a single-mode fiber (SMF) to a 3 mm x 3 mm MEMS chip with a 100-nm-thick
    low-pressure chemical vapor deposition (LPCVD) Si$_3$N$_4$ diaphragm. The resulting
    approximately 200-$μ$m deep silicon microcavity functions simultaneously as a
    photoacoustic gas cell and an acoustic confinement cavity. A micro-aperture fabricated
    at the diaphragm periphery by focused ion beam (FIB) milling serves as both a
    gas diffusion channel and an acoustic high-pass filter, suppressing ambient low-frequency
    pressure fluctuations and stabilizing the F-P quadrature point without active
    servo control. In gas-phase measurements, the sensor achieves a noise-equivalent
    concentration (NEC) of 58.5 ppb@1s, with a rapid response time of 6 s. Benefiting
    from its ultra-small cavity volume of approximately 1.5 nL, the device is further
    adapted through structural packaging for in situ dissolved gas analysis in transformer
    oil, where it achieves an NEC of 230 ppb@1s and a T90 response time of 320 s in
    the oil phase. By combining nanoliter-scale detection volume, ppb-level sensitivity,
    rapid response, and wafer-scale batch fabrication compatibility, the proposed
    MFPAS bridges MEMS diaphragm micromachining and FIB-enabled gas exchange engineering.
    This design overcomes the intrinsic gas-exchange limitation of conventional sealed-diaphragm
    optical microphones and offers significant potential for power equipment monitoring
    and in situ health diagnostics.
- title: Simulation-guided design of an integrated photonic cavity for frequency-multiplexed
    Spontaneous Parametric Down Conversion
  date: 2026-05
  url: https://arxiv.org/abs/2605.03121v2
  category: integrated-photonics
  subcategory: systems
  authors:
  - Benjamin Szamosfalvi
  - Michael Raymer
  - CJ Xin
  - Leticia Magalhaes
  - Jarrett Nelson
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Frequency-multiplexed entangled photon pair sources with narrow bandwidths
    and high pair generation efficiency are a key enabling technology for quantum
    networking. We present a simulation-based design study of an integrated photonic
    racetrack resonator source for spontaneous parametric down-conversion (SPDC) that
    simultaneously achieves all three properties. The central result is a simulated
    set of 90 doubly resonant signal/idler frequency-mode pairs with an effective
    Schmidt number of 89.62, average bandwidths of 1.08 GHz, a mean free spectral
    range of 51.9 GHz, and a total internal pair-generation-rate efficiency of 1.16
    GHz/mW. Under deterministic wavelength-based splitting, the accessible frequency-state
    Schmidt number is reduced to 44.93. To support these predictions, we derive a
    closed-form analytical connection between classical cavity parameters (resonant
    frequencies, decay rates, coupling coefficients) and the quantum joint spectral
    amplitude and pair generation rate, extending the dispersive-medium quantization
    formalism of Raymer to the nonlinear optical cavity case. We demonstrate how classical
    electromagnetic field simulations can be combined with this analytical framework
    to predict quantum figures of merit for an integrated photonic source prior to
    fabrication. Fabrication and experimental validation are left for future work.
- title: Crosstalk-free Chiral Anomaly Bulk States in Photonic Crystals
  date: 2026-05
  url: https://arxiv.org/abs/2605.17717v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Guochao Wei
  - Yingfeng Qi
  - Kang Du
  - Wei Zhu
  - Zhenzhen Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Ultracompact cladding-free waveguide arrays with zero inter-channel spacing
    and negligible crosstalk open a new avenue for high-density integrated photonic
    circuits. However, existing cladding-free waveguide arrays typically rely on conventional
    trivial bulk modes, making them highly susceptible to scattering losses at sharp
    bends or in the presence of obstacles and defects. To overcome this limitation,
    we theoretically propose and experimentally demonstrate a robust, crosstalk-free,
    and cladding-free photonic waveguide array based on chiral anomaly bulk states
    (CABSs) in photonic crystals. By interfacing distinct Dirac photonic crystals
    that host Dirac cones at different high-symmetry points (Γ and K) in the Brillouin
    zone and carefully engineering the boundary conditions, the boundary-induced CABSs
    in adjacent channels become effectively decoupled due to a large momentum separation,
    thereby eliminating inter-channel crosstalk. More importantly, we experimentally
    demonstrate that these crosstalk-free CABSs are robust to perturbations, including
    metallic obstacles, air defects, and sharp bends. We further extend the CABS-based
    waveguide array to two dimensions and demonstrate a cladding-free triangular resonator
    and a crosstalk-free waveguide crossing, both of which are previously unattainable.
    Our work establishes a new design paradigm for cladding-free, crosstalk-free,
    and ultracompact topological photonic devices, paving the way for robust, highly
    integrated photonic circuits.
- title: Giant Photon Superbunching from Weak Nonlinearity
  date: 2026-05
  url: https://arxiv.org/abs/2605.29596v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - You Wang
  - Xu Zheng
  - Timothy C. H. Liew
  - Y. D. Chong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Photon superbunching, which occurs when the second-order correlation satisfies
    $g^{(2)}&gt; 2$, is typically associated with strong optical nonlinearities or
    collective multi-photon emission processes. We predict that extreme superbunching
    can also arise in systems of weakly-nonlinear photonic cavities, via the creation
    of a squeezed vacuum through interference engineering by fine-tuning inter-cavity
    couplings and drive parameters. We present numerical calculations indicating that
    a system of four photonic resonators containing representative Kerr media can
    achieve $g^{(2)}(0) = 135$ with a $80\,\text{kHz}$ emission rate. Unlike earlier
    superbunching schemes, this mechanism is highly compatible with integrated photonic
    platforms constructed using conventional optical media.
- title: Millimetre-scale spectrographs for next-generation photonic instrumentation
  date: 2026-07
  url: https://arxiv.org/abs/2607.14841v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Emily Ronson
  - Robert J. Harris
  - Ariadna Calcines Rosario
  - Viktoria Kutnohorsky
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a set of ultra-compact spectrographs fabricated using two-photon
    polymerisation, each under 1 mm in length and printed directly onto an optical
    fiber. This fully integrated, alignment-free architecture enables extremely low-mass
    instrumentation with broad potential across astrophotonics, space systems, drone-based
    sensing, and quantum optics. Two transmissive configurations are presented; they
    combine beam-expansion optics, dispersive elements, and stray-light suppression
    within monolithic printed structures optimised for J- and H-band operation. Coarse
    gratings provide resolving powers of approximately R = 30. Experimental characterisation
    confirms the feasibility of fiber-coupled, fully printed spectrographs and demonstrates
    their promise as deployable components for next-generation integrated photonic
    instrumentation.
- title: Broadband Asymmetric Transmission with Wide Spectral Tunability based on
    Substrate-Embedded Silicon Nanoring Arrays
  date: 2026-03
  url: https://arxiv.org/abs/2603.22232v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Ruihan Ma
  - Yuqing Cheng
  - Mengtao Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this work, we theoretically propose a broadband asymmetric transmission
    (AT) device based on periodic Si nanoring arrays embedded in a SiO2 substrate.
    Results indicate that the device achieves a remarkable broadband AT effect in
    the near-infrared region (1750-2400 nm), with forward transmissivity exceeding
    0.8 (maximum of 0.98), backward transmissivity less than 0.15 (minimum of 0.015)
    and an isolation ratio (IR) reaching a maximum of 17.8 dB at 2280 nm. Furthermore,
    the transmissivity spectrum exhibits excellent scalability and tunability through
    uniform scaling of the structure, allowing the operational band to be tailored
    across a wide spectral range, from 890 to 3300 nm. This Si-based nanostructure
    offers a robust and flexible platform for applications in optical isolation, multi-channel
    sensing, and integrated photonic circuits.
- title: Inverse-Designed High-Q/V Silicon Nitride Photonic Crystal Cavities for Second-
    and Third-Harmonic Generation
  date: 2026-08
  url: https://arxiv.org/abs/2608.13261v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - M. Takiguchi
  - P. Heidt
  - X. Z. Lim
  - J. Zöllner
  - S. Yanagimoto
  venue: ''
  code_url: ''
  project_url: ''
  abstract: SiN photonic crystal (PhC) cavities are promising platforms for nonlinear
    and quantum photonics because of their wide transparency window, CMOS compatibility,
    and negligible two-photon absorption. However, realizing high-Q/V cavities remains
    challenging because of the relatively low refractive index of SiN. Here, we employ
    inverse design to optimize a two-dimensional SiN PhC cavity and experimentally
    demonstrate a quality factor of approximately 80,000, the highest reported for
    a near-stoichiometric SiN 2D PhC cavity. Furthermore, both second- and third-harmonic
    generation are observed from the same cavity, providing experimental evidence
    of strong optical confinement and large Q/V. Our results establish inverse-designed
    SiN PhC cavities as a promising platform for nonlinear photonics and future heterogeneous
    integrated photonic devices.
- title: Quasinormal mode quantization of bound and propagating photons in complex
    lightguiding nanostructures for integrated devices
  date: 2026-05
  url: https://arxiv.org/abs/2605.22153v1
  category: integrated-photonics
  subcategory: systems
  authors:
  - Robert Meiners Fuchs
  - Marten Richter
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Open optical or plasmonic resonators are placed on and connected through
    surfaces or via waveguides, forming complex lightguiding nanostructures, e.g.
    for integrated photonic quantum devices. We derive general boundary conditions
    for quasinormal modes that account for the structure's specific geometry. We then
    present a general quantization scheme for multiple, interacting quasinormal-mode
    cavities coupled to quantum emitters and to a non-bosonic bath of propagating
    photons on waveguides or a surface. We derive a system-bath Hamiltonian with rigorously
    defined coupling elements that can be computed using Maxwell solvers, including
    light-matter coupling between the electromagnetic field and quantum emitters.
    We define system-bath correlation functions for an effective, bath-mediated, and
    time-delayed interaction between the quasinormal modes and quantum emitters, which
    is a main ingredient commonly used to simulate open quantum system dynamics.
