- title: 'Photonic Emergence Operating System (PEOS): A Conceptual Architecture for
    Physics-Native Operating System Functions on Photonic Computing Substrates'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20603667
  category: optical-computing
  subcategory: theory
  authors:
  - Mao Guanghui
  abstract: 'We propose the Photonic Emergence Operating System (PEOS), a conceptual
    architecture that maps conventional operating system (OS) functions directly onto
    the intrinsic physical behaviors of photonic computing substrates, without requiring
    any electronic control layer in steady-state operation. Conventional approaches
    treat photonic hardware as accelerators managed by electronic operating systems,
    preserving all constraints of the Von Neumann model: global clock dependency,
    integer-indexed linear memory, software- managed scheduling, and hardware interrupt
    controllers. We identify this as a fundamental architectural mismatch: photonic
    physics governs the substrate, yet electronic abstractions govern its operation.
    PEOS resolves this mismatch by defining five physics-native OS primitives: Photonic
    Process (PP), Phase Address Space (PAS), Energy Routing Scheduling (ERS), Interference
    Interrupt (II), and Emergent Concurrency (EC). Each primitive is implemented through
    a distinct physical property of photonic systems: optical coherence, continuous
    phase, energy density gradients, optical interference, and wavelength division
    multiplexing, respectively. PEOS is designed as the system-layer component of
    the Photonic Computing Full Stack (PCFS), integrating with the author''s prior
    disclosures: the Photonic Logic Chip (PLC) [1], Photonic State Memory (PSM) [2],
    and the BitStar geographic photonic routing protocol [3]. This paper presents
    the complete conceptual architecture, theoretical analysis of each primitive,
    integration with the PCFS, and 31 technical claims constituting a formal prior
    art disclosure. Keywords: photonic computing, operating system architecture, optical
    interference, phase address space, wavelength division multiplexing, emergent
    computation, prior art disclosure'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Hybrid 2.5D/3D Integration of Photonic Chiplets and Compute Dies for Scalable
    Co-Packaged Optical Interconnects in AI Data Centers
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18858931
  category: optical-computing
  subcategory: method
  authors:
  - Paladugu Phani Suresh
  abstract: Modern artificial intelligence and high-performance computing systems
    face critical bottlenecks in inter-chip communication as computational capabilities
    continue to advance beyond the limits of traditional copper-based interconnects
    and board-edge optical modules. Co-packaged optics emerges as a transformative
    solution by integrating photonic components directly within processor packages,
    dramatically reducing electrical path lengths and enabling unprecedented bandwidth
    densities while lowering energy consumption per transmitted bit. This article
    presents a comprehensive hybrid integration architecture that combines two-and-a-half-dimensional
    and three-dimensional packaging techniques to co-locate photonic chiplets with
    compute dies on silicon interposers. The article leverages micro-ring resonator-based
    wavelength division multiplexing on silicon photonic platforms to achieve high
    aggregate throughput while maintaining compatibility with advanced logic manufacturing
    processes. Through detailed co-design of packaging structures, electrical-optical
    interfaces, thermal management systems, and control algorithms, the architecture
    addresses key technical challenges that have historically impeded photonic integration
    efforts. Validation through multi-level simulations and physical prototypes demonstrates
    feasibility for rack-scale optical connectivity meeting the demanding requirements
    of distributed machine learning workloads. The article examines critical parameters
    that affect the timing of commercial adoption, such as manufacturing yield, serviceability,
    the need for standardization, and economic trade-offs. Results indicate that hybrid
    co-packaged optics architectures provide viable pathways for sustaining bandwidth
    scaling in next-generation data center fabrics serving artificial intelligence
    applications.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Analogue computing with nonlinear photonic metasurfaces
  date: 2026-05
  url: https://doi.org/10.1117/12.3106195
  category: optical-computing
  subcategory: method
  authors:
  - Costantino De Angelis
  abstract: 'Nonlocality and nonlinearity are the two key ingredients whose interplay
    I will describe how to merge into a powerful analogue optical computing architecture
    with unprecedented figures of merit. Notably, none of the works reported in the
    literature so far have efficiently implemented the analogue version of the basic
    mathematical morphology operators: (i.e., dilation and erosion). Spatial dispersion,
    i.e., nonlocality, is usually regarded as a nonideality in flat-optics devices.
    However, the nonlocal response of metasurfaces has been recently indicated as
    an effective means to achieve advanced functionalities. Despite the advantages,
    linear approaches — both local and nonlocal — face limitations related to the
    restricted numerical aperture and frequency bandwidth. Here we demonstrate that
    the combination of nonlinear and nonlocal effects in the same flat-optics device
    is a powerful strategy to achieve advanced image processing and analog computing
    functionalities with reduced structural complexity and increased efficiencies
    in terms of reconfigurability of both angular and frequency bandwidth.'
  venue: ''
- title: Spatial‐Wavelength Multiplexing Error‐Controlled Photonic Analog Computing
    System
  date: 2026-03
  url: https://doi.org/10.1002/advs.202515689
  category: optical-computing
  subcategory: theory
  authors:
  - Tao Zhu
  - Bowen Zhu
  - Shicheng Zhang
  abstract: In the "post-Moore era," the growing challenges in traditional digital
    computing have driven renewed interest in analog computing. Photonic analog computing
    has emerged as an effective paradigm for overcoming the fundamental bottlenecks
    that constrain conventional analog accelerators, especially suited for high-speed
    signal processing and next-generation 5G/6G RF systems. However, existing photonic
    analog computing frameworks lack the flexibility required to accommodate diverse
    application scenarios. To address these challenges, a novel silicon photonic chip
    is proposed in this paper that leverages fully optical analog computation. This
    system features multichannel architectures to enable spatial multiplexing, a parallel
    array of four reconfigurable microring resonators performs wavelength division
    multiplexed differentiation computing. In addition, an FPGA-based error correction
    algorithm is developed to monitor processing operations in real time, ensuring
    the fidelity of computational results. Experimental demonstrations show the system's
    capability to solve ordinary differential equations and its applications in signal
    generation, coherent fiber communications, microwave photonics, and image feature
    detection. Taking into account the spectral utilization efficiency across the
    entire C-band, the theoretical on-chip processing capacity of single unit is evaluated
    to reach up to 2.725 tera operations per second, providing a novel hardware framework
    and innovative directions for photonic analog computing.
  venue: Advanced Science
- title: Photonic Mixture-of-Experts for scalable multi-task on-chip optical neural
    networks
  date: 2026-06
  url: https://doi.org/10.1038/s41467-026-73983-4
  category: optical-computing
  subcategory: method
  authors:
  - Wencan Liu
  - Zhenghang Zhang
  - Peng Meng Chan
  abstract: Photonic computing offers an energy-efficient, high-bandwidth platform
    for artificial intelligence (AI) but currently faces scalability bottlenecks stemming
    from depth-dependent designs, linear optical structures, and intrinsic optical
    losses, along with high hardware and reconfiguration costs for multi-task processing.
    Here, we present a scaling paradigm that circumvents these limitations by expanding
    network width rather than depth, leveraging the intrinsic parallelism of photonics.
    We implement a scalable Photonic Mixture-of-Experts (PMoE) architecture, where
    parallel photonic cores function as expert networks. By dynamically routing inputs
    to these experts, the PMoE efficiently executes multi-task workloads without altering
    the physical optical weights. We fabricated a PMoE chip integrating three collaborative
    diffraction-based expert networks, featuring 18 parallel kernels within a compact
    intrinsic computational-core footprint of 0.067 mm2. Experimentally, the PMoE
    chip achieves multi-domain image classification with an average accuracy of 97.1%.
    While offering further scalability, this approach outperforms conventional optical
    networks and reduces digital parameter overhead by 67%. Our work underscores the
    scalability and efficiency of the PMoE architecture for next-generation large-scale
    photonic AI processors. Optical computing could accelerate AI, but struggles to
    scale optical neural networks for diverse tasks. Here, the authors demonstrate
    a scalable photonic mixture-of-experts chip that expands network capacity in width
    using parallel optical experts for multi-task processing.
  venue: Nature Communications
- title: Approaching physical limits of latent dimensionality in optical computing
  date: 2026-05
  url: https://arxiv.org/abs/2605.23361
  category: optical-computing
  subcategory: theory
  authors:
  - Zhenyu Zhao
  - Zijun Qiu
  - Xuan Hu
  abstract: 'The physical implementation of artificial intelligence requires mapping
    computational processes onto the dynamic physical processes of the underlying
    computing platform. The photonic processors offer an intrinsically parallel and
    low energy framework for this mapping, however, a mismatch between the potential
    computing capability of a bounded optical domain and the human accessible manipulation
    range sets a hard integration density ceiling on existing architectures. Here,
    we address this challenge by investigating the integration density limits in photonic
    processors through exploring the fundamental physical limits on the latent dimensionality
    for maximum expressivity of a bounded optical domain. These physical limits potentially
    serve as universal metrics for evaluating optical computing capacity. To validate
    these, we design and realize ultracompact multimode photonic processors approaching
    these limits: a 2.2 um by 8 um processor achieves 86.7 % accuracy in experiment
    for iris flower classification, and a 20.6 um by 44.8 um processor reaches 92.9%
    accuracy in handwritten digit recognition. Finally, we scale this architecture
    to highly complex tasks by implementing a generative diffusion model for image
    synthesis. By grounding photonic processor design in the wave physics origin of
    latent dimensionality, our results supply the missing theoretical reference point
    for optical computing architecture.'
  venue: arXiv (Cornell University)
- title: 'Photonic Memory as a Dynamical Phase for Neuromorphic Computing: A Unified
    Framework with Experimental Realization'
  date: 2026-07
  url: https://arxiv.org/abs/2607.17817
  category: optical-computing
  subcategory: theory
  authors:
  - Isaac Yorke
  abstract: Photonic memory underpins optical information processing, neuromorphic
    photonics, and photonic computing. Existing studies typically treat dispersive,
    nonlinear, and driven-dissipative memory as distinct physical phenomena, despite
    all being governed by the evolution of the optical field. This work proposes a
    unified phase-based framework in which photonic memory is interpreted as a dynamical
    phase, with transitions between memory regimes governed by optical phase evolution,
    Kerr nonlinearity, and the balance between delayed feedback and dissipation. Within
    this framework, dispersive memory arises from frequency-dependent phase accumulation,
    nonlinear memory emerges through intensity-dependent phase evolution leading to
    bistability and hysteresis, and driven-dissipative memory is established through
    attractor convergence and memory stabilization. The proposed framework is validated
    through theoretical analysis and numerical simulations, demonstrating a continuous
    progression from linear dispersive memory to nonlinear and ultimately driven-dissipative
    memory. Experimental validation is performed using a silicon photonic waveguide
    incorporating chirped Bragg gratings. Group delay measurements reveal distinct
    linear and nonlinear memory responses, while the reconstructed memory distribution
    demonstrates the coexistence of dispersive, nonlinear, and driven-dissipative
    memory within a single integrated photonic device. To the best of the author's
    knowledge, this constitutes the first experimental demonstration supporting the
    coexistence of all three photonic memory regimes in a single photonic platform.
    These results establish optical phase as the unifying physical quantity underlying
    photonic memory and provide a common framework for designing future neuromorphic
    photonic systems, reservoir computers, and integrated photonic processors.
  venue: arXiv (Cornell University)
- title: 'Photonic‐Enabled Energy‐Efficient Transparent Neuromorphic Computing Devices:
    A Review'
  date: 2026-06
  url: https://doi.org/10.1002/advs.75861
  category: optical-computing
  subcategory: theory
  authors:
  - Shuvaraj Ghosh
  - Ki‐Bum Lee
  - Junghyeon Lee
  abstract: 'In the evolving field of artificial intelligence (AI), two notable trends
    are emerging: the rapid growth of large AI model sizes and the surge of vast amounts
    of data. Moore''s law emphasizes the need for alternative computing paradigms
    to meet the rising demand for computational power and address von Neumann model
    constraints. Nowadays, neuromorphic computing, inspired by the mechanisms and
    functionality of human brains, uses physical artificial neurons to do computations
    and is drawing widespread attention. Neuromorphic computing aims to emulate brain-like
    information processing with co-localized memory and logic, breaking the von Neumann
    bottleneck. In this regard, the integration of photonic materials in computing
    led to growth in photonic computing, where light is a fundamental source of energy
    and can also be utilized as a signal for neuromorphic computing. Photonic computing
    enables ultrafast artificial neural networks with sub-nanosecond latencies and
    low heat dissipation. However, current neuromorphic technologies still struggle
    to achieve petascale speed and energy efficiency. Additionally, the general benefits
    of neuromorphic computing and AI can be realized in an optically transparent manner,
    broadening their applications in bionics and human interfaces. This review explores
    the suitability and design strategies for transparent photonic devices that create
    artificial interfaces mimicking natural functions.'
