- title: Gate-based emulation of boson sampling using photonic qubits
  date: 2026-08
  url: https://arxiv.org/abs/2608.09509
  category: quantum-photonics
  subcategory: theory
  authors:
  - Aastha P. Zalone
  - S. P. Dinesh
  - C. M. Chandrashekar
  abstract: Boson sampling arising from multiphoton interference in linear-optical
    networks is a prominent non-universal model for quantum computation. Here, by
    encoding the multi-qubit state to bosonic Fock state, we present a scalable quantum-circuit
    framework for simulating boson sampling on a universal quantum computing platform.
    Beginning with balanced beam-splitter transformations on the single- and two-photon
    sectors, we derive equivalent quantum-circuit implementations and unify them within
    a common Hilbert-space representation using an ancilla-assisted encoding. This
    construction is then generalized to arbitrary interferometers by replacing each
    optical beam splitter with a repeating quantum-circuit unit that selectively acts
    only within the relevant local interference subspace, requiring $N+1$ qubits for
    a two-photon $N$-mode interferometer and a linear-overhead subspace-identification
    procedure. Using this framework, gate-based quantum circuit for a four-mode boson-sampling
    circuit is developed and experimentally implemented on a four-qubit gate-based
    photonic qubit system. The qubit framework for emulating boson sampling of $n-$photons
    in $m-$mode will be useful to solve a broad class of sampling complexity problem
    on a gate-based quantum computers.
