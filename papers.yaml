- title: Whispering-gallery-mode-enhanced optoelectronic fiber probes for efficient
    photoelectric conversion and photoactivated gas sensing
  date: 2026-07
  url: https://doi.org/10.1117/1.ap.8.4.046015
  category: photonic-sensing
  subcategory: method
  authors:
  - Liu Y
  - Le Chen
  - Wanjun Li
  abstract: Integrating functional micro- and nanomaterials onto optical fibers has
    emerged as a powerful strategy to expand the capabilities of fiber-optic platforms
    beyond traditional light transmission. However, achieving efficient on-fiber photoelectric
    conversion remains a critical bottleneck for enabling active sensing and signal
    transduction at the fiber tip. Here, we propose a hybrid optoelectronic fiber
    probe that integrates a ZnO whispering gallery mode (WGM) microcavity onto a multimaterial
    fiber composed of metal, glass, and polymer, enabling simultaneous optical guiding
    and electrical readout. The WGM microcavity, precisely positioned on the fiber
    tip, strongly confines the optical field and enhances light–matter interactions,
    resulting in a high photocurrent gain of 524 under 375-nm illumination. Leveraging
    this amplified photo response, we demonstrate a light-activated ZnO/Pd hydrogen
    sensor with markedly improved performance, including a detection limit of 45 ppm
    and fast response/recovery times of 30 s/8 s. The enhancement is attributed to
    efficient photocarrier modulation at the Pd−H2 interface driven by the intensified
    local field. We establish a compact and versatile platform for all-fiber optoelectronic
    sensing, with potential applications in environmental monitoring, biochemical
    detection, and integrated photonic devices.
  venue: Advanced Photonics
- title: Dual-metal plasmonic modulation in a coaxial PCF-SPR fiber sensor for simultaneous
    pathogen and temperature detection
  date: 2026-04
  url: https://doi.org/10.1088/1402-4896/ae5ce2
  category: photonic-sensing
  subcategory: method
  authors:
  - Pengxiao Guo
  - Lei Zhang
  - Huijing Du
  abstract: Abstract This paper presents a coaxial surface plasmon resonance (SPR)
    sensor based on bimetal modulation technology, which is used for simultaneous
    detection of urinary tract infection pathogens and body temperature. This sensor
    integrates two different functional plasmonic regions within the cross-section
    of the optical fiber. The Au film coated in the groove area is used to identify
    small biomolecules with different refractive indices, capable of detecting typical
    bacteria related to urinary tract infections (Escherichia coli, Pseudomonas, and
    Enterococcus faecalis) and their refractive indices (1.333–1.42). A composite
    Ag/TiO 2 film was deposited inside the pores and filled with PDMS, which was used
    to measure human body temperature. The mode characteristics and sensing response
    of the designed photonic crystal fiber sensor were numerically simulated using
    the finite element method, and the influence of structural parameters on the sensing
    performance was systematically analyzed. The bimetallic structure achieves spectral
    modulation of the resonant band and independent detection of the two sensing areas.
    At the same time, it avoids the problem of the Ag film of the sensor being prone
    to oxidation, and has good sensitivity and stability. The system has achieved
    sensitive identification of pathogenic bacteria, as well as detection of refractive
    index (1.33–1.42) and body temperature (20–50 °C). The sensitivities reached 10200
    nm RIU −1 and 6.32 nm °C −1 , respectively. The designed PCF sensor is simple
    to prepare and has a compact structure, providing a feasible research platform
    for integrated detection of biomedical and thermal parameters.
