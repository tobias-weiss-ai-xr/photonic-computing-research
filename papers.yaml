- title: Stable, bidirectional electro-optic transduction in thin film lithium tantalate
  date: 2026-06
  url: https://arxiv.org/abs/2606.12726
  category: integrated-photonics
  subcategory: theory
  authors:
  - Christopher Axline
  - Stephan Gamper
  - Phoebe Tengdin
  abstract: Efficient and stable microwave-optical transduction is a key enabling
    technology for distributed superconducting quantum computing and heterogeneous
    quantum networks. Electro-optic transducers based on thin-film lithium niobate
    (TFLN) have shown strong promise, but demonstrations to date have been limited
    by various factors such as low frequency bias drift, low efficiency, fabrication
    complexity, and scalability. Here we demonstrate the first integrated electro-optic
    microwave-optical transducers realized in thin-film lithium tantalate (TFLT),
    a material platform offering Pockels nonlinearity comparable to TFLN together
    with improved bias stability and high-power handling. We fabricate superconducting
    microwave resonators coupled to tunable photonic-molecule optical resonators using
    wafer-scale deep ultraviolet lithography, offering high-throughput production
    of hundreds of devices per wafer. Across six devices we observe coherent bidirectional
    conversion between C-band optical photons and 4.9-5.5 GHz microwave photons, with
    measured on-chip efficiencies and inferred single-photon coupling rates g_0/2π
    ~ 1 kHz consistent with theory. Continuous operation over multiple days is achieved
    using a static bias field with minimal feedback, demonstrating a major operational
    advantage. We further characterize optical loss statistics, microwave resonator
    performance, and optically induced added noise under pulsed pumping, finding less
    than one added photon for 100 microsecond pulses at the highest measured efficiencies.
    These results establish TFLT as a scalable and robust electro-optic platform for
    future quantum interconnects and modular quantum processors.
