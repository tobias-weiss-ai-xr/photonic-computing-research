  authors:
  - Tianjun Cai
  - Ziyu Zhang
  - Binmin Wu
  abstract: Abstract The monolithic photonic-electronic integration is crucial for
    high-bandwidth optical communication and computing, while existing structures
    struggle to reconcile compact footprints with performance preservation. Here,
    graphene-integrated silicon nitride microtube whispering-gallery mode resonators,
    fabricated via wafer-level nanomembrane self-rolling process, are demonstrated
    for polarization optical modulation and photodetection in photonic-electronic
    synergy. The engineered lobe-shaped architecture in the microtube facilitates
    axial mode quantization, greatly enhancing the optical mode confinement and improving
    the quality factor. A balanced trade-off between photodetection efficiency and
    optical resonance is achieved by adjusting the coupling between graphene and microtube
    resonance, and graphene-integrated microtube resonators with lobe structure demonstrate
    an efficient optical resonance ( $$Q$$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
    <mml:mi>Q</mml:mi> </mml:math> = 2008.36) and high photoresponsivity (2.80 A W
    −1 ). Furthermore, fourfold rotational symmetry breaking in microtubes presents
    a workable structural paradigm for the polarization-sensitive optical modulation
    and photodetection, overall characteristics presents a promising platform for
    optical manipulation and multidimensional detection of integrated photonic and
    optoelectronic systems.
  venue: Light Science & Applications
- title: 'Code from: Self-reconfigurable polarization perception in dual-anisotropy
    heterostructures enables high-dimensional in-sensor computing'
  date: 2026-02
  url: https://doi.org/10.5061/dryad.1vhhmgr87
  category: optical-computing
  subcategory: method
  authors:
  - Yuan Cheng
  - Wenxuan Zhu
  abstract: Polarization encodes vectorial optical information invisible to conventional
    intensity-only sensors but critical for advanced artificial vision. Implementing
    in-sensor computing along the polarization dimension, however, remains challenging
    due to the lack of reconfigurable array-level hardware. Here, we demonstrate self-reconfigurable
    polarization sensor arrays built from epitaxial van der Waals heterostructures
    of 2D tellurium and ReS₂ with orthogonal in-plane anisotropies. Light-driven interfacial
    carrier transfer and trapping synergistically produce a bipolar photoresponse,
    while perpendicular lattice alignment yields opposite polarization sensitivities
    in the two response branches, enabling all-optical reconfiguration without electrical
    bias. Integrated into in-sensor architectures, these arrays process time-resolved,
    multi-dimensional optical information with high fidelity. Dynamic vision tasks
    achieve enhanced accuracy (&gt;95%), demonstrated in applications ranging from
    autonomous driving to intelligent medicine. Our results establish self-reconfigurable
    polarization arrays as a versatile platform for high-dimensional in-sensor photonic
    computing, offering a path toward efficient artificial vision in complex real-world
    environments.
  venue: DRYAD
- title: Cost-effective, high-performance heterogeneous integration for 6.4T and beyond
    224Gbps/lane co-packaged-optical engines for AI/ML and data center
  date: 2026-03
  url: https://doi.org/10.1117/12.3085221
